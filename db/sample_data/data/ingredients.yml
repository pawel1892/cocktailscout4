- :id: 441
  :name: Whisky Canadian
  :plural_name: ''
  :description: "Der kanadische Whisky wurde weltweit bekannt und geschätzt, insbesondere
    in den USA, wo er als hochwertige Alternative zu den damals üblichen amerikanischen
    Whiskeys galt.\r\nVielfalt der Aromen: Kanadischer Whisky wird aus verschiedenen
    Getreidesorten hergestellt, wie Roggen, Mais, Gerste und Weizen. Durch das Verschneiden
    dieser unterschiedlichen Getreide-Whiskys entstehen vielfältige Geschmacks- und
    Aromaprofile, die den kanadischen Whisky so besonders machen.\r\n\r\nReifung in
    verschiedenen Fässern: Kanadischer Whisky reift oft in einer Vielzahl von Fässern,
    einschließlich ehemaliger Bourbon-, Sherry- oder Weinfässer. Der Verschnitt von
    Whiskys aus verschiedenen Fässern ermöglicht es, die gewünschten Aromen und Nuancen
    zu kombinieren, um einen harmonischen und ausgewogenen Geschmack zu erzielen.
    Der destillierte Whisky wird in Eichenfässern gelagert, um zu reifen.  Kanadischer
    Whisky muss mindestens drei Jahre in Fässern lagern, oft reift er jedoch noch
    länger."
  :slug:
  :alcoholic_content: 43
  :ml_per_unit:
  :wiki_article_id:
  :old_id:
  :created_at: !ruby/object:ActiveSupport::TimeWithZone
    utc: &858 2026-05-08 14:26:56.745651000 Z
    zone: *2
    time: *858
  :updated_at: !ruby/object:ActiveSupport::TimeWithZone
    utc: &859 2026-05-09 09:17:18.254836000 Z
    zone: *2
    time: *859
