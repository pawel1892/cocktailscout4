- :id: 445
  :name: Whiskey Rye
  :plural_name: ''
  :description: "Rye Whisky oder auch Rye Whiskey ist eine Art Whisky herzustellen,
    bei der ein überwiegender Teil der Maische aus Roggen besteht. In den USA ist
    dies gesetzlich geregelt. So muss er zu mindestens 51 % aus Roggen bestehen, für
    mindestens zwei Jahre im Fass gereift sein und darf nicht mehr als 80% Vol. Alkohol
    enthalten.\r\n\r\nKanadischer Whisky in der Regel Rye muss in Holzfässern gereift
    werden, mindestens drei Jahre lang in kleinen Fässern und sie dürfen nicht neu
    oder verkohlt sein. Diese Anforderung unterscheidet sich von den Vorschriften
    für den gemischten Whisky in den USA, bei dem die Massengrundspirituosen nicht
    gealtert sein müssen. "
  :slug:
  :alcoholic_content: 45
  :ml_per_unit:
  :wiki_article_id:
