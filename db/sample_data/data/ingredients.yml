- :id: 443
  :name: Whiskey Tennessee
  :plural_name: ''
  :description: Tennessee Whiskey ist eine eigene Whiskey-Kategorie in den USA, dem
    Straight Bourbon Whiskey sehr ähnlich. Tennessee Whiskey wird im US-Bundesstaat
    Tennessee hergestellt und mit dem sog. "Lincoln County Verfahren" behandelt. Dabei
    wird der Spirit durch Ahorn-Holzkohle gefiltert, bevor er in die Fässer zum Reifen
    kommt.
  :slug:
