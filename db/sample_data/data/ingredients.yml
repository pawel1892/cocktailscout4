  :plural_name:
  :description: "BIONADE ist ein alkoholfreies Erfrischungsgetränk,\r\ndas rein biologisch
    hergestellt wird.\r\nDurch Fermentation natürlicher Rohstoffe ökologischer Qualität.\r\nMit
    viel Calcium und Magnesium. Und mit natürlichen Essenzen aus Früchten und Kräutern.\r\nBIONADE
    wirkt isotonisch und erfrischt auf natürlicher Basis. Feinherb fruchtig.\r\nAls
    Holunder, Litschi, Kräuter und jetzt neu: Ingwer-Orange.\r\nPur oder auf Eis ein
