- :id: 141
  :name: Pastis
  :plural_name:
  :description: "Das Verbot der Herstellung von Absinth zog die Entwicklung zahlreicher
    und unterschiedlicher Alternativgetränke nach sich. 1938 wurde erstmals wieder
    ein anishaltiger Alkohol zum Verbrauch zugelassen: der Pastis. Paul Ricard aus
    Marseille gilt als der Erfinder, und in der Provence begann auch die offizielle
    Produktion, die sofort einen Begeisterungsturm hervorrief.\r\nPastis wird aus
    Anis oder Sternanis, Süßholz (Lakritz), weiteren Kräutern und neutralem Alkohol
    hergestellt und ist bernsteinfarben und klar. Sobald er mit Wasser gemischt wird,
    wird er milchig weiß.\r\n"
  :slug: pastis
  :alcoholic_content: 40
