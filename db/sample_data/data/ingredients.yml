- :id: 3
  :name: Gin
  :plural_name:
  :description: "Gin wird - ähnlich wie Wodka - aus stärkehaltigen Ausgangsstoffen
    wie Getreide oder Melisse gebrannt. Er erhält sein einzigartiges Aroma während
    der Destillation. Dort werden die Alkoholdämpfe mit Gewürzextrakten (vorallem
    Wacholderbeeren und Korriander) versetzt. <br /><br />\r\n\r\nIm 17. Jahrhundert
    fing man in England an Gin zu brennen. Bereits mitte des 18. Jahrhunderts war
    dieser schon so populär, dass die Regierung ein Gesetz gegen das Gintrinken erlassen
    hat, um den inzwischen stark verbreiteten Alkoholismus aufzuhalten. Ein zusätzliches
    Problem war die schlechte Qualität des selbstgebrannten Gins."
  :slug: gin
  :alcoholic_content: 47
