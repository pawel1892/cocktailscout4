  :description: Kiwisaft ist eigentlich völlig easy herzustellen. Man benötigt ein
    paar Kiwis und einen handelsüblichen Entsafter. Die Kiwis waschen und je nach
    Entsaftertyp halbieren, oder vierteln und die Stücke entsaften. Eine Schale der
    billigen Kiwis aus dem Supermarkt ergibt dabei eine Saftmenge von ca. 0,7Liter.
    Die etwas teureren und reiferen Früchte bringen es auf ca. 0,5Liter mit etwa 6-7
    Kiwis. Kiwisaft ist relativ sauer und fruchtig.
