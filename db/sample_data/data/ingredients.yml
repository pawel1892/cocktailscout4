  :plural_name:
  :description: "Für die Herstellung von Kräuterlikör werden allerlei verschiedene
    Kräuter verwendet. Häufig entstanden die unter Verschluss gehaltenen Rezepte in
    Klöstern.<br />\r\nDie Kräuterliköre verbreiteten sich besonders durch ihre appetit-
    und verdauungsanregende Wirkung."
