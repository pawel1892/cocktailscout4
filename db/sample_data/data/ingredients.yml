- :id: 70
  :name: Angostura
  :plural_name:
  :description: "Angostura bzw. Angosturabitter ist ein Bitterlikör, der aus der Rinde
    des Angosturabaums und diversen Kräuterextrakten hergestellt wird. Der Alkoholgehalt
    liegt meistens über 40%. \r\n<br><br>\r\nAngosturalikör ist so bitter, dass er
    sich nur zum Abschmecken und Verfeinern von Cocktails eignet. Sogar während der
    Prohibition in den U.S.A. war Angostura trotz des hohen Alkoholgehalts nicht verboten,
    da man davon ausgehen kann, dass niemand dieses Getränk in größeren Mengen triken
    kann/will."
  :slug: angostura
