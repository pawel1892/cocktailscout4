- :id: 66
  :name: Whiskeylikör
  :plural_name:
  :description: "Geschmack und Zusammensetzung von Whiskeylikör variieren von Marke
    zu Marke. Da wir jedoch den Anspruch haben, jedem das Cocktailmixen zu ermöglichen,
    haben wir diese unter dem Begriff zusammengefasst.<br /><br />\r\nAn dieser Stellen
    werden zwei der bekanntesten Whiskeyliköre beschrieben: Drambuie und Southern
    Comfort.<br /><br />\r\nDer Drambuie gilt als einer der exquisiteren Liköre. Er
    wird hergestellt aus einer Kräutermixtur, Bienenhonig und einem Highlandmalt.<br
    /><br />\r\nSouthern Comfort ist Bourbon Whiskey, der dann mit Pfirsichlikör,
    Pfirsichen, Zitrusfrüchten und Kräutern verfeinert wird."
  :slug: whiskeylikor
  :alcoholic_content: 40
