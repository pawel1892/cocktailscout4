- :id: 142
  :name: Grand Marnier
  :plural_name:
  :description: "Grand Marnier ist ein französischer Likör aus Bitterorangen gemischt
    mit Cognac. Er wurde im Jahr 1880 von Alexandre Marnier-Lapostolle erfunden.\r\nEs
    gibt verschiedene Sorten.  \r\nRed Label oder Cordon Rouge: \r\ndie meistgetrunkene
    Art des Grand Marnier. Sie wird auch oft nur als Grand Marnier bezeichnet. \r\nYellow
    Label oder Cordon Jaune: \r\nFür diese Variante verwendet der Hersteller anstatt
    Cognac einen neutralen Alkohol. Zudem werden süße und bittere Orangen verwendet.
    Das Ergebnis ist daher vergleichbar mit Cointreau.\r\nLouis Alexandre: \r\nHierbei
    handelt es um eine Variante mit Cognacs aus den Gebieten Petite Champagne und
    Borderies. Der Louis Alexandre ist zudem im Vergleich zum Cordon Rouge weniger
    süß. Seinem Namen verdankt er dem Firmengründer. \r\nCuvee du centenaire: \r\nDiese
    Sorte wurden zum 100-jährigen Firmenbestehen 1927 kreiert. Verwendet werden Cognacs
    aus der Petite Champange und der Grande Champagne, die bis zu 25 Jahre alt sind.
    \r\nCuvee du cent cinquantenaire: \r\nZum 150-jährigen Firmenbestehen 1977 wurde
    dieser wohl edelste Grand Marnier geschaffen. Verwendet werden nur Cognacs aus
    Grande Champagne mit einem Alter von bis zu 50 Jahren. \r\n"
  :slug: grand-marnier
  :alcoholic_content: 40
  :ml_per_unit:
