- :id: 362
  :name: Appenzeller Alpenbitter
  :plural_name:
  :description: "Appenzeller Alpenbitter ist ein Bitter-Liqueur aus der Schweiz, der
    in Appenzell erstmals 1902 von Emil Ebneter als Magenbitter hergestellt wurde.
    Bereits 1907 hat sich der Hersteller den Namen „Appenzeller Alpenbitter“ schützen
    lassen. Seit den 1940er Jahren wurde das Rezept des Appenzeller Alpenbitters nicht
    mehr verändert. Der Appenzeller Alpenbitter wird ausschliesslich mit natürlichen
    Zutaten hergestellt.\r\n\r\nViele der verwendeten 42 Kräuter sind heute exotischer
    Herkunft. Für den Geschmack wichtige Inhaltsstoffe sind ein Brand aus Wurzeln
    vom gelben Enzian sowie Anis- und Wacholderdestillate. Der Alkoholgehalt beträgt
    29%."
