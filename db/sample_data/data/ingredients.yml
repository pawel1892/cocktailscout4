  :name: Soda
  :plural_name:
  :description: "Bei Soda bzw. Sodawasser handelt es sich - zumindest im Zusammenhang
    mit Cocktailrezepten - um mit Kohlensäure versetztes Wasser. <br /><br />\r\n\r\nFür
