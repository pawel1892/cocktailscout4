- :id: 68
  :name: Brandy
  :plural_name:
  :description: "Brandy ist eine Bezeichnung für Branntwein, d.h. für destillierten
    Wein. \r\nDurch Eichenfasslagerung erhalten Brandys ihr typisches Aroma und die\r\nbraune
    Farbe. Der Alkoholgehalt eines Brandys beträgt ca. 40%.\r\n<br><br>\r\nCognac
    und Weinbrand sind ebenfalls Brandys, unterscheiden sich jedoch durch folgende
    Äußerlichkeiten:\r\n<br><br>\r\nCognac ist eine Stadt in Südfrankreich und nur
    Brandys, die aus dieser Gegend stammen, dürfen sich auch Cognac nennen.\r\nKurioserweise
    wurde dies im Versailler Freidensvertrag (Ende des I. Weltkriegs) 1919 geregelt.
    Für Cognac gibt es viele\r\nRichtlinien bezüglich Herstellungsprozess und Lagerzeit,
    damit stets eine gute Qualität garantiert ist.\r\n<br><br>\r\nWeinbrand wurde
    1907 vom Destillateur Hugo Asbach als Marke eingetragen. Heute darf ein Brandy
    nur dann Weinbrand heissen,\r\nwenn er bestimme Normen erfüllt (z.B. Lagerzeit
    muss mehr als 6 Monate betragen, Mindestalkoholgehalt liegt bei 38%).\r\n<br><br>\r\nEin
    weiterer Brandy ist der Armagnac, der sich jedoch von den Anderen darin unterschiedet,
    dass seine Destillation \r\nkontinuierlich durchgeführt wird, nicht wie beim Brandy
    in zwei Stufen. Dadurch ist sein Alkoholgehalt etwas \r\nniedriger.\r\n<br /><br
    />\r\nFür Cocktails kann man jedoch im Allgemeinen auf diese Unterscheidungen
    verzichten."
  :slug: brandy
  :alcoholic_content: 40
  :ml_per_unit:
