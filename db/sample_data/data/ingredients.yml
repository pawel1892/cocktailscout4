- :id: 1
  :name: Wodka
  :plural_name:
  :description: "Wodka ist einer der meistgetrunkenen Branntweine der Welt und wird
    aus Getreide, Kartoffeln oder Melasse hergestellt. Sein Alkoholgehalt bewegt sich
    meist zwischen 37,5&#37; und 40&#37;. <br><br>\r\n\r\nSofern es sich nicht um
    einen aromatisierten Wodka handelt, ist er farblos und weist einen neutralen Geschmack
    auf.<br><br>\r\n\r\nDer erste Wodka wurde im 16. Jahrhundert aus Gertreide gebrannt.
    Das Verfahren der Destillation wurde von geneser Kaufleuten übernommen, die im
    14. Jahrhundert ihren Traubenbrand (aqua vitae) an einen russischen Hof brachten.<br><br>
    \r\n\r\nOb der erste Wodka in Polen oder in Rußland gebrannt wurde, ist unbekannt.
    Beide Länder beanspruchen dies für sich."
  :slug: wodka
  :alcoholic_content: 40
