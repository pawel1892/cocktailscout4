- :id: 144
  :name: Waldmeistersirup
  :plural_name:
  :description: "Sirup (von arabisch šarab über lateinisch siropus) ist eine dickflüssige,
    konzentrierte Lösung, die durch Kochen oder andere Techniken aus zuckerhaltigen
    Flüssigkeiten wie Zuckerwasser, Zuckerrübensaft, Fruchtsäften oder Pflanzenextrakten
    gewonnen wird. Durch seinen hohen Zuckergehalt ist er unter Luftabschluss auch
    ohne Kühlung lange haltbar. \r\n\r\nDer Waldmeister (Galium odoratum, früher auch
    Asperula odorata) gehört zu den Rötegewächsen (Rubiaceae), wie der Färberkrapp
    oder die Kaffeepflanze. Er ist auch unter den Namen Maiblume, Gliedkraut, Gliedegänge
    und Halskräutlein bekannt.\r\nIn den grünen Pflanzenteilen kommt Cumaringlycosid
    vor, das besonders beim verwelkenden Blatt Cumarin abspaltet. Cumarin verursacht
    den besonderen Waldmeister-Duft. In geringen Mengen kommen zudem das Glucosid
    Rubichlorsäure (siehe Färberkrapp) und Gerbstoffe vor."
  :slug: waldmeistersirup
  :alcoholic_content: 0
