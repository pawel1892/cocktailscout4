- :id: 64
  :name: Rum (weiss)
  :plural_name:
  :description: "Rum ist ein Destillat aus Zuckerrohr, das aus der Karibik stammt.
    \r\nEs wird jedoch (im Gegensatz zum Cachaça) meist nicht der frische Zuckerrohrsaft,
    sondern Zuckermelasse vergoren.\r\nUm die Zuckermelasse zu gewinnen, verkocht
    man den frischen Zuckerrohrsaft. Beim anschließenden Abkühlen kristalisiert \r\nsich
    der Rohrzucker aus und es bleibt die dickflüssige Melasse übrig.\r\n<br><br>\r\nSeine
    Farbe erhält Rum durch die Lagerung in Fässern (meist sind das Eichenfässer).
    Weißer und brauner Rum unterscheiden\r\nsich lediglich in Ihren Lagerungszeiten
    und in der Holzart des Fasses.\r\n<br><br>\r\nBeim Kauf von Rum sollte man unbedingt
    auf seine Bezeichnung achten. \r\nEs wird zwischen \"Original Rum\", \"Echten
    Rum\", \"Rum-Verschnitt\" und \"Kunst-Rum\" unterschieden.\r\n\"Original Rum\"
    wird importiert und unverändert verkauft. \r\n\"Echter Rum\" wird verdünnt (um
    seinen Alkoholgehalt zu reduzieren).\r\nDer oftmals günstige \"Rum-Verschnitt\"
    ist ein Gemisch aus Wasser, Neutralalkohol und Rum. \r\nDer Rumanteil muss dabei
    nur 5%(!) betragen.\r\n\"Kunst-Rum\" ist ein Rumimitat.\r\n<br><br>\r\nDie Geschichte
    des Rums geht wahrscheinlich auf das 17. Jahrhundert zurück. \r\nVermutlich haben
    holländische Siedler auf den Antillen als Rrste\r\nZuckerrohr destilliert. Das
    Zuckerrohr wurde ursprünglich von Christoph Kolumbus 1494 in die Karibik gebracht.\r\n<br><br>\r\nDer
    Alkoholgehalt von Rum liegt typischerweise zwischen 37,5% und 80%."
  :slug: rum-weiss
  :alcoholic_content: 40
  :ml_per_unit:
