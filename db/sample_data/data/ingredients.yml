- :id: 17
  :name: Tequila (braun)
  :plural_name:
  :description: "Den bekanntermaßen aus Mexico stammenden Tequila gibt es bereits
    seit 400 Jahren. Der Name \"Tequila\" kommt von seinem Ursprungsort und heißt
    übersetzt \"Stein der schneidet\".\r\n\r\n<br /><br />\r\nDer Rohstoff des Tequila
    stammt aus Agavengewächsen, die ausschließlich in Mittelamerika (und den südlichen
    Staaten der USA) wachsen. Die bekannte Yuccapalme ist eine dieser Agavenpflanzen.<br
    />\r\nWie Single Malt Whiskey und Cognac wird auch der Tequila zweimal gebrannt.<br
    />Nach der Destillation ist jeder Tequila weiß. Weißer Tequila reift bis zu 60
    Tagen. Der sogenannte goldene Tequila (auch häufig als braun kategorisiert) ist
    eigentlich auch nur ein weißer Tequila, der allerdings mit braunem Zucker, Karamel
    oder ähnlichem versetzt wird um milder zu schmecken und die goldene Farbe zu erhalten.
    Echter brauner Tequila reift länger als 60 Tage im Eichenfass, in der Regel genau
    ein oder mehrere (3-7) Jahre.\r\n\r\n<br /><br />\r\nDer Tequila selbst war lange
    Zeit als Getränk der Armen bekannt. Später verbreitete er sich soweit, dass in
    Mexico zu großen Anlässen Tequila statt Champagner getrunken wurde. <br />\r\nMitte
    des 20. Jahrhunderts wurde der Tequila in Mexico zum Nationalsymbol gemacht, was
    sich die US-amerikanische Filmindustrie (mit Hilfe von Western-Legende John Wayne)
    zu nutzen machte. \r\n"
  :slug: tequila-braun
  :alcoholic_content: 40
  :ml_per_unit:
