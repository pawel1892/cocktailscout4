- :id: 69
  :name: Calvados
  :plural_name:
  :description: "Calvados ist ein französischer Apfelbranntwein. Er wird aus Cidre
    (Apfelmost) hergestellt. Dieser wird zweimal destilliert und anschließend in Eichenholzfässern
    gelagert. Der Alkoholgehalt von Calvados liegt bei ca. 40%.\r\n<br><br>\r\nCalvados
    ist nach dem gleichnamigen französischem Landstrich in der Normandie benannt und
    wird nur dort hergestellt. Die Geschichte dieses speziellen Branntweines geht
    in das 16. Jahrhundert zurück. Bereits damals hatte man probiert Apfelmost zu
    brennen.\r\n"
  :slug: calvados
  :alcoholic_content: 40
