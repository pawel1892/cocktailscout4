  :name: Cachaça
  :plural_name:
  :description: "Cachaça ist ein aus Brasilien stammender Zuckerrohrbranntwein.\r\nManchmal
    wird Cachaça als eine Art von Rum klassifiziert. Dies ist jedoch nicht\r\nrichtig,
    da Cachaça ein Destillat aus frischem Zuckerrohr ist, während Rum\r\naus Zuckermelasse
    hergestellt wird. <br><br>\r\n\r\nDer Caipirinha ist der wohl bekannteste und
    am häufigsten getrunkene Cachaçacocktail.\r\nMit seiner Verbreitung erlangte der
    Cachaça in den 90er Jahren seinen hohen Bekanntheitsgrad in Europa."
