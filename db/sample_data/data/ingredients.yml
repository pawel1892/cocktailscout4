- :id: 138
  :name: Aquavit
  :plural_name:
  :description: "Aquavit oder Akvavit, (Aqua vitae = Lebenswasser) ist eine Kümmelbasierte
    aus Skandinavien stammende Spirituose.\r\nAquavit wird aus sehr reinem und fast
    geschmacksneutralem Alkohol (Getreide oder Kartoffeln) hergestellt. Dieser wird
    dieser mit Wasser, Kümmel und einer markenspezifischen Gewürzmischung (u. a. Koriander,
    Fenchel, Zimt, Nelken, Dill) destilliert. Die Zusammensetzung der jeweiligen Gewürzmischung
    bestimmt den Charakter der einzelnen Marken.\r\nBei der Destillation wird der
    Vor- und Nachlauf wegen der enthaltenen Verunreinigungen abgeschieden. Um das
    Gewürzdestillat auf Trinkstärke herabzusetzen, wird neutraler Alkohol und destilliertes
    oder demineralisiertes Wasser zugegeben. Dieses Rohprodukt verbringt anschließend
    einige Zeit im Reifelager, um die Inhaltsstoffe Bindungen eingehen zu lassen und
    den Geschmack abzurunden. Hochwertiger Aquavit reift in Holzfässern heran. Teilweise
    werden dabei auch gebrauchte Sherryfässer wiederbefüllt.\r\n"
  :slug: aquavit
  :alcoholic_content: 40
  :ml_per_unit:
