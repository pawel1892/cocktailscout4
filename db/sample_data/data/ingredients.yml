- :id: 145
  :name: Kakao
  :plural_name: ''
  :description: "Als Kakao bezeichnet man die Samen des Kakaobaumes (Kakaobohnen)
    und das daraus hergestellte Pulver. Kakao ist ein wichtiges Exportprodukt zahlreicher
    Entwicklungsländer und dient - in verflüssigter Form - der Herstellung von Schokolade.
    Als Kakao wird auch das aus Kakaopulver, Milch und Zucker zubereitete Getränk
    bezeichnet (siehe Kakao (Getränk)). Das Wort Kakao hat seinen Ursprung im Nahuatl,
    der Sprache der Azteken. Aus dem dort verwendete Begriff cacahuatl für die Kakaobohne
    leitet sich das spanische cacao ab.\r\n\r\n"
  :slug: kakaopulver-trinkkakao
