- :id: 143
  :name: Kumquat
  :plural_name: Kumquats
  :description: "Die Kumquat trägt auch den irreführenden Namen Zwergorange. Sie hat
    zwar die selbe Farbe wie eine Orange und auch die Schale ist ähnlich beschaffen,
    aber die Kumquat ist keine Zitrusfrucht, allerdings botanisch mit Zitrusfrüchten
    verwandt. Die Früchte sind kugelig oder länglich-oval mit einem Durchmesser von
    2,5cm und einer Länge bis 4cm. Die Schale ist goldgelb bis orangegelb und, wie
    die der Zitrusfrüchte, mit feinen Poren besetzt. Das Fruchtfleisch ist orangefarben
    und in drei bis sechs Kammern unterteilt. Im Inneren befinden sich einige Kerne.
    \r\n"
  :slug: kumquat
