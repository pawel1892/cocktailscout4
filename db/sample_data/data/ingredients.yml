- :id: 446
  :name: Whiskey Irish
  :plural_name: ''
  :description: "Irische Mönche um 1000 nach Christus brachten die Destillierkunst
    von ihren Reisen aus dem Mittelmeerraum mit nach Irland, in ihre Heimat. Die allererste
    schriftliche Erwähnung findet sich in den Annalen von Clonmacnoise im Jahr 1405,
    die erste Regulierung der Brennkunst stammte aus dem Jahr 1556.\r\n\r\nIrischer
    Whiskey ist in der Regel drei Mal gebrannt, schottischer Whisky nur zwei Mal,
    mit Ausnahme des Auchentoshan und Springbank’s Hazelburn die ebenfalls drei Mal
    gebrannt sind.  Das macht den irischen Whiskey im direkten Vergleich zu den allermeisten
    schottischen Whiskies in der Regel geschmeidig und weich."
  :slug:
  :alcoholic_content: 40
