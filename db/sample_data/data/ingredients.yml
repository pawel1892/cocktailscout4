- :id: 24
  :name: Whiskey
  :plural_name: ''
  :description: "Hier sollen alle Whiskeys also mit \"e\" gelistet werden, deren Zuordnung
    sonst nicht möglich ist. Oder in Cocktails Verwendung finden, denen sowohl, alsauch
    bescheinigt wird.\r\n\r\nDa es ganze Bücher über das Thema Whiskey gibt, wird
    es hier nur kurz angeschnitten, ohne jeglichen Anspruch vollständig oder genau
    zu sein. \r\nDer Begriff \"Whiskey\" stammt ursprünglich vom gälischen \"uisge
    beatha\" und heißt übersetzt \"Wasser des Lebens\". In Irland und den USA wird
    er mit \"e\" geschrieben (Whiskey) und in Canada, Deutschland, Japan, Schottland
    z. B. ohne \"e\" (Whisky). \r\n\r\nEigentlich darf alles Whiskey heißen, was aus
    Wasser und Getreide destilliert wird, allerdings muss es in Fässern mit maximal
    700 Litern mindestens drei Jahre gelagert \r\nwerden.  Außer in den Staaten, dort
    reichen 2 Jahre.\r\n\r\nWhiskey wird unterteilt in Scotch, Bourbon, Malt, Irish
    und Blended Whiskey. \r\nScotch darf sich nur der Whiskey nennen, der wirklich
    aus Schottland kommt.  Bourbon besitzt einen sehr hohen Maisanteil, der ihm einen
    süßlichen Geschmack verleiht. Außerdem wird er ausschließlich in neuen Eichenholzfässern
    mindestens zwei Jahre lang gelagert. Malt Whiskey wird aus Gerste destilliert.
    Single Malt Whiskey stammt nur aus \r\neiner Brennerei und wird nicht - wie einige
    andere - aus verschiedenen Brennereien zusammengemischt. Er genießt einen guten
    Ruf unter Whiskeykennern. \r\nIrish Whiskey stammt aus Irland (wie der Name schon
    sagt) und wird aus einer Mischung von Gerste, Hafer, Weizen und Roggen hergestellt.
    \r\nBlended Whiskey ist eine Mischung aus Malt und Grain Whiskey, der fast auschließlich
    aus Weizen oder Mais hergestellt wird. \r\n\r\nDie erste urkundliche Erwähnung
    des Whiskey war 1494. Wahrscheinlich wurde \r\ner von irischen Mönchen nach Schottland
    gebracht. Der Whiskey wurde \r\nsehr häufig als Medizin verschrieben, jedoch wuchs
    seine Beliebtheit auch \r\naußerhalb der Medizin. Als die Engländer die Schotten
    besiegten verboten \r\nsie den Whiskey, was zu einer Reihe von Schwarzbrennereien
    führte. Erst im \r\nfrühen 19. Jahrhundert wurde das Whiskeybrennen legalisiert. "
  :slug: whiskey
  :alcoholic_content: 40
  :ml_per_unit:
