  :description: "Der Orangenlikör Triple Sec Curaçao existiert seit dem 16. Jahrhundert.
    Sein Name liegt darin begründet, dass sein Fertigungsprozess in drei Stufen abläuft,
    in dem vor allem bittere Orangen verwendet werden. <br />\r\nDer bekannte Cointreau
    gehört auch zu den Triple Sec Curaçaos."
  :slug: triple-sec-curacao-z-b-cointreau
  :alcoholic_content: 40
