  :name: Amaretto
  :plural_name:
  :description: "Der Amaretto ist ein aus Saronno (Italien) stammender Mandellikör.
    Laut Originalrezept wird dieser aus Mandel- und Aprikosenkernen hergestellt, die
    im Aprikosenöl eingelegt sind und mit vielen verschiedenen Gewürzen verfeinert
    werden.<br /><br />\r\n\r\nEiner Anekdote nach enstand das Rezept, als ein Künstler
    auf der Suche nach einem Modell eine junge Wirtin kennen lernte, die ihm als Zeichen
    ihrer Liebe einen Madellikör brannte. Das war die erste Flasche Amaretto.\r\n"
