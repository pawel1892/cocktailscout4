- :id: 393
  :title: Bezeichnung der Getränke
  :slug: bezeichnung-der-getraenke
  :body: ">Das Wort **„Cocktail\"** wurde erstmals 1798 in einer Londoner Zeitung
    erwähnt. Die genaue Definition als Mischung aus Spirituosen, Zucker, Wasser und
    [[wiki:bitters|Bitterlikören]] folgte 1806 in einer amerikanischen Zeitung. Heute
    gilt als Cocktail jede Mischung aus mindestens zwei Zutaten.\r\n\r\n>**Shortdrink:**
    ca. 7–14 cl, [[wiki:shaken-vs-ruehren|meist ohne Eis oder mit wenig Eis]], in
    [[wiki:glaeser|Cocktailgläsern]] serviert.\r\n>**Longdrink:** Größere Menge, [[wiki:shaken-vs-ruehren|meist
    mit Eis und einem Mixer]], in [[wiki:glaeser|Longdrinkgläsern]].\r\n\r\n\r\n###
    *Überschneidungen zwischen den Kategorien sind normal und beabsichtigt – die Einteilung
    dient der Orientierung, nicht der strikten Abgrenzung.*\r\n\r\n---\r\n\r\n## Kategorien
    (Auswahl)\r\n\r\n| Kategorie | Beschreibung |\r\n|---|---|\r\n| [[wiki:aperitif|Aperitif]]
    | Trocken, appetitanregend, vor dem Essen |\r\n| [[post:zfI9J50o|Blazer]] |  Erwärmte
    Spirituose mit Zucker, [[wiki:sirupe-hausgemacht|Sirup]] und aromatischen Garnierungen,
    die [[post:KfWCTgw9|dramatisch zwischen zwei Gefäßen, sogenanntes Flairbartending]],
    flambiert wird. Bekannt gemacht von [[wiki:legendaere-barmixer|Barkeeper-Legende
    Jerry Thomas]]. |\r\n| Collins | Longdrink: Spirituose, [[wiki:zitrusfruechtchen|Zitronensaft]],
    Zucker, [[wiki:filler-1|Soda]] |\r\n| Cobbler | Spirituose oder Wein, Fruchtstücke,
    Zucker über [[wiki:eis|Crushed Ice]] |\r\n| Cooler | Spirituose, Fruchtsaft, Ginger
    Ale oder [[wiki:sodawasser|Soda]] |\r\n| [[wiki:classic-daiquiri|Daiquiri]] |
    Rum, Limettensaft, Zucker – geschüttelt |\r\n| Daisy | Klassische Cocktailgruppe
    auf Sour-Basis Spirituose, [[wiki:zitrusfruechtchen|Zitrone]], Grenadine oder
    [[wiki:likoere|Likör]] als Süßungsmittel, serviert über [[wiki:eis|Eis]]. |\r\n|
    [[wiki:digestif|Digestif]] | Nach dem Essen, meist schwerer und süßer |\r\n| Fix
    | Historische Cocktailgruppe: Hochprozentige Spirituose, [[wiki:zitrusfruechtchen|Zitronensaft]]
    und bevorzugt [[wiki:sirup|Himbeersirup]], geschüttelt über [[wiki:eis|Crushed
    Ice]].|\r\n| Fizz | Spirituose, [[wiki:zitrusfruechtchen|Zitronensaft]], Zucker
    und [[wiki:filler-1|Sodawasser]]. Ähnlich dem Collins, aber kürzer. Bekanntester
    Vertreter: [[recipe:gin-fizz]]; [[wiki:shaken-vs-ruehren|geschüttelter Sour]]
    + [[wiki:filler-1|Sprudel]] |\r\n| Flip | Historische Cocktailkategorie: Spirituose
    oder [[wiki:wein|Wein]] mit Ei und [[wiki:zucker|Zucker]], heiß oder kalt serviert.
    |\r\n| Frappé | Historische Getränkekategorie [[wiki:likoere|Likör]] oder Spirituose,
    Milch oder Kaffee über [[wiki:eis|Crushed Ice]] oft mit Strohhalm serviert. |\r\n|
    Frozen | Im [[wiki:barwerkzeuge|Mixer]] mit [[wiki:eis|Crushed Ice]] homogen gemixt
    |\r\n| [[post:94rZApCd|Gimlet]] |Klassischer Kurzdrink aus [[wiki:gin|Gin]] (oder
    [[wiki:wodka|Vodka]]) und [[wiki:zitrusfruechtchen|Limettensaft]]. Traditionell
    mit Rose's Lime Juice zubereitet. |\r\n|Grog | Historische Getränkekategorie,
    [[wiki:rum|Rum]] mit heißem Wasser. Traditionell auch mit [[wiki:zitrusfruechtchen|Zitrone]],
    [[wiki:zucker|Zucker]], [[wiki:kraeuter-und-botanicals|Gewürzen]] und Früchten
    zubereitet. Bezeichnet nach Admiral Vernon (Spitzname \"Old Grog\". |\r\n| Highball
    | Longdrink aus einer Spirituose und einem [[wiki:filler-1|Softdrink oder Mixer]],
    serviert im [[wiki:glaeser|Highball-Glas]] mit viel [[wiki:eis|Eis]]. Klassiker:
    [[wiki:whisky|Whisky]] Soda, [[recipe:gin-tonic]]. |\r\n| Julep | Klassische Cocktailkategorie:
    Spirituose [[wiki:bourbon-vs-rye|(meist Bourbon)]], [[wiki:kraeuter-und-botanicals|Minze]],
    Zucker und [[wiki:eis|Crushed Ice]] im [[wiki:equipment|Julep Mug]]. Bekanntester
    Vertreter: [[recipe:mint-julep]]. |\r\n| [[wiki:margarita-2|Margarita]] | [[wiki:tequila|Tequila]],
    [[wiki:orangen-triade|Triple Sec]], [[wiki:zitrusfruechtchen|Limette]], Salzrand
    |\r\n| Mule | Spirituose, [[wiki:filler-1|Ginger Beer]], [[wiki:zitrusfruechtchen|Limette]]
    |\r\n| Nogs | Festliches Getränk aus Eiern, Sahne, Milch, Zucker und Spirituosen
    [[wiki:kraeuter-und-botanicals|Gewürze]] auf [[wiki:eis|Eis]],  (meist Rum, Bourbon,
    Cognac). In den USA besonders zu Weihnachten populär.\r\n |\r\n| Posset | Milk/Cream,
    [[wiki:wein|Wein]] oder Bier, [[wiki:kraeuter-und-botanicals|Gewürze]], warm |\r\n|
    Pousse Café | Zutaten werden der Reihe nach – geordnet nach ihrer Dichte – übereinandergeschichtet,
    ohne sich zu vermischen.  |\r\n| Punch | Ursprünglich 5 Zutaten: Spirituose, [[wiki:zitrusfruechtchen|Zitrone]],
    Tee, Zucker, [[wiki:kraeuter-und-botanicals|Gewürze]] |\r\n| Rickey | Historische
    Cocktailkategorie: Spirituose (klassisch [[wiki:gin|Gin]]), [[wiki:zitrusfruechtchen|halbe
    Limette]], optional Zucker oder [[wiki:sirupe-hausgemacht|Sirup]], aufgefüllt
    mit [[wiki:filler-1|Sodawasser]] im [[wiki:glaeser|Highball-Glas]] über [[wiki:eis|Eis]].
    |\r\n| Sangaree | Historische Kategorie, [[wiki:wein|Rotwein oder Port]], Spirituose,
    [[wiki:likoere|Likör]], oder Zucker, warm oder eisgekühlt mit [[wiki:kraeuter-und-botanicals|Muskatnuss.]]
    |\r\n| Scaffa | Historische Cocktailkategorie, Hochprozentige Spirituose, [[wiki:likoere|Likör]],
    [[wiki:bitters|Bitters]] – Zimmertemperatur im Kelchglas serviert – ohne Eis.
    |\r\n| Shooter | Kleiner Cocktail (meist 2–4 cl) in einem Schnapsglas, der auf
    Ex getrunken wird. Kann geschichtet (Pousse Café) oder einfach serviert werden.
    |\r\n| Shrub | Historische Kategorie, Mazerationsgetränk aus Früchten, Spirituosen
    und Zucker, optional mit Essig. Heiß oder kalt serviert. Im Cocktailbereich wiederentdeckt
    als Sirup-Alternative. |\r\n| Sling | Klassische Cocktailkategorie, Spirituose,
    Wasser, Zucker, [[wiki:bitters|Bitters]], Moderner: Fruchtsaft und Soda statt
    Wasser. |\r\n| Smash | Wie Julep, aber mit [[wiki:zitrusfruechtchen|Zitronensaft]]
    |\r\n| Sour | Grundlegende Cocktailkategorie: Spirituose, [[wiki:zitrusfruechtchen|Zitronensaft]]
    und [[wiki:sirup|Süßungsmittel]]. Oft mit Eiweiß geschüttelt. Beispiele: [[recipe:pisco-sour]],
    [[recipe:whiskey-sour]], Amaretto Sour. |\r\n| Swizzle | Spirituose, [[wiki:zitrusfruechtchen|Limette]],
    Zucker, [[wiki:eis|Crushed Ice], mit [[wiki:equipment|Swizzle-Stab]] aufgewirbelt
    |\r\n| Toddy | Warm: Spirituose, Wasser, Zucker, [[wiki:kraeuter-und-botanicals|Gewürze]]
    |\r\n\r\n\r\n---\r\n\r\n>'Begriffe der Zusammensetzung eines Cocktails, zunächst
    die **[[post:zfI9J50o|Basis]]** ([[wiki:gin|Gin]], [[wiki:rum|Rum]], etc.), gefolgt
    von **[[post:EVAyIWVC|Modifier]]** ([[wiki:likoer|Liköre und dergleichen]]), zuletzt
    der **[[post:KfWCTgw9|Flavouring Part]]** mit intensiven Aromen in kleinen Mengen
    z. B. ([[wiki:bitters|Bitters]], auch [[wiki:sirup|Sirupe]]).\r\n\r\n\r\n---\r\n\r\n\r\n|
