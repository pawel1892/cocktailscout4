  :title: Tequila & Mezcal - Agave & Agave
  :slug: tequila
  :body: "###Agavendestillate\r\n\r\n\r\n## Die Agave als Rohstoff\r\n\r\n>[[post:1X6UGsPe|Tequila
    und Mezcal]] werden aus **Agaven** destilliert — sukkullente Pflanzen, die\r\n>7–25
    Jahre bis zur Ernte brauchen. Das macht diese Destillate einzigartig und langsam.
    Tequila darf nur aus der Blauen Weber-Agave hergestellt werden. Für Mezcal sind
    hingegen über 30 zugelassene Agavenarten erlaubt, die oft auch wild wachsen. \r\n\r\nDie
    Herkunft der Agaven entscheidet darüber, ob aus ihnen Tequila hergestellt werden
    kann. Ähnlich wie beim [[wiki:brandy-cognac-und-Armagnac|Cognac]] sind der Tequilaagavenanbau
    und die Tequilaherstellung regional eng abgegrenzt. Ganze 5 Provinzen, alle in
    der südlichen Mitte Mexikos liegend, dürfen Tequila herstellen. Das Zentrum sind
    die Städte Tequila und Guadelajara in der Provinz Jalisco. >Tequila darf nur maximal
    49% Fremdzucker enthalten und muss somit zu mindestens 51% \r\naus Agave Azul
    hergestellt sein.\r\n\r\n---\r\n\r\n## Ursprung\r\n\r\nPulque ist ein Über 2000
    Jahre altes, fermentiertes Agavensaftgetränk mit 5–10 % Alkohol. Vorläufer von
    Mezcal und Tequila. Heute noch in Mexiko traditionell getrunken.\r\n\r\n\r\n---\r\n\r\n##
    Tequila\r\n\r\nTequila ist wohl die am häufigsten falsch eingestufte Spirituose,
    die es gibt. Auch finden sich immer wieder Vorurteile, die dieser tollen Spirituose
    einfach nicht gerecht werden. \r\n\r\nNein, Tequila ist kein Kaktusschnaps und
    nein, er wird auch nicht mit einem Wurm in der Flasche verkauft. Letzteres kommt
    bei seinen Mezcalgeschwistern zwar durchaus vor (allerdings auch nur bei den nicht
    so hochwertigen), dient aber entgegen anderslautender Aussagen nicht der Würze,
    sondern ist dort nur ein reiner Marketinggag. Außerdem ist es auch kein Wurm,
    sondern die Larve eines Falters, die in den Agaven lebt. In einem Tequila werdet
    Ihr jedoch nie eine solche Larve vorfinden. Auch ist er alkoholisch nicht stärker,
    als jede andere Spirituosenart auch und ebenso hat er auch keine anderen alkoholischen
    Wirkungen, als die anderen. Die Trinkstärke liegt in der Regel bei 40%. Tequila
    ist technisch gesehen ein Mezcal, allerdings mit einigen Besonderheiten. Mezcal
    ist ein Destillat, welches aus Agaven ausschließlich in Mexiko hergestellt wird.\r\n\r\nTequila
    darf nur in bestimmten Regionen Mexikos (hauptsächlich Jalisco) hergestellt werden
    und muss aus mindestens \r\n>**51% Blaue Weber-Agave** bestehen. \r\n>**100%-Agave-Produkte**
    sind hochwertiger.\r\n>Tequilas werden jedoch nicht nur über ihren Agavengehalt
    klassifiziert, sondern auch über ihr Alter, was direkten Einfluß auf ihren Charakter
    hat.\r\n\r\n| Kategorie | Reifung | Charakter |\r\n|---|---|---|\r\n| Blanco /
    Silver | Ungelagert | Frisch, agavebetont |\r\n| Reposado | 2–12 Monate im Fass
    | Mild, Holznoten |\r\n| Añejo | 1–3 Jahre | Komplex, Vanille |\r\n| Extra Añejo
    | >3 Jahre | Reich, whiskyähnlich |\r\n\r\n\r\n>Man sollte dabei auch folgendes
    bedenken. Tequilas profitieren im Gegensatz zu anderen gelagerten Destillaten,
    wie [[wiki:brandy-cognac-und-armagnac|Cognac]], [[wiki:whisky|Whisky]] und [[wiki:rum|Rum]],
    nicht von immer längeren Lagerzeiten. Insofern sollte man gut prüfen, ob man bereit
    ist die teils exorbitanten Preise dieser Super-Premium-Tequilas zu bezahlen.\r\n\r\n>Wer
    Tequila wirklich kennenlernen will, sollte nicht mit einem Anejo einsteigen.\r\n\r\n>Sogenannte
    **[[post:texpP6wv|Joven]] oder Gold Tequilas**, mit dieser Bezeichnung werden
    nur Mixtos versehen, die keiner Lagerung, aber dafür einer **Manipulation mit
    Zuckercouleur und/oder Holzspänen** unterzogen wurden. Damit will man künstlich
    eine Weichheit generieren. Für den wahren Tequilafreund stellen diese Tequilas
    jedoch keine wirkliche Option dar.\r\n\r\n\r\n## Mezcal\r\n\r\nMezcal kann aus
    **über 30 Agave-Arten** hergestellt werden. Die traditionelle Produktion röstet
    die Agavenherzen (*Piñas*) in Erdöfen — das ergibt den charakteristischen Rauchgeschmack.\r\n\r\n##
    Bacanora\r\n\r\nEin weiteres Agavendestillat, mexikanischer Brand mit geschützter
    Herkunftsbezeichnung aus dem Bundesstaat Sonora. Er ist mit Mezcal verwandt.\r\n\r\n##
    Raicilla \r\n\r\nNoch ein mexikanischer Agavenbrand aus verschiedenen Agavenarten.
    Alternative zu Mezcal mit eigenem Produktionsprofil.\r\n\r\n---\r\n\r\n## Sotol\r\n\r\nMexikanischer
    Brand aus der Sotol-Pflanze (Dasylirion), die der Agave ähnelt. Mit geschützter
    Herkunftsbezeichnung aus drei Bundesstaaten.\r\n\r\n\r\n---\r\n\r\n### Trivia\r\n\r\n>
    \"Para todo mal, mezcal. Para todo bien, también.\"\r\n> (\"Für alles Schlechte,
    Mezcal. Für alles Gute, auch.\")\r\n\r\n---\r\n\r\n### Im Cocktail\r\n\r\nDie
    [[wiki:margarita-2|Margarita]] lebt von der Spannung zwischen Agavengeist und
    [[wiki:zitrusfruechtchen|Limettensäure]].\r\nDas richtige Verhältnis — und warum
    frischer Saft unersetzlich ist — erklärt der Zitrus-Artikel.\r\n[[wiki:sirup|Agavensirup]]
    als Süßungsmittel ist die authentische Wahl.\r\nFür Parties eignet sich die Margarita
    hervorragend als [[wiki:batching|Batched Cocktail]].\r\nDie Wahl des [[wiki:eis|Eises]]
    entscheidet über Textur und Verdünnung.\r\n\r\n\r\n\r\n### Einsteigertequilas\r\n-
    Sauza Hornitos Blanco / Reposado\r\n- el Jimador Blanco / Reposado\r\n\r\n###
    Premium\r\n- Herradura Plata / Reposado\r\n- Milagro Silver / Reposado\r\n\r\n###
    Tequila im Einsatz\r\nMit den Sauza Hornitos Tequilas lassen sich sehr gut Cocktails
    mit starker Fruchtausprägung (besonders [[wiki:zitrusfruechtchen|Zitrusfrüchte]]),
    aber trotzdem noch hohem Tequilagehalt zubereiten. Als Beispiel sei hier der [[recipe:tequila-sunrise]]
    genannt, in dem der Sauza Hornitos Reposado einen sehr guten Job macht, oder auch
    der [[recipe:guavia-civil]].\r\n\r\nDie el Jimador Tequilas eignen sich sehr gut
    für Rezepte mit etwas weniger starker Fruchtausprägung, aber sattem Agaveauftrag
    wie zum Beispiel die [[wiki:margarita-2|Margarita]], auch deren zahllose Frucht-
    und Frozenversionen wie [[recipe:apfel-ingwer-margarita]]. Aber auch Drinks, in
    denen Tequila nur eine Gastrolle zu spielen scheint, gelingen damit recht gut
    und der Tequila geht nicht unter. So zum Beispiel der [[recipe:el-manito]].\r\n\r\nIn
    der etwas gehobeneren Preisklasse, sind die Herradura- und Milagro-Tequila echte
    Allrounder. Besonders universell jeweils der Herradura Plata und der Milagro Reposado.
    Mit ihnen gelingen die meisten Tequilarezepte.\r\n\r\n\r\n---\r\n\r\n| *Quellen:
    Wiki* | *Quellen: Forum, Rezepte* |\r\n| --- | --- |\r\n| *Quelle: Wiki [[wiki:batching]]*
    | *Quelle: Forum [[post:1X6UGsPe|Agavendestillate]]* |\r\n| *Quelle: Wiki [[wiki:zitrusfruechtchen]]*
    | *Quelle: Forum [[thread:lexikon]]* |\r\n| *Quelle: Wiki [[wiki:eis]]* | *Quelle:
    Rezepte [[recipe:guavia-civil]]* |\r\n| *Quelle: Wiki [[wiki:whisky]]* | *Quelle:
