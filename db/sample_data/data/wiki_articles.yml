- :id: 379
  :title: Gläser - Form folgt der Funktion
  :slug: glaeser
  :body: "## Warum das Glas wichtig ist\r\n\r\n>Die Form eines Glases beeinflusst,
    **wie wir trinken** — die Neigung des Kopfes,\r\nwohin die Flüssigkeit zuerst
    auf die Zunge trifft, wie sich Aromen zur Nase stauen.\r\n>Kein Zufall, dass jeder
    Cocktailstil sein eigenes Glasformat entwickelt hat.\r\n\r\n>Die Wahl des richtigen
    Glases beeinflusst Geschmack und Trinkgenuss eines Cocktails erheblich. Eine Übersicht
    der gängigen Typen:\r\n\r\n## Glasformen zur Cocktailbereitung\r\n\r\n| Glastyp
    | Inhalt | Verwendung |\r\n|---|---:|---|\r\n| Longdrink-Glas | 200–450 ml | Drinks
    mit [[wiki:eis|Eis]], [[wiki:filler-1|Säfte, Tonic]] |\r\n| Collins-Glas | 200–350
    ml | Schlank und hoch, für [[recipe:kiwi-collins|Collins-Drinks]] |\r\n| Highball
    / DOF | variabel | Stabil, für einfache [[recipe:junglefruit|Drinks und Muddling]]
    |\r\n| Fancy / Hurricane | 200–450 ml | Exotische [[recipe:wild-horse|Drinks mit
    Fruchtsäften]] |\r\n| Tumbler, Rocks / Old-Fashioned | 160–350 ml | [[recipe:sazerac|Kurz,
    breit, dickwandig]] |\r\n| Nick & Nora | 80–120 ml | [[wiki:martini-1|Martini]],
    [[wiki:manhattan|Manhattan]] (Nosing) |\r\n| Martini-Glas, V-Shape | 120–220 ml
    | Klassisches [[recipe:ottone|Cocktailglas für Shortdrinks]] |\r\n| Coupe | 90–150
    ml | [[wiki:classic-daiquiri|Daiquiri]], Sidecar, Aviation |\r\n| Margarita-Glas
    | 200–350 ml | [[wiki:margarita-2|Spezialisiert]]; kann durch Sekt- oder Martiniglas
    ersetzt werden |\r\n| Weinglas (groß) | 400–600 ml | [[recipe:campari-tocco-rosso|Spritzes,
    Aperol]], Tiki |\r\n| Nosing-Glas | ab 170 ml | [[wiki:whisky-und-whiskey|Konisch
    zulaufend, konzentriert Aromen]] |\r\n| Tiki Mug | 300–600 ml | [[wiki:rum|Trinkgefäß
    oder Becher]] mit traditionellen typischen, südpazifischen Tiki-Motiven.   Tiki-Cocktails.
    |\r\n| Mule-Becher (Kupfer) | 300–400 ml | Moscow Mule |\r\n| Shot-Glas | 40–60
    ml | [[recipe:apfelschorle|Für Kurzdrinks wie B-52]] |\r\n\r\n\r\n## Unverzichtbare
    Grundausstattung\r\n\r\n- Wer kompakt starten möchte, kommt mit diesen vier Typen
    weit:\r\n- Longdrink-Glas\r\n- Martini-Glas\r\n- Tumbler\r\n- Nosing-Glas\r\n\r\n\r\n\r\n##
    Temperatur & Kühlung\r\n\r\n>Gläser vor dem Servieren kühlen: entweder im Tiefkühler
    oder mit Eiswasser befüllen.\r\nEin warmes Glas verdünnt den Cocktail schneller
    und macht ihn wässriger.\r\n\r\n## Passend zum Stil\r\n\r\nDer [[wiki:negroni-bittersweet-klassiker|Negroni]]
    kommt im Tumbler-Glas — der [[wiki:eis|große Eiswürfel]] passt zum langsamen Trinktempo.
    Der [[wiki:gin|G & T]] im hohen Highball, oder großen Weinglas, hat Platz für
    viel Eis und [[wiki:filler-1|Tonic]]. Der Old Fashioned wird im [[wiki:old-fashioned|gleichnamigen
    Klassiker]]-Stil im [[wiki:glaeser|Rocks-Glas]] gereicht. Das [[wiki:barwerkzeuge|Mixing
    Glass]] selbst ist auch ein Glas — es gehört zur Barausstattung.\r\n\r\n---\r\n\r\n###
    Weiter Formen der Trinkgefäße\r\n\r\n- Borrel: Traditionelles niederländisches
    Trinkglas für Genever.\r\n- Catavino: Traditionelles spanisches Sherryglas; tulpenförmig
    mit sich nach oben verjüngendem Rand. Ideal zur Aromakonzentration beim Verkosten.\r\n-
    Coppa: Ballon- oder kelchförmiges Glas, ideal für Gin Tonic. Fasst die Aromen
    des Gins besonders gut.\r\n- Coupette: Cocktailglas in der Form einer Champagner-Coupe:
    flach, mit breitem Rand und kurzem Stiel. Für Cocktails \"straight up\" (ohne
    Eis).\r\n- Glencairn: Robustes Nosing-Glas für [[wiki:whisky|Whisky]] mit dickem
    Boden und sich nach oben verjüngendem Rand. Optimiert für Whisky-Tastings.\r\n-
    Goblet: Kelchglas mit breiter Öffnung. Für bestimmte Bier- und Cocktailstile verwendet.\r\n-
    Julep Mug: Silbernes oder verzinntes Metallgefäß zur Zubereitung und zum Servieren
    eines Julep.\r\n- Nick & Nora: Elegantes Cocktailglas mit 12–18 cl, ähnlich breites
    Weinglas ohne Stiel. 1930er-Jahre-Stil, benannt nach den Charakteren aus \"The
    Thin Man\".\r\n- Snifter: Elegantes, geschwenktes Nosing-Glas für Whisky, [[wiki:brandy-cognac-und-armagnac|Cognac]]
    und andere hochwertige Spirituosen.\r\n- Tankard: Einfaches Trinkgefäß, meist
    aus Metall. \r\n- Veladora: Kerzenglas aus mexikanischen Kirchen, als 8 cl Mezcal-Trinkgefäß
    zweckentfremdet. Trägt traditionell ein Kreuz auf dem Boden.\r\n\r\n\r\n\r\n---\r\n\r\n|
    *Quellen: Wiki / Forum* | *Quellen: Wiki / Rezepte* |\r\n| --- | --- |\r\n| *Quelle:
    Wiki [[wiki:eis]]* | *Quelle: Wiki [[wiki:old-fashioned]]* |\r\n| *Quelle: Wiki
    [[wiki:filler-1]]* | *Quelle: Wiki [[wiki:barwerkzeuge]]* |\r\n| *Quelle: Wiki
    [[wiki:martini-1]]* | *Quelle: Wiki [[wiki:gin]]* |\r\n| *Quelle: Wiki [[wiki:manhattan]]*
    | *Quelle: Wiki [[wiki:whisky]]*|\r\n| *Quelle: Wiki [[wiki:classic-daiquiri]]*
