- :id: 184
  :title: Gin - Botanicals & Destillation
  :slug: gin
  :body: "## Was ist Gin?\r\n\r\n>Gin ein [[post:SSCU7FTL|Getreidedestillat]], das
    während der Destillation mit verschiedenen [[wiki:kraeuter-und-botanicals|Gewürzaromen]]
    angereichert wird. Allen Gins gemeinsam ist der Wacholder (*Juniperus communis*).
    Es empfiehlt sich, Varianten mit über 40 % Alkohol zu kaufen – höherprozentige
    Abfüllungen bieten spürbar vollere, rundere Geschmacksprofile als 40-%-Varianten.
    Mittlerweile werden Spirituosen, gerade Gin, deutlich unter ihrer ursprünglichen
    Abfüllstärke angeboten.\r\n\r\n>**Gin bietet eine Vielzahl an Geschmacks-, Aromaprofilen.
    Von fruchtig, über [[wiki:zitrusfruechtchen|Zitrus]], blumig, grasig, kräuterig,
    Harz, würzig, bis erdig, pikant und süßlich.**\r\n\r\n\r\n### Historie\r\n\r\nGenever,
    auch Jenever niederländischer, oder belgischer Wacholderschnaps, historischer
    Vorläufer des Gin. Wird aus Malzwein destilliert und anschließend verschnitten.
    Zwei Hauptkategorien: Jonge (jünger, neutraler) und Oude (älter, malzbetonter).\r\n\r\n---\r\n\r\n###
    Wacholder als Pflichtbestandteil\r\n\r\nGin ist per Definition ein Wacholdergeist.
    Ohne ***Juniperus communis*** — den gemeinen Wacholder — darf kein Destillat als
    Gin vermarktet werden. Alles andere ist Freiheit.\r\n\r\n\r\n### Die wichtigsten
    Botanicals\r\n\r\nModerne Gins verwenden zwischen **4 und 40** verschiedene Botanicals:\r\n\r\n-
    Wacholder (Pflicht)\r\n- Koriandersamen\r\n- Angelikawurzel\r\n- Zitrusschalen
    (Zitrone, Orange, Grapefruit)\r\n- Kardamom, Ingwer, Pfeffer\r\n- Gurke, Rosenblüten,
    Lavendel (New-Western-Stile)\r\n\r\n---\r\n\r\n## [[wiki:destillation|Destillationsmethoden]]\r\n\r\n###
    [[post:AEiAj1OF|Pot Still Destillation]]\r\nBotanicals werden direkt in die Brennblase
    gegeben (*[[post:EVAyIWVC|Mazeration]]*) oder\r\nüber Dampfkorb (*vapour infusion*)
    aromatisiert. Ergibt vollmundigere Profile.\r\n\r\n### [[post:Zr3AN86u|Column
    Still]]\r\nSchneller und günstiger. Liefert reinere, neutralere Basis-Gins.\r\n\r\n---\r\n\r\n##
    Kategorien\r\n\r\n| Kategorie | Charakter |\r\n|---|---|\r\n| Dry / London Dry
    | Trocken |\r\n| Old Tom | Leicht süßlich |\r\n| Plymouth | Süßlich und würzig
    |\r\n| New Western | Wacholder tritt zurück | \r\n| Gunpowder Proof / Navy Strength
    | Brit. Militärbezeichnung für Spirituosen mit mindestens 54,5 % Alkohol. Bei
    [[wiki:rum|Rum]] und Gin verwendet. |\r\n\r\n>Die Wacholder-Intensität variiert
    erheblich zwischen den Kategorien.\r\n\r\n\r\n### Gin mit Begleitern\r\n\r\nDer
    klassische [[wiki:negroni-bittersweet-klassiker|Negroni]] zeigt, wie Gin mit [[wiki:vermouth|Vermouth]]
    und [[wiki:bitters|Bitters]] ein vollständiges Geschmacksbild ergibt. Für das
    richtige Mischverhältnis ist die [[wiki:shaken-vs-ruehren|Technik]] entscheidend
    — ein Negroni wird immer gerührt. \r\n\r\n### [[wiki:gin-tonic|Tonic-Pairings]]\r\n\r\nEin
    gutes G&T lebt vom **Verhältnis 1:3** (Gin zu Tonic). Wichtig:\r\n> Das [[wiki:filler-1|Tonic]]
    sollte den Gin ergänzen, nicht überdecken. Ein blumiger Gin\r\n> verlangt nach
    einem milden Tonic; ein würziger nach einem bitteren.\r\nImmer über große [[wiki:eis|Eiswürfel]]
    servieren — langsames Schmelzen verdünnt weniger.\r\n\r\n---\r\n\r\n| Empfehlungen
    London Dry | Empfehlungen Premium  | \r\n| --- | --- |\r\n|- Finsbury Platinum
    – 47 % | - Beefeater 24 – 45 % |\r\n|- Finsbury – 60 % | - The Duke – 45 % |\r\n|-
    Beefeater – 47 % | - Tanqueray No. Ten – 47,3 % |\r\n|- Tanqueray – 47,3 % | -
    Lebensstern – 43 % |\r\n|- Bombay Sapphire – 47 % auslaufend | - Both's Old Tom
    – 47 % |\r\n|- Brokers - 47 % | - Plymouth Gin – 41,2 % |\r\n\r\n---\r\n\r\n###
    Cocktails\r\n[[recipe:aviation]], [[recipe:gin-fizz|Gin Fizz]], [[wiki:gin-tonic|Gin
    Tonic]], [[wiki:martini-1|Martini]], [[wiki:negroni-bittersweet-klassiker|Negroni]].\r\n\r\n---\r\n\r\n###
    Trivia\r\n\r\n Ein Leben ohne Gin ist zwar möglich, doch vollkommen Gin-los.\r\n
    *Frei nach Loriot, alias Vicco von Bülow*\r\n\r\n---\r\n\r\n| *Quellen: Verschieden*
    | *Quellen: Wiki* |\r\n| --- | --- |\r\n| *Quelle: Forum [[post:SSCU7FTL|Tipps
    für den Barneuling/Gin]]*| *Quelle: Wiki [[wiki:negroni-bittersweet-klassiker]]*
    |\r\n| *Quelle: Forum [[post:AEiAj1OF|Tipps für den Barneuling/Getreidedestillate/Pot
    Still]]* | *Quelle: Wiki [[wiki:rum]]* |\r\n| *Quelle: Forum [[post:EVAyIWVC|LEXIKON/Mazeration]]*
    | *Quelle: Wiki [[wiki:vermouth|Vermouth - Der unterschätzte Wermut]]* |\r\n|
    *Quelle: Forum [[post:Zr3AN86u|LEXIKON/Column Still]]* | *Quelle: Wiki [[wiki:bitters|Bitters
    -  Aromatische Konzentrate]]* |\r\n| *Quelle: Rezepte [[recipe:aviation]]* | *Quelle:
    Wiki [[wiki:filler-1|Filler - as its best]]* |\r\n| *Quelle: Wiki [[wiki:shaken-vs-ruehren|Shaken
    vs. Rühren - Die richtige Technik]]* | *Quelle: Wiki [[wiki:martini|Martini]]*
    |\r\n| *Quelle: Wiki [[wiki:negroni-bittersweet-klassiker|Negroni]]* | *Quelle:
    Wiki [[wiki:kraeuter-und-botanicals]]* |\r\n| *Quelle: Rezepte [[recipe:gin-fizz]]*
    | *Quelle: Wiki [[wiki:zitrusfruechtchen]]* |\r\n| *Quelle: Wiki [[wiki:destillation]]*
