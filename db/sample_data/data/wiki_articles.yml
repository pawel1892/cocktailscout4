- :id: 399
  :title: Rum - Das karibische Lebenswasser
  :slug: rum
  :body: "## Was ist Rum?\r\n\r\n>Rum ist ein **Zuckerrohrschnaps**, der aus vergorenem
    Zuckerrohrsaft oder Melasse destilliert wird. Er gehört zu den meistkonsumierten
    Spirituosen der Welt und ist die Basis vieler klassischer Cocktails — darunter
    der [[wiki:classic-daiquiri|Daiquiri]] und der {{wiki:mojito|Mojito]].\r\n\r\n>
    \"**Rum ist das Destillat der Tropen, in jeder Flasche steckt ein Stück karibischer
    Geschichte.**\"\r\n\r\n---\r\n\r\n## Geschichte\r\n\r\nAls Urform des Rums gilt
    Clairin, ein haitianischer weißer Rhum Agricole aus spontaner Fermentation mit
    Wildhefen. Enthält typischerweise 51–60 % Alkohol. Spontangärung nennt man eine
    natürliche Gärung ohne Zugabe von Reinzuchthefe, nur durch wilde Hefen aus der
    Luft und der Umgebung. Verleiht unverwechselbare, komplexe Aromen.\r\n\r\nDie
    ersten dokumentierten Hinweise auf die Rum-Produktion stammen aus der **ersten
    Hälfte des 17. Jahrhunderts** von der Karibik-Insel Barbados. Der Entstehungsort
    ist nicht gesichert, es wird eine der Inseln des karibischen Raumes sein.\r\n\r\nSklaven
    auf den Zuckerrohrplantagen entdeckten, dass [[post:EVAyIWVC|Melasse]] — ein Nebenprodukt
    der Zuckerraffinierung — zu Alkohol vergoren werden kann.\r\n\r\n### Wichtige
    Meilensteine\r\n\r\n1. **1620** — Erste urkundliche Erwähnung von Rum in Barbados\r\n2.
    **1655** — Die britische Royal Navy führt die tägliche Rum-Ration ein\r\n3. **1862**
    — Bacardí gründet seine erste Destillerie in Kuba\r\n4. **1919–1933** — US-Prohibition
    macht Kuba zum Rum-Tourismusziel\r\n\r\n---\r\n\r\n## Herstellung\r\n\r\nDie Produktion
    läuft grob in vier Schritten ab\r\n\r\n- **Rohstoff**:  Für [[post:AEiAj1OF|Zuckerrohrsaft
    / Rhum Agricole]] oder [[post:EVAyIWVC|Melasse]] für industriellen Rum.\r\n- **Vergärung**:
    Hefe wandelt Zucker in 3–10 Tagen in Alkohol um\r\n- [[post:dxaH86Fo|**Destillation**:
    Pot Still (vollmundig) oder Column Still (leichter)]]\r\n- [[wiki:faesser|**Reifung**:
    Eichenfässer]] — je länger, desto komplexer\r\n\r\n## Stile im Überblick\r\n\r\n|
    Stil | Herkunft | Charakter |\r\n|---|---|---|\r\n| [[post:AEiAj1OF|Weißer Rum]]
    | Kuba, Puerto Rico | Leicht, neutral |\r\n| [[post:AEiAj1OF|Goldener Rum]]| Barbados,
    Trinidad| Mild, karamellisiert |\r\n| [[post:6B70hcZ6|Dunkler Rum]] | Jamaika,
    Guyana | Vollmundig, rauchig |\r\n| [[post:AEiAj1OF|Rhum Agricole]] | Martinique
    | Grasig, komplex |\r\n| [[post:FaSGbacs|Overproof]] | Jamaika | Intensiv, >57%
    |\r\n\r\n\r\n### Rum im Cocktail\r\n\r\nFür [[wiki:batching|Batched Drinks]] eignen
    sich goldene oder dunkle Rums besonders gut — ihre Komplexität trägt auch in großen
    Mengen. Weißer Rum ist die klassische Wahl für [[recipe:rum-sour|Sours]].\r\n\r\nEin
    schönes Beispiel für Agricole-Rum bildet der [[recipe:ti-punch-martiniquais|Ti
    Punch]], ein Kleiner Punch (Ti = Petit) aus der Karibik: Rhum Agricole, [[wiki:zucker|Rohrzucker]]
    und [[wiki:zitrusfruechtchen|Limette]]. Der nationale Cocktail von Martinique.\r\n\r\nEinen
    guten Überblick über geeignete [[wiki:sirup|Sirupe]] als Gegenpol zur Rumwürze\r\nfindest
    du im Sirup-Artikel. Wer Rum mit anderen Spirituosen vergleichen möchte: [[wiki:gin]]\r\narbeitet
    mit ganz anderen Aromaprinzipien.\r\n\r\n\r\n### Lagerung & Serviertipps\r\n\r\nRum
    sollte **aufrecht** und **lichtgeschützt** gelagert werden. Anders als [[wiki:wein|Wein]]
    reift er in der Flasche nicht weiter. Für Cocktails greife zu [[wiki:weisser-rum|weißem
    oder goldenem Rum]] — für Pur-Genuss lohnt sich ein guter [[wiki:dunkler-rum|aged
    Rum]].\r\n\r\n---\r\n\r\n| *Quellen: Verschieden* | *Quellen: Wiki* |\r\n| ---
    | --- |\r\n| *Quelle: Forum [[thread:tipps-fuer-den-barneuling]] Zuckerrohrdestillate*
    | *Quelle: Wiki [[wiki:sirup]]* |\r\n| *Quelle: Forum [[thread:lexikon]]* | *Quelle:
    Wiki [[wiki:gin]]* |\r\n| *Quelle: Wiki [[wiki:classic-daiquiri]]* | *Quelle:
    Wiki [[wiki:faesser]]* |\r\n| *Quelle: Wiki [[wiki:mojito]]* | *Quelle: Wiki [[wiki:wein]]*
    |\r\n| *Quelle: Wiki [[wiki:batching]]* | *Quelle: Wiki [[wiki:weisser-rum]]*
    |\r\n| *Quelle: Wiki [[wiki:zitrusfruechtchen]]* | *Quelle: Wiki [[wiki:dunkler-rum]]*
    |\r\n| *Quelle: Rezepte [[recipe:ti-punch-martiniquais]]* | *Quelle: Wiki [[wiki:zucker]]*
    |\r\n| *Quelle: Rezepte [[recipe:rum-sour]]* | |\r\n"
