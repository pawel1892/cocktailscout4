- :id: 401
  :title: Eis - Zeit
  :slug: eis
  :body: "##Eis in der Historie\r\n\r\n>Schon zur Römerzeit nutzte man Eis für den
    Genuss. Teuer transportiertes Gletschereis wurde zur Kühlung von Speisen und  Herstellung
    von Erfrischungsgetränken in jenen Tagen verwandt. Mit aus gefrorenen Seen und
    Flüssen geschnittene Blöcke füllte man im 19. Jahrhundert bis in die Neuzeit sogenannte
    Eiskeller für die Kühlung des Bieres und anderer Leckereien im Sommer.\r\n\r\n---\r\n\r\n##
    Eis ist eine Zutat\r\n\r\n>Die meisten Barkeeper unterschätzen Eis. Es beeinflusst
    **Temperatur, Verdünnung und Textur** eines Cocktails — und damit den Gesamteindruck
    genauso stark wie die Spirituose. Ein Begriff der Cocktailwelt mit Eis ist wohl
    jedem geläufig: \"On the Rocks\"  ist ein auf Eis serviertes Getränk, direkt über
    große Eiswürfel oder Monolith-Eis gegossen.\r\n\r\n\r\n### Eisarten im Überblick\r\n\r\n|
    Art | Oberfläche | Schmelzrate | Einsatz |\r\n| --- | --- | --- | --- |\r\n|[[thread:lexikon|Spherical]]
    (Kugel), Glasdurchmesser|sehr klein|sehr langsam| [[wiki:old-fashioned|Old Fashioned]]
    |\r\n|[[thread:lexikon|Monolith]] (großer Stücke), Glasdurchmesser|klein|Langsam|Tumbler|\r\n|
    Großer Würfel (5×5 cm) | Klein | Langsam | On the Rocks,[[wiki:old-fashioned|Old
    Fashioned]] |\r\n| Standard-Würfel | Mittel | Mittel | Shaker, [[wiki:gin-tonic|Highballs]]
    |\r\n| Cracked Ice | Groß | Schnell | [[recipe:moscow-mule-home-made|Mule]], Julep,
    Swizzle |\r\n| Crushed Ice | Sehr groß | Sehr schnell | Tiki, Basis für [[recipe:frozen-strawberry-margarita|Frozen
    Drinks]], Julep, Caipirinha. |\r\n|...|...|...|...|\r\n| Klares Eis | Klein |
    Langsam | Premium-Präsentation |\r\n\r\n## Klares Eis selbst herstellen\r\n\r\nTrübes
    Eis entsteht durch eingeschlossene Luft und Mineralien. Klares Eis gelingt mit
    der **Richtungsgefrierung**:\r\n\r\n1. Styroporbox mit Wasser füllen (oben offen
    lassen)\r\n2. Im Gefrierschrank von oben nach unten gefrieren lassen\r\n3. Untere
    trübe Schicht abschneiden — oberer Teil ist klar\r\n\r\n## Verdünnungsmanagement\r\n\r\n>>
    **Zu wenig Verdünnung: Cocktail zu stark und „hot\". Zu viel: flach und wässrig.
    \r\n>> Der optimale Bereich liegt bei 20–25% Verdünnung durch Schmelzwasser.**\r\n\r\nDie
    richtige [[wiki:shaken-vs-ruehren|Schütteltechnik]] entscheidet über Verdünnung
    beim Shaken.\r\nDas [[wiki:barwerkzeuge|passende Barwerkzeug]] — insbesondere
    gute Eiswürfelformen — machen den Unterschied.\r\nWelches [[wiki:glaeser|Glas]]
    du verwendest, beeinflusst, wie schnell das Eis schmilzt.\r\nIm [[wiki:classic-daiquiri|Daiquiri]]
    spielt Eis eine entscheidende Rolle für Textur und Temperatur.\r\n\r\n---\r\n\r\n###
    Utensilien für das Eismanagement\r\n- [[wiki:equipment|Eiskübel]]\r\n- [[wiki:equipment|Eispickel]]\r\n-
    [[wiki:equipment|Eisschaufel]]\r\n- [[wiki:equipment|Eiszange]]\r\n- Eisbox für
    größere Eismengen\r\n- Lewis Bag, Leinenbeutel - Herstellung von Crushed Ice;
    Eis wird in den Beutel gegeben, mittels Schlegel zerschlagen. Schmelzwasser wird
    absorbiert.\r\n- Ice-Crusher, Gerät um größere Eisbrocken zu zermahlen\r\n\r\nNatürlich
    eine Gefriermöglichkeit, aber das versteht sich von selbst.\r\n\r\n\r\n---\r\n\r\n|
    *Quellen: Wiki* | *Quellen: Verschieden*|\r\n| --- | --- |\r\n| *Quelle: Wiki
    [[wiki:shaken-vs-ruehren]]* | *Quelle: Forum [[thread:lexikon]]* |\r\n| *Quelle:
    Wiki [[wiki:barwerkzeuge]]* | *Quelle: Wiki [[wiki:equipment]]* |\r\n| *Quelle:
