- :id: 383
  :title: Whiskey und Whisky
  :slug: whisky-und-whiskey
  :body: ">Die Schreibweise gibt Hinweis auf die Herkunft: \r\n>**Whisky** Schottland,
    Kanada – \r\n>**Whiskey** Irland, USA. \r\n>Whisky oder Whiskey ist ein Destillat
    aus Getreide — Gerste, Mais, Roggen oder Weizen — das in [[wiki:faesser|Holzfässern]]
    reift. Für die EU sind Standards erforderlich: Mindestens 3 Jahre Fassreife in
    Fässern kleiner 700 l. Mindestens einen Alkoholwert von 40 %.\r\n\r\n\r\n## Historie\r\n>Seit
    1736 gibt es Aufzeichnungen über das Wort Whisky, dessen Ursprung doch weit davor
    aus dem gälischen abgeleiteten Wort \"uisge beatha\" stammt. Diese Bezeichnung
    wurde bereits im 16. Jahrhundert benutzt. Ob nun Schottland, oder Irland den Whisk(e)y
    erfamd, darüber streiten sich die Gelehrten heute noch.\r\n\r\n---\r\n\r\n## [[wiki:destillation|Destillatkategorien]]\r\n\r\n>**Malt
    Whisky** wird aus gemälzter Gerste von einer einzigen Brennerei hergestellt und
    genießt die höchste Wertschätzung unter Trinkern.\r\n\r\n>**Grain Whisky** (Weizen,
    Roggen, ungemälzte Gerste, Hafer, Mais) wird selten pur abgefüllt und dient hauptsächlich
    zum Verschneiden mit Malts. \r\n\r\n>**Blended Whisky** bietet gleichbleibende
    Aromen – von Vorteil für konsistente Cocktails.\r\n\r\n## [[wiki:whisky|Schottischer
    Whisky]]\r\nRegionsabhängige Aromenprofile von mild bis rauchig ([[wiki:peated|Peated]]).
    Sechs anerkannte Regionen.\r\n\r\n## [[wiki:whisky|Irischer Whiskey]]\r\nMilder
    als schottische Pendants, da Gerste nicht über Torf gedarrt, aber dreifach destilliert
    wird.\r\n\r\n## [[wiki:bourbon-vs-rye|Amerikanische Whiskeys]]\r\n\r\n| Typ |
    Besonderheit |\r\n|---|---|\r\n| [[wiki:bourbon-vs-rye|Bourbon]] | Mind. 51 %
    Mais, süßlich-mild |\r\n| [[wiki:bourbon-vs-rye|Rye Whiskey]] | Mind. 51 % Roggen,
    würzig |\r\n| [[wiki:bourbon-vs-rye|Tennessee]] | Sonderfilterung, weich |\r\n|
    Corn Whiskey | Nahezu neutral, hauptsächlich zum Blenden |\r\n\r\n## Neue Herkunft\r\n\r\n###
    Japanischer Whisky\r\nSchottischer Stil in der Regel\r\n\r\n### Deutscher Whisky
    \r\nBrennereispezifische Aromenprofile von mild, fruchtig bis rauchig. Kleinere
    Brennereien.\r\n\r\n---\r\n\r\n### Empfehlungen\r\n- Glenfiddich 12 Jahre\r\n-
    Clontarf Irish Malt\r\n- Jim Beam Black\r\n- Jim Beam Rye\r\n- Jack Daniel's No.
    7\r\n- Black Velvet Reserve\r\n- Glenlivet 12 Jahre\r\n- Jameson Irish Whiskey\r\n-
    Tyrconnell Single Malt\r\n\r\n\r\n### Cocktails\r\n[[recipe:blood-and-sand]],
    [[wiki:manhattan|Manhattan]], [[wiki:old-fashioned|Old Fashioned]], [[recipe:irish-coffee]],
    [[recipe:rob-roy]]\r\n\r\n\r\n---\r\n\r\n| *Quellen: Rezepte* | *Quellen: Verschieden*
    |\r\n| --- | --- |\r\n| *Quelle: Rezepte [Kategorien/Whiskey](https://www.cocktailscout.de/tag/Whiskey)*
    | *Quelle: [Forum: Tipps für den Barneuling](https://www.cocktailscout.de/cocktailforum/beitrag/LSbjcA1e)*
    |\r\n| *Quelle: Rezepte [Kategorien/Whisky](https://www.cocktailscout.de/tag/Whisky)*
    | *Quelle: Wiki [[wiki:faesser]]* |\r\n| *Quelle: Rezepte [[recipe:bood-and-sand]]*
    | *Quelle: Wiki [[wiki:manhattan]]* |\r\n| *Quelle: Rezepte [[recipe:whiskey-sour]]*
    | *Quelle: Wiki [[wiki:whisky]]* |\r\n| *Quelle: Rezepte [[recipe:irish-coffee]]*
    | *Quelle: Wiki [[wiki:bourbon-vs-rye]]* |\r\n| *Quelle: Rezepte [[recipe:mint-julep]]*
    | *Quelle: Wiki [[wiki:old-fashioned]]* |\r\n| *Quelle: Rezepte [[recipe:rob-roy]]*
    | *Quelle: Wiki [[wiki:destillation]]* |\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n"
