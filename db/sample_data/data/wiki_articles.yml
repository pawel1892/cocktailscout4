    | *Quelle: Wiki [[wiki:margarita-2]]* |\r\n| *Quelle: Wiki [[wiki:negroni-bittersweet-klassiker]]*
    | *Quelle: Rezepte [[recipe:campari-tocco-rosso]]* |\r\n| *Quelle: Wiki [[wiki:filler-1]]*
    | *Quelle: Rezepte [[recipe:junglefruit]]* |\r\n| *Quelle: Wiki [[wiki:whisky-und-whiskey]]*|
    *Quelle: Rezepte [[recipe:kiwi-collins]]* |\r\n| *Quelle: Forum [Tipps für den
    Barneuling](https://www.cocktailscout.de/cocktailforum/beitrag/Td3hzyZf)* | *Quelle:
    Rezepte [[recipe:sazerac]]* |\r\n| *Quelle: Forum [[thread:lexikon]]* | *Quelle:
    Rezepte [[recipe:wild-horse]]* |\r\n| | *Quelle: Rezepte [[recipe:ottone]]* |\r\n|
    | *Quelle: Rezepte [[recipe:apfelschorle]]* |\r\n\r\n"
