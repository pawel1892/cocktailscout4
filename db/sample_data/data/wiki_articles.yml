- :id: 400
  :title: Barwerkzeuge - Das Einmaleins
  :slug: barwerkzeuge
  :body: "## Was braucht man wirklich?\r\n\r\n>Wer [[wiki:eis|Eiswürfel]] selbst produzieren
    will, braucht natürlich außer dem Eisfach auch passende Eiswürfelformen. **Die
    Kantenlänge der Eiswürfel sollte 3 cm nicht unterschreiten**, damit die Cubes
    genügend Volumen haben, um reichlich Umgebungswärme aufnehmen zu können, ohne
    zu schnell zu schmelzen. Um crushed ice produzieren zu können, könnt ihr aber
    auch auf Cubes mit geringerer Kantenlänge zurückgreifen, um so leichter sind sie
    zu crushen. Die Formen sind heute vielfältig erhältlich.\r\n\r\n>Gute Cocktails
    entstehen nicht durch viel Ausrüstung — sondern durch\r\n**das richtige Werkzeug,
    richtig eingesetzt**. Hier ist die Minimalliste,\r\ndie wirklich jeden [[wiki:bezeichnung-der-getraenke|Cocktailstil]]
    abdeckt.\r\n\r\n## Das Wichtigste\r\n\r\n| Werkzeug | Zweck | Worauf achten |\r\n|---|---|---|\r\n|
    [[post:qVqyJIcq|Boston-, oder Standard-Shaker]] | [[wiki:shaken-vs-ruehren|Schütteln]]
    | Zwei Teile (Glas + Metall, nur Metall |\r\n| [[post:EVAyIWVC|Mixing Glass]]
    | [[wiki:shaken-vs-ruehren|Rühren]] | Dickwandig, schwer, mit Ausguss |\r\n| [[post:zfI9J50o|Barlöffel]]
    | [[wiki:shaken-vs-ruehren|Rühren]], Schichten, [[wiki:barmasse|Abmessen]] | Langer
    Stiel, spiralförmig |\r\n| [[post:qVqyJIcq|Jigger (Doppelmessbecher]]) | Abmessen
    | 20/40 ml, 25/50 ml oder 30/60 ml — [[wiki:barmasse|kein Schätzen]] |\r\n| [[post:qVqyJIcq|Hawthorne
    Strainer]] | [[post:TizOWyNh|Abseihen]] | Passt auf Boston, oder Standard-Shaker
    |\r\n| [[post:KfWCTgw9|Feinsieb]] | [[wiki:double-strain|Doppelt Abseihen]] |
    Hält kleine [[wiki:eis|Eispartikel]] und Fruchtfleisch zurück |\r\n| [[post:EVAyIWVC|Muddler]]
    | Zerstoßen | Nicht zu aggressiv — Zerstampfen ≠ Zerquetschen |\r\n| [[post:mxk9AhpD|Zester]]
    / [[post:mxk9AhpD|Y-Peeler]] / [[post:55QJgTHQ|Sparschäler]] | [[post:mxk9AhpD|Zesten
    schneiden]] | [[wiki:hygiene|Scharfe Klinge pflegen]] |\r\n\r\n## Was man nicht
    braucht\r\n\r\n- Elektrischer Shaker (Verlust der Kontrolle über Verdünnung)\r\n-
    Vorgefertigte Sour-Mischungen (echten Zitrus verwenden)\r\n- Messlöffel aus der
    Küche (zu ungenau für Bararbeit)\r\n\r\n## Pflege & Qualität\r\n\r\nGutes [[wiki:eis|Eis]]
    und [[wiki:hygiene|scharfes Werkzeug]] sind untrennbar. Ein stumpfer Y-Peeler
    zerreißt [[wiki:zitrusfruechtchen|Zitrusschalen]] statt sie sauber abzuziehen.\r\n\r\nDie
    [[wiki:shaken-vs-ruehren|Technik]] entscheidet über Ergebnis — das Werkzeug ermöglicht
    sie nur. Mit dem richtigen [[wiki:glaeser|Glas]] und dem richtigen Equipment lässt
    sich ein [[wiki:classic-daiquiri|Daiquiri]] in unter\r\n2 Minuten auf Restaurantniveau
    zubereiten.\r\n\r\nWer seine Bar weiter ausstatten möchte und da gibt es so einige
    Gelegenheiten, eine [[wiki:equipment|Übersicht möglicher Barwerkzeuge]], der kleinen
    Helferlein, die zwar nicht notwendig, manchmal recht angenehm sind. Aber je mehr
    Gerätschaft vorhanden, umso mehr muss auch [[wiki:hygiene|gereinigt]] werden.
    Das sollte man immer beachten.\r\n\r\n---\r\n\r\n| *Quellen: Wiki* | *Quellen:
    Verschieden* |\r\n| --- | --- |\r\n| *Quelle: Wiki [[wiki:bezeichnung-der-getraenke]]*
    | *Quelle: Forum [[thread:tipps-fuer-den-barneuling]]* |\r\n| *Quelle: Wiki [[wiki:shaken-vs-ruehren]]*
    | *Quelle: Forum [[thread:lexikon]]* |\r\n| *Quelle: Wiki [[wiki:barmasse]]* |
    *Quelle: Wiki [[wiki:glaeser]]* |\r\n| *Quelle: Wiki [[wiki:double-strain]]* |
    *Quelle: Wiki [[wiki:classic-daiquiri]]* |\r\n| *Quelle: Wiki [[wiki:eis]]* |
    *Quelle: Wiki [[wiki:hygiene]]* |\r\n| *Quelle: Wiki [[wiki:zitrusfruechtchen]]*
    | *Quelle Wiki [[wiki:equipment]]* |\r\n| *Quelle: Wiki [[wiki:shaken-vs-ruehren]]*|
    |\r\n\r\n\r\n\r\n"
