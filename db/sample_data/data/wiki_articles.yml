- :id: 133
  :title: Double Strain - Doppeltes Sieben
  :slug: double-strain
  :body: "### Zweimal Sieben \r\n\r\n```\r\nIn der Mathematik ergibt es vierzehn,
    \r\noder im Baugewerbe ganz feinen Sand.\r\nAber Spaß beiseite, eigentlich handelt\r\nes
    sich um eine Bezeichnung der Cocktailtechnik:\r\n\r\n```\r\n\r\n--- \r\n\r\n##
    Begriff\r\n\r\n>Der Begriff Double Strain (doppeltes Abseihen) bezeichnet eine
    gängige Barkeeper-Technik, bei der ein geschüttelter Cocktail durch zwei Siebe
    gegossen wird. Es wird dadurch verhindert, dass Eisstückchen (Splits), Fruchtfleisch
    oder Kräuterreste in das finale Getränk gelangen, was für eine seidige Textur
    und ein klares Aussehen sorgt. \r\n\r\n## Warum zweimal sieben\r\n\r\nDer \"Double
    Strain\" ist besonders wichtig für:\r\n\r\n- Eisfreie Drinks: Alles, was \"[[post:55QJgTHQ|straight
    up]]\" (ohne Eis im Glas) in [[wiki:glaeser|Martinigläsern oder Coupes]] serviert
    wird.\r\n- Frucht- und Kräutercocktails: Drinks mit pürierten Früchten, Beeren
    oder frischen Kräutern (z.B. ein [[recipe:gin-basil-smash|Gin Basil Smash]]).\r\n-
    Feine Texturen: Um ein schönes, feines Schaumhäubchen z.B. bei einem [[recipe:whiskey-sour]]
    zu erhalten. \r\n\r\n##So funktioniert der Double Strain\r\n\r\n1. Erstes Sieb
    [[wiki:barwerkzeuge|(Hawthorne Strainer)]]: Setzen Sie das herkömmliche Barsieb
    auf den Shaker, \r\num die [[wiki:eis|groben Eiswürfel]] und größere Zutaten wie
    [[wiki:kraeuter-und-botanicals|Blätter]] zurückzuhalten.\r\n2. Zweites Sieb [[post:KfWCTgw9|(Fine
    Mesh Strainer)]]: Halten Sie zusätzlich ein sehr feines Teesieb über das Servierglas.\r\n3.
    Ausgießen: Gießen Sie den Drink langsam aus dem Shaker durch beide Siebe in das
    Glas. \r\n\r\n>Rezepte für die es sich lohnt zu sieben, am Beispiel **[[post:7AL2C0PB|Basilikum]]**,
    unten stehend.\r\n\r\n---\r\n\r\n| *Quellen: Wiki* | *Quellen: Forum / Rezepte*
    |\r\n| --- | --- |\r\n| *Quelle: Wiki [[wiki:glaeser]]* | *Quelle: Forum [LEXIKON](https://www.cocktailscout.de/cocktailforum/beitrag/AujmVOOB)*
    |\r\n| *Quelle: Wiki [[wiki:barwerkzeuge]]* | *Quelle: Forum [[thread:tipps-fuer-den-barneuling|Tipps
    für den Barneuling]]* |\r\n| *Quelle: Wiki [[wiki:eis]]* | *Quelle: Rezepte [Kategorien/Basilikum](https://www.cocktailscout.de/tag/Basilikum)*
    |\r\n| *Quelle: Wiki [[wiki:kraeuter-und-botanicals]]* | *Quelle: Rezepte [[recipe:whiskey-sour]]*
    |\r\n\r\n\r\n"
