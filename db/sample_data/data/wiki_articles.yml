- :id: 2
  :title: Absinth - Die grüne Fee
  :slug: absinth
  :body: "## Das Mysterium\r\n\r\nHaha, auf Cocktailscout glauben die noch an Feen
    und Elfen. - Nicht wirklich, \"Grüne Fee\" das Synonym für Absinth, umgibt selbst
    heute eine gewisse Mystik. Doch was macht das Mystische aus? Dazu müssen wir erst
    eintauchen in Abgründe vergangener Jahrhunderte.\r\n\r\nAbsinth, ursprünglich
    erstmals destilliert, so belegt, im heutigen Schweizer Kanton Neuenburg. Prinzipiell
    ist Absinth ein [[wiki:vermouth|Wermut-Likör]], wie der Name verrät, stammt er
    von [[wiki:kraeuter-und-botanicals|Artemisia absinthium, dem Wermutkraut]]. Er
    wird mit Anis, Fenchel und weiteren Kräutern durch Destillation auf einen hohen
    bis sehr hohen alkoholischen Wert gebracht, der in der Regel zwischen 50 und über
    80 Volumenprozent liegt. Gehört zur Ordnung der Bitter wie Magenbitter und weitere,
    obwohl er doch so gar nicht bitter schmeckt.\r\n\r\nDieses Elixier sollte seit
    dem 18. Jahrhundert der Heilung dienlich sein, trat im 19. Jahrhundert seinen
    Siegeszug an. Persönlichkeiten wie Edgar Ellen Poe, Gauguin, van Gogh, Toulouse-Lautrec,
    viele weitere große Künstler waren diesem Getränk sehr zugeneigt, wie berichtet
    wird. Man sprach ihm euphorisierende, aphrodisierende Wirkungen zu. Einige Gemälde,
    von „Grüner Fee“ berauschten Personen darstellend, entstanden.\r\n\r\nEin richtiger
    Kult wurde zelibriert. Gerätschaften explizit für diese kleine Sünde entwickelt.
    Davon war der [[wiki:absinthloeffel|Absinthlöffel]] recht schlicht. In der einschlägigen
    Gastronomie tauchten [[wiki:absinthe-fontaine|Absinth-Fontainen]] auf. Behälter
    aus Glas die gekühltes Wasser über mehrere Hähne dosiert ins Gästeglas tropfen
    lassen. Andere hatten Glasaufsätze aus Metall, [[post:zfI9J50o|Brouilleur]] genannt,
    die ebenfalls Wasser in den Absinth tröpfeln ließen.\r\n\r\nOscar Wilde sinnierte
    über die „Grüne Fee“: „Nach dem ersten Glas sehen Sie die Dinge, wie Sie es sich
    wünschen. Nach dem Zweiten sehen Sie die Dinge, wie sie nicht sind. Letzten Endes
    sehen Sie die Dinge so, wie sie wirklich sind, und dieses ist das Schrecklichste
    auf der Welt.“\r\n\r\nEin von Absinth beseelter Vater löschte seine ganze Familie
    aus. So die Geschichte, worauf die Forderung nach Verbot dieser [[wiki:spirituosen|Spirituose]]
    laut wurde. Es war einer von mehreren Faktoren, der letztendlich den jahrelangen
    Ruf fruchten ließ. Einer aber, der das [[wiki:faesser|Fass]] zum Überlaufen brachte.
    Anfang des 20. Jahrhunderts gingen viele Staaten dazu über Absinth-Verbote auszusprechen.
    Ein Verantwortlicher wurde schnell gefunden: Der hohe Thujon-Gehalt, ein Nervengift,
    das in der Pflanzenwelt häufig vorkommt, ist der Buhmann in diesem Getränk. Thujon
    in hohen Dosen genossen führt zu Halluzinationen, Schwindel, Krämpfen, Wahnvorstellungen.\r\n\r\nSpätestens
    jetzt beginnt das Mysterium. Der Reiz des Verbotenen, der Status als Droge erhält
    immer mehr Anhänger über alle Kontinente. Doch da, wo er verboten war musste Gleichwertiges
    folgen. Man erfand den Pastis, der erfolgreich seinen Siegeszug antrat. Über ein
    dreiviertel Jahrhundert hielt das Verbot. Doch war es tatsächlich der, ach so
    hohe, Thujongehalt?\r\n\r\n## Das Mysterium kehrt zurück\r\n\r\nSeit Aufhebung
    des Verbotes in Europa, Deutschland z. B. im Jahr Ende 1990, erhältlich ca. 1998,
    stieg die Nachfrage derart an, dass immer mehr Hersteller einen Absinth kreierten.
    Heute besteht für uns die Qual der Wahl.\r\n\r\nCharles Baudelaire philosophierte:
    „Absinth gebe dem Leben eine feierliche Färbung, helle seine dunklen Tiefen auf“.
    Er wird seine Fee auf traditionelle Weise verköstigt haben, Zuckerlöffel auf das
    Absinth-Glas, tröpfchenweise kaltes Wasser zufügen, dass der Zucker sich auflöst,
    in das Glas tropft, mit dem Absinth vermengt. Eine Anisée typische Trübung tritt
    ein. Der so genannte [[post:1cNpHYL3|Louche-Effekt-, oder Ouzo-Effekt]]. Hierbei
    versuchen die Anisöle im Alkohol eine Liaison mit dem Wasser einzugehen. Doch
    das klappt nicht, kann sich nicht mit Wasser vermengen, eine Art Emulsion entsteht.
    Durch unterschiedlichen Index der Lichtbrechung trübt sich die Spirituose.\r\n\r\nHeute
    wird vielfach ein Zuckerwürfel mit Absinth getränkt, angezündet. Der Zucker karamellisiert,
    tropft in das Getränk, ergibt eine etwas andere Note. Zum Schluss mit Wasser aufgefüllt
    im traditionellen Mischverhältnis ca. 1:3.\r\n\r\nWie schon erwähnt, wurde Absinth,
    nicht nur in Künstlerkreisen, in sehr großen Mengen verzehrt. Die Legende, der
    Schnaps stimuliere zu Höchstleistungen, verändere das Bewusstsein, hielt sich
    unerschütterlich. Es kam wie es kommen musste zum Verbot dieser Spirituose und
    der Buhmann Thujon war die Erklärung.\r\n\r\nAber Wissenschaftler fanden nun heraus
    (dafür haben wir sie): Alles Quatsch! Man untersuchte nicht nur Absinth der nach
    alter Rezeptur nachgebaut wurde, sondern ebenso Absinth aus vergangener Zeit in
    verschlossenen Flaschen. Heraus kam, der Anteil an Nervengift ist äußerst gering.
    Auslöser der Exzesse vergangener Jahrhunderte mag der erhöhte, sicherlich auch
    der teilweise nicht ganz so saubere, fuselige Alkohol dieser Zeit gewesen sein.\r\n\r\nSo
    schnell kann Wissenschaft Mysterien zerstören. Doch wir wissen immer noch nicht,
    warum heißt es „Grüne Fee“? Nun, grün ist einfach: Die meisten Absinthe vergangener
    und heutiger Zeit sind grün durch pflanzliches Chlorophyll gefärbt. Die Fee: Sie
    hält noch leicht das Mystische. Ist vielleicht die junge Dame, die einem den Kopf
    verdreht, um ihn schwirrt, betört, berauscht...\r\n\r\nDer [[recipe:citius-altius-fortius]]
    soll euch heute den Kopf verdrehen.... Zum Wohl!\r\n\r\n---\r\n\r\n### Zusammensetzung\r\n\r\n>Kräuterdestillat
    aus [[wiki:kraeuter-und-botanicals|Anis, Fenchel und Wermut]] sowie weiteren Botanicals,
    45–80 % Alkohol. Die grüne Färbung entsteht durch das Chlorophyll(Blattgrün) der
    Kräuter, welches bei der [[post:EVAyIWVC|Mazeration]] an den umgebenden Alkohol
    abgegeben wird und diesen einfärbt. Die EU begrenzt [[post:B1ePZzoq|Thujon auf
    35 mg/kg]] – weit unterhalb schädlicher Konzentrationen.\r\n\r\n>Wird in Cocktails
    tropfenweise eingesetzt – viele Rezepte geben genaue Tropfenmengen vor.\r\n\r\n\r\n###
    Geschmacksprofile\r\n\r\n- **[[wiki:anisee|Anisbetonter Absinth]]:** Ähnelt [[wiki:anisee|Pernod/Pastis]],
    traditionell mit Zuckerwürfel und Wasser serviert.\r\n- **[[wiki:vermouth|Wermutzentrierter
    Absinth]]:** Für Personen mit Abneigung gegen Anis.\r\n\r\n### Absinth-Ritual\r\n\r\n-
    In ein spezielles Absinthglas wird etwas Absinth gegeben.\r\n- Auf den Glasrand
    legt man einen [[wiki:absinthloeffel|Absinthlöffel]] mit einem Zuckerwürfel.\r\n-
    [[wiki:eis|Eiskaltes Wasser]] wird langsam auf den Zuckerwürfel in das Glas getropft.
    Traditionell mit einer [[wiki:absinthe-fontaine|Absinthe-Fontaine]]\r\n- [[post:zfI9J50o|Brouilleur]],
    Gerät, das Wasser tropfenweise ins Glas laufen lässt und so den Louche-Effekt
    auslöst. Ähnlich Absinthe-Fontaine, aber kompakter.\r\n- Durch das Wasser trübt
    sich der klare Absinth milchig-weiß ein, der [[post:1cNpHYL3|Louche-Effekt]].\r\n\r\n###
    Cocktailverwendung\r\n\r\nAbsinth harmoniert hervorragend mit [[wiki:gin|Gin]],
    [[wiki:Whisky-und-whiskey|Whisky]], [[wiki:brandy-cognac-und-armagnac|Cognac]]
    und [[wiki:vermouth|Vermouth]]. Manche Rezepte verwenden ihn nur zum Ausspülen
    des Glases (*Rinse*), z. B. [[recipe:sazerac]] und [[recipe:corpse-reviver-2]].\r\n\r\n###
    Kauftipps\r\n\r\nQualitätsabsinthe sind in der Regel hochpreisig, aber in größeren
    Flaschen abgefüllt. Pernod ist eine günstigere Alternative für Rezepte, die anisbetonten
    Ersatz zulassen.\r\n\r\n### Empfehlung \r\n- Abysse Premium Absinthe 60 % Vol.,
    im Niedrigpreissegment\r\n\r\n---\r\n\r\n### Absinth-Tag\r\nIn den Vereinigten
    Staaten von Amerika wird im März der Tag des Absinthes begangen. Seltsame Bräuche...\r\n\r\n\r\n---\r\n\r\n|
