  :body: "![Lexikon W](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:32}}/grafik.png)\r\n**Wedges
    (engl.)**\r\nSpalten von Früchten, z. B. Zitrusfrüchte vom Stiel zur Blüte aufgeschnitten
    in kleine Teile.\r\n![Wedges](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:194}}/aWedges.jpg
    \"small\")\r\n\r\n**Weinbrand**\r\nSiehe unter [[post:JGU7ljnS|<u>\"Weinbeerendestillate\"</u>]]
    in den Tipps für den Barneuling.\r\n\r\n**Wermut**\r\nArtemisia absinthium, aromatische
    Pflanze, die zur Herstellung von Absinth und Vermouth genutzt wird. \r\n\r\n*\"Ein
    wenig Wermut teilt dem Honig schnell seine Bitterkeit mit, dagegen nicht einmal
    die doppelte Menge Honig dem Wermut etwas von seiner Süßigkeit.\" Gregor von Nazianz
    (um 320 - um 390)*\r\n\r\n**Whipped Cream (engl.)**\r\nGeschlagene Sahne.\r\n\r\n**Whisk
    (engl.)**\r\nSchlagbesen um z. B. Sahne zu schlagen.\r\n\r\n**Whiskey / Whisky
    (irisch-, schott.-gäl. Ursprung)**\r\nBei den [[post:LSbjcA1e|<u>\"Getreidedestillaten\"</u>]]
    in den Tipps für den Barneuling.\r\n\r\n*\"Whisky ist schlecht für die Menschen,
    vor allem schlechter Whisky.\" Spruch aus Schottland*\r\n\r\n**Wineglass (engl.)**\r\nAmerikanisches
    Barmaß entspricht einem gill. Siehe unter [[post:JGU7ljnS|<u>\"Barmaße\"</u>]]
    in den Tipps.\r\n\r\n**Winzersekt**\r\n[[post:LCsqyzy7|<u>Schaumwein</u>]] mit
    Herstellungsverfahren wie Champagner, doch ohne regionalem Schutz.\r\n\r\n**Wodka
    (slaw. Ursprung)**\r\nSiehe unter [[post:JGU7ljnS|<u>\"Getreidedestillate\"</u>]]
    in den Tipps für den Barneuling.\r\n\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]\r\n"
