    Keller. Kleiner Tipp, wenn lediglich Ginger Ale statt Ginger Beer zur Hand, kann
    man dieses mit frischem Ingwer aufpeppen.\r\n\r\n[color=#fefefe] . . . . . . .
    . . . . . [/color][img]https://image.jimcdn.com/cdn-cgi/image/width=300%2Cheight=300%2Cfit=contain%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/ia05ba4b1455f9102/version/1406661953/image.jpg[/img]\r\n\r\nDrink
    mit Ingwer:\r\n- Ginger MaMu\r\n\r\n[b][i]Lavendel[/i][/b]\r\nKraut, in Stauden
    wachsend, mit blauen Blüten. Vorwiegend in Gartenabteilungen und Gärtnereien erhältlich.
    Benötigt sonnige Standorte. Intensiver Duft und Geschmack, deswegen sehr sparsam,
    hauptsächlich die Blüten verwenden. So nebenbei, Lavendel vertreibt Mücken.\r\n\r\n[color=#fefefe]
    . . . . . . . . . . . . [/color][img]https://image.jimcdn.com/cdn-cgi/image/width=300%2Cheight=300%2Cfit=contain%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/ie7c43a7990a02eb0/version/1406661953/image.jpg[/img]\r\n\r\nDrink
    mit Lavendel:\r\n- Frozen Lemon-Lavender \r\n\r\n[b][i]Limettenblätter[/i][/b]\r\nDie
    Blätter der Kaffir-Limette entfalten nur im zerkleinerten und erwärmten Zustand
    ihr volles, citrusartiges Aroma. Teilweise frisch, sonst eingefroren in Asia-Shops
    erhältlich. Ähneln vom Aussehen einem frischen Lorbeerblatt, mit einer ledrigen
    Festigkeit. Getränke mit Limettenblättern könnten sein Glühwein, Feuerzangenbowle,
    Punches und ähnliches.\r\n\r\n[color=#fefefe] . . . . . . . . . . . . [/color][img]https://image.jimcdn.com/cdn-cgi/image/width=300%2Cheight=300%2Cfit=contain%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/id5de857de1498673/version/1406661953/image.jpg[/img]\r\n\r\nDrink
    mit Limettenblätter:\r\n- GF Honey\r\n\r\n[b][i]Minze[/i][/b]\r\nEs gibt unzählige
    Arten Minze. Zu nennen sind hier die\r\n[u][i]Hain-Minze[/i][/u] Mentha x spicata
    var. nemorosa, die ideale Minze für Mojito schlechthin.\r\n[u][i]Krause Minze[/i][/u]
    Mentha spicata var. crispate\r\n[u][i]Marrokanische Minze[/i][/u] Mentha spicata
    \r\n[u][i]Pfefferminze[/i][/u] Mentha x piperita var. piperita, besitzt im Vergleich
    zu den oberen drei Minzen einen höheren Mentholgehalt, der in Cocktails weniger
    geschätzt wird. \r\n[u][i]Schokoladenminze[/i][/u] Mentha x piperita var. chocolate\r\n\r\nDiese
    und andere Arten sind im gut sortierten Fachhandel oder teilweise auf dem Wochenmarkt
    erhältlich. Minze nicht ohne Gefäß in den Garten auspflanzen. Sie bildet sonst
    überall neue Triebe.\r\n\r\n[color=#fefefe] . . . . . . . . . . . . [/color][img]https://image.jimcdn.com/cdn-cgi/image/width=300%2Cheight=300%2Cfit=contain%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/ifcdde870569f3c8e/version/1406661953/image.jpg[/img]\r\n\r\nDrinks
    mit Minze:\r\n- Mojito\r\n- Brokkr\r\n\r\n[b][i]Oregano[/i][/b]\r\nDost oder Wilder
    Majoran sind weitere Bezeichnungen dieses würzigen, antibakteriell wirkenden Krautes
    mit kleinen Blättchen. Bevorzugt einen warmen trockenen Standort. Geeignet ist,
    wegen der hohen Würzkraft der griechische Oregano. Auf und in Märkten wie auch
    im Fachhandel erhältlich. Sein spezielles Aroma lässt experimentelle Drinks entstehen.\r\n\r\n[color=#fefefe]
    . . . . . . . . . . . . [/color][img]https://image.jimcdn.com/cdn-cgi/image/width=300%2Cheight=300%2Cfit=contain%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/ia9451479fcc381ef/version/1406661953/image.jpg[/img]\r\n\r\n[b][i]Petersilie[/i][/b]\r\nPeterle,
    auch Silk und viele weitere regionaltypische Namen trägt dieses Gewächs. Wer kennt
    es nicht, dieses Kraut? Zwei Arten zur groben Blattunterscheidung, krausblättrige
    und glatte Petersilie. Die Glattblättrige ist für unsere Zwecke die passendere,
    da mehr Würzkraft in ihr steckt. Sie ist überall erhältlich. Verwendung könnte
    sie im Aperitif oder ähnlichem zur Geschmackssteigerung finden.\r\n\r\n[color=#fefefe]
    . . . . . . . . . . . . [/color][img]https://image.jimcdn.com/cdn-cgi/image/width=300%2Cheight=300%2Cfit=contain%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/i0123fef1225d39dd/version/1406661953/image.jpg[/img]\r\n\r\n[b][i]Rosmarin[/i][/b]\r\nImmergrüner
    buschiger Strauch, mit sehr aromatischem, ausgeprägtem Duft. Leicht bitterer Geschmack,
    an Eukalyptus erinnernd. Die frischen, nicht verholzten Triebspitzen sind für
    Cocktails ideal. In Gartenabteilungen der Märkte und auf dem Wochenmarkt erhältlich.
    Mag sonnige Standorte wenig Wasser, da aus dem Mittelmeerraum kommend.\r\n\r\n[color=#fefefe]
    . . . . . . . . . . . . [/color][img]https://image.jimcdn.com/cdn-cgi/image/width=300%2Cheight=300%2Cfit=contain%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/i405617eba1035053/version/1406661953/image.jpg[/img]\r\n\r\nDrinks
    mit Rosmarin:\r\n- Rosemarys Daiquiri\r\n- Rosemarys GT\r\n\r\n[b][i]Salbei[/i][/b]\r\nSehr
    viele Arten haben sich über fast alle Regionen verteilt. Vom [u][i]Echten Salbei[/i][/u]
    Salvia officinalis die Blätter mit unvergleichlichem Aroma zum Würzen, ebenfalls
    Verwendung finden die blauen Blüten als Deko. Ähnlich im Geschmack und Aussehen
    der [u][i]Muskatellersalbei[/i][/u] Salvia sclarea. Warmer Duft mit Schärfe, schmeckt
    in größerer Menge bitter. Im Fachhandel so auch in den Gartenmärkten und Wochenmärkten
    zu kaufen. Sonniger Standort und wenig Wasser bevorzugt.  \r\n\r\n[color=#fefefe]
    . . . . . . . . . . . . [/color][img]https://image.jimcdn.com/cdn-cgi/image/width=300%2Cheight=300%2Cfit=contain%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/i65f944809979e944/version/1406661953/image.jpg[/img]\r\n\r\nDrink
    mit Salbei:\r\n- Salvia Laimun\r\n\r\n[b][i]Thymian[/i][/b]\r\nViele Arten auch
    beim Thymian mit seinem hocharomatischen Duft und würzigen Geschmack der kleinen
    Blättchen. Bekannteste\r\n[u][i]Echter Thymian[/i][/u] Thymus vulgaris aber auch
    \r\n[u][i]Zitronenthymian[/i][/u] Thymus x citriodorus mit seinen hell geränderten
    Blättchen ist zu nennen. Hat einen intensiven zitronigen Duft und Geschmack. Kurzer
    bis bodendeckender Strauch, mag ebenfalls viel Sonne und wenig Wasser. Geeignet
    die jungen, nicht verholzten Triebspitzen. In und auf Märkten und im Fachhandel
    zu bekommen.\r\n\r\n[color=#fefefe] . . . . . . . . . . . . [/color][img]https://image.jimcdn.com/cdn-cgi/image/width=300%2Cheight=300%2Cfit=contain%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/ia59a19edbead1200/version/1406661953/image.jpg[/img]\r\n\r\nDrinks
    mit Thymian:\r\n- Ottone\r\n- Raspberry Thyme Smash\r\n\r\n[b][i]Waldmeister[/i][/b]\r\nHäufig
    in Rotbuchenwäldern anzutreffen, auch in Hain- und Eichenwäldern. Gutes Erkennungsmerkmal,
    die Blätter wachsen am Stängel in Quirlen und Etagen. Liebt Schatten bis halbschattige
    Standorte. Hat einen eigenartigen, angenehm würzigen Geruch. Im Frühjahr wird
    der Waldmeister auch auf Wochenmärkten verkauft. Man sollte ihn nicht im Garten
    aussetzen, sonst verteilt er sich überall. Gesundheitsschädlich durch seinen Cumarininhalt
    wird der Verzehr in sehr großen Mengen.\r\n\r\n[color=#fefefe] . . . . . . . .
    . . . . [/color][img]https://image.jimcdn.com/cdn-cgi/image/width=300%2Cheight=300%2Cfit=contain%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/ic93c00f0ef0dcaa0/version/1406661953/image.jpg[/img]\r\n\r\nDrink
    mit Waldmeister:\r\n- Mai-Bowle\r\n\r\n[b][i]Wermut[/i][/b]\r\nBitterer Beifuß,
    lat. Artemisia absinthium, etwas ungewöhnlich für einen Cocktail zu verwenden
    aber nicht abwegig, da es die Spirituose gleichen Namens gibt, die Extrakte dieser
    Pflanze enthält. Ebenfalls Bestandteil des Absinth. Verwenden möglichst die zarten
    Blättchen an den Neuaustrieben und die Blüten. Wird seit Urzeiten als Heilkraut
    angesehen. Wächst als Wildkraut selbst an Straßenrändern. Hin und wieder werden
    Jungpflanzen auch auf dem Wochenmarkt verkauft. Sehr bitter im Geschmack, appetitanregend.
    Wermut enthält Thujon, deswegen bitte nicht übermäßg verwenden. \r\n\r\n[color=#fefefe]
    . . . . . . . . . . . . [/color][img]https://image.jimcdn.com/cdn-cgi/image/width=300%2Cheight=300%2Cfit=contain%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/icd53884320a265fb/version/1406661953/image.jpg[/img]\r\n[color=#fefefe]
    . . . . . . . . . . . . [/color][i]Valérie75[/i]\r\n\r\nDrink mit Wermutkraut:\r\n-
    Americano AF\r\n\r\n[b][i]Ysop[/i][/b]\r\nEisenkraut und weitere Namen, ein Bestandteil
    des Chartreuse, benötigt sonnige, kalkhaltige Standorte. Die kleinen schmalen
    Blättchen mit ihrer starken Würzkraft, sollten sparsam verwendet werden. Im gut
    sortierten Fachhandel erhältlich. Ein Versuch, Ysop im entsprechenden Aperitif
    zu verwenden, ist es jedenfalls wert. \r\n\r\n[color=#fefefe] . . . . . . . .
    . . . . [/color][img]https://image.jimcdn.com/cdn-cgi/image/width=300%2Cheight=300%2Cfit=contain%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/ie542fd77e2714798/version/1406661953/image.jpg[/img]\r\n[i][color=#fefefe]
    . . . . . . . . . . . . [/color]Lemmikkipuu[/i]\r\n\r\n[b][i]Zimt[/i][/b]\r\nDie
    getrocknete Rinde des Zimtbaumes wird als Stangenzimt oder Kaneel, ebenso gemahlen
    in Pulverform in Gewürzabteilungen des Handels verkauft. Die Rinden, bei der Ernte
    in mehreren Lagen geschichtet, rollen sich in der Trocknungsphase zusammen. Zu
    unterscheiden ist, der feine Ceylonzimt, zeigt an den Enden ein geschlossenes
    Bild, im Gegensatz zum indonesischen oder chinesischen Zimt. Ebenfalls findet
    sich im Zimt Cumarin, weswegen die gleichen Vorsichtsmaßnahmen gelten, wie beim
    Waldmeister. Der Anteil im Ceylonzimt ist allerdings deutlich geringer, als im
    indonesischen oder Chinazimt. Im Getränk finden Verwendung sowohl Kaneel, alsauch
    der gemahlene Zimt.\r\n\r\n[color=#fefefe] . . . . . . . . . . . . [/color][img]https://image.jimcdn.com/cdn-cgi/image/width=300%2Cheight=300%2Cfit=contain%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/i52a34cbec0b56818/version/1406661953/image.jpg[/img]\r\n\r\nDrinks
    mit Zimt:\r\n- Hot buttered Rum\r\n- Weihnachts-Caipi\r\n\r\n[b][i]Zitronengras[/i][/b]\r\nFrüher
    den Asiamärkten vorbehalten, mittlerweile findet man es genauso im Supermarkt
    in der Obst- und Gemüseabteilung. Verwenden sollte man allerdings nur Frisches.
    Die Aromaten citrusartig, allerdings ohne Säure. Sie werden nur freigesetzt, indem
    man die Stängel anquetscht.\r\n\r\n[color=#fefefe] . . . . . . . . . . . . [/color][img]https://image.jimcdn.com/cdn-cgi/image/width=300%2Cheight=300%2Cfit=contain%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/if467c253afbf239c/version/1406661953/image.jpg[/img]\r\n\r\nDrink
    mit Zitronengras:\r\n- Lemongrasmojito\r\n\r\n[b][i]Zitronenmelisse[/i][/b]\r\nAuch
    einfach Melisse genannt, ist mittlerweile überall im Handel erhältlich Die gezackten,
    Blätter besitzen ein schönes, zitroniges Aroma. \r\n\r\n[color=#fefefe] . . .
    . . . . . . . . . [/color][img]https://image.jimcdn.com/cdn-cgi/image/width=300%2Cheight=300%2Cfit=contain%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/ia8ad34185591b422/version/1406661953/image.jpg[/img]\r\n[color=#fefefe]
    . . . . . . . . . . . . [/color][i]Werner100359[/i] \r\n\r\nDrinks mit Zitronenmelisse:\r\n-
    Banana`s Dreamland\r\n- Citrus Kumquat 43\r\n\r\n[b][i]Zitronenverbene[/i][/b]\r\nOder
    Zitronenstrauch, ein leider etwas in Vergessenheit geratenes Kraut. Verwendung
    finden die frischen Triebspitzen. Beim Reiben der Blätter entfaltet sich ein herrliches
    Citrusaroma mit leicht süßlichem Hauch. Zu beziehen im gut sortierten Fachhandel.\r\n\r\n[color=#fefefe]
    . . . . . . . . . . . . [/color][img]https://image.jimcdn.com/cdn-cgi/image/width=300%2Cheight=300%2Cfit=contain%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/i08dcababffcdf21d/version/1406661953/image.jpg[/img]\r\n\r\nDie
    Palette der Kräuter ist damit nicht beendet. Doch die Auswahl geschah unter dem
    Gesichtspunkt der möglichen Verwendung in einem Getränk.\r\n\r\n[i]rrr[/i]\r\n\r\n\r\n[post=JGU7ljnS]oben[/post]"
