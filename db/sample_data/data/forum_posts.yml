  :body: "![Lexikon F](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:14}}/grafik.png)\r\n**Fadenschneider**\r\nAuch
    unter [[post:mxk9AhpD|Zestenreißer]] oder Channel Knife bekannt, Besteck das feine
    Zesten von Schalen der Zitrusfrucht reißt. \r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:119}}/zestenreisser.JPG
    \"small\")\r\n\r\n**[[wiki:falernum-rumlikoer-und-wuerzrum-auf-karibische-art|Falernum]]**\r\nRumlikör
    mit Limettensaft und Gewürzen versetzt.\r\n\r\n**Fancy (engl.)**\r\nIn keine andere
    Cocktailkategorie einzuordnendes Mix-Getränk, welches sich oft durch einige Säfte
    und phantasievoller Dekoration auszeichnet.\r\nSiehe auch [[post:94rZApCd|<u>Bezeichnung
    der Getränke</u>]].\r\n\r\n**Fassstärke**\r\nBezeichnet in der Regel ein fassgelagertes,
    unverdünntes Destillat. Fassstark sind Alkoholica ab ca. 60% vol. und höher, trinkstark
    sind sie hingegen bei rund 40% vol., welche mit dest. Wasser versetzt werden.\r\n
    \r\n**Fat washing (engl.)**\r\nMethode, die gebratenes, geröstetes, gegrilltes,
    oder geräuchertes Fleisch in einer Spirituose nach und nach erkalten lässt. Anschließend
    wird das auf der Oberfläche angesammelte Fett abgeschöpft. Der Alkohol erhält
    so gewünschte Röst- / Raucharomen.  \r\n\r\n**Federweißer**\r\nDer frische, vergorene
    Traubenmost.\r\n\r\n**[[wiki:double-strain|Feinsieb]]**\r\nEngmaschiges Sieb (Teesieb),
    welches auch feine Rückstände aus der Flüssigkeit siebt. Siehe auch fine strain
    hier unten. \r\n\r\n**Félédes (ungar.)**\r\nUngarisch für lieblich; halbsüß.\r\n\r\n**Félszáraz
    (ungar.)**\r\nUngarisch für halbtrocken.\r\n\r\n**Fertigprodukt**\r\nVermengte
    Zutaten, die von der Getränkeindustrie zum schnellen Konsum in Dosen oder Flaschen
    gefüllt werden. Sie ersetzen keinesfalls einen guten Cocktail.\r\n\r\n**Fiaker
    (öster.)**\r\nIn Österreich ein schwarzer Kaffee mit Kirschwasser und Sahne (Schlagobers).
    Cognac, oder Rum werden ebenfalls gern genommen.\r\n\r\n**Fiederwäissen (luxem.)**\r\nLuxemburgische
    Bezeichnung für Federweißer, siehe oben.\r\n\r\n**[[wiki:filler-1|Filler (engl.)]]**\r\nAuffüllgetränk
    bei einem Drink, z. B. Orangensaft, oder Mineralwasser.\r\n\r\n**Fillette (franz.)**\r\nKleines
    Mädchen; Flaschengröße für Wein siehe unter [[post:Hza7iHRz|<u>Demi</u>]].\r\n\r\n**Filz**\r\nUntersetzer,
    zumeist aus Pappe, Bierdeckel.\r\n\r\n**Fine (franz.)**\r\nFranzösische Zusatz-Bezeichnung
    eines edlen Weinbrand.\r\n\r\n**Fine strain (engl.)**\r\nSiehe [[post:Hza7iHRz|<u>double
    strain</u>]]\r\n\r\n**Fino (span.)**\r\nTrockene Sherry-Variante mit biologischer
    Reifung unter Flor-Hefe, siehe auch unter [[post:LCsqyzy7|<u>leichte Alkohole
    / Weinbasis</u>]] unserer Tipps für den Barneuling. Sehr trocken, heller Stil.\r\n\r\n**[[wiki:bezeichnung-der-getraenke|Fix
    (engl.)]]**\r\nAlte Getränkekategorie bestehend aus hochprozentiger Spirituose,
    Zitronensaft, vorzugsweise Himbeersirup. Geschüttelt und über crushed ice serviert.\r\n\r\n**Fizz**\r\nSiehe
    unter [[post:94rZApCd|<u>Bezeichnung der Getränke</u>]] in den Tipps für den Barneuling.\r\n\r\n**Fladderac/Fladderak
    (niederl.?)**\r\nLikör auf Zitronenbasis(?) aus den Niederlanden, dessen Herkunft
    unklar scheint. Letzte Fertigungsstätte liegt in Groningen. \r\n\r\n**Flairbartending
    (engl.)**\r\nSpektakuläre Bartenderkunst, bei der Flaschen, Shaker, Gläser jonglierend
    in die Cocktailbereitung integriert werden, die zur Unterhaltung der Gäste dienen
    soll.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:134}}/flair.jpg
    \"small\")\r\n\r\n**Flakon (franz.)**\r\nGlasfläschchen mit schmalem Hals zur
    Aufnahme von z. B. Bitters.\r\n\r\n**Flambieren (franz. Ursprung)**\r\nAbbrennen
    einer Spirituose mit hohem Alkoholanteil. Wird beim Absinth-Zeremoniell  zelebriert.
    Ebenfalls beim [[recipe:irish-coffee]], der [[recipe:feuerzangenbowle]] und zu
    einigen anderen Gelegenheiten. Ebenfalls das Abflämmen der ätherischen Öle einer
    Zitrusschale.\r\n\r\n**Flasche**\r\nAltes Flüssigkeitsmaß, entspricht ca. 1 l,
    Preußen ca. 0,85 l = 3/4 Quart. Behältnis, in der Regel aus Glas.\r\n\r\n**Flaschengärung**\r\nZweite,
    durch Hefe und Zucker in der Flasche ausgelöste Gärung in der Schaumweinherstellung.\r\n\r\n**Flask
    (engl.)**\r\nEnglischer Ausdruck für Flasche.\r\n\r\n**Flavored (engl.)**\r\nMit
    Gewürzen o. ä. aromatisierte Spirituose.\r\n\r\n**Flavouring Part (engl.)**\r\nLetzter,
    keinesfalls unwichtiger Bestandteil des Cocktails, der das Getränk abrundet. Hier
    kommen oft intensive Aromen in geringen Mengen ins Spiel, wie z. B. Bitters. „Basis“
    und „Modifier“ werden so vollendet.\r\n\r\n**Flip**\r\nSiehe unter [[post:94rZApCd|<u>Bezeichnung
    der Getränke</u>]] in den Tipps für den Barneuling.\r\n\r\n**Floaten (engl.)**\r\nLangsames,
    vorsichtiges Aufgießen einer Zutat, zur Aromatisierung am Schluss auf der Oberfläche
    des Cocktails.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:135}}/floaten.jpg
    \"small\")\r\n\r\n**Flöte**\r\nSchlankes Stielglas für Schaumwein, auch Sektkelch
    mit enger Öffnung, lässt die Kohlensäure länger erhalten. Weitere Glastypen in
    unseren [[post:Td3hzyZf|<u>Tipps für den Barneuling</u>]].\r\n\r\n**fl oz, fluid
    ounze (angl.-amer.)**\r\nFlüssigunze, eine Unze enspricht 29,574 ml. Siehe auch
    unter [[post:6gwRnHPv|<u>Barmaße</u>]] aus den Tipps für den Barneuling.\r\n\r\n**Foam
    (engl.)**\r\nSchaum, z. B. aus Sahne, oder Eiklar entsteht, durch längeres Schütteln
    im Shaker und abseihen, auf der Oberfläche eines Drinks. Siehe auch [[post:N0as74rP|<u>Espuma.</u>]]\r\n\r\n**[[wiki:bezeichnung-der-getraenke|Frappé]]**\r\nAlte
    Getränkekategorie mit Likör, andere Spirituosen, oder ohne Alkohol, wie Milch,
    oder Kaffee über crushed ice serviert.\r\n\r\n**frappieren**\r\nBezeichnet das
    schnelle Abkühlen einer Flüssigkeit. Gelingt mittels eines größeren Behälters
    mit Eis und  Wasser gefüllt. Zu kühlende Flasche hineinstellen, Salz zufügen,
    kurz vermengen. Das Salz führt zu einer schnelleren Schmelze des Eises, führt
    so zur raschen Reduzierung der Temperatur.\r\n\r\n**[[wiki:eis|Freezen (engl.)]]**\r\nDas
    Kühlen des Gästeglases, aber auch Rührglas und Shaker. Die ideale Methode ist
    ein Vereisen der Gläser im Gefrierschrank über Nacht. Im Allgemeinen werden sie
    aber mit Würfeleis vorgekühlt.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:136}}/freezing.jpg
    \"small\")\r\n\r\n**Frizzante (ital.)**\r\nItalienischer Perlwein \r\n\r\n**Frozen
    (engl.)**\r\nGefroren, die Ingredienzien eines Cocktails werden zusammen mit crushed
    ice mittels Blender oder Stabmixer zu einem homogenen Getränk verarbeitet. Z.
    B. Frozen Margarita oder Frozen Daiquiri.\r\n\r\n\r\n**[[wiki:barwerkzeuge|Fruchtpresse]]**\r\nFür
    frisch gepresste Säfte, z. B. aus Orangen, Zitronen oder Limetten unverzichtbar.
    \ Die normale Haushalts- Standversion mit geriffeltem Kegel in der Mitte. Auch
    als Handversion, die mittels Hebelkraft die Früchte ausdrückt. Ebenfalls elektrische
    Fruchtpressen sind erhältlich.\r\n\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]"
  :body_bbcode: "[IMG]https://image.jimcdn.com/app/cms/image/transf/none/path/s34ef2c3ad959eb14/image/if71d8a2847afeb23/version/1554062861/f.jpg[/IMG][color=#fefefe]F[/color]\r\n\r\n[b]Fadenschneider[/b]\r\nBesteck
    das feine Zesten von Schalen der Zitrusfrucht reißt. \r\n\r\n[b]Falernum[/b]\r\nRumlikör
    mit Limettensaft und Gewürzen versetzt.\r\n\r\n[b]Fancy (engl.)[/b]\r\nIn keine
    andere Cocktailkategorie einzuordnendes Mix-Getränk, welches sich oft durch einige
    Säfte und phantasievoller Dekoration auszeichnet.\r\nSiehe auch [post=94rZApCd][u]Bezeichnung
    der Getränke[/u][/post].\r\n\r\n[b]Fassstärke[/b]\r\nBezeichnet in der Regel ein
    fassgelagertes, unverdünntes Destillat. Fassstark sind Alkoholica ab ca. 60% vol.
    und höher, trinkstark sind sie hingegen bei rund 40% vol., welche mit dest. Wasser
    versetzt werden.\r\n \r\n[b]Fat washing (engl.)[/b]\r\nMethode, die gebratenes,
    geröstetes, gegrilltes, oder geräuchertes Fleisch in einer Spirituose nach und
    nach erkalten lässt. Anschließend wird das auf der Oberfläche angesammelte Fett
    abgeschöpft. Der Alkohol erhält so gewünschte Röst- / Raucharomen.  \r\n\r\n[b]Federweißer[/b]\r\nDer
    frische, vergorene Traubenmost.\r\n\r\n[b]Félédes (ungar.)[/b]\r\nUngarisch für
    lieblich; halbsüß.\r\n\r\n[b]Félszáraz (ungar.)[/b]\r\nUngarisch für halbtrocken.\r\n\r\n[b]Fertigprodukt[/b]\r\nVermengte
    Zutaten, die von der Getränkeindustrie zum schnellen Konsum in Dosen oder Flaschen
    gefüllt werden. Sie ersetzen keinesfalls einen guten Cocktail.\r\n\r\n[b]Fiaker
    (öster.)[/b]\r\nIn Österreich ein schwarzer Kaffee mit Kirschwasser und Sahne
    (Schlagobers). Cognac, oder Rum werden ebenfalls gern genommen.\r\n\r\n[b]Fiederwäissen
    (luxem.)[/b]\r\nLuxemburgische Bezeichnung für Federweißer, siehe oben.\r\n\r\n[b]Filler
    (engl.)[/b]\r\nAuffüllgetränk bei einem Drink, z. B. Orangensaft, oder Mineralwasser.\r\n\r\n[b]Fillette
    (franz.)[/b]\r\nKleines Mädchen; Flaschengröße für Wein siehe unter [post=Hza7iHRz][u]Demi[/u][/post].\r\n\r\n[b]Filz[/b]\r\nUntersetzer,
    zumeist aus Pappe, Bierdeckel.\r\n\r\n[b]Fine (franz.)[/b]\r\nFranzösische Zusatz-Bezeichnung
    eines edlen Weinbrand.\r\n\r\n[b]Fine strain (engl.)[/b]\r\nSiehe [post=Hza7iHRz][u]double
    strain[/u][/post]\r\n\r\n[b]Fino (span.)[/b]\r\nTrockene Sherry-Variante, siehe
    auch unter [post=LCsqyzy7][u]leichte Alkohole / Weinbasis[/u][/post] unserer Tipps
    für den Barneuling.\r\n\r\n[b]Fix (engl.)[/b]\r\nAlte Getränkekategorie bestehend
    aus hochprozentiger Spirituose, Zitronensaft, vorzugsweise Himbeersirup. Geschüttelt
    und über crushed ice serviert.\r\n\r\n[b]Fizz[/b]\r\nSiehe unter [post=94rZApCd][u]Bezeichnung
    der Getränke[/u][/post] in den Tipps für den Barneuling.\r\n\r\n[b]Fladderac/Fladderak
    (niederl.?)[/b]\r\nLikör auf Zitronenbasis(?) aus den Niederlanden, dessen Herkunft
    unklar scheint. Letzte Fertigungsstätte liegt in Groningen. \r\n\r\n[b]Flairbartending
    (engl.)[/b]\r\nArtistische Handlungen des Barpersonals, die zur Unterhaltung der
    Gäste, durch spektakuläre Einlagen während der Cocktailbereitung, dienen sollen.\r\n\r\n[b]Flakon
    (franz.)[/b]\r\nGlasfläschchen mit schmalem Hals zur Aufnahme von z. B. Bitters.\r\n\r\n[b]Flambieren
    (franz. Ursprung)[/b]\r\nAbbrennen einer Spirituose mit hohem Alkoholanteil. Wird
    beim Absinth-Zeremoniell  zelebriert. Ebenfalls beim Irish-Coffee, der Feuerzangenbowle
    und zu einigen anderen Gelegenheiten. Ebenfalls das Abflämmen der ätherischen
    Öle einer Zitrusschale.\r\n\r\n[b]Flasche[/b]\r\nAltes Flüssigkeitsmaß, entspricht
    ca. 1 l, Preußen ca. 0,85 l = 3/4 Quart. Behältnis, in der Regel aus Glas.\r\n\r\n[b]Flaschengärung[/b]\r\nZweite,
    durch Hefe und Zucker in der Flasche ausgelöste Gärung in der Schaumweinherstellung.\r\n\r\n[b]Flask
    (engl.)[/b]\r\nEnglischer Ausdruck für Flasche.\r\n\r\n[b]Flavored (engl.)[/b]\r\nMit
    Gewürzen o. ä. aromatisierte Spirituose.\r\n\r\n[b]Flavouring Part (engl.)[/b]\r\nLetzter,
    keinesfalls unwichtiger Bestandteil des Cocktails, der das Getränk abrundet. Hier
    kommen oft intensive Aromen in geringen Mengen ins Spiel, wie z. B. Bitters. „Basis“
    und „Modifier“ werden so vollendet.\r\n\r\n[b]Flip[/b]\r\nSiehe unter [post=94rZApCd][u]Bezeichnung
    der Getränke[/u][/post] in den Tipps für den Barneuling.\r\n\r\n[b]Floaten (engl.)[/b]\r\nLangsames,
    vorsichtiges Aufgießen einer Zutat, zur Aromatisierung am Schluss auf der Oberfläche
    des Cocktails.\r\n\r\n[b]Flöte[/b]\r\nSchlankes Stielglas für Schaumwein, auch
    Sektkelch. Weitere Glastypen in unseren [post=Td3hzyZf][u]Tipps für den Barneuling[/u][/post].\r\n\r\n[b]fl
    oz, fluid ounze (angl.-amer.)[/b]\r\nFlüssigunze, eine Unze enspricht 29,574 ml.
    Siehe auch unter [post=6gwRnHPv][u]Barmaße[/u][/post] aus den Tipps für den Barneuling.\r\n\r\n[b]Foam
    (engl.)[/b]\r\nSchaum, z. B. aus Sahne, oder Eiklar entsteht, durch längeres Schütteln
    im Shaker und abseihen, auf der Oberfläche eines Drinks. Siehe auch [post=N0as74rP][u]Espuma.[/u][/post]\r\n\r\n[b]Frappé[/b]\r\nAlte
    Getränkekategorie mit Likör, andere Spirituosen, oder ohne Alkohol, wie Milch,
    oder Kaffee über crushed ice serviert.\r\n\r\n[b]frappieren[/b]\r\nBezeichnet
    das schnelle Abkühlen einer Flüssigkeit. Gelingt mittels eines größeren Behälters
    mit Eis und  Wasser gefüllt. Zu kühlende Flasche hineinstellen, Salz zufügen,
    kurz vermengen. Das Salz führt zu einer schnelleren Schmelze des Eises, führt
    so zur raschen Reduzierung der Temperatur.\r\n\r\n[b]Freezen (engl.)[/b]\r\nDas
    Kühlen des Gästeglases, aber auch Rührglas und Shaker. Die ideale Methode ist
    ein Vereisen der Gläser im Gefrierschrank über Nacht. Im Allgemeinen werden sie
    aber mit Würfeleis vorgekühlt.\r\n\r\n[b]Frizzante (ital.)[/b]\r\nItalienischer
    Perlwein \r\n\r\n[b]Frozen (engl.)[/b]\r\nGefroren, die Ingredienzien eines Cocktails
    werden zusammen mit crushed ice mittels Blender oder Stabmixer zu einer homogenen
    Masse vermengt.\r\n\r\n[b]Fruchtpresse[/b]\r\nFür frisch gepresste Säfte, z. B.
    aus Orangen, Zitronen oder Limetten unverzichtbar.  Die normale Haushalts- Standversion
    mit geriffeltem Kegel in der Mitte. Auch als Handversion, die mittels Hebelkraft
    die Früchte ausdrückt. Ebenfalls elektrische Fruchtpressen sind erhältlich.\r\n\r\n\r\n[post=AujmVOOB][u]oben[/u][/post]"
