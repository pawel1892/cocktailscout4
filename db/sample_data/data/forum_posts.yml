  :body: "### [[wiki:likoere|Liköre]]\r\n\r\nAls Liköre lassen sich alkoholische Getränke
    bezeichnen, die einen Zuckeranteil von mindestens 100g pro Liter aufweisen und
    in der Regel zwischen 15-40%vol. besitzen. In den meisten Cocktails ist Likör
    ein wichtiger Bestandteil, der sowohl geschmacklich die Basisspirituose unterstützt,
    als auch für Süße sorgt. \r\n\r\nIhren Ursprung haben Liköre bereits im Mittelalter,
    als sie als Heilmittel verabreicht wurden und die Produktion ihren Platz innerhalb
    der katholischen Kirche hatte. So geht beispielsweise der französische Kräuterlikör
    *Bénédictine* auf den Benediktinermönch Dom Bernado Vincelli zurück. Berühmtheit
    erlangte in diesem Zusammenhang auch der Likör *Chartreuse*, der noch heute in
    einem Kloster in Frankreich von Mönchen hergestellt wird.\r\n\r\nDer Einsteiger
    wird sich in der Regel erst einmal mit den Fruchtlikören auseinander setzen. Hier
    sind an erster Stelle die Orangenliköre oder Curaçaos zu nennen. Diese werden
    aus den Schalen von Bitterorangen gewonnen, welche auf der vor Venezuela liegenden
    Insel Curaçao gedeihen. Besonders trockene Curaçaos werden als Triple Sec bezeichnet,
    haben in der Regel 40%vol. und sind unverzichtbarer Bestandteil berühmter Cocktails
    wie Cosmopolitan, Margarita oder Sidecar. Blue Curaçao ist nichts anderes als
    ein blau gefärbter Curaçao, der in der Regel zwischen 20-25%vol. enthält. \r\n\r\n![Laraha-Orangenschalen](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:108}}/grafik.png)
    Bitterorangenschalen vor der Weiterverarbeitung\r\n\r\nNeben den Orangenlikören
    sollten auch die sogenannten Créme de Fruits erwähnt werden. Das sind Fruchtliköre,
    welche mindestens 250g Zucker pro Liter umfassen. Johannis-, Himbeer-, Brombeer-
    und Erdbeerliköre gehören dieser Kategorie an. Sie haben meistens zwischen 15-20%vol.,
    eignen sich gut zum Aufgießen mit Sekt und werden auch gerne pur nach dem Essen
    gereicht. Noch zu nennen wäre auch der Créme de Cacao, ein Kakaolikör, den es
    in weiß und braun gibt, aber nicht zu den Créme de Fruits zählt.\r\n\r\nFür den
    etwas fortgeschritteneren Hobbymixer bieten die Kräuterliköre ein neues Erfahrungsfeld.
    Sie besitzen in der Regel 40%vol., können aber auch – wie beim französischen Kräuterlikör
    *Chartreuse Verte* – 50%vol. übersteigen. Dass man Kräuter auch mit anderen Gewürzen
    paaren kann, zeigen die Vanille-Kräuterliköre *Likör 43* und *Galliano Vanilla*.
    Unter den Gewürzlikören sollte noch das Falernum herausgestellt werden, welches
    aus Rum und anderen Gewürzen wie Nelken, Ingwer und Piment vermählt wird und vor
    allem Bestandteil vieler Cocktails der Tiki-Kultur ist.\r\n\r\nWenn man sich nun
    als Einsteiger die Frage stellt, welche Liköre zuerst angeschafft werden sollten,
    so fällt eine pauschale Antwort darauf nicht leicht. Am besten schaut ihr euch
    erst einmal an, welche Cocktails ihr versuchen wollt und kauft die Liköre nach
    Bedarf.\r\n\r\nVon den Likörherstellern, die eine breite Palette an Produkten
    im Sortiment haben, bieten im preislichen Bereich bis 15€/0,7L *Giffard* und *Marie
    Brizard* sowie im etwas höheren Bereich um 20€/0,7L *Cartron* und *Boudier* durchweg
    gute Qualität. Außerdem sind bei den Einzelsorten folgende Produkte zu empfehlen:\r\n-
    Amaretto: *Disaronno*\r\n- Anis: *Pernod*\r\n- Falernum: *The Bitter Truth*\r\n-
    Kaffee: *Kahlua*\r\n- Kirsche: *Cherry Heering*\r\n- Kokos: *Batida de Coco*,
    *Malibu*\r\n- Kräuter: *Bénédictine D.O.M. Liqueur*\r\n- Maraschino: *Luxardo*\r\n-
    Triple Sec: *Cointreau*, *Grand Marnier Triple Sec*\r\n- Vanille: *Galliano Vanilla*,
    *Likör 43*\r\n\r\n*F.B.*\r\n\r\n\r\n[[post:JGU7ljnS|oben]]"
