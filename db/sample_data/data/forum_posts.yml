  :body: "###Obstbrände\r\n\r\n**Obstler, Kirschwasser, Birnengeist, Marillenbrand
    und viele andere Brände**\r\n\r\nDie letzte Kategorie der Destillate, der wir
    uns nun widmen möchten, ist der Obstbrand. Dieser blickt in Europa auf eine lange
    Tradition zurück, denn bereits im 15. Jahrhundert haben in den Ländern rund um
    die Alpen die Bauern damit begonnen, Obst zu Alkohol zu verarbeiten. Etwa zu Beginn
    des 19. Jahrhundert erfuhr die Produktion einen Schub und wurde zu einer lukrativen
    Nebentätigkeit der Bauern. Auch heute noch werden die meisten Obstbrände in den
    Alpenländern produziert und auch wenn durch die Professionalisierung natürlich
    auch hier große Unternehmen entstanden sind, gibt es immer noch viele lokale Brennereien.
    \r\n\r\nObstbrände können sowohl aus einer Sorte Früchte (z.B. Apfelbrand oder
    Kirschwasser) oder aus mehreren Früchten hergestellt sein. Ist Letzteres der Fall,
    so nennt man diese auch „Obstler“. In jedem Fall muss ein Obstbrand mindestens
    37,5%vol. enthalten. Als „Wasser“ werden diejenigen Obstbrände bezeichnet, die
    aus Kernobst destilliert werden und zu denen etwa Apfel, Birne oder Kirsche zählen.
    Diese Früchte verfügen über einen hohen Fruchtzuckergehalt, so dass dieser direkt
    in Alkohol umgewandelt werden kann. Dies ist bei den „Geistern“ anders. Sie basieren
    zumeist auf Beeren, die selbst über nicht ausreichend Fruchtzucker verfügen, so
    dass Neutralalkohol hinzugefügt werden muss. Himbeer-, Brombeer- oder auch Vogelbeergeist
    gehören in diese Kategorie.  \r\n\r\nObstbrände sind auch heute noch ein beliebter
    Abschluss eines Essens. Wie auch Liköre spielen sie an der Seite einer Basisspirituose
    jedoch auch in Cocktails eine Rolle. Ein für Cocktailklassiker besonders wichtiger
    Obstbrand ist hierbei das Kirschwasser. In dem vermutlich originalen Rezept des
    Singapore Sling, welches heute unter dem Namen [[recipe:straits-sling]] kursiert,
    spielt Kirschwasser eine tragende Rolle und auch in Kombination mit Whiskey weiß
    es im Rye and Cherry Fizz zu überzeugen.\r\n\r\nObstbrände sind grundsätzlich
    keine günstige Sache. Im Preisbereich um 20 Euro ist man jedoch mit folgenden
    Herstellern grundsätzlich gut aufgehoben:\r\n- *Pascall*\r\n- *Weingut Markus
    Görgen*\r\n- *Schladerer*\r\n\r\nWer hin und wieder mal einen Obstbrand pur trinken
    möchte und bereit ist, noch ein bisschen mehr auszugeben, hätte noch folgende
    Abfüller zur Auswahl:\r\n- *Lingenfelder*\r\n\r\n\r\n***Calvados***\r\n\r\nEin
    besonders bekannter und geschätzter Obstbrand ist der aus der französischen Normandie
    stammende Calvados. Genau wie Cognac und Armagnac ist Calvados eine geschützte
    Herkunftsbezeichnung. Es dürfen sich nur diejenigen Apfelbrände so nennen, die
    rund um die gleichnamige Region im Norden Frankreichs destilliert und abgefüllt
    werden. Ein besonderes qualitatives Niveau besitzen dabei die Brände aus der Region
    Pays d’Auge. \r\n\r\n![Äpfel](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:109}}/grafik.png
    \"small\") Äpfel für die Destillation\r\n\r\n\r\nWie auch bei den Obstbränden
    aus anderen europäischen Ländern reicht die Produktion bis in das 16. Jahrhundert
    zurück. Schon im Jahr 1553 wurden die Richtlinien zur Herstellung von Apfelbrand
    in der Normandie schriftlich festgehalten, ohne dass zu dieser Zeit jedoch der
    Name Calvados bereits Erwähnung fand. Einen Anstieg der Bedeutung und Produktion
    erfuhr der Calvados etwa zweieinhalb Jahrhundert später mit der Französischen
    Revolution. Die Bauern erhielten nun das Recht, bis zu einer gewissen Menge steuerfrei
    Brände zu produzieren. Dies führte jedoch nicht nur zu steigendem Konsum, sondern
    auch zu einem Imageverlust in den höheren sozialen Schichten. Bis zum Zweiten
    Weltkrieg wurde Calvados hauptsächlich von Bauern getrunken und hatte längst nicht
    den Ruf von heute. Sein Siegeszug als besonders edles Destillat setzte erst in
    der zweiten Hälfte des 20. Jahrhunderts ein.\r\n\r\nZur Destillation des Calvados
    sind nur 48 bestimmte Apfelsorten zugelassen. Diese werden zunächst zu Cidré verarbeitet
    und lagern erst einmal ein bis zwei Jahre in Holzfässern. Nach dieser Zeit erfolgt
    eine zweistufige Destillation und eine erneute eine Lagerzeit. Die Klassifikation
    erfolgt ähnlich wie bei Cognac und Armagnac. Neben V.O. (very old), V.S.O.P. und
    X.O. werden mit Hors d' Age Brände mit einer besonders langen Lagerzeit bezeichnet.
    \r\n\r\nCalvados lässt sich sehr gut pur nach dem Essen trinken, ist aber auch
    ein wichtiger Bestandteil in einigen Cocktailklassikern. Grundsätzlich lässt sich
    sagen, dass er auch sehr gut mit Wermut harmoniert.\r\n\r\nEmpfehlenswerte Calvados'
    um 15 Euro:\r\n- *Papidoux V.S.O.P.*\r\n- *Père Magloire Fine*\r\n\r\nAuch hier
    bieten sich noch mehr Möglichkeiten im nächst höheren preislichen Segment um 25
    Euro:\r\n- *Papidoux X.O.*\r\n- *Pere Magloire V.S.O.P.* \r\n\r\nCocktails mit
    Calvados:\r\n[[recipe:after-all]]\r\n[[recipe:jack-rose]]\r\n[[recipe:tulip]]\r\n\r\n*F.B.*\r\n\r\n\r\n[[post:JGU7ljnS|oben]]"
