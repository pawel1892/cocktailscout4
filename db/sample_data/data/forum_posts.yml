  :body: "###Leichte Alkohole II\r\n\r\nHierunter fallen diejenigen Getränke, welche
    einen Alkoholgehalt von weniger als 20% aufweisen und keinen Weinbeerensaft als
    Basis besitzen.  \r\n\r\n\r\n***Bier***\r\nGerstensaft, so landläufig der Name
    des angeblich Deutschen liebstes Kind. Obwohl der Bierumsatz der Brauereien stagniert,
    sogar teilweise sinkt, erfreuen sich Bier-Cocktails einer größer werdenden Fan-Gemeinde
    und insgeheim mausert der ein oder andere Drink sich, „salonfähig“ zu werden.
    Oft sind sie der Erfrischung dienlich. \r\n\r\nHopfen, Malz (Gerste), Hefe und
    Wasser, so sagt man, ist alles, was ein gutes Bier benötigt. Doch die Rezepturen
    sind so vielfältig, dass nicht alles aufgezählt werden sollte. Während beim Wein
    die Fermentation durch Zucker der Beeren, oder Zusatz von z. B. Honig erfolgt,
    ist der Ausgangsstoff im Bier die Stärke der verwendeten Getreidesorten, aus denen
    die Hefe den Zucker verarbeitet.\r\n\r\nDer Alkoholanteil der Biere unserer Region
    liegt bei 4,5 – 6 %, kann doch ebenso 16% und mehr bei Starkbier beinhalten. Bei
    hohen Alkoholanteilen hat Hefe keine Lust mehr zum Arbeiten, ja stirbt sogar ab,
    deshalb wird Alkoholerhöhung entweder durch Konzentrierung, oder Aufspritung erreicht.
    Ja, tatsächlich gibt es in Franken eine Brauerei, die Bier mit einem Alkoholgehalt
    von knapp 60% produziert. Insofern relativiert sich der Eingangssatz, es sind
    Ausnahmen. Doch auch alkoholfreie Biere, durch Entzug des Alkohols, werden hergestellt.\r\n\r\nBier
    lässt sich grob in  obergärig, untergärig und Spontangärung einteilen.\r\nObergärig:
    Erfordert eine Temperatur von ca. 15° bis 22°. Die zugesetzte Hefe bleibt nach
    dem Gärprozess auf der Oberfläche stehen. Hierzu zählen Ale, Alt, Berliner Weiße,
    Kölsch, Porter, Stout und Weizenbier, nur um einige zu nennen.\r\n\r\nUntergärig:
    Bei Temperaturen weniger als 10° fühlt die Hefe sich wohl und arbeitet ihr Pensum
    ab, bis sie hiernach auf den Grund des Gärbottichs absinkt. Die Bekanntesten Export,
    Lager, Märzen,  natürlich das Pils und Schwarzbier. \r\n\r\nSpontangärig: Hier
    wurde keine Hefe der Maische zugesetzt. Die Gärung setzte ein durch die natürlich
    in der Luft vorhandenen Sporen. Die früher übliche Bierherstellung bis man erkannte,
    wodurch Gärung entsteht und so die Hefepilze zur Herstellung gewann. \r\n\r\nCocktails
    mit Bier:\r\n[[recipe:colours-of-the-world]]\r\n[[recipe:black-refresher]]\r\n\r\n***Obstweine***\r\nAuch
    Fruchtweine genannt, allen voran der Apfelwein, sind Getränke ebenfalls mit Hefepilzen
    gewonnen, die eine alkoholische Konzentration ohne weitere Zusätze bis zu 10%
    erreichen können. Mit Zuckerzugabe während der Gärphase bis zu 18%. Auch Ausgangsprodukte
    wie Birnen, Honig, Johannisbeeren, Rhabarber etc. ergeben herrlich weinige Getränke.
    \r\n\r\nIn einen großen, verschließbaren Kunststoffbehälter wird das grob zerkleinerte
    Obst (die so genannte Maische), bei Äpfeln der ausgepresste Saft, gegeben und
    mit Hefe versetzt. Verschlossen wird der Behälter mit einem Gäraufsatz, der die
    Gase zwar entweichen lässt, doch durch eine Wasserblase  abschließt, an einen
    kühlen, dunklen Ort gestellt und wartet ab. Nachdem die Pilze durch Hilfe des
    Fruchtzuckers ihre Arbeit vollzogen haben, sinken sie zu Boden und der fertige
    „Wein“ wird hiervon getrennt abgefüllt.\r\n\r\nCocktails mit Obstwein:\r\n[[recipe:hot-buttered-rum-triobar]]\r\n\r\n***Palmwein***\r\nNur
    kurz erwähnt soll hier der Palmwein werden, welcher aus verschiedenen Palmen gewonnen
    und im asiatischen und afrikanischen Raum beheimatet ist. Auch die Herstellung
    recht unterschiedlich, Ausgangsbasis immer Palmsaft, der sogenannte Toddy. Aus
    Toddy wiederum wird ebenfalls Arrak destilliert. Da Toddy bei uns kaum erhältlich,
    fehlt es an prägenden Cocktails.\r\n\r\nCocktails mit Palmwein: 0\r\n\r\n***Reiswein***\r\nWird
    aus Reis, oder Reisstärke durch alkoholische Gärung gewonnen und gehört ebenso
    zu den getreidbasierten leichten Alkoholen, wie das Bier. Erzielt einen Alkoholgehalt
    von 5 bis über 20%. Reisweinherstellung findet im gesamten asiatischen Raum statt,
    mit  Unterschieden in der verwandten Reissorte und beim Produkt in der Farbe von
    trüb bis klar, über gold, bis braun. Ob Apong aus Indien, Brem aus Indonesien,
    Huangjiu aus China, Sake aus Japan, Sato aus Thailand, oder Tapai aus Malaysia,
    allen gemein ist die Grundzutat Reis / Reismehl der vergoren wird. Doch weitere
    Zutaten und / oder Lagerzeiten unterscheiden sie. Bei uns ist japanischer Sake
    der bekannteste.  \r\n\r\nCocktails mit Reiswein:\r\n[[recipe:yuzu-sakerita]]\r\n[[recipe:yuzu-summer]]\r\n\r\n*rrr*\r\n\r\n\r\n[[post:JGU7ljnS|oben]]"
