  :body: "**[[wiki:gin|Gin]]**\r\n\r\nist ein Getreidedestillat, welches während der
    Destillation mit verschiedenen Gewürzaromen angereichert wird. Allen Gins gemeinsam
    ist der Wacholder. Gin ist wie Wodka ab 37,5%Alc erhältlich.\r\n\r\n![Wacholderpflanze
    mit Beeren](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:106}}/grafik.png
    \"small\") Wacholderbusch mit Beeren\r\n\r\nAllerdings solltet Ihr darauf achten,
    möglichst einen Gin mit mehr als nur 40% anzuschaffen. Der Geschmack ist bei den
    Höherprozentigen einfach deutlich voluminöser und runder als bei ihren 40%igen
    Geschwistern. \r\n\r\nGin untergliedert sich im Einzelnen noch mal in Dry (trocken),
    London Dry (ebenfalls trocken), Old Tom (süß) und Plymouth (süß+würzig). Die Wacholdernote
    ist bei den einzelnen Vertretern unterschiedlich stark ausgeprägt. \r\n\r\nGut
    dabei seid Ihr mit folgenden Kandidaten\r\nLondon Dry:\r\n*- Finsbury Platinum
    - 47%\r\n- Finsbury - 60%\r\n- Beefeater - 47%\r\n- Tanqueray - 47,3%\r\n- Bombay
    Sapphire - 47%*\r\n\r\n[[recipe:gin-tonic|Gin-Tonic]]- und [[wiki:martini-1|Martini-Fans]]
    und Leute, die auch gern mal einen Gin pur trinken möchten, sollten sich überlegen,
    ob sie nicht bereit wären auch über 20€ für die 0,7L Flasche auszugeben, denn
    damit würden sie noch mal in andere Regionen vorstoßen. Gute Kandidaten wären
    da:\r\n*- Beefeater 24 - 45% (London Dry)\r\n- The Duke - 45% (London Dry)\r\n-
    Tanqueray No Ten - 47,3% (Dry)\r\n- Lebensstern - 43% (Dry)\r\n- Both's Old Tom
    - 47% (Old Tom)\r\n- Plymouth Gin - 41,2% (Plymouth)*\r\n\r\nBekannte Cocktails
    mit Gin:\r\n- [[recipe:aviation]]\r\n- [[recipe:gimlet]]\r\n- [[recipe:gin-basil-smash]]\r\n-
    [[recipe:gin-fizz]]\r\n- [[recipe:gin-tonic]]\r\n- [[recipe:martinez-cocktail|Martinez]]\r\n-
    [[recipe:dry-martini|Martini]]\r\n- [[recipe:singapore-sling]]\r\n- [[recipe:white-lady]]\r\n\r\n*SchSt*\r\n\r\n[[post:JGU7ljnS|oben]]"
