  :body: "![Lexikon B](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:10}}/grafik.png)\r\n**Babbelwasser
    (hess.)**\r\nUmgangssprachliche Bezeichnung für Apfelwein im hessischen Raum,
    hervorgerufen durch redselige Zeitgenossen, die dem Apfelwein recht zugeneigt
    sind. \r\n\r\n**Bacanora (span./mex.)**\r\nAgavenbrand, eine alte Mezcalart mit
    regionalem Schutz aus der Region Sonora.\r\n\r\n**Baijiu (chin.)**\r\nGetreidebrand
    ähnlich einem Wodka, oder Korn, der aus verschiedenen Produkten, oft Hirse gebrannt
    wird.\r\n\r\n**Bain-Marie (franz.), balneum Mariae (lat.)**\r\nMarienbad; bezeichnet
    eine Vorrichtung, die das zu behandelnde Gut nicht über 100° Grad Celsius erhitzen
    lässt (Wasserbad). Wird in der Bar zum schonenden Erwärmen von Zutaten und Sirupen
    eingesetzt. Einige Destilliereinrichtungen benutzen dieses Verfahren.\r\n\r\n**Balthazar
    (Ursprung sumer.?)**\r\nFlaschengröße für Champagner mit einem Fassungsvermögen
    von 12 Litern.\r\n\r\n**Bar**\r\nDer Tresen der gastronomischen Einrichtung. Der
    Begriff umfasst heute den ganzen Betrieb.\r\n\r\n**Barack (ungar.)**\r\nVollständig
    Barackpálinka, ungarischer, im Eichefass gelagerter Aprikosen- (Marillen)brand.
    Lediglich angrenzende, aus der Historie geborene österreichische Regionen dürfen
    ihren Marillenbrand ebenfalls so benennen. Weiterführendes siehe unter [[post:dxaH86Fo|<u>Pálinka</u>]].\r\n\r\n**Barcaddy
    (engl.)**\r\nBehälter für Trinkhalme, Servietten und dergleichen.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:128}}/BAR-CADDY.jpg
    \"small\")\r\n\r\n**[[wiki:barwerkzeuge|Bar-Equipment (engl.)]]**\r\nDie Handwerkzeuge
    einer Bar. \r\n\r\n**Bärenfang**\r\nHoniglikör aus dem ehemaligen Ostpreußen.
    \"Königsberger Bärenfang\", oder \"Ostpreußischer Bärenfang\" sind ges. gesch.
    Bezeichnungen, die es Produzenten gestattet, welche bis 1945 in diesem Gebiet
    den Likör produziert haben, sie weiterhin zu benutzen.\r\n\r\n**[[wiki:legendaere-barmixer|Barkeeper
    (engl.)]]**\r\nInhaber einer Bar, meist wird der Barmixer ebenfalls so genannt.\r\n\r\n**Barlöffel**\r\nLanger
    Löffel zum Rühren und Mengenabmessung einzelner Zutaten. Zur besseren Führung
    oft in gedrehter Form des Griffes, mit unterschiedlichen Griffenden. Wird zum
    Rühren klarer Drinks und sorgfältigen Schichten von Zutaten verwendet. Auch Barspoon
    (engl.) genannt. Volumen siehe unter [[post:JGU7ljnS|<u>\"Barmaße\"</u>]] in unseren
    Tipps für den Barneuling.   \r\n\r\n**Barmaid (engl.)**\r\nWeiblicher Cocktailmixer\r\n\r\n**Barman
    (engl.)**\r\nKellnermesser, siehe dort\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:129}}/kellnermesser.jpg
    \"small\")\r\n\r\n**Barman (engl.)**\r\nMännlicher Cocktailmixer\r\n\r\n**Barmatte**\r\nRutschsichere
    Unterlage für Gläser zum Auffangen von Tropfen bei der Cocktailbereitung. Flexibles,
    zumeist mit Noppen versehenes Gummimaterial in verschiedenen Größen und Farben.\r\n\r\n**Barmesser**\r\nMesser
    zum Zerteilen und Aufpicken von Früchten, besitzt in der Regel ein zu zwei Spitzen
    ausgeformtes Ende.\r\n![Barmesser](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:183}}/Abarmesser.jpg
    \"small\")\r\n\r\n**Barrail (engl.)**\r\nSiehe Barmatte\r\n\r\n**Barraquito (span.)**\r\nAuf
    kanarischen Inseln ein Espresso mit Milch, Likör und einer Zitronenzeste. Obenauf
    geschäumte Milch mit Zimt bestreut.\r\n\r\n**Barrel aged (engl.)**\r\nFass gereift,
    siehe auch [[post:Zr3AN86u|<u>Cocktailaging</u>]].\r\n\r\n**Barrique (gasc. Ursprung)**\r\nKleines
    Eichenholzfass mit einem Volumen von ca. 225 Litern. Historisches Transportmittel
    für die Schifffahrt benutzte Größe die ein Arbeiter im Hafen leer bewältigen konnte,
    wobei das Fass ein Gewicht von ca. 45 kg aufweist. Oft wird Wein, der hierin gelagert
    wurde, so genannt. Wichtig für die Reifung von Cognac, Armagnac, Whisky und anderen
    Spirituosen.\r\n\r\n\r\n**Barserviette**\r\nKleine Serviette, die als Untersatz
    für das Glas zur Feuchtigkeitsaufnahme des Schwitzwassers genutzt wird.\r\n\r\n**[[wiki:barwerkzeuge|Barsieb]]**\r\nHält
    Eis oder Fruchtkerne zurück. In der Standard-, Hawthorne-Version mit Spirale am
    Rand, die sich der Größe des Shakers, Glases anpaßt. Die Julepform besitzt lediglich
    ein größeres, gelochtes, löffelartig geformtes Mittelteil.  Siehe unter [[post:JGU7ljnS|<u>\"Benötigte
    Barutensilien\"</u>]] in den Tipps für den Barneuling.\r\n\r\n**Barspoon (engl.)**\r\nSiehe
    Barlöffel \r\n\r\n**Barstock**\r\nAlle trink- und essbare Zutaten der Bar. \r\n\r\n**Bartender,
    Barkeeper (engl.)**\r\nPächter einer Bar, Barmixer. \r\n\r\n**Bartowel (engl.)**\r\nBarhandtuch
    zum Abtrocknen und Polieren der Gläser. \r\n\r\n**Barzange**\r\nZwei verschiedene
    Instrumente. 1. Allzweckwerkzeug zum Flaschen öffnen, Abschneiden von Kapseln
    und Dergleichen. 2. Zange zum hygienischen Hantieren mit Früchten und Eis, einer
    groben Pinzette ähnlich.\r\n\r\n| Mehrzweckzange | Eis- Früchtezange |\r\n|:---:|:---:|\r\n|![Barzange
    Mehrzweck](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:184}}/Abarzange.jpg
    \"small\")|![Barzange Eis etc.](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:185}}/AbarzangeEis.jpg
    \"small\")|\r\n\r\n**Basis**\r\nHauptbestandteil des Cocktails, meist Spirituose,
    \ gefolgt von „Modifier“ und „Flavouring Part“. \r\n\r\n**Batch (engl.)**\r\nEinheit,
    Charge; small batches, Produktion kleiner Chargen. Zusammenfügen von Cocktailelementen
    um größere Gruppen mit gleichen Cocktails schnell zu bedienen.\r\n\r\n**Batida
    (port.)**\r\nBezeichnung für eine port.-brasil. Cocktailgruppe bestehend aus Cachaça,
    Fruchtsaft, Rohrzucker, evtl. Wasser.\r\n\r\n**Beaker (engl.)**\r\nBecher(-glas),
    Messbecher.\r\n\r\n**Before-Dinner-Cocktail (engl.)**\r\nDrink für die Zeit vor
    dem Essen, Appetitanreger, auch Aperitif.\r\n\r\n**Bernhard von Clairvaux** \r\nHeiliger
    Bernhard, Schutzpatron der Barkeeper, * um 1090, Burg Fontaine-lès-Dijon; † 20.
    August 1153 in Clairvaux bei Troyes. Abt, Kirchenlehrer, Kreuzzugsprediger, einer
    der bedeutendsten Mönche des Zisterzienserordens, verantwortlich für dessen Ausbreitung
    über ganz Europa. \r\n\r\n**Bessen Genever (niederl.)**\r\n Beeren Genever, [[post:RBQLgPHt|Genever]]
    der mit Beeren versetzt und aromatisiert wird. Siehe auch unter Genever.\r\n\r\n**Bianco
    (ital.)**\r\nSteht in Italien für weiß als Farbbezeichnung bei Wein, Vermouth
    u. a..\r\n\r\n**[[wiki:filler-1|Bitter Lemon (engl.)]]**\r\nKohlensäurehaltiges,
    mit [[post:Zr3AN86u|<u>Chinin</u>]] versetztes Erfrischungsgetränk, das im Ursprung
    aus Zitronensaft hergestellt wurde.\r\n\r\n**[[wiki:bitters|Bitters (engl.)]]**\r\nZumeist
    alkoholische, bittere Tinktur unterschiedlicher Geschmacksrichtung, die Cocktails
    mit wenigen Tropfen aromatisiert. Siehe Weiterführendes unter [[post:JGU7ljnS|<u>Sonstige
    Destillate.</u>]] Im Weiteren befinden sich  [[post:fQbS2JYj|<u>hier Anregungen
    für die Selbstherstellung</u>]].\r\n\r\n**Bittersbottle (engl.)**\r\nFläschchen
    zur Aufnahme der Bitters-Flüssigkeit. Siehe auch Dash-Bottle.\r\n![Bittersbottle](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:186}}/abittersbottle.jpg
    \"small\")\r\n\r\n**Blanco (span.)**\r\nEine von fünf Altersbezeichnungen beim
    Mezcal. Frischer, ungelagerter Brand. Weiterführendes siehe unter [[post:1X6UGsPe|<u>Tequila</u>]].\r\n\r\n**Blanco
    (span.)**\r\nSteht im spanischen für weiß.\r\n\r\n**[[wiki:bezeichnung-der-getraenke|Blazer
    (engl.)]]**\r\nGrundlegende Cocktailkategorie für eine Spirituose, die mit Zucker/Sirup/Likör
    leicht abgerundet wurde. Vorzugsweise erwärmt in einem Cognacschwenker, auch Nosingglas,
    mit einer Zeste aromatisiert, serviert. Erlangte Popularität durch [[wiki:legendaere-barmixer|Jerry
    Thomas]], der Whisky entzündet von einem Silberbecher zum Zweiten, gefüllt mit
    gleichem Anteil Wasser, in hohem Bogen goß. So entstand, benannt nach der Flammenfarbe,
    der Blue Blazer.  Oft mit Eiweiß geschüttelt. Beispiele: [[recipe:pisco-sour]],
    [[recipe:whiskey-sour]], [[recipe:amaretto-sour]].\r\n\r\n\r\n**Blend (engl.)**\r\nVermischen,
    Vermengen z. B. in der Whiskyherstellung die Zusammenführung einiger Grains und
    / oder Malts zur Geschmackssteigerung.\r\n\r\n**Blender (engl.)**\r\nElektrisches
    Mix-, Zerkleinerungsgerät für Früchte und Eis. Ideales Gerät für Frozen-Cocktails.\r\n\r\n**[[wiki:orangen-triade|Blue
    Curaçao]]**\r\nBlau eingefärbter Bitterorangenlikör, siehe auch [[post:Zr3AN86u|<u>Curaçao</u>]].
    Grün und rot gefärbte Versionen ebenfalls erhältlich.\r\n\r\n**Borrel (niederl.)**\r\nTrinkglas
    aus dem Genever genossen wird. \r\n\r\n**[[wiki:barwerkzeuge|Boston-Shaker (engl.)]]**\r\nZweiteiliger
    Schüttelbecher zum Mixen der Zutaten aus Metall- und Glasteil. \r\n\r\n**[[wiki:kraeuter-und-botanicals|Botanicals
    (engl.)]]**\r\nPflanzenextrakte, Gewürze verschiedener Art, die dem Cocktail /
    \ Destillat seinen Charakter verleihen. Besonders wichtig bei Gin, der durch Botanicals
    sein typisches Juniperus-Profil erhält.\r\n\r\n**[[wiki:bourbon-vs-rye|Bourbon
    (engl.)]]**\r\nAmerikanischer Mais-Whiskey aus mindestens 51 % Mais. Muss in neuen,
    ausgekohlten Eichenfässern reifen. Typische Aromen: Vanille, Karamell, Eiche.
    Siehe unter [[post:JGU7ljnS|<u>\"Getreidedestillate\"</u>]] in den Tipps für den
    Barneuling. \r\n\r\n**Bowl (engl.)**\r\nSchale für Getränke\r\n\r\n**Bowle (engl.
    Ursprung)**\r\nSiehe unter [[post:94rZApCd|<u>Bezeichnung der Getränke</u>]] in
    den Tipps für den Barneuling.\r\n\r\n**Brand**\r\nDestillierte Spirituose \r\n\r\n**Brand
    (engl.)**\r\nMarke \r\n\r\n**[[wiki:brandy-cognac-und-armagnac|Brandy (engl.)]]**\r\nWeinbrand,
    siehe unter [[post:JGU7ljnS|<u>\"Weinbeerendestillate\"</u>]] in den Tipps für
    den Barneuling.\r\n\r\n**Branntwein**\r\nAus dem mittelhochdeutschen brandten
    win, brantewein, allgemeine Bezeichnung für gebrannte Spirituosen. Wird heute
    für die deutsche und europäische  Gesetzgebung mit unterschiedlichen, oder sich
    ergänzenden Aussagen verwandt. Nicht zu verwechseln mit [[post:2r4dOHmA|<u>Weinbrand</u>]].\r\n\r\n*\"Der
    Branntwein ist das Getränk des berühmten armen Mannes.\" Otto von Bismarck (1815
    - 1898)*\r\n\r\n**[[wiki:absinth|Brouilleur (franz.)]]**\r\nAbsinth-Tropfer, Glasaufsatz,
    der es erlaubt Wasser tröpfchenweise im [[wiki:absinth|Absinth]] einsinken zu
    lassen. Die verschiedenen ätherischen Öle können so ihr Aroma entfalten. Auf der
    anderen Seite  fasziniert die beginnende Trübung des Absinthes. \r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:131}}/Brouilleur.jpg
    \"small\")\r\n\r\n**Brut (franz.)**\r\nTrockener Champagner, zwischen 6 und 15
    g Restzucker pro Liter.\r\n\r\n**Bucks (engl.)**\r\nAlte Getränkekategorie, Mule
    ähnlich, siehe unter [[post:94rZApCd|<u>Bezeichnung der Getränke</u>]] in den
    Tipps für den Barneuling.\r\n\r\n**[[wiki:shaken-vs-ruehren|Built in the glass
    (engl.)]]**\r\nDas Zusammenstellen des Cocktails im Gästeglas, eignet sich für
    gut vermengbare Zutaten. Nach dem Eis werden die Cocktail-Komponenten eingefüllt.
    Mit einem Barlöffel vermengt, bis die Temperatur der Zutaten auf das erforderliche
    Niveau gesunken ist. Ebenfalls für Cocktails die im Glas effektvoll geschichtet
    werden.\r\n\r\n**[[wiki:faesser|Butt (Ursprung franz./ital.)]]**\r\nFassgröße
    mit einem Volumen von ca. 490 Litern.\r\n\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]"
  :body_bbcode: "[IMG]https://image.jimcdn.com/app/cms/image/transf/none/path/s34ef2c3ad959eb14/image/i551988a16b113191/version/1554040590/b.jpg[/IMG][color=#fefefe]B[/color]\r\n\r\n[b]Bacanora
    (span./mex.)[/b]\r\nAgavenbrand, eine alte Mezcalart mit regionalem Schutz aus
    der Region Sonora.\r\n\r\n[b]Baijiu (chin.)[/b]\r\nGetreidebrand ähnlich einem
    Wodka, oder Korn, der aus verschiedenen Produkten, oft Hirse gebrannt wird.\r\n\r\n[b]Bain-Marie
    (franz.), balneum Mariae (lat.)[/b]\r\nMarienbad; bezeichnet eine Vorrichtung,
    die das zu behandelnde Gut nicht über 100° Grad Celsius erhitzen lässt (Wasserbad).
    Einige Destilliereinrichtungen benutzen dieses Verfahren.\r\n\r\n[b]Balthazar
    (Ursprung sumer.?)[/b]\r\nFlaschengröße für Champagner mit einem Fassungsvermögen
    von 12 Litern.\r\n\r\n[b]Bar[/b]\r\nDer Tresen der gastronomischen Einrichtung.
    Der Begriff umfasst heute den ganzen Betrieb.\r\n\r\n[b]Barack (ungar.)[/b]\r\nVollständig
    Barackpálinka, ungarischer, im Eichefass gelagerter Aprikosen- (Marillen)brand.
    Lediglich angrenzende, aus der Historie geborene österreichische Regionen dürfen
    ihren Marillenbrand ebenfalls so benennen. Weiterführendes siehe unter [post=dxaH86Fo][u]Pálinka[/u][/post].\r\n\r\n[b]Barcaddy
    (engl.)[/b]\r\nBehälter für Trinkhalme, Servietten und dergleichen.\r\n\r\n[b]Bar-Equipment
    (engl.)[/b]\r\nDie Handwerkzeuge einer Bar. \r\n\r\n[b]Bärenfang[/b]\r\nHoniglikör
    aus dem ehemaligen Ostpreußen. \"Königsberger Bärenfang\", oder \"Ostpreußischer
    Bärenfang\" sind ges. gesch. Bezeichnungen, die es Produzenten gestattet, welche
    bis 1945 in diesem Gebiet den Likör produziert haben, sie weiterhin zu benutzen.\r\n\r\n[b]Barkeeper
    (engl.)[/b]\r\nInhaber einer Bar, meist wird der Barmixer ebenfalls so genannt.\r\n\r\n[b]Barlöffel[/b]\r\nZum
    Umrühren von Drinks und Abmessen einzelner Zutaten. Zur besseren Führung oft in
    gedrehter Form des Griffes, mit unterschiedlichen Griffenden. Volumen siehe unter
    [post=JGU7ljnS][u]\"Barmaße\"[/u][/post] in unseren Tipps für den Barneuling.\r\n\r\n[b]Barmaid
    (engl.)[/b]\r\nWeiblicher Cocktailmixer\r\n\r\n[b]Barman (engl.)[/b]\r\nBarmesser,
    siehe dort\r\n\r\n[b]Barman (engl.)[/b]\r\nMännlicher Cocktailmixer\r\n\r\n[b]Barmatte[/b]\r\nRutschsichere
    Unterlage für Gläser zum Auffangen von Tropfen bei der Cocktailbereitung. Flexibles,
    zumeist mit Noppen versehenes Gummimaterial in verschiedenen Größen und Farben.\r\n\r\n[b]Barmesser[/b]\r\nMesser
    zum Zerteilen und Aufpicken von Früchten, besitzt in der Regel ein zu zwei Spitzen
    ausgeformtes Ende.\r\n\r\n[b]Barrail (engl.)[/b]\r\nSiehe Barmatte\r\n\r\n[b]Barraquito
    (span.)[/b]\r\nAuf kanarischen Inseln ein Espresso mit Milch, Likör und einer
    Zitronenzeste. Obenauf geschäumte Milch mit Zimt bestreut.\r\n\r\n[b]Barrel aged
    (engl.)[/b]\r\nFass gereift, siehe auch [post=Zr3AN86u][u]Cocktailaging[/u][/post].\r\n\r\n[b]Barrique
    (gasc. Ursprung)[/b]\r\nKleines Eichenholzfass mit einem Volumen von ca. 225 Litern.
    Früher als Transportmittel für die Schifffahrt benutzte Größe die ein Arbeiter
    im Hafen leer bewältigen konnte, wobei das Fass ein Gewicht von ca. 45 kg aufweist.
    Oft wird Wein, der hierin gelagert wurde, so genannt.\r\n\r\n[b]Barserviette[/b]\r\nKleine
    Serviette, die als Untersatz für das Glas zur Feuchtigkeitsaufnahme des Schwitzwassers
    genutzt wird.\r\n\r\n[b]Barsieb[/b]\r\nHält Eis oder Fruchtkerne zurück. In der
    Standard-, Hawthorne-Version mit Spirale am Rand, die sich der Größe des Shakers,
    Glases anpaßt. Die Julepform besitzt lediglich ein größeres, gelochtes, löffelartig
    geformtes Mittelteil.  Siehe unter [post=JGU7ljnS][u]\"Benötigte Barutensilien\"[/u][/post]
    in den Tipps für den Barneuling.\r\n\r\n[b]Barspoon (engl.)[/b]\r\nSiehe Barlöffel
    \r\n\r\n[b]Barstock[/b]\r\nAlle trink- und essbare Zutaten der Bar. \r\n\r\n[b]Bartender,
    Barkeeper (engl.)[/b]\r\nPächter einer Bar, Barmixer. \r\n\r\n[b]Bartowel (engl.)[/b]\r\nBarhandtuch
    zum Abtrocknen und Polieren der Gläser. \r\n\r\n[b]Barzange[/b]\r\nZwei verschiedene
    Instrumente. 1. Allzweckwerkzeug zum Flaschen öffnen, Abschneiden von Kapseln
    und Dergleichen. 2. Zange zum hygienischen Hantieren mit Früchten und Eis, einer
    groben Pinzette ähnlich.\r\n\r\n[b]Basis[/b]\r\nHauptbestandteil des Cocktails,
    meist Spirituose,  gefolgt von „Modifier“ und „Flavouring Part“. \r\n\r\n[b]Batch
    (engl.)[/b]\r\nEinheit, Charge; small batches, Produktion kleiner Chargen.\r\n\r\n[b]Batida
    (port.)[/b]\r\nBezeichnung für eine port.-brasil. Cocktailgruppe bestehend aus
    Cachaça, Fruchtsaft, Rohrzucker, evtl. Wasser.\r\n\r\n[b]Beaker (engl.)[/b]\r\nBecher(-glas),
    Messbecher.\r\n\r\n[b]Before-Dinner-Cocktail (engl.)[/b]\r\nDrink für die Zeit
    vor dem Essen, Appetitanreger, auch Aperitif.\r\n\r\n[b]Bernhard von Clairvaux[/b]
    \r\nHeiliger Bernhard, Schutzpatron der Barkeeper, * um 1090, Burg Fontaine-lès-Dijon;
    † 20. August 1153 in Clairvaux bei Troyes. Abt, Kirchenlehrer, Kreuzzugsprediger,
    einer der bedeutendsten Mönche des Zisterzienserordens, verantwortlich für dessen
    Ausbreitung über ganz Europa. \r\n\r\n[b]Bessen Genever (niederl.)[/b]\r\n Beeren
    Genever, Genever der mit Beeren versetzt und aromatisiert wird. Siehe auch unter
    Genever.\r\n\r\n[b]Bianco (ital.)[/b]\r\nSteht in Italien für weiß als Farbbezeichnung
    bei Wein, Vermouth u. a..\r\n\r\n[b]Bitter Lemon (engl.)[/b]\r\nKohlensäurehaltiges,
    mit [post=Zr3AN86u][u]Chinin[/u][/post] versetztes Erfrischungsgetränk, das im
    Ursprung aus Zitronensaft hergestellt wurde.\r\n\r\n[b]Bitters (engl.)[/b]\r\nZumeist
    alkoholische, bittere Tinktur unterschiedlicher Geschmacksrichtung, die Cocktails
    mit wenigen Tropfen aromatisiert. Siehe Weiterführendes unter [post=JGU7ljnS][u]Sonstige
    Destillate.[/u][/post] Im Weiteren befinden sich  [post=fQbS2JYj][u]hier Anregungen
    für die Selbstherstellung[/u][/post].\r\n\r\n[b]Bittersbottle (engl.)[/b]\r\nFläschchen
    zur Aufnahme der Bitters-Flüssigkeit. Siehe auch Dash-Bottle.\r\n\r\n[b]Blanco
    (span.)[/b]\r\nEine von fünf Altersbezeichnungen beim Mezcal. Frischer, ungelagerter
    Brand. Weiterführendes siehe unter [post=1X6UGsPe][u]Tequila[/u][/post].\r\n\r\n[b]Blanco
    (span.)[/b]\r\nSteht im spanischen für weiß.\r\n\r\n[b]Blazer (engl.)[/b]\r\nAlte
    Getränkebezeichnung für eine Spirituose, die mit Zucker/Sirup/Likör leicht abgerundet
    wurde. Vorzugsweise erwärmt in einem Cognacschwenker, auch Nosingglas, mit einer
    Zeste aromatisiert, serviert. Erlangte Popularität durch Jerry Thomas, der Whisky
    entzündet von einem Silberbecher zum Zweiten, gefüllt mit gleichem Anteil Wasser,
    in hohem Bogen goß. So entstand, benannt nach der Flammenfarbe, der Blue Blazer.
    \r\n\r\n[b]Blend (engl.)[/b]\r\nVermischen, Vermengen z. B. in der Whiskyherstellung
    die Zusammenführung einiger Grains und / oder Malts zur Geschmackssteigerung.\r\n\r\n[b]Blender
    (engl.)[/b]\r\nElektrisches Mix-, Zerkleinerungsgerät für Früchte und Eis. Ideales
    Gerät für Frozen-Cocktails.\r\n\r\n[b]Blue Curaçao[/b]\r\nBlau eingefärbter Bitterorangenlikör,
    siehe auch [post=Zr3AN86u][u]Curaçao[/u][/post]. Grün und rot gefärbte Versionen
    ebenfalls erhältlich.\r\n\r\n[b]Borrel (niederl.)[/b]\r\nTrinkglas aus dem Genever
    genossen wird. \r\n\r\n[b]Boston-Shaker (engl.)[/b]\r\nZweiteiliger Schüttelbecher
    zum Mixen der Zutaten aus Metall- und Glasteil. \r\n\r\n[b]Botanicals (engl.)[/b]\r\nPflanzenextrakte,
    Gewürze verschiedener Art, die dem Cocktail / der Spirituose ihr Aroma abgeben.\r\n\r\n[b]Bourbon
    (engl.)[/b]\r\nAmerikanischer Mais-Whiskey. Siehe unter [post=JGU7ljnS][u]\"Getreidedestillate\"[/u][/post]
    in den Tipps für den Barneuling.\r\n\r\n[b]Bowl (engl.)[/b]\r\nSchale für Getränke\r\n\r\n[b]Bowle
    (engl. Ursprung)[/b]\r\nSiehe unter [post=94rZApCd][u]Bezeichnung der Getränke[/u][/post]
    in den Tipps für den Barneuling.\r\n\r\n[b]Brand[/b]\r\nDestillierte Spirituose
    \r\n\r\n[b]Brand (engl.)[/b]\r\nMarke \r\n\r\n[b]Brandy (engl.)[/b]\r\nWeinbrand,
    siehe unter [post=JGU7ljnS][u]\"Weinbeerendestillate\"[/u][/post] in den Tipps
    für den Barneuling.\r\n\r\n[b]Branntwein[/b]\r\nAus dem mittelhochdeutschen brandten
    win, brantewein, allgemeine Bezeichnung für gebrannte Spirituosen. Wird heute
    für die deutsche und europäische  Gesetzgebung mit unterschiedlichen, oder sich
    ergänzenden Aussagen verwandt. Nicht zu verwechseln mit [post=2r4dOHmA][u]Weinbrand[/u][/post].\r\n\r\n[i]\"Der
    Branntwein ist das Getränk des berühmten armen Mannes.\" Otto von Bismarck (1815
    - 1898)[/i]\r\n\r\n[b]Brouilleur (franz.)[/b]\r\nAbsinth-Tropfer, Glasaufsatz,
    der es erlaubt Wasser tröpfchenweise im Absinth einsinken zu lassen. Die verschiedenen
    ätherischen Öle können so ihr Aroma entfalten. Auf der anderen Seite  fasziniert
    die beginnende Trübung des Absinthes. \r\n\r\n[b]Brut (franz.)[/b]\r\nTrockener
    Champagner, zwischen 6 und 15 g Restzucker pro Liter.\r\n\r\n[b]Bucks (engl.)[/b]\r\nAlte
    Getränkekategorie, Mule ähnlich, siehe unter [post=94rZApCd][u]Bezeichnung der
    Getränke[/u][/post] in den Tipps für den Barneuling.\r\n\r\n[b]Built in the glass
    (engl.)[/b]\r\nDas Zusammenstellen des Cocktails im Gästeglas, eignet sich für
    gut vermengbare Zutaten. Nach dem Eis werden die Cocktail-Komponenten eingefüllt.
    Mit einem Barlöffel vermengt, bis die Temperatur der Zutaten auf das erforderliche
    Niveau gesunken ist. Ebenfalls für Cocktails die im Glas effektvoll geschichtet
    werden.\r\n\r\n[b]Butt (Ursprung franz./ital.)[/b]\r\nFassgröße mit einem Volumen
    von ca. 490 Litern.\r\n\r\n\r\n[post=AujmVOOB][u]oben[/u][/post]"
