  :body: "![Lexikon G](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:15}}/grafik.png)\r\n**Gallon
    (engl.), Galón (span.)**\r\nAltes Hohlmaß mit, über die Zeiten und Regionen, wechselnder
    Volumina. Von ca. 3,8 bis 4,6 Liter entspricht eine Gallone = 4 Quarts, 8 Pints,
    16 Cups. \r\n\r\n**Gänsewein**\r\nSommerliches Erfrischungsgetränk, bestehend
    aus Zuckerwasser mit einem Schuß Essig versetzt. Oft auch nur reines Leitungswasser
    so genannt.\r\n\r\n**Garnitur**\r\nDekorieren eines Getränkes mit frischen, auch
    getrockneten Früchten oder Zesten.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:137}}/garnitur.jpg
    \"small\")\r\n\r\n**Gastrique (franz.)**\r\nKaramellisierter Zucker mit Essig
    versetzt. Aus der Gourmetküche entlehnte Zutat für den Cocktailbereich, auch Süß-Saure-Sauce
    genannt. \r\n\r\n**Gedeck**\r\nIn einigen Regionen Ostdeutschlands Bezeichnung
    für einen Cocktail aus Bier mit Sekt. Ebenso üblich ein Bier mit einem Schnaps
    daneben. Viele weitere Varianten entstanden im Laufe der Jahre, wie Schachtel
    Zigaretten, Glas Wasser und Cosmopolitan.\r\n\r\n**Geist**\r\nSpirituose aus aromareichen,
    zuckerarmen Früchten. Näheres siehe unter [[post:WckvbYIT|<u>Obstbrand</u>]].\r\n\r\n**Gelifikation**\r\nVerfestigung
    von Flüssigkeiten zu Gel. Siehe auch [[post:EVAyIWVC|<u>Molekular-Cocktail</u>]]
    und [[post:55QJgTHQ|<u>Sphärisierung.</u>]]\r\n\r\n**Genever, auch Jenever (niederl.,
    belg.)**\r\nHolländischer, oder belgischer Wacholderschnaps, Vorläufer des [[wiki:gin|Gin]].
    Grundlage des Genever ist [[post:EVAyIWVC|<u>Malzwein</u>]] der in [[wiki:faesser|Fässern]]
    reifen darf, anschließend mit ginähnlichen Spirituosen verschnitten und auf Trinkstärke
    herabgesetzt wird. Weitere Form der [[post:zfI9J50o|Bessen Genever]].\r\n\r\n**[[wiki:martini-1|Gibson
    (engl.)]]**\r\nVariante des Dry Martini, statt einer Olive wird eine Perlzwiebel
    serviert. Dieser Drink soll mangels Olive einem Herrn Gibson serviert worden sein,
    erlangte so eine gewisse Popularität.\r\n\r\n**Gill (engl.)**\r\nAmerikanisches
    Barmaß entspricht einem wineglass. siehe unter [[post:JGU7ljnS|<u>\"Barmaße\"</u>]]
    in den Tipps für den Barneuling.\r\n\r\n**Gimlet (engl.)**\r\nSiehe unter [[post:94rZApCd|<u>Bezeichnung
    der Getränke</u>]] in den Tipps für den Barneuling.\r\n\r\n**Gin (franz. Ursprung)**\r\nWacholderdestillat.
    Siehe unter [[post:JGU7ljnS|<u>\"Getreidedestillate\"</u>]] in den Tipps für den
    Barneuling.\r\n\r\n**[[wiki:filler-1|Ginger Ale (engl.)]]**\r\nMit Kohlensäure
    und Ingweraromen angereichertes Erfrischungsgetränk.\r\n\r\n**[[wiki:filler-1|Ginger
    Beer (engl.)]]**\r\nMit Kohlensäure angereichertes und mit mehr Ingwer als im
    Ale, daher schärferes Erfrischungsgetränk, welches meistens alkoholfrei angeboten
    wird. Häufig mit Zusätzen an Zitrusaromen abgeschmeckt.\r\n\r\n**[[wiki:barmasse|Glas]]**\r\nAltes
    Hohlmaß mit einem Volumen von 0,15 Liter.\r\n\r\n**Glass rimmer (engl.)**\r\nGerätschaft
    für die Aufnahme von Salz und / oder Zucker zur Crustaherstellung.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:120}}/rimmer.JPG
    \"small\")\r\n\r\n**Glencairn**\r\nGedrungenes Nosingglas mit dickem Glasfuß speziell
    für Whiskytastings entwickelt. Weitere Glasformen siehe unter [[post:Td3hzyZf|<u>Gläser</u>]].\r\n\r\n**Glögg
    (schwed.), Glögi (finn.), Gløgg (norw.)**\r\nGlühwein, siehe dort.\r\n\r\n**Glühwein**\r\nMit
    [[wiki:kraeuter-und-botanicals|Gewürzen]] versetzter, gesüßter und erwärmter Wein.\r\n\r\n**Goblet
    (engl.)**\r\nKelch -glas, weitere Glasformen siehe unter [[post:Td3hzyZf|<u>Gläser</u>]].\r\n\r\n**Goliath
    (Ursprung sumer.?)**\r\nFlaschengröße für Champagner siehe unter [[post:EVAyIWVC|<u>Melchior</u>]].\r\n\r\n**[[wiki:sirupe-hausgemacht|Gomme
    syrup (engl.)]]**\r\nEin konzentrierter Läuterzucker, dem Gummi Arabicum zur besseren
    Viskosität beigemengt wurde. Der Drink erhält hierdurch eine andere Haptik im
    Mund. Näheres hierzu siehe [[post:JG58w9bi|Gummi Arabicum]]\r\n\r\n**Grain (engl.)**\r\nKurzwort
    für Grainwhisky, bestehend u. a. aus Weizen, gemälzter Gerste, Mais. Vorzugsweise
    zur Blend-Whisky-Herstellung verarbeitet. \r\n\r\n**Grappa (ital.)**\r\nItalienischer
    Tresterbrand.\r\n\r\n**Grater (engl.)**\r\nReibe z. B. für Zesten, Schokolade,
    Muskat. Siehe auch [[post:EVAyIWVC|<u>Muskatnussreibe</u>]].\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:138}}/grater.jpg
    \"small\")\r\n\r\n**Grenadine**\r\nRoter Fruchtsirup ursprünglich aus Granatapfelsaft
    gefertigt. Siehe ebenfalls unter [[post:JGU7ljnS|<u>alkoholfreie Zutaten</u>]].\r\n\r\n**Grog**\r\nAlte
    Getränkekategorie, die Rum mit Wasser vermengt, enthält. Üblich sind ebenso Zitronensaft,
    Zucker, Gewürze, aber auch aromatische Früchte hierzu. Wird kalt und heiß genossen.
    Stammt aus der Zeit als englische Seeleute eine tägliche Ration Rum zur \"Stärkung\"
    erhielten. Siehe auch unter [[post:B1ePZzoq|<u>Toddy</u>]].\r\n\r\n**[[wiki:absinth|Grüne
    Fee]]**\r\nSiehe [[post:TizOWyNh|<u>Absinth</u>]]\r\n\r\n**Gummi arabicum (lat.)**\r\nArabisches
    Gummi sind ausgeschiedene Substanzen von einigen in Afrika vorkommenden Akazienbäumen,
    deren Rinde zur Gewinnung keilförmig eingeritzt wird. Besteht aus natürlich weißlichen,
    über gelbbraun bis rotem Polysacchariden-Gemisch, findet im Cocktailbereich Verwendung
    als gomme syrup, siehe dort.\r\n\r\n**Gunpowder proof (engl.)**\r\nAlkoholstärke-Angabe
    welche einem Volumen von 57,15% entspricht. Zur Überprüfung wurde von englischen
    Seeleuten Schießpulver mit Gin oder Rum getränkt, brannte es, ist der Alkoholgehalt
    gleich oder größer 57,15%. \r\n\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]"
