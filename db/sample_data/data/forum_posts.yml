  :body: "![Lexikon L](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:21}}/grafik.png)\r\n**Label
    (engl.)**\r\nFlaschenetikett \r\n\r\n**[[wiki:sirupe-hausgemacht|Läuterzucker]]**\r\nZuckersirup
    leicht selbst herzustellen durch Erwärmen der Flüssigkeit bis sich der Zucker
    komplett auflöst, Verhältnis Zucker zu Wasser meist 1:1, ebenso möglich 2:1. Siehe
    auch rich syrup und simple syrup.\r\n\r\n**[[wiki:zitrusfruechtchen|Lemon / Lemon
    juice (engl.)]]**\r\nZitrone / Zitronensaft\r\n\r\n**[[wiki:kraeuter-und-botanicals|Lemon
    grass (engl.)]]**\r\nZitronengras, aromatische Pflanze aus dem asiatischen Raum.
    Für einige Cocktails die ein gewisses Zitrusaroma erhalten sollen.\r\n\r\n**[[wiki:eis|Lewis
    bag (engl.), Lewis Beutel]]**\r\nDient zur Herstellung von crushed ice. Beutel
    mit grobem Eis befüllen, schließen und mit einem Holzhammer bearbeiten, bis die
    gewünschte Größe des Eises erreicht ist. Der Vorteil, Feuchtigkeit wird durch
    das Gewebe weitestgehend aufgesogen, Eissplitter fliegen nicht durch die Gegend.
    \r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:144}}/lewis%20bag.jpg
    \"small\")\r\n\r\n**[[wiki:likoere|Likör (lat. Ursprung)]]**\r\nSpirituose mit
    einem erhöhten Zuckeranteil verschiedener Geschmacksrichtung. Weiterführendes
    zu finden unter [[post:ABPOc8gf|<u>Likör</u>]] in unseren Tipps für den Barneuling.\r\n\r\n**[[wiki:zitrusfruechtchen|Lime
    / Lime juice (engl.)]]**\r\nLimette / Limettensaft\r\n\r\n**Limes (engl.)**\r\nSiehe
    unter [[post:94rZApCd|<u>Bezeichnung der Getränke</u>]] in den Tipps für den Barneuling.\r\n\r\n**[[wiki:filler-1|Limonade
    (franz. Ursprung)]]**\r\nUmgangssprachlich Limo, Erfrischungsgetränk, seit dem
    17. Jahrhundert erwähnt,  besteht aus Wasser, Zucker, Zitrussaft. Auch andere
    Früchte können Anwendung finden. Der Vater dieser Getränke ist der englische Lemon
    Squash.\r\n\r\n**Limousin (franz.)**\r\nWaldreiche Region in Frankreich mit hohem
    Eichenbestand. Ursprung des Holzes für die [[wiki:faesser|Limousinfässer]].\r\n\r\n**Liqueur
    (franz.)**\r\nBezeichnung in Frankreich für Likör, siehe dort.\r\n\r\n**Liquid
    smoke (engl.)**\r\nFlüssiger Rauch;  Rauch-Essenz verschiedener Aromenbereiche
    durch anbrennen unterschiedlicher Holz-, Pflanzengrundprodukte hervorgerufen und
    in Flüssigkeit (meist Essige) extrahiert. Findet Verwendung seit längerer Zeit
    in der Lebensmittelindustrie, wurde zur Eröffnung neuer Geschmackswelten auf die
    Zubereitung von Cocktails erweitert.  Siehe auch [[post:KfWCTgw9|<u>fat washing</u>]].\r\n\r\n**[[wiki:bezeichnung-der-getraenke|Longdrink
    (engl.)]]**\r\nGetränk, das nur aus wenigen Zutaten besteht und mehr als 18-20
    cl Menge aufweist.  Weiterführende Getränkegattungen siehe unter [[post:94rZApCd|<u>Tipps
    für den Barneuling.</u>]]\r\n\r\n**[[wiki:absinthloeffel|Louche-Effekt (franz.)]]**\r\nTrübung
    bei anishaltigen Spirituosen, wenn sie mit Wasser verlängert, oder starker Kühlung
    unterzogen werden. Die Anisöle lösen sich in Alkohol, aber nicht in Wasser auf.
    Dadurch tritt eine Art Emulsion ein, welche Moleküle mit unterschiedlicher Lichtbrechung
    entstehen und so die Flüssigkeit eintrüben lässt. Auch Ouzo-Effekt genannt.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:145}}/louche.jpg
    \"small\")\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]"
