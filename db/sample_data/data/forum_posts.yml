  :body: "![Lexikon C](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:11}}/grafik.png)\r\n**Cachaça
    (port.)**\r\nSiehe unter [[post:JGU7ljnS|<u>\"Zuckerrohrdestillate\"</u>]] in
    den Tipps für den Barneuling.\r\n\r\n**Calvados (franz.)**\r\nApfelbranntwein,
    näheres zu finden unter [[post:WckvbYIT|<u>Obstbrand</u>]] in unseren Tipps für
    den Barneuling.\r\n\r\n**Cane syrup (engl.)**\r\nSiehe [[post:55QJgTHQ|<u>Sirop
    de Canne</u>]]\r\n\r\n**Cask Strength (engl.)**\r\nFassstärke, bezeichnet eine
    Fass gelagerte Spirituose (z. B. Rum, Whisky), die in unveränderter alkoholischer
    Stärke aus dem Fass abgefüllt wird. \r\n\r\n**Cassis (franz.)**\r\nLikör aus schwarzen
    Johannisbeeren\r\n\r\n**Catavino (span.)**\r\nDas in Spanien bezeichnete Sherryglas.
    Ein sich zum Rand schließendes, tulpenförmiges Stielglas. Weitere Glasformen siehe
    unter [[post:Td3hzyZf|<u>Gläser</u>]] in unseren Tipps für den Barneuling.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:127}}/catavino.jpg
    \"small\")\r\n\r\n**Cava (span.)**\r\nSiehe unter [[post:LCsqyzy7|<u>Schaumwein</u>]].
    Geschützte, regionale Bezeichnung.\r\n\r\n**Champagner (franz.)**\r\nSiehe unter
    [[post:LCsqyzy7|<u>Schaumwein</u>]]. Geschützte, regionale Bezeichnung.\r\n\r\n*\"Champagner
    ist der einzige Wein, der eine Frau noch schöner macht, nachdem sie ihn getrunken
    hat.\" Madame de Pompadour (1721 - 1764)*\r\n\r\n**Chaser (engl.)**\r\nAlkoholreicher
    Drink, der zu etwas weniger Starkem getrunken wird.\r\n\r\n**Cheong-Verfahren
    (korea.)**\r\nCheong, ein Verfahren zur konzentrierten Sirupgewinnung, dabei werden
    Früchte 1:1 mit Zucker in einem Kaltauszug durch osmotische Entwicklung zu einem
    Sirup verwandelt. Gewollt, oder ungewollt, kommt es eventuell zu einer anfänglichen
    Fermentation. Dieser entstehende Sirup ist hocharomatisch. Weiteres siehe unter
    [[post:dgX2ruhW|<u>Cheong</u>]] und folgende.\r\n![Cheong im Schraubglas](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:187}}/acheong.jpg
    \"small\")\r\n\r\n**Chinin**\r\nWeißes, schlecht lösliches, kristallines Alkaloid,
    ursprünglich zur Malariabekämpfung eingesetzt, befindet sich das bittere Chinin
    in einigen limonadigen Getränken. Gewonnen aus Chinarinde des gleichnamigen Baumes,
    gefunden im Hochwald der Anden. \r\n\r\n**Chu Yeh Ching (chin.)**\r\nChinesischer,
    gelbgrüner, hochprozentiger Bambusblätter-Likör/-Schnaps wird mit mindestens 12
    Kräutern, u. a. Bambusblättern gebraut.\r\n\r\n**Cider (engl.), Cidre (franz.)**\r\nSiehe
    [[post:TizOWyNh|<u>Apfelwein</u>]]\r\n\r\n**[[wiki:kraeuter-und-botanicals|Cinnamon
    (engl.)]]**\r\n[[post:7AL2C0PB|Zimt]]\r\n\r\n**Clairin (kreol.)**\r\nHaitianische
    Nationalspirituose die in vielen dörflichen Brennereien für den Eigenbedarf gebrannt
    wird. Weißer, ungelagerter Rhum aus frischem Zuckerrohrsaft, der einer Spontangärung
    unterzogen wird. Zwischen Mezcal, Pisco und Rhum Agricole einzuordnen, besitzt
    der Clairin einen alk. Anteil von 51% - 60%. \r\n\r\n**Coaster (engl.)**\r\nSiehe
    [[post:CFftpzxQ|Untersetzer]]\r\n\r\n**Cobbler (engl.)**\r\nSiehe unter [[post:94rZApCd|<u>Bezeichnung
    der Getränke</u>]] in den Tipps für den Barneuling.\r\n\r\n**Cocktail (engl.)**\r\nBezeichnung
    für ein Getränk aus mehreren Bestandteilen, wird in Kategorien unterteilt. Siehe
    [[post:94rZApCd|<u>Tipps für den Barneuling.</u>]]\r\n\r\n**Cocktailaging (engl.)**\r\nDie
    Reifung bestimmter Cocktailzutaten in einem Holzfass über eine gewisse Zeit. Geeignet
    sind die alkoholischen Bestandteile eines Cocktails. \r\n\r\n**Cocktailhappen**\r\nKleiner
    Imbiss der zu den, oder zwischen den Getränken gereicht werden kann. Besteht evtl.
    aus zugeschnittenen, mit diversen Köstlichkeiten belegten Weißbrotstücken, Käsewürfel
    mit Obst auf Spießchen gesteckt und dergleichen. Andere Bezeichnungen sind Aperitivo
    alla Milanese, Fingerfood, griechische Mezedes , Schnittchen, Snacks, Tapas in
    Spanien. In der Schweiz ist Apéro eine willkommene Abwechslung des Tages mit netten
    Menschen, in der Kleinigkeiten zum Cocktail gereicht werden, ähnlich im Schwäbischen
    das Ständerling.\r\n\r\n**Cocktail-Kultur**\r\nDie Präsentation des Cocktails
    im dezent eleganten Ambiente, umrahmt von nicht zu aufdringlicher Musik, dagereicht
    von freundlich, höflichem Barpersonal. Stil gebende Kultur, die Einrichtung (z.
    B. Cocktail-Sessel) und Mode (z. B. Cocktailkleid) beeinflusst und prägte. \r\n\r\n**Cocktailscout
    (engl.)**\r\nIhr unabhängiger Begleiter durch die Cocktailwelt. [<u>www.cocktailscout.de</u>](https://www.cocktailscout.de/),
    oder Sie bleiben gleich hier.\r\n\r\n**Cocktailspieß / Cocktailstäbchen**\r\nZur
    Dekoration mit Früchten aus verschiedenen Materialien, von schlicht bis edel.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:133}}/Cocktailspie%C3%9F.jpg
    \"small\")\r\n\r\n**[[wiki:glaeser|Cocktailspitz]]**\r\nKegelförmiges, nach unten
    spitz zulaufendes Cocktailglas, in einem Stiel endend. Auch V-Shape genannt. \r\n\r\n**Coffey
    Still (engl.)**\r\nBrennanordnung  der Destillierapparatur, siehe [[post:AEiAj1OF|<u>Rum/Ron/Rhum
    weiß</u>]] in unseren Tipps für den Barneuling.\r\n\r\n**Cognac (franz.)**\r\nSiehe
    unter [[post:JGU7ljnS|<u>\"Weinbeerendestillate\"</u>]] in den Tipps für den Barneuling.\r\n\r\n*\"Wenn
    du einen Schneck behauchst, kriecht er ins Gehäuse, wenn du ihn in Cognac tauchst,
    sieht er weiße Mäuse.\" Joachim Ringelnatz (1883 - 1934)*\r\n\r\n**Colada**\r\nSiehe
    unter [[post:94rZApCd|<u>Bezeichnung der Getränke</u>]] in den Tipps für den Barneuling.\r\n\r\n**Cold
    drip (engl.)**\r\nHerstellungsverfahren zur Extraktion von Aromen für Infusionen
    in Spirituosen usw.. Siehe auch [[post:oD2oYkoc|<u>Infusion</u>]] und [[post:EVAyIWVC|<u>Mazerat</u>]].\r\n\r\n**Collins**\r\nSiehe
    unter [[post:94rZApCd|<u>Bezeichnung der Getränke</u>]] in den Tipps für den Barneuling.\r\n\r\n**Column
    still (engl.)**\r\nDestillierhelm der säulenförmig ausgearbeitet ist. Siehe auch
    [[post:TizOWyNh|<u>Alambic</u>]].\r\n\r\n**Cooler (engl.)**\r\nSiehe unter [[post:94rZApCd|<u>Bezeichnung
    der Getränke</u>]] in den Tipps für den Barneuling.\r\n\r\n**[[wiki:glaeser|Coppa
    (span.)]]**\r\nBauchiges Glas / Ballonglas, ideal für Gin Tonic.\r\n\r\n**Cordial
    (span.)**\r\nDigestiflikör, Kräuterlikör, aber auch Getränkesirup, wie Lime Juice
    Cordial.\r\n\r\n**Coupette (franz.)**\r\nCocktailglas in Form einer Sektschale.
    Weitere Glasformen siehe [[post:Td3hzyZf|<u>Tipps für den Barneuling.</u>]] \r\n\r\n**[[wiki:eis-zeit|Cracked
    ice (engl.)]]**\r\nAus großen Eisblöcken grob gebrochenes Eis mit Eispickel hergestellte,
    zwischen Ice Cube und Crushed Ice, würfelähnliche Eisstücke für die Cocktailbereitung.\r\n
    \r\n**Cream of Coconut (engl.)**\r\nKokosnusscreme, bestehend aus Kokosnussfleisch
    und Saft, fast ausschließlich in Dosen konserviert.\r\n\r\n**Crémant (franz.)**\r\n[[post:LCsqyzy7|<u>Schaumwein</u>]]
    mit Herstellungsverfahren wie Champagner, doch ohne regionalem Schutz.\r\n\r\n**Crème
    de Cerises (franz.)**\r\nKirschlikör\r\n\r\n**Crème de Ciel (franz.)**\r\nCreme
    des Himmels, andere Bezeichnung für Blue Curaçao\r\n\r\n**Crème de Fraise /- des
    Bois (franz.)**\r\nErdbeerlikör / Walderdbeerlikör\r\n\r\n**Crème de Framboise
    (franz.)**\r\nHimbeerlikör\r\n\r\n**Crème de Menthe (franz.)**\r\nPfefferminzlikör\r\n\r\n**Crème
    de Mûre (franz.)**\r\nBrombeerlikör\r\n\r\n**Crème de Myrtille (franz.)**\r\nHeidelbeerlikör\r\n\r\n**Crème
    de Noyaux (franz.)**\r\nLikör aus Kernen. Zum Beispiel Aprikosenkerne, Mandeln,
    Pflaumenkerne und andere. \r\n\r\n**Crème de Pèche (franz.)**\r\nPfirsichlikör\r\n\r\n**Crème
    de Poire (franz.)**\r\nBirnenlikör\r\n\r\n**Crème de Violette (franz.)**\r\nVeilchenlikör\r\n\r\n**Crème
    de Yvette (franz.)**\r\nLikör aus violetten Blütenblättern, Walderdbeeren, Himbeeren,
    Brombeeren, schwarzen Johannisbeeren und weiteren Zutaten hergestellt.\r\n\r\n**[[wiki:eis-zeit|Crushed
    Ice (engl.)]]**\r\nZerkleinertes / gestoßenes Eis \r\n\r\n**Crusta (engl.)**\r\nKruste,
    zarter Zuckerrand am Glas. Der mit Säften, farbigen Likören angefeuchtete Glasrand
    wird sanft in Zucker getaucht. Aber auch Kokosflocken, Kakao usw. stattdessen
    möglich. Klassische Getränkegruppe siehe [[post:94rZApCd|<u>Bezeichnung der Getränke</u>]]\r\n\r\n**Cucumber
    (engl.)**\r\nGurke, Zutat einiger Drinks.\r\n\r\n**[[wiki:bezeichnung-der-getraenke|Cup
    (engl.)]]**\r\nAlte Getränkekategorie ähnlich einer Bowle, nur im kleineren Gefäß,
    z. B. Becher. Aus Spirituose, Wein/Wermut, Früchten, evtl. Zucker/Likör, evtl.
    Soda auf Eis gereicht.\r\n\r\n**Cup (engl.)**\r\nAmerikanisch, englische Maßeinheit,
    siehe unter [[post:JGU7ljnS|<u>\"Barmaße\"</u>]] in unseren Tipps für den Barneuling.\r\n\r\n**[[wiki:orangen-triade|Curaçao]]**\r\nBitterorangenlikör
    aus Schalen der Larahaorange. Benannt nach der gleichnamigen Insel der südlichen
    Antillen, auf der diese Pomeranze wächst. In klar, aber auch vielen eingefärbten
    Versionen erhältlich. Erweiterte Form ist ein [[post:B1ePZzoq|Triple Sec]], siehe
    dort.\r\n\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]"
  :body_bbcode: "[IMG]https://image.jimcdn.com/app/cms/image/transf/none/path/s34ef2c3ad959eb14/image/i076c53a01555b9d4/version/1554062739/c.jpg[/IMG][color=#fefefe]C[/color]\r\n\r\n[b]Cachaça
    (port.)[/b]\r\nSiehe unter [post=JGU7ljnS][u]\"Zuckerrohrdestillate\"[/u][/post]
    in den Tipps für den Barneuling.\r\n\r\n[b]Calvados (franz.)[/b]\r\nApfelbranntwein,
    näheres zu finden unter [post=WckvbYIT][u]Obstbrand[/u][/post] in unseren Tipps
    für den Barneuling.\r\n\r\n[b]Cane syrup (engl.)[/b]\r\nSiehe [post=55QJgTHQ][u]Sirop
    de Canne[/u][/post]\r\n\r\n[b]Cask Strength (engl.)[/b]\r\nFassstärke, bezeichnet
    eine Fass gelagerte Spirituose (z. B. Rum, Whisky), die in unveränderter alkoholischer
    Stärke aus dem Fass abgefüllt wird. \r\n\r\n[b]Cassis (franz.)[/b]\r\nLikör aus
    schwarzen Johannisbeeren\r\n\r\n[b]Catavino (span.)[/b]\r\nDas in Spanien bezeichnete
    Sherryglas. Ein sich zum Rand schließendes, tulpenförmiges Stielglas. Weitere
    Glasformen siehe unter [post=Td3hzyZf][u]Gläser[/u][/post] in unseren Tipps für
    den Barneuling.\r\n\r\n[b]Cava (span.)[/b]\r\nSiehe unter [post=LCsqyzy7][u]Schaumwein[/u][/post].
    Geschützte, regionale Bezeichnung.\r\n\r\n[b]Champagner (franz.)[/b]\r\nSiehe
    unter [post=LCsqyzy7][u]Schaumwein[/u][/post]. Geschützte, regionale Bezeichnung.\r\n\r\n[i]\"Champagner
    ist der einzige Wein, der eine Frau noch schöner macht, nachdem sie ihn getrunken
    hat.\" Madame de Pompadour (1721 - 1764)[/i]\r\n\r\n[b]Chaser (engl.)[/b]\r\nAlkoholreicher
    Drink, der zu etwas weniger Starkem getrunken wird.\r\n\r\n[b]Cheong-Verfahren
    (korea.)[/b]\r\nCheong, ein Verfahren zur konzentrierten Sirupgewinnung, dabei
    werden Früchte 1:1 mit Zucker in einem Kaltauszug durch osmotische Entwicklung
    zu einem Sirup verwandelt. Es kann gewollt, oder ungewollt, zu einer anfänglichen
    Fermentation sich entwickeln. Dieser entstehende Sirup ist hocharomatisch. Weiters
    siehe unter [post=#dgX2ruhW][u]Cheong[/u][/post] und folgende.\r\n\r\n\r\n[b]Chinin[/b]\r\nWeißes,
    schlecht lösliches, kristallines Alkaloid, ursprünglich zur Malariabekämpfung
    eingesetzt, befindet sich das bittere Chinin in einigen limonadigen Getränken.
    Gewonnen aus Chinarinde des gleichnamigen Baumes, gefunden im Hochwald der Anden.
    \r\n\r\n[b]Chu Yeh Ching (chin.)[/b]\r\nChinesischer, gelbgrüner, hochprozentiger
    Bambusblätter-Likör/-Schnaps wird mit mindestens 12 Kräutern, u. a. Bambusblättern
    gebraut.\r\n\r\n[b]Cider (engl.), Cidre (franz.)[/b]\r\nSiehe [post=TizOWyNh][u]Apfelwein[/u][/post]\r\n\r\n[b]Cinnamon
    (engl.)[/b]\r\nZimt\r\n\r\n[b]Clairin (kreol.)[/b]\r\nHaitianische Nationalspirituose
    die in vielen dörflichen Brennereien für den Eigenbedarf gebrannt wird. Weißer,
    ungelagerter Rhum aus frischem Zuckerrohrsaft, der einer Spontangärung unterzogen
    wird. Zwischen Mezcal, Pisco und Rhum Agricole einzuordnen, besitzt der Clairin
    einen alk. Anteil von 51% - 60%. \r\n\r\n[b]Coaster (engl.)[/b]\r\nSiehe Untersetzer\r\n\r\n[b]Cobbler
    (engl.)[/b]\r\nSiehe unter [post=94rZApCd][u]Bezeichnung der Getränke[/u][/post]
    in den Tipps für den Barneuling.\r\n\r\n[b]Cocktail (engl.)[/b]\r\nBezeichnung
    für ein Getränk aus mehreren Bestandteilen, wird in Kategorien unterteilt. Siehe
    [post=94rZApCd][u]Tipps für den Barneuling.[/u][/post]\r\n\r\n[b]Cocktailaging
    (engl.)[/b]\r\nDie Reifung bestimmter Cocktailzutaten in einem Holzfass über eine
    gewisse Zeit. Geeignet sind die alkoholischen Bestandteile eines Cocktails. \r\n\r\n[b]Cocktail-Kultur[/b]\r\nDie
    Präsentation des Cocktails im dezent eleganten Ambiente, umrahmt von nicht zu
    aufdringlicher Musik, dargereicht von freundlich, höflichem Barpersonal. Stil
    gebende Kultur, die Einrichtung (z. B. Cocktail-Sessel) und Mode (z. B. Cocktailkleid)
    beeinflusst und prägte. \r\n\r\n[b]Cocktailscout (engl.)[/b]\r\nIhr unabhängiger
    Begleiter durch die Cocktailwelt. [url=https://www.cocktailscout.de/][u]www.cocktailscout.de[/u][/url],
    oder Sie bleiben gleich hier.\r\n\r\n[b]Cocktailspieß / Cocktailstäbchen[/b]\r\nZur
    Dekoration mit Früchten aus verschiedenen Materialien, von schlicht bis edel.\r\n\r\n[b]Cocktailspitz[/b]\r\nKegelförmiges,
    nach unten spitz zulaufendes Cocktailglas, in einem Stiel endend. Auch V-Shape
    genannt. \r\n\r\n[b]Coffey Still (engl.)[/b]\r\nBrennanordnung  der Destillierapparatur,
    siehe [post=AEiAj1OF][u]Rum/Ron/Rhum weiß[/u][/post] in unseren Tipps für den
    Barneuling.\r\n\r\n[b]Cognac (franz.)[/b]\r\nSiehe unter [post=JGU7ljnS][u]\"Weinbeerendestillate\"[/u][/post]
    in den Tipps für den Barneuling.\r\n\r\n[i]\"Wenn du einen Schneck behauchst,
    kriecht er ins Gehäuse, wenn du ihn in Cognac tauchst, sieht er weiße Mäuse.\"
    Joachim Ringelnatz (1883 - 1934)[/i]\r\n\r\n[b]Colada[/b]\r\nSiehe unter [post=94rZApCd][u]Bezeichnung
