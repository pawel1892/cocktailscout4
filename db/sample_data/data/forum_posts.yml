    da:\r\n[i]- Beefeater 24 - 45% (London Dry)\r\n- The Duke - 45% (London Dry)\r\n-
    Tanqueray No Ten - 47,3% (Dry)\r\n- Lebensstern - 43% (Dry)\r\n- Both's Old Tom
    - 47% (Old Tom)\r\n- Plymouth Gin - 41,2% (Plymouth)[/i]\r\n\r\nBekannte Cocktails
