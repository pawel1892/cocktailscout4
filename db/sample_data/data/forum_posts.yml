  :body: "###Benötigte Barutensilien\r\n\r\nMesser, Flaschenöffner, Raspeln und diverse
    Gefäße sollten im Küchenbestand ja vorhanden sein und brauchen somit erst einmal
    nicht zusätzlich gekauft werden. Falls wider Erwarten doch was in der Richtung
    fehlen sollte, so werdet Ihr entweder in jedem Supermarkt fündig oder könnt es
    online, z. B. bei Barstuff.de, mitbestellen.\r\n![Eiswürfel einfüllen](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:69}}/pexels-cottonbro-4667190.jpg
    \"small\")\r\nWer **Eiswürfel** selbst produzieren will, braucht natürlich außer
    dem Eisfach auch passende Eiswürfelformen. Die Kantenlänge der Eiswürfel sollte
    3cm nicht unterschreiten, damit die Cubes genügend Volumen haben, um reichlich
    Umgebungswärme aufnehmen zu können, ohne zu schnell zu schmelzen. Um crushed Ice
    produzieren zu können, könnt Ihr aber auch auf Cubes mit geringerer Kantenlänge
    zurückgreifen, um so leichter sind sie zu crushen.\r\n\r\nBeim Kauf, vor allem
    von **Silikonformen**, achtet bitte darauf, dass sie lebensmittelecht sind, z.B.
    so etwas:\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:71}}/grafik.png
    \"small\")\r\n\r\nWas Ihr wahrscheinlich nicht besitzt und demzufolge auf jeden
    Fall kaufen müßt, sind Shaker, Strainer und Jigger. Shaker werden unterschieden
    nach zwei großen Gruppen:\r\n\r\n**Das sind die 2- und die 3-teiligen Shaker.**\r\n\r\n|3-teilige
    Shaker|Standard zweiteilige Shaker|Boston|Speedshaker|\r\n|:---:|:---:|:---:|:---:|\r\n|[![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:74}}/grafik.png
    \"small\")](https://www.barstuff.de/3-tlg-shaker-deluxe-300ml.html)|[![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:78}}/a2.jpg
    \"small\")](https://www.barstuff.de/french-shaker/)|[![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:75}}/a3.jpg
    \"small\")](https://www.barstuff.de/boston-shaker/)|[![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:80}}/a5.jpg
    \"small\")](https://www.barstuff.de/speed-shaker/)|\r\n||2-teilige Shaker werden
    noch mal untergliedert in:\r\n|3-teilige Shaker sind für Heimnutzung oft ausreichend
    und haben den Vorteil, dass sie auch einen im Mittelteil integrierten Strainer
    besitzen. Billige Modelle lassen sich allerdings manchmal nicht gut öffnen. Außerdem
    sind sie allgemein weniger flexibel als 2-teilige.|Standard 2 Teiler, im Prinzip
    wie ein 3-teiliger nur ohne den integrierten Strainer. Gibt's oft in Übergrößen,
    so dass man auch mehrere gleiche Drinks auf einmal shaken kann. Für den Homebereich
    aber wohl eher uninteressant.|Der Boston ist wohl der beliebteste Shaker überhaupt.
    Ihn gibt's in 2 Grundausführungen. Einmal als Tin+Mixingglas und einmal als Tin+Tin.
    Wichtig, wenn Ihr Euch einen Bostonshaker zulegen wollt, nehmt keinen mit Gummidichtring.
    Manchmal wird auch nur der eigentliche Shaker allein angeboten. Wer ein passendes
    Mixingglas hat, oder sich anderweitig eines besorgen will, OK. Alle anderen sollten
    nicht vergessen, zusätzlich ein Mixingglas mitzubestellen.|Nur 1 Teil und trotzdem
    ein 2-Teiler? Nein es fehlt nix. Das 2. Teil ist das Gästeglas. Im Prinzip ist
    das der kleine Bruder des Bostonshakers. Diesen Shakertyp kann man natürlich nur
    verwenden, wenn das Gästeglas die passende Form und Stabilität hat und wenn der
    Drink nicht gestraint werden soll.|\r\n\r\n\r\n\r\n|Hawthorne (der meistverwendete)|oder
    Julep|Jigger|Blender|\r\n|:---:|:---:|:---:|:---:|\r\n|[![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:100}}/a7.jpg
    \"small\")](https://www.barstuff.de/barsieb/)|[![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:82}}/a8.jpg
    \"small\")](https://www.barstuff.de/barsieb/)|[![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:83}}/a6.jpg
    \"small\")](https://www.barstuff.de/barmass-jigger/)|[![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:84}}/a10.jpg
    \"small\")](https://www.barstuff.de/standmixer-blender/)|\r\n|Bei den 2-teiligen
    Shakern habt Ihr keinen Strainer dabei, deshalb müßt Ihr Euch einen solchen extra
    zulegen. Hier mit Spirale für den Randabschluß.|Einfaches Sieb, wird auf den Shaker
    aufgelegt und festgehalten.|Zum Abmessen der Mengen benötigt Ihr einen Jigger.
    Für den Anfang auf jeden Fall eine sinnvolle Anschaffung. Wer später viel mixen
    will, wird möglicherweise auf den Jigger verzichten und mit Ausgießern und Zeit
    zählen die Menge abmessen.|Für die Zubereitung von einigen Rezepten (so z. B.
    Frozen Drinks) benötigt Ihr einen Blender.|\r\n\r\n*SchSt/jean.11*\r\n\r\n[![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:81}}/a7.jpg
    \"small\")](https://www.barstuff.de/barsieb/)\r\n\r\n[[post:JGU7ljnS|oben]]"
