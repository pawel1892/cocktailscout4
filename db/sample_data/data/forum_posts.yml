  :body: "## Unsere Markdown Syntax\r\n\r\nDas sind alle Formatierungen, die ihr hier
    nutzen könnt:\r\n\r\n---\r\n\r\n`So schreibt man **fett**`\r\n\r\nSo schreibt
    man **fett**\r\n\r\n---\r\n\r\n`*kursiv kann man auch schreiben*`\r\n\r\n*kursiv
    kann man auch schreiben*\r\n\r\n---\r\n\r\n`~~durchgestrichen~~`\r\n\r\n~~durchgestrichen~~\r\n\r\n---\r\n\r\n`<u>unterstrichen</u>`\r\n\r\n<u>unterstrichen</u>\r\n\r\n---\r\n\r\n##
    Überschriften\r\n\r\n`## Große Überschrift`\r\n\r\n## Große Überschrift\r\n\r\n`###
    Kleinere Überschrift`\r\n\r\n### Kleinere Überschrift\r\n\r\n---\r\n\r\n## Listen\r\n\r\n```\r\n-
    Rum\r\n- Limettensaft\r\n- Minze\r\n```\r\n\r\n- Rum\r\n- Limettensaft\r\n- Minze\r\n\r\n```\r\n1.
    Glas mit Eiswürfeln füllen\r\n2. Rum einschenken\r\n3. Limette auspressen\r\n```\r\n\r\n1.
    Glas mit Eiswürfeln füllen\r\n2. Rum einschenken\r\n3. Limette auspressen\r\n\r\n---\r\n\r\n##
    Links\r\n\r\n`[CocktailScout](https://www.cocktailscout.de)`\r\n\r\n[CocktailScout](https://www.cocktailscout.de)\r\n\r\n---\r\n\r\n##
    Zitate\r\n\r\n`> Das war das beste Rezept, das ich je ausprobiert habe!`\r\n\r\n>
    Das war das beste Rezept, das ich je ausprobiert habe!\r\n\r\nMit Autor — `[quote=Name]Text[/quote]`:\r\n\r\n[quote=Zoidberg]Das
    war das beste Rezept![/quote]\r\n\r\n---\r\n\r\n## Rezepte, Themen und Beiträge
    verlinken\r\n\r\nRezept verlinken — `[[recipe:pina-colada]]`:\r\n\r\n[[recipe:pina-colada]]\r\n\r\nMit
    eigenem Text — `[[recipe:pina-colada|mein Lieblingsrezept]]`:\r\n\r\n[[recipe:pina-colada|mein
    Lieblingsrezept]]\r\n\r\nForum-Thema verlinken — `[[thread:news-eroeffnungsthread]]`:\r\n\r\n[[thread:news-eroeffnungsthread]]\r\n\r\nMit
    eigenem Text — `[[thread:news-eroeffnungsthread|Neuigkeiten]]`:\r\n\r\n[[thread:news-eroeffnungsthread|Neuigkeiten]]\r\n\r\nForum-Beitrag
    verlinken — `[[post:tZkxdKI9]]`:\r\n\r\n[[post:tZkxdKI9]]\r\n\r\nMit eigenem Text
    — `[[post:tZkxdKI9|dieser Beitrag]]`:\r\n\r\n[[post:tZkxdKI9|dieser Beitrag]]\r\n\r\n---\r\n\r\n##
    Bilder\r\n\r\nÜber den Bild-Button in der Symbolleiste kannst du Bilder hochladen
    oder per URL einfügen. Der Text in den eckigen Klammern ist die **Alt-Beschreibung**
    (wichtig für Barrierefreiheit):\r\n\r\n`![Ein Mojito im Highball-Glas](https://example.com/mojito.jpg)`\r\n\r\nStandardmäßig
    wird das Bild in voller Breite angezeigt. Mit einem Größen-Schlüsselwort als Titel
    lässt sich die Darstellung steuern:\r\n\r\nMittelgroß — `![Ein Mojito](https://example.com/mojito.jpg
    \"medium\")`:\r\n\r\nKlein — `![Ein Mojito](https://example.com/mojito.jpg \"small\")`:\r\n\r\nBilder
    können auch per **Strg+V** oder **Drag & Drop** direkt eingefügt werden.\r\n\r\n---\r\n\r\n##
    Tabellen\r\n```\r\n| Spalte 1 | Spalte 2 |\r\n|---|---|\r\n| Wert 1 | Wert 2 |\r\n|
    Wert 3 | Wert 4 |\r\n```\r\n\r\n| Spalte 1 | Spalte 2 |\r\n|---|---|\r\n| Wert
    1 | Wert 2 |\r\n| Wert 3 | Wert 4 |\r\n\r\n## Trennlinie\r\n\r\n`---`\r\n\r\n---\r\n\r\n##
    Code\r\n\r\nFür Mengenangaben oder Fachbegriffe: `` `2 cl Rum` ``\r\n\r\n`2 cl
    Rum`\r\n"
