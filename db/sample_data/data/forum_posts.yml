    ) nich widerstehen:\n\r\n\n\r\nzwar hab ich etwas weniger Weiswein (= [I]Casálta
    Pinot Grigio di Toscana[/I] vom Weingut Ruffino) und Prosecco (= [I]Trevisiol
    Prosecco di Valdobbiadene[/I], Frizzante Extra Dry) genommen, aber das tat dem
    überaus gelungenen Geschmack keinen Abbruch: bitter-süße Aperol-Note mit gut gekühlter
    Weiswein-Prosecco-Auffüllung. Auch im Winter eine empfehlenswerte Erfrischung
    und mir [B]4,5 Sterne[/B] wert.\n\r\n\n\r\np.k und Pferd - wäre auch was für Euch
    ... unbedingt probieren!\n\r\n\n\r\n:ausschenken::stoesschen:"
