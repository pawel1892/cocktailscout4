  :body: "###Spirituosen\r\n\r\nTut Euch selbst einen Gefallen und lasst die 5€-Spirituosen
    im Supermarkt stehen. Da ist nichts dabei, was man wirklich brauchen kann. Auch
    das, was Ihr möglicherweise aus der Werbung kennt, ist nicht unbedingt das, was
    wünschenswert im Cocktailglas wäre.\r\n\r\nJe nachdem, was Ihr gern für Rezepte
    zubereiten möchtet, ist die Palette an möglichen Spirituosen recht groß. Es gibt
    auch nicht DEN Universalrum, oder DEN Universalwhisk(e)y. Für viele Drinks gibt
    es besonders und weniger gut geeignete Spirituosen. Wenn Ihr was Spezielles sucht,
    fragt am besten die anderen Mitglieder im Forum, was sie dafür verwenden.\r\n\r\nDie
    einzelnen Spirituosen werden in teils unterschiedlichen Destillationsverfahren
    hergestellt, die aber unter anderem auch Einfluss auf den Geschmack haben. Ebenso
    gibt es gelagerte und ungelagerte Spirituosen. Die Lagerung kann sowohl in Stahltanks,
    als auch in [[wiki:faesser|Holzfässern]] erfolgen. Die Art und Länge der Lagerung
    hat Einfluss auf die Weichheit und den Geschmack einer Spirituose. Auf weiterführende
    Erläuterungen verzichten wir aber an dieser Stelle. Es soll jedoch nicht unerwähnt
    bleiben, dass sich lange Lagerzeiten nicht nur geschmacklich, sondern auch in
    der Preisgestaltung auswirken. Nicht desto weniger bedeutet dies jedoch nicht
    zwingend, dass sich ein 25 Jahre gelagerter [[wiki:rum|Rum]] in einem bestimmten
    Cocktail besser macht als ein nur 10 Jahre gelagerter. Das kann so sein, muss
    es jedoch nicht.\r\n\r\nIm Folgenden versuchen wir uns also an der Quadratur des
    Kreises und versuchen somit ein paar Empfehlungen zu geben, mit denen Ihr in möglichst
    vielen Bereichen punkten könnt, die preislich erschwinglich und in Deutschland
    möglichst gut erhältlich sind.\r\n\r\n*SchSt*\r\n\r\n\r\n[[post:JGU7ljnS|oben]]"
