  :body: "**[[wiki:whisky-und-whiskey|Whiskey/Whisky]]**\r\n\r\nWhisky wird weltweit
    produziert. Ob in der schriftlichen Darstellung das e geschrieben wird oder nicht,
    entscheidet das Land seiner Herkunft.\r\n\r\n[[wiki:whisky|Whisky]] gehört zu
    den gelagerten Getreidedestillaten. Dabei werden sogenannte Maltwhiskys aus gemälzter
    Gerste hergestellt. Bei Grainwhiskys finden hingegen Weizen, Roggen, ungemälzte
    Gerste, Hafer oder auch Mais Verwendung. Während sich Malts bei Whiskytrinkern
    großer Beliebtheit erfreuen, finden sich Grainwhiskys kaum einzeln auf dem freien
    Markt. \r\n\r\n![Gemälzte Gerste](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:107}}/grafik.png
    \"small\") Gemälzte Gerste\r\n\r\nSie werden zum überwiegenden Teil nur dafür
    hergestellt, um mit Maltwhiskys geblendet (vermischt) zu werden. Dies dient dazu,
    den Geschmack der Malts für den unbedarften Gaumen zu mildern und Whisky sozusagen
    Massentauglich zu machen. Blended Whiskys haben durch Ihren stets gleichbleibenden
    Geschmack für Cocktailfreunde den Vorteil, keine geschmacklichen Ausreißer im
    Glas zu produzieren. Bei Whiskytrinkern jedoch sind Blends eher verpönt, vor allem
    die billigen, mit einem niedrigen Maltanteil.\r\n\r\nSchottland, als eines der
    ältesten whiskyproduzierenden Länder, ist sowohl für seine Maltwhiskys, als auch
    für seine Blended Whiskys sehr bekannt. Der jeweils recht komplexe Geschmack der
    Maltwhiskys ist sehr regionsabhängig.  \r\n\r\nDie Iren streiten sich mit den
    Schotten schon immer und ewig, wo wohl der erste Whisky gebrannt wurde. Diesen
    Streit aber mal beiseite gelassen, sind die Unterschiede, zumindest in der Herstellung,
    gar nicht so groß. Der im Vergleich zum schottischen Whisky jedoch deutlich andere
    Geschmack der irischen Whiskeys rührt wohl in der Hauptsache daher, daß sie zum
    einen ihr Malz nicht über Torffeuern darren und zum anderen den Whiskey dreifach
    destillieren (die Schotten destillieren in der Regel nur zweifach). Das macht
    die irischen Whiskeys für unseren Gaumen milder als ihre schottische Verwandtschaft.\r\n\r\nJetzt
    machen wir einen Sprung übers große Wasser in das Land der Bourbon-, Rye-, Tennessee-
    und Cornwhiskeys, also in die USA. [[wiki:whiskey-vs-rye|Bourbon]], diesen Begriff
    hat sehr wahrscheinlich wohl jeder, der sich mit Spirituosen befasst, schon einmal
    gehört. Der Name Bourbon stammt von Bourbon County in Kentucky. Der so bezeichnete
    Whiskey muss zu über 51% aus Mais bestehen. Der Rest setzt sich aus Gerste, Roggen
    und Weizen zusammen. Bourbon entspricht dem Geschmack der Neuzeit, süßlich und
    mild. Wenn er unverschnitten abgefüllt wird, so spricht man von Straight Bourbon.
    \r\n\r\nCornwhiskeys bestehen nahezu ausschließlich aus Mais und sind relativ
    geschmacksneutral. Deshalb werden sie in der Regel auch meist zum Blenden (vermischen)
    genutzt. Im Gegensatz zum Bourbon ist der Rye ein Whiskey mit mehr als 51% Roggenanteil
    und deshalb sehr würzig. Heute wird zu Gunsten des Bourbon leider nur noch sehr
    wenig Rye produziert.\r\n\r\nUnd dann gibt es da noch die Tennessee Sour Mash
    Whiskeys, die, wie der Name schon vermuten lässt, aus Tennessee kommen. Diese
    Whiskeys werden vor der Fasslagerung einem aufwändigen Filterungsprozess unterzogen.
    Das Produkt ist dann besonders weich und mild.\r\n\r\n|**Scotch Whisky**|**Irish
    Whiskey**|**Bourbon Whiskey**|**Rye Whiskey**|**Tennessee Whiskey**|**Canadian
    Whisky**|\r\n|---|---|---|---|---|---|\r\n|**ca. 20€/l empf. Whisk(e)ys:**|\r\n|-Glenfiddich
    12|-Clontarf Irish Malt|-Jim Beam Black|-Jim Beam Rye|-Jack Daniels No.7|-Black
    Velvet Reserve|\r\n|-Glenlivet 12|-Jameson Irish Whiskey|-Jim Beam Devils Cut||||\r\n||-Tyrconnell
    Single Malt|||||\r\n|**Etwas höhere Kosten:**||||||\r\n|-Ardmore Fully Peated|-Connemara
    Irish Malt|-Elijah Craig|||-Lot No.40|\r\n|-Deanston Virgin Oak|-Irish Man Founder´s
    Reserve|-Wild Turkey 101||||\r\n|-Glenmorangie The Original||||||\r\n|-Talisker
    Malt 10 Years||||||\r\n|**Bekannte Cocktails:**||||||\r\n|[[recipe:blood-and-sand]]|[[recipe:hotel-d-alsace-cocktail]]|[[recipe:bourbon-crusta]]|[[recipe:la-louisiane]]|[[recipe:lynchburg-lemonade]]|[[recipe:Canada]]|\r\n|[[recipe:der-gondoliere]]|[[recipe:irish-coffee]]|[[recipe:horse-s-neck]]|[[recipe:manhattan]]|[[recipe:tennessee-rush]]|[[recipe:Ohio]]|\r\n|[[recipe:hot-toddy]]|[[recipe:irish-lady]]|[[recipe:the-old-fashioned]]|[[recipe:mint-julep]]|||\r\n|[[recipe:rob-roy]]||[[recipe:whiskey-sour]]|[[recipe:vieux-carre]]|||\r\n|[[recipe:rusty-nail]]||||||\r\n|[[recipe:whisky-flip]]||||||\r\n\r\n\r\nIn
    der Neuzeit entwickelten sich in mehreren Ländern, unter anderem Deutschland und
    Japan, nennenswerte Destillerien. Manche mit sehr hochwertigen Whisk(e)ys. Wenn
    hier nur in der Tabelle genannte Länder / Verfahren aufgeführt sind, liegt es
    an der geschichtlichen Entwicklung der Cocktails. \r\n\r\n\r\n\r\n*SchSt/rrr*\r\n\r\n\r\n[[post:JGU7ljnS|oben]]"
