  :body: "***[[wiki:sirupe-hausgemacht|Sirup]]***\r\n\r\nSirup könnt Ihr selbst herstellen,
    was sich jedoch nicht in jedem Fall lohnt. Einerseits kann der Aufwand recht hoch
    sein, Früchte entsaften, Flaschen reinigen und das Ganze zu einer homogenen Masse
    kochen. Zum Anderen ist er oft nur begrenzte Zeit haltbar, so dass man letztendlich
    den Aufwand auch immer nur für recht kleine Mengen betreiben kann.\r\n\r\nDie
    letzte Aussage gilt auch, wenn Ihr Euch Fruchtsirups z. B. von der Firma Riemerschmid
    zulegt. Auch die sind nur begrenzte Zeit haltbar.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:113}}/3.jpg
    \"small\")\r\n\r\nGerade Gelegenheitsmixer haben mit der geringen Haltbarkeitsdauer
    und den doch eher gering benötigten Mengen ein Problem.\r\n\r\nDeshalb ist es
    besser Barsirups zu verwenden. Die sind deutlich länger haltbar, die Konsistenz
    ist auch homogener und für's Mixen optimiert. In Deutschland weit verbreitet sind
    die Produkte von Riemerschmid und Monin.\r\n\r\n|**Barsirup**||\r\n|:---:|:---:|\r\n|![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:114}}/2.jpg
    \"small\")|![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:115}}/1.jpg
    \"small\")|\r\n|-Riemerschmid|-Monin|\r\n\r\n*SchSt/jean.11*\r\n\r\n\r\n[[post:JGU7ljnS|oben]]\r\n"
