  :body: "![Lexikon T](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:29}}/grafik.png)\r\n**Tankard
    (engl.)**\r\nEinfacher Trinkkrug, vorzugsweise aus Metall. Weitere Trinkgefäße
    siehe unter [[post:Td3hzyZf|<u>Gläser</u>]].\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:164}}/Tankard.jpg
    \"small\")\r\n\r\n**Tannine**\r\nPhenolsubstanzen aus pflanzlichen Rückständen,
    die u. a. aus Schalen der Weinbeeren stammen.\r\n\r\n**Tasting (engl.)**\r\nDas
    Schmecken bei einer Verkostung. Es folgt nach dem „Nosing“. Allgemeine Verwendung
    für den gesamten Verkostungsprozess.\r\n\r\n**Tea (engl.)**\r\nAlte Getränkekategorie
    bestehend aus Spirituosen, Zitrussaft, Zucker und Soda. Soll zu Zeiten der Prohibition
    entstanden sein.\r\n\r\n**Tea**\r\nWein auf den kanarischen Inseln, der einer
    Lagerung in Fässern aus kanarischem Kiefernholz unterzogen wurde. Der Wein erhält
    hierdurch tabak-, holzartig, würzige Aromen, die in Verbindung mit den natürlichen
    Weinaromen sehr komplex sind. \r\n\r\n**Tequila (mex.)**\r\nMezcal (mexikanischer
    Agavenbrand) mit regionaler Qualitätsbezeichnung. Näheres siehe unter [[post:JGU7ljnS|<u>\"Agavendestillate\"</u>]]
    in den Tipps für den Barneuling.\r\n\r\n**Thiole**\r\nEine Gruppe flüchtiger,
    organischer Schwefelverbindungen, die während und nach dem Gärprozess entstehen
    können. Einige hiervon sind im Produkt erwünscht, viele wiederum nicht.\r\n\r\n**Thujon**\r\nHauptbestandteil
    der grünen, ätherischen Öle, die unter anderen im [[post:2r4dOHmA|<u>Wermut</u>]]kraut
    enthalten, einen bitteren Geschmack verursachen.\r\n\r\n**Tiki-Ära**\r\nZeit in
    der die Tiki-Kultur ihre Blüte erlebte, ab ca. 1935er bis gut in die 1960er Jahre.
    Zeit der Rum-Mix-Kreationen wie Mai Tai und viele andere.\r\n![Tiki-Drink im Becher
    und karibische Figurdarstellungen](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:34}}/grafik.png
    \"medium\")\r\n\r\n**Tiki-Mug (engl.)**\r\nBecher oder Gefäß mit alten Gestaltungselementen
    der Südsee.\r\n\r\n**Ti Punch (franz./hindi. Ursprung)**\r\nTi eine Abkürzung
    für petit = klein, also kleiner Punsch. Ein Cocktail bestehend aus Rhum Agricole,
    Rohrzucker und Limette.\r\n\r\n**Toast (engl.)**\r\nBeim Anstoßen, oder Zuprosten
    gehaltene, kurze Ansprache, gerichtet an eine Person, oder Gruppe.\r\n\r\n**Toasting
    (engl.)**\r\nDas Ausbrennen einer Fasswandung, die enthaltene Flüssigkeit erhält
    durch Lagerung Röstaromen. Die Fässer werden über offenem Feuer, oder mittels
    Gasbrenner ausgebrannt, anschließend gewässert. Stammt aus einer Zeit als Fisch
    noch mit Fässern transportiert wurden und hiernach eine weitere Verwendung erhalten
    sollten. Dem Fischgeruch begegnete man durch diese Technik.  \r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:165}}/toasting.jpg
    \"small\")\r\n\r\n**Toddy (engl.)**\r\nAlte Getränkebezeichnung, auch Grog genannt.
    Siehe unter [[post:94rZApCd|<u>Bezeichnung der Getränke</u>]] in den Tipps für
    den Barneuling.\r\n\r\n**Törkölypálinka (ungar.)**\r\nTresterbrand, siehe unter
    [[post:dxaH86Fo|<u>Pálinka</u>]].\r\n\r\n**Tonic Water (engl.)**\r\nMit Kohlensäure
    versetztes, chininhaltiges Erfrischungsgetränk.\r\n\r\n**Topping (engl.)**\r\nEtwas
    obenauf setzen als Krönung, z. B. Sahne, Soda, Bitters, Muskat.\r\n\r\n**Traubenbrand**\r\nAus
    der Maische von Trauben gewonnener Brand, im Gegensatz zum [[post:2r4dOHmA|Weinbrand]],
    welcher aus Wein gefertigt wird.\r\n\r\n**Treber (urspr. Öster.)**\r\nBezeichnung
    der Rückstände des Maischeprozesses in der Whisky-, Weinherstellung, aber auch
    beim Bierbrauen anfallende Reste des Malzes. \r\n\r\n**Trester**\r\nDie ausgepressten
    Schalen, Stängel und Kerne von Weinbeeren bzw. Trauben.\r\n\r\n**Tresterbrand**\r\nEine
    Reihe von Spirituosen die aus Trester hergestellt werden.\r\n\r\n**Trinkkultur**\r\nÜber
    den ganzen Globus verteilt, oft mit Zeremonien verbundene, Jahrtausende alte Kultur.
    Fester Bestandteil bei festlichen, geschäftlichen Anlässen, Ritualen, auch in
    den Religionen. \r\n\r\n**Triple Sec (franz.)**\r\nDreifach Trocken, bezeichnet
    einen [[post:Zr3AN86u|Curacao]] mit erhöhtem Alkoholanteil (weit über 30%).\r\n\r\n**Trocken**\r\nDer
    Gehalt an Restzucker im Verhältnis zum Säuregrad. Der Säuregehalt sollte höchstens
    2 Grad niedriger als der Zuckeranteil sein.\r\n\r\n**Tsikoudia (griech.)**\r\nGriechischer
    Tresterbrand aus Kreta, ohne jegliche Aromatisierung, einem italienischen Grappa
    gleich.\r\n\r\n**Tsipouro (griech.)**\r\nGriechischer Tresterbrand, pur im Geschmack
    einem italienischen Grappa gleich, alsauch Anis aromatisiert.\r\n\r\n**Tumbler
    (engl.)**\r\nSchweres, breites Whiskyglas mit dickem Boden ohne Stiel. Weitere
    Glasformen siehe [[post:Td3hzyZf|<u>Tipps für den Barneuling.</u>]]\r\n\r\n**Twist
    (engl.)**\r\nCocktail über dem die ätherischen Öle eines Stück Zitrusschale ausgedrückt
    und durch abreiben am Glasrand aromatisiert wird. Anschließend dient diese gedrehte
    Schale als Dekoration.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:166}}/twist.jpg
    \"small\")\r\n\r\n**Twister (engl.)**\r\nDas zur Aromatisierung gedrehte Stück
    Zitrusschale als Dekoration für den Cocktail. \r\n\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]\r\n"
  :body_bbcode: "[IMG]https://image.jimcdn.com/app/cms/image/transf/none/path/s34ef2c3ad959eb14/image/i2d6a950f70f6f84a/version/1554118412/t.jpg[/IMG][color=#fefefe]T[/color]\r\n\r\n[b]Tankard
    (engl.)[/b]\r\nEinfacher Trinkkrug, vorzugsweise aus Metall. Weitere Trinkgefäße
    siehe unter [post=Td3hzyZf][u]Gläser[/u][/post].\r\n\r\n[b]Tannine[/b]\r\nPhenolsubstanzen
    aus pflanzlichen Rückständen, die u. a. aus Schalen der Weinbeeren stammen.\r\n\r\n[b]Tasting
    (engl.)[/b]\r\nDas Schmecken bei einer Verkostung. Es folgt nach dem „Nosing“.
    Allgemeine Verwendung für den gesamten Verkostungsprozess.\r\n\r\n[b]Tea (engl.)[/b]\r\nAlte
    Getränkekategorie bestehend aus Spirituosen, Zitrussaft, Zucker und Soda. Soll
    zu Zeiten der Prohibition entstanden sein.\r\n\r\n[b]Tea[/b]\r\nWein auf den kanarischen
    Inseln, der einer Lagerung in Fässern aus kanarischem Kiefernholz unterzogen wurde.
    Der Wein erhält hierdurch tabak-, holzartig, würzige Aromen, die in Verbindung
    mit den natürlichen Weinaromen sehr komplex sind. \r\n\r\n[b]Tequila (mex.)[/b]\r\nMezcal
    (mexikanischer Agavenbrand) mit regionaler Qualitätsbezeichnung. Näheres siehe
    unter [post=JGU7ljnS][u]\"Agavendestillate\"[/u][/post] in den Tipps für den Barneuling.\r\n\r\n[b]Thiole[/b]\r\nEine
    Gruppe flüchtiger, organischer Schwefelverbindungen, die während und nach dem
    Gärprozess entstehen können. Einige hiervon sind im Produkt erwünscht, viele wiederum
    nicht.\r\n\r\n[b]Thujon[/b]\r\nHauptbestandteil der grünen, ätherischen Öle, die
    unter anderen im [post=2r4dOHmA][u]Wermut[/u][/post]kraut enthalten, einen bitteren
    Geschmack verursachen.\r\n\r\n[b]Tiki-Ära[/b]\r\nZeit in der die Tiki-Kultur ihre
    Blüte erlebte, ab ca. 1935er bis gut in die 1960er Jahre. Zeit der Rum-Mix-Kreationen
    wie Mai Tai und viele andere.\r\n\r\n[IMG]https://image.jimcdn.com/app/cms/image/transf/dimension=950x10000:format=jpg/path/s34ef2c3ad959eb14/image/if34be12183a8efb1/version/1554130914/tiki-%C3%A4ra.jpg[/IMG]\r\n\r\n[b]Tiki-Mug
    (engl.)[/b]\r\nBecher oder Gefäß mit alten Gestaltungselementen der Südsee.\r\n\r\n[b]Ti
    Punch (franz./hindi. Ursprung)[/b]\r\nTi eine Abkürzung für petit = klein, also
    kleiner Punsch. Ein Cocktail bestehend aus Rhum Agricole, Rohrzucker und Limette.\r\n\r\n[b]Toast
    (engl.)[/b]\r\nBeim Anstoßen, oder Zuprosten gehaltene, kurze Ansprache, gerichtet
    an eine Person, oder Gruppe.\r\n\r\n[b]Toasting (engl.)[/b]\r\nDas Ausbrennen
    einer Fasswandung, die enthaltene Flüssigkeit erhält durch Lagerung Röstaromen.
    Die Fässer werden über offenem Feuer, oder mittels Gasbrenner ausgebrannt, anschließend
    gewässert. Stammt aus einer Zeit als Fisch noch mit Fässern transportiert wurden
    und hiernach eine weitere Verwendung erhalten sollten. Dem Fischgeruch begegnete
    man durch diese Technik.  \r\n\r\n[b]Toddy (engl.)[/b]\r\nAlte Getränkebezeichnung,
    auch Grog genannt. Siehe unter [post=94rZApCd][u]Bezeichnung der Getränke[/u][/post]
