  :body: "![Lexikon H](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:16}}/grafik.png)\r\n**Haarsieb**\r\nBesonders
    engmaschiges Sieb (Teesieb), dient beim double strain feine Partikel von Kräutern
    und dergleichen aufzufangen.\r\n\r\n**Halbtrocken**\r\nÜbliche Bezeichnung bei
    Schaumwein, Wein für  den Restzuckergehalt im Vergleich zur Gesamtsäure.\r\n\r\n**Handcrafted
    (engl.)**\r\nVon Hand gefertigt.\r\n\r\n**Hauersekt (öster.)**\r\n[[post:LCsqyzy7|<u>Schaumwein</u>]]
    mit Herstellungsverfahren wie Champagner, doch ohne regionalem Schutz.\r\n\r\n**[[wiki:barwerkzeuge|Hawthorne
    Strainer (engl.)]]**\r\nSiehe Barsieb. Die Feder lässt sich eng oder weit einstellen.
    Häufigster Siebtyp in der Profibar. Weitere Hilfen und Begriffe der Cocktailwelt
    siehe unsere [[post:qVqyJIcq|<u>Tipps für den Barneuling</u>]].\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:139}}/a7.jpg
    \"big\")\r\n\r\n**Heiliger Bernhard**\r\nSiehe unter [[post:zfI9J50o|Bernhard
    von Clairvaux]]\r\n\r\n**Herzstück**\r\nDer Mittellauf einer Destillation.\r\n\r\n**Highball
    (engl.)**\r\nSiehe unter [[post:94rZApCd|<u>Bezeichnung der Getränke</u>]] in
    den Tipps für den Barneuling.\r\n\r\n**[[wiki:faesser|Hogshead (engl.)]]**\r\nFass
    mit einem Fassungsvermögen von 250 Litern. Wird vielfach in der Whiskyproduktion
    eingesetzt.\r\n\r\n**Hors d'âge (franz.)**\r\nAltersbezeichnung einer Spirituose,
    siehe unter [[post:mxk9AhpD|<u>XO, X.O.</u>.]]\r\n\r\n**Hurricane-Glas**\r\nSiehe
    unter [[post:Td3hzyZf|<u>Gläser</u>]] in den Tipps für den Barneuling.\r\n\r\n**Hypocras
    (griech. Ursprung)**\r\nAuch Ypocras, Ipocras usw. ist ein gewürzter Wein, der
    seit Alters her mit Honig, später mit Zucker gesüßt wurde. Zur Anwendung kommen
    diverse Gewürze wie Ingwer, Kardamom, Koriander, Muskat, Nelken, Zimt, Zitrusschalen
    auch Kräuter und erinnert an Glühwein, oder Feuerzangenbowle. Der Name verweist
    auf den griechischen Arzt Hippokrates, wurde im Mittelalter als wohlschmeckende
    Medizin feil geboten. Hypocras ist im Baseler Raum heute noch ein beliebtes Getränk,
    besonders auch zum Jahreswechsel.\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]"
