  :body: "###Zuckerrohrdestillate\r\n\r\n**[[wiki:rum|Rum/Ron/Rhum weiß]]**\r\n\r\nDie
    Heimat des Zuckerrohrs ist nicht zweifelsfrei feststellbar, liegt aber sehr wahrscheinlich
    in Papua-Neuguinea. Über China gelangte es schließlich nach Nordafrika, von wo
    aus es dann mit den spanischen Eroberern nach Südamerika und in die Karibik gelangte.\r\n\r\nDas
    Klima in dieser Region war für das Wachstum der Pflanzen optimal und der Absatz
    auf dem unersättlichen europäischen Markt versprach gute Gewinne, so dass Zuckerrohr
    bald überall in dieser Region angebaut wurde. Um an den Zucker zu kommen, wurde
    das Zuckerrohr entsaftet, gekocht und in Behälter gefüllt, in deren oberen Teil
    der Zucker auskristallisierte und der Rest nach unten abtropfen konnte. Diese
    Restflüssigkeit nennt man Melasse. Sie enthält immer noch fermentierbaren Zucker,
    so dass durch Zusetzen von Hefe und Wasser eine Maische entstand, die in Ruhe
    gären konnte. Nach Abschluss der Fermentation brauchte die so entstandene alkoholische
    Flüssigkeit nur noch destilliert zu werden, um so den ersten einfachen Rum zu
    erhalten. Allerdings nannte man ihn damals noch nicht so. Das Destillat erhielt
    verschiedene Bezeichnungen, unter anderem wurde es auch Kill Devil genannt, weil
    man ihm teufelsaustreibende Wirkung nachsagte.\r\n\r\nDer Export nach Europa war
    jedoch untersagt, weil man fürchtete, durch dieses billige Destillat die Absatzchancen
    der europäischen Destillerien zu schmälern. Deshalb fand es vorwiegend einheimische
    Abnehmer, wurde aber auch als Tauschware verwendet und erfreute sich bei Seefahreren
    wachsender Beliebtheit.\r\n\r\nDie Bezeichnung Rum entstand wahrscheinlich auf
    Barbados, wobei die Holländer mit ihren großen Trinkgefäßen, genannt Rummer, möglicherweise
    durchaus ihren Anteil hatten. Um 1 Liter Rum destillieren zu können, benötigt
    man etwa 15 Liter Maische.\r\n\r\n![Alte Brennblase](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:102}}/grafik.png
    \"small\") Alte Brennblase\r\n\r\nZur Destillation kommen verschiedene Verfahren
    zum Einsatz. Während zu Beginn nur sehr kleine Brennanlagen Verwendung fanden,
    wurde die Effizienz im Laufe der Zeit durch verschiedene Verfahren gesteigert.
    Der erste Schritt war die Verwendung von Pot Still Brennblasen. Damit konnten
    bereits Destillate mit 70%Alc gewonnen werden. Durch einen zweiten Destillationsgang
    konnte der Alkoholgehalt auf 85%Alc gesteigert werden.\r\n\r\nDa das **Pot Still**
    Verfahren eine recht arbeitsintensiver und vor allem unregelmäßiger Arbeitsablauf
    ist, wurden Säulenbrennapparate entwickelt, mit denen eine kontinuierliche Destillation
    möglich war. Durch die Gleichmäßigkeit und den geringeren Arbeitsaufwand wird
    die Effektivität bei der Rumherstellung erheblich gesteigert. Um auch hier 2 Destillationsgänge
    möglich zu machen, wurde eine 2. Brennsäule hinter die erste geschaltet. Diese
    Anlage wird als **Coffey Still** bezeichnet.\r\n\r\n![Coffey Still Brennanlage](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:98}}/grafik.png
    \"small\") Moderne Säulenbrennanlage\r\n\r\nHeutzutage gibt es auch Anlagen, die
    mehr als 2 Brennsäulen hintereinander verwenden. Dies ist jedoch eine recht preisintensive
    Angelegenheit und kommt somit bei kleinen Destillerien nicht zum Einsatz. Pot
    Still- und Einsäulenbrennanlagen erzeugen Rums mit einem höheren Anteil an Estern
    und Aldehyden, weswegen sie auch oft als schwere Rums bezeichnet werden. \r\n\r\nDurch
    die Mehrfachdestillation in Brennanlagen mit 2 und mehr Säulen entstehen reinere
    Alkohole, die aber durch den geringeren Ester- und Aldehydanteil auch einen weniger
    ausgeprägten Geschmack aufweisen und somit trotz des oft höheren Alkoholgehaltes
    als leichte Rums bezeichnet werden. Auch die Gärdauer und die verwendeten Hefen
    haben Einfluß darauf, ob ein Rum als schwer oder leicht eingestuft wird. Schnell
    vergorene Maische findet oft Verwendung bei leichten Rums.\r\n\r\n**Rhum Agricole**
    wird anders als nach dem oben beschriebenen Verfahren nicht aus Melassemaische
    hergestellt, sondern direkt aus frischem Zuckerrohrsaft. Diese Art der Rumherstellung
    wird vorwiegend in den ehemaligen französischen Kolonien gepflegt. Das Endprodukt
    weicht geschmacklich sehr deutlich von seinen Melassebrüdern ab.\r\n\r\nWeißen
    Rum als Handelsendprodukt gibt es in verschiedenen Ausprägungen und Lagerzeiten
    von ungereift bis zu maximal 3 Jahren gelagert (wobei manch einer einen 3 jährigen
    auch schon gern mal zu den goldenen Rum's zählt). Auch hier beginnt der Alkoholgehalt
    wieder bei 37,5% und auch hier gilt die Faustregel, je höher der Alkoholgehalt,
    desto geschmacksintensiver das Ganze.\r\n\r\nDie Bezeichnungen Rum und Ron meinen
    dabei jeweils das Gleiche. Die Verwendung der Bezeichnung liegt in der sprachlichen
    Ausprägung. Rum wird im Englischen und Ron wird eher von den spanisch sprechenden
    Herstellern verwendet. Diese Bezeichnung wird für das Destillat verwendet, welches
    im Allgemeinen aus Melasse erzeugt wird. Rhum (eigentlich vollständig Rhum Agricole)
    ist die französische Bezeichnung des Zuckerrohrbrandes und wird, wie bereits erwähnt,
    in der Regel auch nicht aus Melasse, sondern direkt aus frischem Zuckerrohrsaft
    hergestellt.\r\n\r\n|**Rum/Ron**|**Rhum Agricole**|\r\n|---|---|\r\n|**Empfehlensw.
    Destillate Einsteigerbarstock um 20€:**|\r\n|-Havanna Club Anejo Blanco 37,5%|-Saint
    James Imperial Blanc Agricole 40%|\r\n|-El Dorado White 37,5%|-La Mauny Rhum Blanc
    Agricole 50%|\r\n|-Appleton White 40%|-Barbancourt White 40%|\r\n|-Cartavio Silver
    40%||\r\n|**Etwas mehr kosten diese Destillate:**|\r\n|-Matusalem Platino White
    40%|-Clement Rhum Agricole Blanc 50%|\r\n|-Angostura Butterfly White Reserva 37,5%*|-J.M.Rhum
    White 50%|\r\n|**Bekannte Cocktails mit weißem Rum:**|**Bekannte Cocktails mit
    weißem Rhum:**|\r\n|[[recipe:daiquiri]]|[[recipe:ti-punch-martiniquais]]|\r\n|[[recipe:frozen-daiquiri]]|[[recipe:dernier-mot]]|\r\n|[[recipe:pina-colada]]||\r\n|[[recipe:mojito]]||\r\n|[[recipe:cuba-libre]]||\r\n|[[recipe:el-presidente]]||\r\n\r\n\r\n\r\n*SchSt/rrr*\r\n\r\n\r\n[[post:JGU7ljnS|oben]]"
