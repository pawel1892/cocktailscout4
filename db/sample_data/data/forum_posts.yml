    der Maische von Trauben gewonnener Brand, im Gegensatz zum Weinbrand, welcher
    aus Wein gefertigt wird.\r\n\r\n[b]Treber (urspr. Öster.)[/b]\r\nBezeichnung der
    Rückstände des Maischeprozesses in der Whisky-, Weinherstellung, aber auch beim
    Bierbrauen anfallende Reste des Malzes. \r\n\r\n[b]Trester[/b]\r\nDie ausgepressten
