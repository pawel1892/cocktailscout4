  :body: "![Lexikon N](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:23}}/grafik.png)\r\n**Napoléon
    (franz.)**\r\nAltersbezeichnung einer Spirituose. Siehe unter [[post:mxk9AhpD|<u>XO,
    X.O.</u>]].\r\n\r\n**Navy Strength (engl.)**\r\nFür die britische Marine gefertigte
    Spirituose mit festgelegtem Alkoholanteil von 54,5% (Rum, Gin). \r\n\r\n**Neat
    (engl.)**\r\nUngemischte Spirituose ohne Eis , ungekühlt, ohne Wasser serviert.\r\n\r\n**Nebukadnezar
    (Ursprung sumer.?)**\r\nFlaschengröße für Champagner mit einem Fassungsvermögen
    von 15 Litern. \r\n\r\n**Negus**\r\nHeißgetränk aus (zumeist) Portwein, Gewürzen,
    Wasser und Zucker.\r\n\r\n**Neutralisieren**\r\nWährend einer Mehrfach-Verkostung
    eingelegter \"Zwischengang\" bestehend in der Regel aus Weißbrot und stillem Wasser.
    Dient zur Neutralisierung der Geschmacksknospen, um sie für eine weitere Probe
    zu sensibilisieren.\r\n\r\n**Nick & Nora**\r\nGlastyp mit Stiel, einem Fassungsvermögen
    von 12 - 18 cl, das einem zum Rand sich öffnenden Weinglas ähnelt. Dieser Typ
    entstand in den 30er Jahren des vergangenen Jahrhunderts, wurde nach den Romanfiguren
    von Dashiell Hammett benannt. Weitere Glastypen für das Cocktailleben zu finden
    unter [[post:Td3hzyZf|<u>Gläser</u>]] in unseren Tipps für den Barneuling.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:148}}/nick%20und%20nora.jpg
    \"small\")\r\n\r\n**[[wiki:bezeichnung-der-getraenke|Nogs (engl.)]]**\r\nAlte
    Getränkekategorie die Spirituose mit Ei und Sahne vermengt enthält. Über Eis in
    einer Tasse, oder Becher serviert.\r\n\r\n**Nosing (engl.)**\r\nDas Riechen bei
    einer Verkostung. Die Zufuhr der Aromen zur Nase sollten durch ein Nosingglas
    unterstützt werden. Hiernach folgt das „Tasting“.\r\n\r\n**[[wiki:kraeuter-und-botanicals|Nutmeg
    (engl.)]]**\r\nMuskatnuss\r\n\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]"
