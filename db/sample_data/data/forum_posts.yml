  :body: "Tja, auch in der Provinz gibt es durchaus empfehlenswerte Cocktailbars -
    beispielsweise das Gusto in Kaiserslautern. Am Schillerplatz direkt neben dem
    gleichfalls sehr empfehlenswerten Restaurant \"Uwe&acute;s Tomate\".\n\r\n\n\r\nDas
    Ambiente ist klassisch kühl; sehr angenehm für eine Bar. Vermixt werden durchweg
    ordentliche Zutaten, Standard ist beispielsweise Bombay Gin (leider nur 40%),
    El Jimador Tequila. Aber auch Tanqueray und Hendricks sind vorhanden, wie auch
    die Herraduras. Natürlich bei allen anderen Spirituosen entsprechend; insbesondere
    Vodka und Whiskyauswahl sehr gut. Woran es mangelt, sind Bitters - aber vielleicht
    ändert sich das noch. Gleichfalls verbesserungswürdig: Wasser sollte gereicht
    werden.\n\r\n\n\r\nEntsprechend gut waren auch die Cocktails. Toll fanden wir,
    daß auf unsere Wünsche eingegangen wurde - so erhielt ich eine Margarita mit Herradura
    anejo (leider mit etwas Lime Juice; hätte ich wohl erwähnen müssen, daß das da
    nicht reingehört) und meine Frau einen Jackie Brown. Das Rezept hierfür mußten
    wir aus dem Gedächtnis rekonstruieren, da wir das Original aus der Victoriabar
    ja leider noch nicht kennen. War aber trotzdem recht lecker.\n\r\n\n\r\nFazit:
    alles in allem eine empfehlenswerte Bar und in der Region unbedingt einen Besuch
    wert.\n\r\n\n\r\n:wink::wink:"
