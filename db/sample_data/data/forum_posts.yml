  :body: "![Lexikon O](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:24}}/grafik.png)\r\n**Obstbrand**\r\nSiehe
    unter [[post:JGU7ljnS|<u>sonstige Destillate</u>]].\r\n\r\n**Obstgeist**\r\nSiehe
    unter [[post:WckvbYIT|Obstbrand]] unserer Tipps für den Barneuling.\r\n\r\n**Obstler**\r\nObstbrand
    aus mehreren Früchten, unter [[post:WckvbYIT|<u>Obstbrand</u>]] in den Tipps für
    den Barneuling nähere Erläuterungen.\r\n\r\n**Obstwasser**\r\nSiehe Obstbrand\r\n\r\n**Ochoko
    (jap.)**\r\nDas Trinkgefäß für Sake. Der kleine Becher wird kunstvoll gefertigt
    oft aus Holz, Keramik, Porzellan.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:149}}/ochoko.jpg
    \"small\")\r\n\r\n**Oechsle**\r\nCh. F. Oechsle entwickelte die Maßeinheit für
    das Mostgewicht, kurz OE. \r\n\r\n**Oenologie / Önologie (griech. Ursprung)**\r\nWeinkunde,
    die Wissenschaft des Weinanbaus und der Herstellung.\r\n\r\n**[[wiki:old-fashioned|Old
    Fashioned (engl.)]]**\r\nDie Urform eines Cocktails. Mit  Whisk(e)y, Zuckerwürfel,
    Bitters und Spritzer Wasser bzw. Eis  wird traditionell im Tumbler serviert. Bekam
    seinen Namen erst, nachdem Varianten hiervon zusammengestellt wurden. Davor war
    es lediglich ein Whisk(e)y Cocktail. Heute vielfach Ersatz des Whisk(e)ys durch
    andere Spirituosen, die dann den Namenszusatz derselben erhalten. \r\n![Old-Fashioned-Cocktail
    im Tumbler-Glas](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:38}}/grafik.png
    \"small\")\r\n\r\n**[[wiki:gin|Old Tom (engl.)]]**\r\nLeicht gesüßter Gin. Nicht
    wirklich süß, nur harmonischer im Geschmack. Aus der Zeit als die Brenntechniken
    nicht ausreichend entwickelt waren. Man begegnete dem schlechten Geschmack durch
    Zuckersüßung. Heute als historische Stilkategorie wiederbelebt.\r\n\r\n**[[wiki:zitrusfruechtchen|Oleo
    saccharum (lat.)]]**\r\nÜbersetzt Ölzucker, bezeichnet das Abreiben der Zitrusfrucht
    mit Zuckerwürfeln. Ätherische Öle der Frucht setzen sich hierbei am Zuckerwürfel
    ab und aromatisieren das Getränk. Heute in der Perfektion durch [[post:mxk9AhpD|Zesten]]
    die dem Zucker seine Aromaöle mitteilen. Folgend die Verarbeitung zum [[post:55QJgTHQ|Sherbet]],
    siehe dort. \r\n\r\n**[[wiki:kraeuter-und-botanicals|Olive]]**\r\nFindet in Drinks,
    wie dem Martini, Verwendung. Die grüne, unreife und entsteinte Frucht servieren.
    Mit Mandel gefüllt ebenso möglich. Manchmal wird auch die schwarze, reife Frucht
    bevorzugt.\r\n\r\n**[[wiki:tequila|Ollita (span.)]]**\r\nKleiner Topf, zumeist
    aus Ton, Trinkgefäß zur Mezcal-Aufnahme.\r\n\r\n**[[wiki:eis|On the rocks (engl.)]]**\r\nGetränk
    auf größeren Eisstücken.\r\n\r\n**[[wiki:barwerkzeuge|Opener, bottle (engl.)]]**\r\nFlaschen-Öffner,
    Kapselheber, auch  „crown cork opener“\r\n\r\n**Opener, can (engl.)**\r\nDosenöffner,
    auch „tin opener“ \r\n\r\n**[[wiki:sirupe-hausgemacht|Orchard Syrup (engl.)]]**\r\nSirup
    aus dem Obstgarten, in der Regel Apfelsirup\r\n\r\n**[[post:U2huuRvG|Orgeat (lat.
    Ursprung)]]**\r\nSirup aus Zucker, Mandeln, Bittermandeln, evtl. Rum und Blütenwasser;
    auch „almond syrup“. Früher eine Mischung aus Mandeln und Gerste, wobei Mandeln
    nicht unbedingt verwandt wurden.\r\n\r\n**Origem (port.), Origen (span.), Origine
    (ital.)**\r\nSteht für Herkunft in den Ländern.\r\n\r\n**Oro (ital.)**\r\nDer
    goldene / weiße Marsala.\r\n\r\n**Orujo (span.)**\r\nSpanische Bezeichnung für
    Trester aus Trauben, oder Oliven, siehe auch unter [[post:TizOWyNh|<u>Aguardientes
    de Orujo</u>]].\r\n\r\n**Ouzo (griech.)**\r\nGriechischer Brand mit Anis aromatisiert.\r\n\r\n**Ouzo-Effekt**\r\nsiehe
    [[post:1cNpHYL3|<u>Louche-Effekt</u>]]\r\n\r\n**[[wiki:rum|Overproof (engl.)]]**\r\nFrei
    übersetzt „Erhöhte Trinkstärke“, eine Angabe z. B. bei einigen Rumsorten, die
    den alkoholischen Anteil über 57,15% setzen (Navy Strength). Overproof Rums können
    bis zu 75 % erreichen. Siehe auch Proof\r\n\r\n**[[wiki:faesser|Oxhoft]]**\r\nAltes
    Hohlmaß, welches früher in ganz Europa benutzt wurde. Auch Oxhufvud genannt hatten
    gleichnamige Fässer ein unterschiedliches Volumen in den Ländern von 210 bis 290
    Litern. Es ist der Vorläufer des [[post:zfI9J50o|<u>Barrique</u>]].\r\n\r\n**[[wiki:barmasse|oz
    (engl.)]]**\r\nOunze, siehe unter [[post:KfWCTgw9|<u>fl oz</u>]].\r\n\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]"
