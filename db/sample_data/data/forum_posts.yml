  :body: "### [[wiki:bezeichnung-der-getraenke|Bezeichnung der Getränk]]\r\n\r\nDas
    Wort „Cocktail“, erste festgehaltene Erwähnung im Angelsächsischen des Jahres
    1806, bezeichnete ursprünglich ein stimulierendes Getränk aus Spirituosen, Zucker,
    Wasser und Bitters.\r\n\r\nHeute werden als Cocktail Getränke mit mindestens zwei
    Zutaten genannt, die vorzugsweise in einer Cocktailschale, Champagnerschale, Sektflöte,
    Likör- oder Margaritaglas, also jeweils im Stielglas, serviert werden können.
    Anderer Name Shortdrink, besitzen ein Volumen von ca. 7 - 14 cl. Größere Mengen
    hingegen nennt man u. a. Longdrink. Drink ist nur der englische Sammelbegriff
    für alle Getränke. Darüber hinaus gibt es Kategorien, in denen Drinks ohne starre
    Grenzen eingeordnet sind:\r\n\r\n***Apéritif***\r\nAuch Before- oder Pre-Dinner-Cocktail,
    sind appetitanregende, in der Regel trockene Drinks, meist ohne Eis, zu servieren
    in der Cocktailschale, mit oft nur einer Spirituose, evtl. Vermouth, frisch gepressten
    Säften und gelegentlich Bitter´s, evtl. Sekt. Garnitur spärlich bis keine. Typischer
    Apéritif ist der [Duke Basil](https://www.cocktailscout.de/rezepte/duke-basil)
    oder der [French 68](https://www.cocktailscout.de/rezepte/french-68).\r\n\r\n***Bowle***\r\nEine
    Entlehnung im 18. Jahrhundert aus dem englische bowl für Napf. Vielleicht zu Unrecht
    etwas aus der Mode gekommenes Getränk mit Früchten, Wein, Sekt oder Mineralwasser
    und weiteren Ingredienzien, es gibt kalte und warme Versionen. Ideal für eine
    Party mit guter Laune. Hier kann man seiner Phantasie bezüglich der Zutaten freien
    Lauf lassen. Beispiel als warme Variante die [Feuerzangenbowle](https://www.cocktailscout.de/rezepte/feuerzangenbowle),
    kalt die [Atomkirschbowle](https://www.cocktailscout.de/rezepte/atomkirschbowle).\r\n\r\n***Buck***\r\nEin
    Highball, der aus Spirituose, Limettensaft und Ginger-Beer, -Ale besteht. Auch
    Mule genannt. Ursprünglich wurde ein Zitronenviertel in das Gästeglas ausgedrückt
    und hinein gegeben. Das Süß-Säure-Verhältnis mit einem kohlensäurehaltigen Getränk
    abgestimmt.\r\n\r\n***Cobbler***\r\nEin Longdrink auf zerstoßenem Eis mit Likör
    oder weinhaltiger Spirituose, Früchten, Sirup, der im Glas gerührt wird. Gegebenenfalls
    aufgefüllt mit kohlensäurehaltigen Getränken wie Soda oder Champagner etc.. Cobblers
    vertragen eine aufwändige Deko und werden in der Regel im hohen Stielglas (Hurricane)
    mit Trinkhalm und Löffel serviert. [Kiwirita](https://www.cocktailscout.de/rezepte/kiwirita)
    als Möglichkeit.\r\n\r\n***Colada***\r\nEin cremiger, süßer, vorwiegend mit Rum,
    Früchten, Säften, gern auch mit Kokoscreme hergestellter Drink. Sahne und verspielte
    Dekoration sind ebenfalls angebracht. In jedem Fall die [Piña Colada](https://www.cocktailscout.de/rezepte/pina-colada)
    sollte hier sich repräsentieren, aber auch der [Swimming Pool](https://www.cocktailscout.de/rezepte/swimming-pool).\r\n\r\n***Collins***\r\nAuf
    gestoßenem Eis ein Longdrink, der im schmalen, hohen Glas (Collinsglas) mit einer
    Spirituose, Zitrussäften, Zucker/Likör, ähnlich einem Sour, aber zusätzlich mit
    Soda gerührt wird. Typischer Vertreter der [Tom Collins](https://www.cocktailscout.de/rezepte/tom-collins).\r\n\r\n***Cooler***\r\nWird
    im großen Longdrink-, Highballglas mit einer Basisspirituose und in der Regel
    \ mit Ginger Ale oder einer anderen kohlensäurehaltigen Zutat gemischt. Abgerundet
    mit Bitters. Hier der [Saratoga-Cooler](https://www.cocktailscout.de/rezepte/saratoga-cooler)
    und ebenfalls kann man [Horse's Neck](https://www.cocktailscout.de/rezepte/horse-s-neck)
    hier einordnen.\r\n\r\n***Crusta***\r\nDer Name rührt von dem Zuckerrand am Glas.
    Man befeuchtet mit einem Zitronen- oder Limettenviertel den Glasrand, kopfüber
    damit nichts ins Glasinnere läuft. Dann wird das Glas auf einen Teller mit Zucker
    gesetzt und klopft es anschließend leicht ab. Statt mit Zitrusfrucht den Rand
    zu befeuchten, können auch farbige Säfte oder Liköre, des Effektes wegen, Verwendung
    finden. Vollendet mit einer großen Zitruszeste die ins Rund der Glasöffnung gesetzt
    wird. Eine Variante der [Brandy Crusta](https://www.cocktailscout.de/rezepte/brandy-crusta)\r\n\r\n***Daiquiri***\r\nSind
    klassische Cocktails auf der Basis weißen Rums mit frischem Limettensaft und Rohrzucker.
    Gehören im Prinzip zu den Sour´s und wurden benannt nach einer kubanischen Siedlung.
    Selbstverständlich gehört hierhin der [Daiquiri](https://www.cocktailscout.de/rezepte/daiquiri),
    oder ebenso lecker [Frozen Daiquiri](https://www.cocktailscout.de/rezepte/frozen-daiquiri).\r\n\r\n***Daisy***\r\nAuf
    zerstoßenem Eis, mit alkoholreicher Spirituose, Orangenlikör und frischen Zitrussäften,
    vorzugsweise in einem Collinsglas serviert und eventuell mit wenig Soda aufgefüllt.
    Der Daisydrink ist Vorreiter für viele, heute populäre Drinks wie Sidecar oder
    Margarita. Beispiel [Daisy Pink](https://www.cocktailscout.de/rezepte/daisy-pink).\r\n\r\n***Digestif***\r\nAnderer
    Name After-Dinner-Cocktail, sind Drinks nach dem Essen mit, im Gegensatz zum Aperitif,
    oft lieblicherem, aber ebenso bitterem, \"verdauungsfördernden\" Charakter. Cocktails
    mit Cognac, Calvados, auch Obstbränden usw., serviert vorwiegend in der Cocktailschale.
    Typische Digestifs sind [Brandy Alexander](https://www.cocktailscout.de/rezepte/brandy-alexander)
    oder die alkoholfreie Varietät [White Russian (alkoholfrei)](https://www.cocktailscout.de/rezepte/white-russian-alkoholfrei).\r\n\r\n***Eggnog***\r\nKalt
    oder warm genossen, zählt er zu den ältesten Mixgetränken.  Bestehend aus Eigelb,
    Zucker und Milch / Sahne, häufig in Verbindung mit Bränden und Likören. Als Garnitur
    und nicht zuletzt Aroma gebend, Muskat oder Zimt auf der Oberfläche. Parallelen
    bestehen zum Flip, der aber ohne Milchprodukte gefertigt wird. Obligatorisch der
    [Egg Nogg](https://www.cocktailscout.de/rezepte/egg-nogg).\r\n\r\n***Fancydrink***\r\nSchlecht
    einer anderen Kategorie zuzuordnender Drink, auffällig oft durch außergewöhnliche
    Trinkbehältnisse aber natürlich auch im Fancy-, Hurricaneglas. Vertragen eine
    üppige Dekoration. Exotische Drinks oft mit Kokos wie der [Cherry Coco](https://www.cocktailscout.de/rezepte/cherry-coco)
    \ oder [Coco Cariba](https://www.cocktailscout.de/rezepte/coco-cariba) sind hier
    zu nennen.\r\n\r\n***Fizz***\r\nEin weiterer Klassiker, Spirituose mit Zitrussaft
    und Zucker auf Eis, im Prinzip ein geschüttelter Sour mit Sodawasser/Champagner
    aufgefüllt, ist für ein Fizz traditionell. Kaum ein Unterschied zum Tom Collins.
    Wird im Longdrinkglas serviert. Als schöne Beispiele der [Gin Fizz](https://www.cocktailscout.de/rezepte/gin-fizz),
    oder der [The Ramos Gin Fizz](https://www.cocktailscout.de/rezepte/the-ramos-gin-fizz)\r\n\r\n***Flip***\r\nKalter,
    cremiger Cocktail mit Eigelb, auch Eiklar, Zucker, Spirituosen wie Weinbrand,
    auch Likörwein wird in einer Schale, oder Weinglas serviert. Ähnlich einem Eggnog,
    nur fehlt hier die Milch oder Sahne. Sind bei uns, aufgrund des Eianteils, fast
    in Vergessenheit geraten. [Whisky Flip](https://www.cocktailscout.de/rezepte/whisky-flip)
    als Erinnerung.\r\n\r\n***Gimlet***\r\nKlassischer Zwei-Zutaten-Cocktail, gegen
    Ende des 19. Jahrhundert bei der brit. Navy getrunken, mit einer Spirituose und
    früher Cordial Lime Juice, heute auch oder zusätzlich mit Zitrussäften. [Schumann´s
    Gimlet](https://www.cocktailscout.de/rezepte/schumann-s-gimlet) ist ein tolles
    Beispiel.\r\n\r\n***Highball***\r\nEinfach aufgebaute Longdrinks, die der Erfrischung
    dienen, im hohen Longdrink-, Highballglas. Bestehend z. B. aus einer Basisspirituose,
    evtl. Saft, einem kohlensäurehaltigen Getränk dem sogenannten Filler. Oft mit
    einer Zitrusscheibe als Dekoration. Ursprünglich soll der erste Highball, Whisky
    mit Soda gewesen sein, gefolgt vom Moscow Mule, Vodka mit Ginger Beer. Ein klassisches
    Beispiel ist der [Gin Tonic](https://www.cocktailscout.de/rezepte/gin-tonic),
    ebenso [ Guave Collins](https://www.cocktailscout.de/rezepte/guave-collins) oder
    [Cuba Libre]( https://www.cocktailscout.de/rezepte/cuba-libre) typisch.\r\n\r\n***Julep***\r\nEr
    wird mit zerstoßenem Eis im Gästeglas, traditionell im Silber- oder Zinnbecher,
    gerührt, häufig mit Whiskey und Zucker, in jedem Fall mit frischer Minze. Ein
    Getränk des 18. Jahrhunderts aus den Südstaaten kommend. Klassischer Vertreter
    [Mint Julep](https://www.cocktailscout.de/rezepte/mint-julep)\r\n\r\n***Limes***\r\nEin
    Getränk bestehend in der Regel aus Fruchtpüree und Alkohol. Weil hierbei meist
    Früchte im Gästeglas zu Mus verarbeitet werden, ist ein stabiles Longdrink-, Highballglas
    angemessen. [Kiwi-Limes](https://www.cocktailscout.de/rezepte/kiwi-limes) hier
    als Stellvertreter.\r\n\r\n***Margarita***\r\nIm Prinzip keine Kategorie, sondern
    eine Reihe von Cocktails, die immerhin so berühmt geworden sind, dass die Glasindustrie
    ein extra Margaritaglas entwickelt hat. Ähnelt einer Cocktail- oder Sektschale
    mit zusätzlich schmalerer Vertiefung zum Stiel. Entstehungszeit erste Hälfte des
    20. Jahrhunderts im südamerikanischen Raum, wird klassisch mit Tequila, Triple
    Sec und Limettensaft gemixt. Im Margaritaglas oder Cocktailspitz, mit Salzrand
    versehen, serviert. Deswegen die [Margarita](https://www.cocktailscout.de/rezepte/margarita)
    als Beispiel, oder [Frozen Strawberry Margarita](https://www.cocktailscout.de/rezepte/frozen-strawberry-margarita)\r\n\r\n***Mule***\r\nAuch
    keine Gruppe, trotzdem erwähnenswert weil mehrere Varianten mittlerweile entstanden
    sind. Kreiert in der Mitte des vergangenen Jahrhunderts, ein Highball aus Vodka,
    Limettensaft und Ginger Beer, auf Eis im Kupferbecher serviert. Natürlich auch
    im Longdrinkglas möglich. Die Unterschiede entstehen durch Austausch der Basisspirituose,
    z. B. wird der Munich Mule mit Gin zubereitet. Der [Moscow Mule (Home made)](https://www.cocktailscout.de/rezepte/moscow-mule-home-made)
    steht als Repräsentant.\r\n\r\n***Pousse Café***\r\nEin Drink bei dem die Zutaten
    im Glas geschichtet werden und damit einen schönen Effekt ergeben. Durch vorsichtiges
    Einfüllen der Zutaten, evtl. über ein Löffelrücken, werden sie Schicht für Schicht
    ins Glas befördert, sodass sie sich nicht vermischen.  Dabei wird die schwerste
    Flüssigkeit als erste, die leichteste zum Schluss geschichtet. Ein bekannter Vertreter
    wäre der [ B52](https://www.cocktailscout.de/rezepte/b-52).\r\n\r\n***Punch***\r\nEine
    schon seit dem 17. Jahrhundert gebräuchliche Bezeichnung und somit eines der ältesten
    Mixgetränke überhaupt. Üblicherweise kaltes karibisches Rumgetränk, auch in der
    warmen Version möglich, einem Grog oder Toddy ähnlich, mit Zitrus-Säften, Zucker,
    Tee oder Wasser, Gewürzen. Im Longdrink-, oder Hurricaneglas und mit Früchten
    dekoriert. Zu nennen hier der [Planter´s Punch](https://www.cocktailscout.de/rezepte/planter-s-punch)
    und auch der [Bombay Punch](https://www.cocktailscout.de/rezepte/bombay-punch).\r\n\r\n***Shooter
    / Shot***\r\nKleines Mixgetränk im Schnapsglas, Pinnchen, Stamperl mit 2, 4 bis
    6 cl Fassungsvermögen. Der [Kamikaze](https://www.cocktailscout.de/rezepte/kamikaze)
    oder [Choco Hot Shot](https://www.cocktailscout.de/rezepte/choco-hot-shot) stehen
    als Beispiel.\r\n\r\n***Shortdrink***\r\nEtwas größer als ein Shooter mit ca.
    5 bis 8, maximal 10 cl Inhalt einfach aufgebaute, stark alkoholische Getränke,
    die ihren Ursprung bei einer Vielzahl der Klassiker aufweisen. Typisch hierfür
    [[recipe:angel-face|Angel Face]]\r\n \r\n***Sling***\r\nEine sehr alte Gruppe
    von Mixgetränken, bestanden ursprünglich, nach einer Beschreibung von 1675, aus
    einer Spirituose, Zucker, Wasser, optional etwas Muskatnuss. Der heutige Sling
    ähnelt eher einem Punch im Hurricane- oder Highballglas mit Spirituosen, Fruchtsirup,
    Säften und Sodawasser oder Limonade auf Eis. Beispiel der [Singapore Sling]( https://www.cocktailscout.de/rezepte/singapore-sling)
    oder [Raffles Singapore Sling](https://www.cocktailscout.de/rezepte/raffles-singapore-sling).\r\n\r\n***Smash***\r\nÄhnlich
    einem Julep, der nicht im Gästeglas gerührt und dadurch klar, sondern geschüttelt
    und deswegen trüb wird. Mit einer Spirituose, Minze, Zucker auf Eis im Old-fashioned-Glas
    serviert. Zu nennen der [Gin Basil Smash](https://www.cocktailscout.de/rezepte/gin-basil-smash)
    oder auch [Raspberry Thyme Smash](https://www.cocktailscout.de/rezepte/raspberry-thyme-smash).\r\n\r\n***Sour***\r\nKlassiker
    aus einer Spirituose, Zitronensaft, Zucker oder Sirup, optional Eiklar, Bitters.
    Kann in einem Old-fashioned-Glas/Tumbler mit und ohne Eis serviert werden. Beispiele
    der [Whiskey Sour](https://www.cocktailscout.de/rezepte/whiskey-sour) oder [Hemingway
    Sour](https://www.cocktailscout.de/rezepte/hemingway-sour). \r\n\r\n***Toddy***\r\nFrüher
    in den Südstaaten so genanntes Getränk, das Rum, Zucker und Muskat enthielt, heiß
    zubereitet, aber kalt getrunken wurde. Weiter ein Getränk im Vereinten Königreich,
    Australien und Schweden gleichen Namens im 18. Jahrhundert so bezeichnet, bestehend
    aus Whisky, Zitrone, Gewürzen und heißem Wasser. Beide haben wenig miteinander
    gemein. Bei uns ist es die 2. Variante, der [Hot Toddy](https://www.cocktailscout.de/rezepte/hot-toddy).\r\n\r\n***Twist***\r\nDie
    Schale einer Zitrusfrucht wird zur Vollendung über dem Glas so gedrückt, dass
    die ätherischen Öle in den Drink gelangen. Sie wird anschließend an den Glasrand
    drapiert. Der [Savoy Hotel Special No. 1](https://www.cocktailscout.de/rezepte/savoy-hotel-special-no-1)
    steht für den Twist.\r\n\r\n***Vermouth-Cocktail***\r\nAls Wermut- oder Vermouth-Cocktail,
    werden starke, meist herbe Drinks genannt, die eben mit Vermouth versetzt sind.
    Sie nehmen eine Zwitterrolle ein, weil sie vor oder nach dem Essen getrunken werden
    können und aus einer Spirituose und Vermouth, sowie eventuell Likör(en) und Bitters
    bestehen. Der [Manhattan](https://www.cocktailscout.de/rezepte/manhattan) steht
    stellvertretend.\r\n\r\n***Zwei- und Dreiteiler***\r\nDas sind ebenfalls starke
    Drinks, eher für Fortgeschrittene, bestehen aus einer Spirituose und (einem meist
    hochprozentigen) Likör und eventuell Wermut und Bitters. [Negroni](https://www.cocktailscout.de/rezepte/negroni)
    oder [Rusty Nail](https://www.cocktailscout.de/rezepte/rusty-nail) finden sich
    hier wieder.\r\n\r\nBei Einordnung der Getränke sind Überschneidungen üblich.
    Diese Auflistung mag ein wenig Licht ins Dunkel der unterschiedlichen Cocktailbezeichnungen
    geben.\r\n\r\n*rrr*\r\n\r\n\r\n[[post:JGU7ljnS|oben]]"
  :body_bbcode: "[b]Bezeichnung der Getränke[/b]\r\n\r\nDas Wort „Cocktail“, erste
    festgehaltene Erwähnung im Angelsächsischen des Jahres 1806, bezeichnete ursprünglich
    ein stimulierendes Getränk aus Spirituosen, Zucker, Wasser und Bitters.\r\n\r\nHeute
    werden als Cocktail Getränke mit mindestens zwei Zutaten genannt, die vorzugsweise
    in einer Cocktailschale, Champagnerschale, Sektflöte, Likör- oder Margaritaglas,
    also jeweils im Stielglas, serviert werden können. Anderer Name Shortdrink, besitzen
    ein Volumen von ca. 7 - 14 cl. Größere Mengen hingegen nennt man u. a. Longdrink.
    Drink ist nur der englische Sammelbegriff für alle Getränke. Darüber hinaus gibt
    es Kategorien, in denen Drinks ohne starre Grenzen eingeordnet sind:\r\n\r\n[i][b]Apéritif[/b][/i]\r\nAuch
    Before- oder Pre-Dinner-Cocktail, sind appetitanregende, in der Regel trockene
    Drinks, meist ohne Eis, zu servieren in der Cocktailschale, mit oft nur einer
    Spirituose, evtl. Vermouth, frisch gepressten Säften und gelegentlich Bitter´s,
    evtl. Sekt. Garnitur spärlich bis keine. Typischer Apéritif ist der [url=https://www.cocktailscout.de/rezepte/duke-basil]Duke
    Basil[/url] oder der [url=https://www.cocktailscout.de/rezepte/french-68]French
    68[/url].\r\n\r\n[i][b]Bowle[/b][/i]\r\nEine Entlehnung im 18. Jahrhundert aus
    dem englische bowl für Napf. Vielleicht zu Unrecht etwas aus der Mode gekommenes
    Getränk mit Früchten, Wein, Sekt oder Mineralwasser und weiteren Ingredienzien,
    es gibt kalte und warme Versionen. Ideal für eine Party mit guter Laune. Hier
    kann man seiner Phantasie bezüglich der Zutaten freien Lauf lassen. Beispiel als
    warme Variante die [url=https://www.cocktailscout.de/rezepte/feuerzangenbowle]Feuerzangenbowle[/url],
    kalt die [url=https://www.cocktailscout.de/rezepte/atomkirschbowle]Atomkirschbowle[/url].\r\n\r\n[i][b]Buck[/b][/i]\r\nEin
    Highball, der aus Spirituose, Limettensaft und Ginger-Beer, -Ale besteht. Auch
    Mule genannt. Ursprünglich wurde ein Zitronenviertel in das Gästeglas ausgedrückt
    und hinein gegeben. Das Süß-Säure-Verhältnis mit einem kohlensäurehaltigen Getränk
    abgestimmt.\r\n\r\n[i][b]Cobbler[/b][/i]\r\nEin Longdrink auf zerstoßenem Eis
    mit Likör oder weinhaltiger Spirituose, Früchten, Sirup, der im Glas gerührt wird.
    Gegebenenfalls aufgefüllt mit kohlensäurehaltigen Getränken wie Soda oder Champagner
    etc.. Cobblers vertragen eine aufwändige Deko und werden in der Regel im hohen
    Stielglas (Hurricane) mit Trinkhalm und Löffel serviert. [url=https://www.cocktailscout.de/rezepte/kiwirita]Kiwirita[/url]
    als Möglichkeit.\r\n\r\n[i][b]Colada[/b][/i]\r\nEin cremiger, süßer, vorwiegend
    mit Rum, Früchten, Säften, gern auch mit Kokoscreme hergestellter Drink. Sahne
    und verspielte Dekoration sind ebenfalls angebracht. In jedem Fall die [url=https://www.cocktailscout.de/rezepte/pina-colada]Piña
    Colada[/url] sollte hier sich repräsentieren, aber auch der [url=https://www.cocktailscout.de/rezepte/swimming-pool]Swimming
    Pool[/url].\r\n\r\n[i][b]Collins[/b][/i]\r\nAuf gestoßenem Eis ein Longdrink,
    der im schmalen, hohen Glas (Collinsglas) mit einer Spirituose, Zitrussäften,
    Zucker/Likör, ähnlich einem Sour, aber zusätzlich mit Soda gerührt wird. Typischer
    Vertreter der [url=https://www.cocktailscout.de/rezepte/tom-collins]Tom Collins[/url].\r\n\r\n[i][b]Cooler[/b][/i]\r\nWird
    im großen Longdrink-, Highballglas mit einer Basisspirituose und in der Regel
    \ mit Ginger Ale oder einer anderen kohlensäurehaltigen Zutat gemischt. Abgerundet
    mit Bitters. Hier der [url=https://www.cocktailscout.de/rezepte/saratoga-cooler]Saratoga-Cooler[/url]
    und ebenfalls kann man [url=https://www.cocktailscout.de/rezepte/horse-s-neck]Horse's
    Neck[/url] hier einordnen.\r\n\r\n[i][b]Crusta[/b][/i]\r\nDer Name rührt von dem
    Zuckerrand am Glas. Man befeuchtet mit einem Zitronen- oder Limettenviertel den
    Glasrand, kopfüber damit nichts ins Glasinnere läuft. Dann wird das Glas auf einen
    Teller mit Zucker gesetzt und klopft es anschließend leicht ab. Statt mit Zitrusfrucht
    den Rand zu befeuchten, können auch farbige Säfte oder Liköre, des Effektes wegen,
    Verwendung finden. Vollendet mit einer großen Zitruszeste die ins Rund der Glasöffnung
    gesetzt wird. Eine Variante der [url=https://www.cocktailscout.de/rezepte/brandy-crusta]Brandy
    Crusta[/url]\r\n\r\n[i][b]Daiquiri[/b][/i]\r\nSind klassische Cocktails auf der
    Basis weißen Rums mit frischem Limettensaft und Rohrzucker. Gehören im Prinzip
    zu den Sour´s und wurden benannt nach einer kubanischen Siedlung. Selbstverständlich
    gehört hierhin der [url=https://www.cocktailscout.de/rezepte/daiquiri]Daiquiri[/url],
    oder ebenso lecker [url=https://www.cocktailscout.de/rezepte/frozen-daiquiri]Frozen
    Daiquiri[/url].\r\n\r\n[i][b]Daisy[/b][/i]\r\nAuf zerstoßenem Eis, mit alkoholreicher
    Spirituose, Orangenlikör und frischen Zitrussäften, vorzugsweise in einem Collinsglas
    serviert und eventuell mit wenig Soda aufgefüllt. Der Daisydrink ist Vorreiter
    für viele, heute populäre Drinks wie Sidecar oder Margarita. Beispiel [url=https://www.cocktailscout.de/rezepte/daisy-pink]Daisy
    Pink[/url].\r\n\r\n[i][b]Digestif[/b][/i]\r\nAnderer Name After-Dinner-Cocktail,
    sind Drinks nach dem Essen mit, im Gegensatz zum Aperitif, oft lieblicherem, aber
    ebenso bitterem, \"verdauungsfördernden\" Charakter. Cocktails mit Cognac, Calvados,
    auch Obstbränden usw., serviert vorwiegend in der Cocktailschale. Typische Digestifs
    sind [url=https://www.cocktailscout.de/rezepte/brandy-alexander]Brandy Alexander[/url]
    oder die alkoholfreie Varietät [url=https://www.cocktailscout.de/rezepte/white-russian-alkoholfrei]White
    Russian (alkoholfrei)[/url].\r\n\r\n[i][b]Eggnog[/b][/i]\r\nKalt oder warm genossen,
    zählt er zu den ältesten Mixgetränken.  Bestehend aus Eigelb, Zucker und Milch
    / Sahne, häufig in Verbindung mit Bränden und Likören. Als Garnitur und nicht
    zuletzt Aroma gebend, Muskat oder Zimt auf der Oberfläche. Parallelen bestehen
    zum Flip, der aber ohne Milchprodukte gefertigt wird. Obligatorisch der [url=https://www.cocktailscout.de/rezepte/egg-nogg]Egg
    Nogg[/url].\r\n\r\n[i][b]Fancydrink[/b][/i]\r\nSchlecht einer anderen Kategorie
    zuzuordnender Drink, auffällig oft durch außergewöhnliche Trinkbehältnisse aber
    natürlich auch im Fancy-, Hurricaneglas. Vertragen eine üppige Dekoration. Exotische
    Drinks oft mit Kokos wie der [url=https://www.cocktailscout.de/rezepte/cherry-coco]Cherry
    Coco[/url]  oder [url=https://www.cocktailscout.de/rezepte/coco-cariba]Coco Cariba[/url]
    sind hier zu nennen.\r\n\r\n[i][b]Fizz[/b][/i]\r\nEin weiterer Klassiker, Spirituose
    mit Zitrussaft und Zucker auf Eis, im Prinzip ein geschüttelter Sour mit Sodawasser/Champagner
    aufgefüllt, ist für ein Fizz traditionell. Kaum ein Unterschied zum Tom Collins.
    Wird im Longdrinkglas serviert. Als schöne Beispiele der [url=https://www.cocktailscout.de/rezepte/gin-fizz]Gin
    Fizz[/url], oder der [url=https://www.cocktailscout.de/rezepte/the-ramos-gin-fizz]The
    Ramos Gin Fizz[/url]\r\n\r\n[i][b]Flip[/b][/i]\r\nKalter, cremiger Cocktail mit
    Eigelb, auch Eiklar, Zucker, Spirituosen wie Weinbrand, auch Likörwein wird in
    einer Schale, oder Weinglas serviert. Ähnlich einem Eggnog, nur fehlt hier die
    Milch oder Sahne. Sind bei uns, aufgrund des Eianteils, fast in Vergessenheit
    geraten. [url=https://www.cocktailscout.de/rezepte/whisky-flip]Whisky Flip[/url]
    als Erinnerung.\r\n\r\n[i][b]Gimlet[/b][/i]\r\nKlassischer Zwei-Zutaten-Cocktail,
    gegen Ende des 19. Jahrhundert bei der brit. Navy getrunken, mit einer Spirituose
    und früher Cordial Lime Juice, heute auch oder zusätzlich mit Zitrussäften. [url=https://www.cocktailscout.de/rezepte/schumann-s-gimlet]Schumann´s
    Gimlet[/url] ist ein tolles Beispiel.\r\n\r\n[i][b]Highball[/b][/i]\r\nEinfach
    aufgebaute Longdrinks, die der Erfrischung dienen, im hohen Longdrink-, Highballglas.
    Bestehend z. B. aus einer Basisspirituose, evtl. Saft, einem kohlensäurehaltigen
    Getränk dem sogenannten Filler. Oft mit einer Zitrusscheibe als Dekoration. Ursprünglich
    soll der erste Highball, Whisky mit Soda gewesen sein, gefolgt vom Moscow Mule,
    Vodka mit Ginger Beer. Ein klassisches Beispiel ist der [url=https://www.cocktailscout.de/rezepte/gin-tonic]Gin
    Tonic[/url], ebenso [url=https://www.cocktailscout.de/rezepte/guave-collins] Guave
    Collins[/url] oder [url= https://www.cocktailscout.de/rezepte/cuba-libre]Cuba
    Libre[/url] typisch.\r\n\r\n[i][b]Julep[/b][/i]\r\nEr wird mit zerstoßenem Eis
    im Gästeglas, traditionell im Silber- oder Zinnbecher, gerührt, häufig mit Whiskey
    und Zucker, in jedem Fall mit frischer Minze. Ein Getränk des 18. Jahrhunderts
    aus den Südstaaten kommend. Klassischer Vertreter [url=https://www.cocktailscout.de/rezepte/mint-julep]Mint
    Julep[/url]\r\n\r\n[i][b]Limes[/b][/i]\r\nEin Getränk bestehend in der Regel aus
    Fruchtpüree und Alkohol. Weil hierbei meist Früchte im Gästeglas zu Mus verarbeitet
    werden, ist ein stabiles Longdrink-, Highballglas angemessen. [url=https://www.cocktailscout.de/rezepte/kiwi-limes]Kiwi-Limes[/url]
    hier als Stellvertreter.\r\n\r\n[i][b]Margarita[/b][/i]\r\nIm Prinzip keine Kategorie,
    sondern eine Reihe von Cocktails, die immerhin so berühmt geworden sind, dass
    die Glasindustrie ein extra Margaritaglas entwickelt hat. Ähnelt einer Cocktail-
    oder Sektschale mit zusätzlich schmalerer Vertiefung zum Stiel. Entstehungszeit
    erste Hälfte des 20. Jahrhunderts im südamerikanischen Raum, wird klassisch mit
    Tequila, Triple Sec und Limettensaft gemixt. Im Margaritaglas oder Cocktailspitz,
    mit Salzrand versehen, serviert. Deswegen die [url=https://www.cocktailscout.de/rezepte/margarita]Margarita[/url]
    als Beispiel, oder [url=https://www.cocktailscout.de/rezepte/frozen-strawberry-margarita]Frozen
    Strawberry Margarita[/url]\r\n\r\n[i][b]Mule[/b][/i]\r\nAuch keine Gruppe, trotzdem
    erwähnenswert weil mehrere Varianten mittlerweile entstanden sind. Kreiert in
    der Mitte des vergangenen Jahrhunderts, ein Highball aus Vodka, Limettensaft und
    Ginger Beer, auf Eis im Kupferbecher serviert. Natürlich auch im Longdrinkglas
    möglich. Die Unterschiede entstehen durch Austausch der Basisspirituose, z. B.
    wird der Munich Mule mit Gin zubereitet. Der [url=https://www.cocktailscout.de/rezepte/moscow-mule-home-made]Moscow
    Mule (Home made)[/url] steht als Repräsentant.\r\n\r\n[i][b]Pousse Café[/b][/i]\r\nEin
    Drink bei dem die Zutaten im Glas geschichtet werden und damit einen schönen Effekt
    ergeben. Durch vorsichtiges Einfüllen der Zutaten, evtl. über ein Löffelrücken,
    werden sie Schicht für Schicht ins Glas befördert, sodass sie sich nicht vermischen.
    \ Dabei wird die schwerste Flüssigkeit als erste, die leichteste zum Schluss geschichtet.
    Ein bekannter Vertreter wäre der [url=https://www.cocktailscout.de/rezepte/b-52]
    B52[/url].\r\n\r\n[i][b]Punch[/b][/i]\r\nEine schon seit dem 17. Jahrhundert gebräuchliche
    Bezeichnung und somit eines der ältesten Mixgetränke überhaupt. Üblicherweise
    kaltes karibisches Rumgetränk, auch in der warmen Version möglich, einem Grog
    oder Toddy ähnlich, mit Zitrus-Säften, Zucker, Tee oder Wasser, Gewürzen. Im Longdrink-,
    oder Hurricaneglas und mit Früchten dekoriert. Zu nennen hier der [url=https://www.cocktailscout.de/rezepte/planter-s-punch]Planter´s
    Punch[/url] und auch der [url=https://www.cocktailscout.de/rezepte/bombay-punch]Bombay
    Punch[/url].\r\n\r\n[i][b]Shooter[/b][/i]\r\nKleines Mixgetränk im Schnapsglas,
    Pinnchen, Stamperl mit 2, 4 bis 6 cl Fassungsvermögen. Der [url=https://www.cocktailscout.de/rezepte/kamikaze]Kamikaze[/url]
    oder [url=https://www.cocktailscout.de/rezepte/choco-hot-shot]Choco Hot Shot[/url]
    stehen als Beispiel.\r\n\r\n[i][b]Sling[/b][/i]\r\nEine sehr alte Gruppe von Mixgetränken,
    bestanden ursprünglich, nach einer Beschreibung von 1675, aus einer Spirituose,
    Zucker, Wasser, optional etwas Muskatnuss. Der heutige Sling ähnelt eher einem
    Punch im Hurricane- oder Highballglas mit Spirituosen, Fruchtsirup, Säften und
    Sodawasser oder Limonade auf Eis. Beispiel der [url= https://www.cocktailscout.de/rezepte/singapore-sling]Singapore
    Sling[/url] oder [url=https://www.cocktailscout.de/rezepte/raffles-singapore-sling]Raffles
    Singapore Sling[/url].\r\n\r\n[i][b]Smash[/b][/i]\r\nÄhnlich einem Julep, der
    nicht im Gästeglas gerührt und dadurch klar, sondern geschüttelt und deswegen
    trüb wird. Mit einer Spirituose, Minze, Zucker auf Eis im Old-fashioned-Glas serviert.
    Zu nennen der [url=https://www.cocktailscout.de/rezepte/gin-basil-smash]Gin Basil
    Smash[/url] oder auch [url=https://www.cocktailscout.de/rezepte/raspberry-thyme-smash]Raspberry
    Thyme Smash[/url].\r\n\r\n[i][b]Sour[/b][/i]\r\nKlassiker aus einer Spirituose,
    Zitronensaft, Zucker oder Sirup, optional Eiklar, Bitters. Kann in einem Old-fashioned-Glas/Tumbler
    mit und ohne Eis serviert werden. Beispiele der [url=https://www.cocktailscout.de/rezepte/whiskey-sour]Whiskey
    Sour[/url] oder [url=https://www.cocktailscout.de/rezepte/hemingway-sour]Hemingway
    Sour[/url]. \r\n\r\n[i][b]Toddy[/b][/i]\r\nFrüher in den Südstaaten so genanntes
    Getränk, das Rum, Zucker und Muskat enthielt, heiß zubereitet, aber kalt getrunken
    wurde. Weiter ein Getränk im Vereinten Königreich, Australien und Schweden gleichen
    Namens im 18. Jahrhundert so bezeichnet, bestehend aus Whisky, Zitrone, Gewürzen
    und heißem Wasser. Beide haben wenig miteinander gemein. Bei uns ist es die 2.
    Variante, der [url=https://www.cocktailscout.de/rezepte/hot-toddy]Hot Toddy[/url].\r\n\r\n[i][b]Twist[/b][/i]\r\nDie
    Schale einer Zitrusfrucht wird zur Vollendung über dem Glas so gedrückt, dass
    die ätherischen Öle in den Drink gelangen. Sie wird anschließend an den Glasrand
    drapiert. Der [url=https://www.cocktailscout.de/rezepte/savoy-hotel-special-no-1]Savoy
    Hotel Special No. 1[/url] steht für den Twist.\r\n\r\n[i][b]Vermouth-Cocktail[/b][/i]\r\nAls
    Wermut- oder Vermouth-Cocktail, werden starke, meist herbe Drinks genannt, die
    eben mit Vermouth versetzt sind. Sie nehmen eine Zwitterrolle ein, weil sie vor
    oder nach dem Essen getrunken werden können und aus einer Spirituose und Vermouth,
    sowie eventuell Likör(en) und Bitters bestehen. Der [url=https://www.cocktailscout.de/rezepte/manhattan]Manhattan[/url]
    steht stellvertretend.\r\n\r\n[i][b]Zwei- und Dreiteiler[/b][/i]\r\nDas sind ebenfalls
    starke Drinks, eher für Fortgeschrittene, bestehen aus einer Spirituose und (einem
    meist hochprozentigen) Likör und eventuell Wermut und Bitters. [url=https://www.cocktailscout.de/rezepte/negroni]Negroni[/url]
    oder [url=https://www.cocktailscout.de/rezepte/rusty-nail]Rusty Nail[/url] finden
    sich hier wieder.\r\n\r\nBei Einordnung der Getränke sind Überschneidungen üblich.
    Diese Auflistung mag ein wenig Licht ins Dunkel der unterschiedlichen Cocktailbezeichnungen
    geben.\r\n\r\n[i]rrr[/i]\r\n\r\n\r\n[post=JGU7ljnS]oben[/post]"
