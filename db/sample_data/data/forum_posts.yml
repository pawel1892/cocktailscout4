    aber wohl eher uninteressant.\r\n\r\n-Boston\r\n[URL=https://www.barstuff.de/boston-shaker/][img]https://image.jimcdn.com/cdn-cgi/image/width=60%2Cheight=60%2Cfit=crop%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/iddd68a38db8d00a7/version/1402481854/image.jpg[/img]\r\n[img]https://image.jimcdn.com/cdn-cgi/image/width=60%2Cheight=60%2Cfit=crop%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/ice540635bbc32f7d/version/1402481854/image.jpg[/img][/URL]\r\nDer
    Boston ist wohl der beliebteste Shaker überhaupt. Ihn gibt's in 2 Grundausführungen.
    Einmal als Tin+Mixingglas und einmal als Tin+Tin. Wichtig, wenn Ihr Euch einen
    Bostonshaker zulegen wollt, nehmt keinen mit Gummidichtring. Manchmal wird auch
    nur der eigentliche Shaker allein angeboten. Wer ein passendes Mixingglas hat,
    oder sich anderweitig eines besorgen will, OK. Alle anderen sollten nicht vergessen,
    zusätzlich ein Mixingglas mitzubestellen.\r\n\r\n-Speedshaker\r\n[URL=https://www.barstuff.de/speed-shaker/][img]https://image.jimcdn.com/cdn-cgi/image/width=60%2Cheight=60%2Cfit=crop%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/i06e20b3a80d13170/version/1402481854/image.jpg[/img][/URL]\r\nNur
    1 Teil und trotzdem ein 2-Teiler? Nein es fehlt nix. Das 2. Teil ist das Gästeglas.
    Im Prinzip ist das der kleine Bruder des Bostonshakers. Diesen Shakertyp kann
    man natürlich nur verwenden, wenn das Gästeglas die passende Form und Stabilität
    hat und wenn der Drink nicht gestraint werden soll.\r\n\r\nBei den 2-teiligen
    Shakern habt Ihr keinen Strainer dabei, deshalb müßt Ihr Euch einen solchen extra
    zulegen.\r\n\r\n-Hawthorne (der meistverwendete)\r\n[URL=https://www.barstuff.de/barsieb/][img]https://image.jimcdn.com/cdn-cgi/image/width=60%2Cheight=60%2Cfit=crop%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/i262d43c4e6bf3973/version/1402481854/image.jpg[/img][/URL]\r\n\r\n-oder
    Julep\r\n[URL=https://www.barstuff.de/barsieb/][img]https://image.jimcdn.com/cdn-cgi/image/width=60%2Cheight=60%2Cfit=crop%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/idca8625e5e128f0f/version/1402481854/image.jpg[/img][/URL]\r\n\r\nZum
    Abmessen der Mengen benötigt Ihr einen Jigger.\r\n[URL=https://www.barstuff.de/barmass-jigger/][img]https://image.jimcdn.com/cdn-cgi/image/width=60%2Cheight=60%2Cfit=crop%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/idbda99f67f379b04/version/1402481854/image.jpg[/img][/URL]\r\nFür
    den Anfang auf jeden Fall eine sinnvolle Anschaffung. Wer später viel mixen will,
    wird möglicherweise auf den Jigger verzichten und mit Ausgießern und Zeit zählen
    die Menge abmessen.\r\n\r\nFür die Zubereitung von einigen Rezepten (so z. B.
    Frozen Drinks) benötigt Ihr einen Blender.\r\n[URL=https://www.barstuff.de/standmixer-blender/][img]https://image.jimcdn.com/cdn-cgi/image/width=60%2Cheight=60%2Cfit=crop%2Cformat=jpg%2C/app/cms/storage/image/path/s1f19f8359d4184d9/image/i34e4c7c16cf31d39/version/1402481854/image.jpg[/img][/URL]\r\n\r\n[i]SchSt[/i]\r\n\r\n\r\n[post=JGU7ljnS]oben[/post]"
