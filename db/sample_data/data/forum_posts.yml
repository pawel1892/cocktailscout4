  :body: 'Dieses Trappistenbier kenne ich und kann es nur empfehlen. Es gibt drei
    Sorten: Dubble (ca. 5,5), Triple (ca. 7) und Quadrupel (ca. Bierlikör). Hier im
    Kölner Raum sind alle relativ problemlos in jedem besseren Getränkemarkt zu bekommen
    (hauptsächlich Grimbergen und Westmalle). Ganz spezielle Klosterbiere bekommt
    man natürlich nur vor Ort.'
