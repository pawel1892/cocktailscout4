  :body: "Ja, kann ich mir im Sommer gut vorstellen. Aperol mit Prosecco ist sowieso
    ein Klassiker. Auf die Idee mit zusätzlich Weißwein bin ich so noch nicht gekommen,
    da Prosecco ja nicht besonders kohlensäurehaltig ist... zumindest nicht der von
    mir meist verwendete Zonin.\n\r\n\n\r\nAber wenn Dir das schmeckt, magst Du bestimmt
    auch die Pfälzer Spezialität Trollschorle: halb Wein, halb Winzersekt. Entweder
    ein Riesling Sekt Brut und einen Rosé, zB Schwarzriesling. Oder einen Blanc de
    Noire vom Spätburgunder. Oder man verwendet einen Rosésekt und gießt mit einem
    sehr trockenen Riesling auf.\n\r\n\n\r\n:wink::wink:"
