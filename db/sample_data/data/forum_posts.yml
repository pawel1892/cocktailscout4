  :body: "## **Projektbericht: Finishing-Experiment „HellDog Meets Port & Peat“**\r\nFass:
    5-Liter Eichenfass\r\n\r\nVorgeschichte: 12j. Islay Whisky, danach 6 Mon. Cruz
    Port\r\n\r\nDestillat: **HellDog New Make (Dresdner Whisky Manufaktur - Hellinger
    42)**\r\n\r\n## **Einleitung**\r\nZiel des Projekts ist die Veredelung eines charakterstarken
    New Makes in einem bereits zweifach vorbelegten Kleinfass. Durch die Kombination
    von rauchigen Islay-Noten und der schweren Süße eines Cruz Portweins wollte ich
    ein komplexes Geschmacksprofil erzeugen, das die Jugend des New Makes (HellDog)
    elegant einbindet.\r\n\r\nIch hoffe, in einer Reifezeit von etwa sechs Monaten
    ein exzellentes Ergebnis zu erzielen. Die gesetzlich vorgeschriebenen drei Jahre
    Lagerzeit, um das Destillat „Whisky“ nennen zu dürfen, werde ich in diesem kleinen
    Fass natürlich nicht realisieren – das Holz würde den Brand schlicht erdrücken.
    Aber die Neugier auf das Ergebnis im Zeitraffer ist einfach zu groß!\r\n\r\n\r\n\r\n1.
    Die Vorbereitung: Konditionierung des Fasses\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:195}}/IMG_4139.jpeg)![]\r\nZuerst
    musste ich den Cruz Portwein nach sechsmonatiger Lagerung entnehmen. Dabei stellte
    ich mit Erschrecken fest, dass der Angels' Share viel zu hoch war: fast 50 % Verlust!
    Eine Entwicklung, die ich so nicht vorausgesehen hatte und die mir für das weitere
    Projekt durchaus Sorgen bereitet.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:197}}/IMG_4156.jpeg)\r\nDas
    Ergebnis der Vorbelegung war jedoch eine wahre Geschmacksexplosion für Nase und
    Gaumen – zweifellos der beste Port, den ich je im Glas hatte. \r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:198}}/IMG_4231.jpeg)\r\nNach
    der Entleerung ließ ich das Fass 14 Tage lang bei offenem Spundloch trocknen.
    Dieser Schritt diente dazu, das Holz „atmen“ zu lassen, bevor der hochprozentige
    New Make eingeführt wurde.\r\n\r\n2. Das Destillat & Der „Entry Proof“\r\nDer
    HellDog New Make wurde mit kraftvollen 60 % vol. geliefert. Um die Extraktion
    von Vanillin und Zuckern aus dem Portwein-Rückstand zu optimieren und die Gefahr
    der „Überholzung“ zu minimieren, wurde das Destillat mit ca. 480 ml Wasser auf
    einen Entry Proof von ca. 55 % vol. eingestellt.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:199}}/IMG_4167.jpeg)\r\n\r\nMessmethode:
    Die Kontrolle erfolgte mittels eines Alkohol-Refraktometers.\r\n\r\nVolumen: Das
    Fass wurde mit 5,2 Litern „spundvoll“ befüllt, um den Luftraum (Headspace) und
    damit die initiale Oxidation so gering wie möglich zu halten.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:200}}/IMG_4180.jpeg)\r\n\r\n3.
    Die Herausforderung: Angels' Share\r\nDie Verdunstung bleibt der kritische Punkt.
    Aufgrund der extremen Erfahrungen während der Portwein-Phase habe ich reagiert:\r\n
    ![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:201}}/IMG_4246.jpeg)\r\nGegenmaßnahme:
    Das Spundloch sowie der Holzkeil wurden nach der Befüllung akribisch mit Kerzenwachs
    versiegelt, um den Alkoholdampf am Entweichen zu hindern.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:202}}/IMG_4239.jpeg)\r\nLagerung:
    Über die optimale Lagertemperatur und Luftfeuchtigkeit muss ich mir noch weitere
    Gedanken machen, da mein aktueller Platz im Keller für ein so kleines Fass noch
    nicht ideal erscheint.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:203}}/IMG_4249.jpeg)\r\nHier
    habe ich noch einiges zu tun und das macht mir auch noch Kopfschmerzen.\r\n\r\n4.
    Reifungsplan & Sensorik\r\nGeplant ist eine fünfmonatige Ruhephase ohne Eingriffe.
    Dieser Zeitraum hat sich in vorangegangenen Versuchen als ideal erwiesen, um den
    „Sweet Spot“ zwischen Holzwürze und Destillat-Charakter zu treffen. Nach Ablauf
    von insgesamt sechs Monaten wird eine zyklische sensorische Prüfung durchgeführt.\r\n\r\n\r\n\r\nErwartetes
    Ergebnis\r\nAufgrund der komplexen Vorbelegung (Torf/Rauch & Portwein) erwarte
    ich ein Destillat, das:\r\n\r\nIn der Nase deutliche Portwein-Süße und dunkle
    Beeren zeigt.\r\n\r\nAm Gaumen die malzige Kraft des HellDog mit einer feinen,
    distanzierten Rauchfahne (Islay-Erbe) kombiniert.\r\n\r\nDurch das massive Oberflächen-Volumen-Verhältnis
    eine visuelle Reife (Farbtiefe) aufweist, die deutlich über sein tatsächliches
    Alter hinausgeht.\r\n\r\n\r\n\r\nWeitere Beschreibungen sowie detaillierte Analysen
    und Bilder folgen in Kürze.\r\n\r\n:wink:"
