  :body: "Passt zwar nicht so ganz mit der Überschrift, aber mangels Whiskythread,
    besser als noch einen Neuen aufzumachen.\n\r\n\n\r\nBei einem Flaschenfund in
    meinen Katakomben entdeckte ich etwas für mich Erstaunliches. Es handelt sich
    um eine ca. 15 Jahre alte Flasche des 10jährigen Glenmorangie. Also äähh... 25
    Jahre..:D  Nun ist es bei einem Singlemalt nicht unbedingt überraschend, daß Abweichungen
    im Bouquet und Geschmack von einem Jahr zum nächsten auftreten. Das überraschende
    bei einer gegenüber gestellten Flasche dieses Jahres war, wie groß der Unterschied
    ist. Es ist unglaublich, es standen zwei gänzlich verschiedene Whiskys vor mir.
    Während der ältere ein schönes, volles Raucharoma besaß, bemerkte ich bei der
    neueren Version lediglich Karamelltöne. Das ganze setzte sich dann im Geschmack
    fort. Die Tendenz beim jüngeren Whisky war eindeutig weicher. Ob jetzt von Vorteil
    oder nicht, muß jeder selbst herausfinden."
