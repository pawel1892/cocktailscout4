  :body: "![Lexikon P](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:25}}/grafik.png)\r\n**Pacharán
    (span.), Patxaran (bask.)**\r\nSpanischer Schlehenlikör mit 500 Jahre alter Tradition.
    Die kleinen Schlehen werden mit Anislikör und, oder Tresterbrand versetzt. \r\n\r\n**Pálinka
    (slow./ungar.)**\r\nObstbrand, mit regionalem Schutz. Das Obst muss in Ungarn
    geerntet, in Ungarn gebrannt und abgefüllt sein. Herstellung aus zuckerhaltigen
    Früchten jeglicher Art wie Aprikose, Heidelbeeren, Johannisbeeren, Schlehen usw..
    Ohne weitere Zusätze wie Aromen, Zucker, Colour muss der Brand einen Mindestalkoholanteil
    von 37,5% Vol. aufweisen. In der Regel liegt der alkoholische Wert aber bei 40%
    bis 55% Vol.. Schrittweises, sanftes Destillieren lässt die Aromen besonders gut
    zur Geltung kommen. Aus der Historie heraus dürfen angrenzend österreichische
    Regionen lediglich den Marillenbrand mit Barackpálinka benennnen. Der aus Trester
    hergestellte Brand heißt in Ungarn Törkölypálinka. \r\n\r\n**Panela (span./chil.)**\r\nFest
    eingedickter, eingekochter Zuckerrohrsaft, findet Verwendung im [[post:EVAyIWVC|Mote
    con huesillos]] siehe dort.\r\n\r\n**Paradies**\r\nEinige Hersteller alkoholischer
    Genüsse besitzen ein Paradies an ihren Stammsitzen. Das sind wohlgehütete Lagerstätten
    ihrer Produktionen über teilweise Jahrhunderte.\r\n\r\n**Parfait d'Amour (franz.)**\r\nViolett
    eingefärbter Likör mit Zitrusnote, blumiges, intensiveres Aroma als Creme de Violette.\r\n\r\n**Pariser
    Messer**\r\nSiehe [[post:HG4n9d6i|<u>Kugelausstecher</u>]].\r\n\r\n**Part des
    Anges (franz.)**\r\nSiehe unter [[post:TizOWyNh|<u>angles share</u>]].\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:151}}/Part%20des%20Anges.jpg
    \"small\")\r\n\r\n**Pastis (franz.)**\r\nFranzösische Spirituose mit Anis aromatisiert.
    In der Zeit des Vebotes von [[post:TizOWyNh|Absinth]] als Droge, erfand man den
    Pastis.\r\n\r\n**Peated (engl.)**\r\nGetorft, betrifft in der Regel [[post:2r4dOHmA|Whisky's]],
    die durch den Brennvorgang torfige Rauch-Aromen erhalten. Dabei ist das Aroma
    abhängig von der Beschaffenheit des Torfes.\r\n\r\n**Peel (engl.)**\r\nStück Schale,
    meist von Zitrusfrüchten.\r\n\r\n**Peg (engl.)**\r\nVolumeneinheit entspricht
    30 ml. Ebenfalls small peg 30 ml und large peg 60 ml. Weiterführende Maße sind
    unserer Tabelle in den  [[post:6gwRnHPv|<u>Tipps für den Barneuling</u>]] zu entnehmen.\r\n\r\n**Pekmes,
    Pecmec, Pekmez (türk.)**\r\nAus Traubenmost hergestellter, honigartiger Sirup.\r\n\r\n**Penina
    (slow.)**\r\nBezeichnung für Sekt in Slowenien.\r\n\r\n**Persiko**\r\nIm deutschsprachigen
    Raum seit alters her bekannter Likör mit mandeligem Geschmack, einem Amaretto
    ähnlich.\r\n\r\n**Petimezi (griech.)**\r\nAus Traubenmost hergestellter, honigartiger
    Sirup.\r\n\r\n**Pezsgő  (ung.)**\r\nBezeichnung für Sekt in Ungarn.\r\n\r\n**Piccolo,
    Pikkolo (ital./de.)**\r\nFlaschengröße für Schaumwein mit einem Volumen von 0,2
    Liter.\r\n\r\n**Pichet (franz.)**\r\nWein-kännchen, -krug wird in Frankreich so
    genannt.\r\n\r\n**Pièce (franz.)**\r\nHauptsächlich in Armagmac und Champagne
    verwendeter, dickbauchiger  Fasstyp unterschiedlicher Volumina oberhalb von 200
    Litern. \r\n\r\n**Pimento Dram (engl.)**\r\nMit Gewürzen versetzter Rumlikör.\r\n\r\n**pint
    (engl.)**\r\nEin halber Liter Seidel. Hohlmaß im englischsprachigen Raum, entspricht
    einem  Gallonen-Achtel. In England ist es über, in USA unter einem halben Liter.\r\n\r\n**Pinzette**\r\nPräzises,
    hygienisches Dekorieren der Getränke mit Früchten hiermit möglich.\r\n\r\n**Pipe
    (engl.)**\r\nAuch Pfeife genannte, kegelförmige Fässer unterschiedlicher Volumina.
    England und USA rund 477 Liter, Portugal 550 Liter und weitere Größen in mehreren
    Ländern.\r\n\r\n**Pisco (peruan.)**\r\nSiehe unter [[post:JGU7ljnS|<u>\"Weinbeerendestillate\"</u>]]
    in den Tipps für den Barneuling.\r\n\r\n**Pitcher (engl.)**\r\nGrößerer Krug,
    z. B. für Auffüllgetränke, ca. ein bis zwei Liter Inhalt.\r\n![Pitcher](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:189}}/aPitcher.jpg
    \"small\")\r\n*\"Betrachte nicht den Krug, sondern dessen Inhalt.\"  (Talmud)*\r\n\r\n**Pjenušac
    (kroat.)**\r\nBezeichnung für den Sekt in Kroatien.\r\n\r\n**Plain (engl.)**\r\nSpirituose
    ohne Alles, außer Wasser, Zucker, Bitters. \r\n\r\n**Poco Grande (span.)**\r\nGeschwungenes
    Stielglas für die Aufnahme von Fancy-, oder Pina Colada-Drinks. Besitzt ein Volumen
    meist über 30 cl. Weitere Glasformen siehe unter [[post:Td3hzyZf|<u>Gläser</u>]].\r\n\r\n
    **Poitin (gäl.)**\r\nIrisch für Töpfchen, auch Poteen, Potcheen (engl.), der wahrscheinlich
    erste alkoholische Brand, überwiegend aus Gerste hergestellt mit einem alk. Vol.
    bis 90%. Vorläufer des Whiskey, Hausbrand früher in Töpfchen hergestellt. Über
    Jahrhunderte wurde das Brennen des Poitin verboten. Seit einigen Jahren legalisiert
    im Handel. \r\n\r\n**Pokal**\r\nTrinkgefäß mit breitem Fuß und kelchartiger Öffnung,
    seit der Antike bekannt.\r\n\r\n**Poncha (port.)** \r\nGetränk mit regionalem
    Schutz auf Madeira bestehend ungefähr jeweils zu einem Drittel aus Zitronensaft
    Honig und einem Brand aus frischem Zuckerrohr. \r\n\r\n**Pony (engl.)**\r\nAnfang
    des letzten Jahrhunderts aufkommende Cocktailgattung aus zwei (alkoholisch und
    nicht alkoholisch) Bestandteilen, z. B. Sekt mit Orangensaft. \r\n\r\n**Pony (engl.)**\r\nAmerikanischer
    slang  für 1 oz (Unze).  Siehe auch unter [[post:JGU7ljnS|<u>\"Barmaße\"</u>]]
    in den Tipps für den Barneuling. Aber auch Flaschengröße mit einem Volumen von
    zumeist 0,1875 Liter.\r\n\r\n**Port, Portwein (port.)**\r\nAperitif-Wein, dessen
    geschützte Bezeichnung von der Stadt Porto herrührt. Die Herstellungverfahren
    sind dem Sherry ähnlich. Die Reben aus dem Duorotal werden bis zu einem bestimmten
    Grad vergoren und anschließend zum Stoppen der Hefeproduktion mit hochprozentigem
    Alkohol verfüllt. Hiernach erhalten die Weine eine Fasslagerung. \r\n\r\n**Portionierer**\r\nAusgießer
    der eine bestimmte Flüssigkeitsmenge abgibt.\r\n![Portionierer](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:190}}/aPortionierer.jpg
    \"small\")\r\n\r\n**Posset (engl.)**\r\nAlte Getränkekategorie bestehend aus Milch/Sahne,
    Wein/Sherry, oder Bier, Honig und Gewürzen. Wird vorzugsweise in einem Gefäß mit
    zwei Henkeln, dem sogenannten Posset, heiß serviert. \r\n\r\n**Pot, Pota, Pote,
    Pott**\r\nAltes, in Europa gebräuchliches Hohlmaß unterschiedlicher Volumina,
    von 0,9 l bis über 8 Liter.\r\n\r\n**Pot still (engl.)**\r\nSiehe [[post:TizOWyNh|<u>Alambic</u>]]\r\n\r\n**Pourer
    (engl.)**\r\nSiehe [[post:TizOWyNh|<u>Ausgießer</u>]].\r\n\r\n**Pouring (engl.)**\r\nDas
    Abmessen der Zutat lediglich mit Ausgießer und Sekunden zählen. Dabei wird angenommen,
    dass in einer Sekunde 1 cl. Flüssigkeit die Flasche verlässt. Eine höchst ungenaue
    Methode, die allerdings Zeit erspart.\r\n\r\n**Pousse Café (franz.)**\r\nDie Ingredienzien
    des Cocktails werden im Glas geschichtet. Siehe [[post:94rZApCd|<u>Bezeichnung
    der Getränke</u>]] in unseren Tipps für den Barneuling.\r\n\r\n**Pox (mex.)**\r\nAlte
    traditionelle Spirituose der Maya aus Mais, Weizen, Zuckerrohr, in der Herstellung
    ähnlich Mezcal und Tequila.\r\n\r\n**Pre-Mixes (engl.)**\r\nVorgefertigte Cocktailbasis
    die lediglich mit Eis und, oder Fruchtsaft ergänzt werden muss,  in Flaschen angeboten
    im Handel. Allerdings kein Ersatz für frisch zubereitete Cocktails.\r\n\r\n**Proof
    (engl.)**\r\nAlte amerikanische Angabe des Alkoholgehalts, 80 Proof entsprechen
    40% Vol., 151 Proof gleich 75,5% Vol. Umrechnungsfaktor demnach ½. In England
    gibt es manchmal noch, z. B. bei Whiskys, die Angabe Degrees Proof. 100 Degrees
    Proof entsprechen 57,15% Vol.\r\n\r\n**Pulco (lat. Ursprung)**\r\nFloh; Konzentrat
    aus Zitrusfrüchten.\r\n\r\n**Pulque (mex.)**\r\nÜber 2000 Jahre altes Wissen zur
    Gewinnung des fermentierten, leicht säuerlichen, dicklichen Saftes aus dem Herz
    der Agave. Mit einem Alkoholanteil von 5% bis 10%, besitzt er je nach Alter unterschiedliche
    geschmackliche Eigenschaften. Wird für die Barszene neu entdeckt.\r\n\r\n**Punch
    / Punsch (hindi. Ursprung)**\r\nUrsprünglich aus dem Raum Indien stammende Mixtur
    aus 5 (so der Name) Zutaten: Arrak, Zitrone, Tee bzw. Wasser, Zucker und Gewürze.
    Heute wird als Alkoholkomponente eher der, dem Arrak im Geschmack ähnelnde, Rum
    verwendet. Weiterführendes siehe unter [[post:94rZApCd|<u>Bezeichnung der Getränke</u>]]
    in den Tipps für den Barneuling.\r\n\r\n**Punt (engl.)**\r\nBezeichnet die Einbuchtung
    des Flaschenbodens.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:154}}/punt.jpg
    \"small\")\r\n\r\n**Pyment**\r\nMet mit Traubenmost fermentiert.\r\n\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]\r\n"
