    still (engl.)[/b]\r\nDestillierhelm der säulenförmig ausgearbeitet ist. Siehe
    auch [post=TizOWyNh][u]Alambic[/u][/post].\r\n\r\n[b]Cooler (engl.)[/b]\r\nSiehe
