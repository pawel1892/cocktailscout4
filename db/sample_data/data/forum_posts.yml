  :forum_thread_id: 2460
  :user_id: 30
  :last_editor_id:
  :body: "[quote=Orca]\r\nZuerst musste ich den Cruz Portwein nach sechsmonatiger
    Lagerung entnehmen. Dabei stellte ich mit Erschrecken fest, dass der Angels' Share
    viel zu hoch war: fast 50 % Verlust! Eine Entwicklung, die ich so nicht vorausgesehen
    hatte und die mir für das weitere Projekt durchaus Sorgen bereitet.[/quote]\r\n\r\nDa
    hast Du dir aber sehr durstige Engel eingeladen.\r\n\r\n[quote=Orca]\r\nDas Ergebnis
    der Vorbelegung war jedoch eine wahre Geschmacksexplosion für Nase und Gaumen
    – zweifellos der beste Port, den ich je im Glas hatte. [/quote]\r\n\r\nDirekt
    zu beneiden bis Du, wahrscheinlich hast Du mit den Engelchen vorm Fass gelegen
    und alles nach und nach verköstigt. :stoesschen::gelage:\r\n\r\n[quote=Orca]\r\nNach
    der Entleerung ließ ich das Fass 14 Tage lang bei offenem Spundloch trocknen.
    Dieser Schritt diente dazu, das Holz „atmen“ zu lassen, bevor der hochprozentige
    New Make eingeführt wurde.[/quote] \r\nKein Wunder, dass Du so viele Engelchen
    hast. Die sind nun wieder alle im Fass und freuen sich auf die nächste Ladung.:unschuldig:
    \r\n\r\n[quote=Orca]\r\n\r\n3. Die Herausforderung: Angels' Share\r\nDie Verdunstung
    bleibt der kritische Punkt. Aufgrund der extremen Erfahrungen während der Portwein-Phase
    habe ich reagiert:\r\nGegenmaßnahme: Das Spundloch sowie der Holzkeil wurden nach
    der Befüllung akribisch mit Kerzenwachs versiegelt, um den Alkoholdampf am Entweichen
    zu hindern.[/quote]\r\n\r\nDu hättest nicht so lange lüften dürfen, siehe oben.\r\n\r\n[quote=Orca]Lagerung:
    Über die optimale Lagertemperatur und Luftfeuchtigkeit muss ich mir noch weitere
    Gedanken machen, da mein aktueller Platz im Keller für ein so kleines Fass noch
    nicht ideal erscheint.[/quote]\r\n\r\nHast Du etwa einen beheizten Keller, 20,nochwas
    Grad?\r\n\r\n[quote=Orca]Hier habe ich noch einiges zu tun und das macht mir auch
    noch Kopfschmerzen.[/quote]\r\n\r\n:kater: Ja nee, ist klar.\r\n\r\n[quote=Orca]4.
    Reifungsplan & Sensorik\r\nNach Ablauf von insgesamt sechs Monaten wird eine zyklische
    sensorische Prüfung durchgeführt.[/quote]\r\n\r\nNaja, das kennen wir schon.:gelage:\r\n\r\nSonst
    bin ich überrascht von deiner prof. Herangehensweise. Das kann ja nur gut, wenn
    nicht excellent werden.\r\nBesteht keine Möglichkeit einer kühleren Lagerung?
    Zur Not in einem ausgekleideten Erdloch osä.? \r\n\r\n"
