  :body: "![Lexikon S](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:28}}/grafik.png)\r\n**SA
    (franz.)**\r\nAbkürzung für sans année; ohne Jahr, bezeichnet in der Champagnerherstellung
    einen Verschnitt verschiedener Jahrgänge. \r\n\r\n**Sabrieren**\r\nUrsprung Sabrage;
    das Öffnen der Champagnerflasche mittels eines Säbels, indem die Verdickung des
    Halses abgeschlagen wird.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:158}}/Sabrieren.jpg
    \"small\")\r\n\r\n**Sack**\r\nSeit dem 16. Jahrhundert benutzte Bezeichnung mit
    unklarer Herkunft. Wird für einen gespriteten Wein von den Kanaren, oder aus Spanien
    verwandt. Gilt als Synonym für Sherry, doch ebenfalls Weine anderer Herkunft tragen
    diesen Zusatz.\r\n\r\n**Sake (jap.)**\r\nReiswein, siehe auch unter [[post:RUIy8WjI|<u>Leichte
    Alkohole II</u>]] in unseren Tipps für den Barneuling.\r\n\r\n**Salmanazar (Ursprung
    sumer.?)**\r\nFlaschengröße für Champagner mit einem Fassungsvermögen von 9 Litern.\r\n\r\n**Salt
    edge / salt rim (engl.)**\r\nSalz am Glasrand, im Gegensatz zum Crusta-Rand.\r\n\r\n**Sambuca
    (ital.)**\r\nAlkoholreicher italienischer Digestif-Likör mit Anis aromatisiert.\r\n\r\n**Sangaree
    (Ursprung span.)**\r\nAlte Getränkekategorie, die nach dem spanischen Wort für
    Blut (Sangre) aufgrund der Farbe benannt wurde. Bestehend aus Rot-, oder Portwein,
    einer weiteren hochprozentigen Spirituose, Lkör, oder Zucker, ungekühlt, oder
    auf Eis im Collinsglas serviert, mit Muskat abgerundet. \r\n\r\n**Sankt Bernhard**\r\nSiehe
    unter [[post:zfI9J50o|Bernhard von Clairvaux]].\r\n\r\n**Sauser**\r\nTeilvergorener
    Traubenmost. Siehe auch [[post:KfWCTgw9|<u>Federweißer</u>]].\r\n\r\n**Scaffa
    (engl.)**\r\nAlte Getränkekategorie bestehend aus hochprozentiger Spirituose,
    Likör und Bitters, in einer Schale bei Zimmertemperatur serviert. \r\n\r\n**Schirmchen,
    Wedel**\r\nMöglichst nur auf einem Eisbecher verwenden. Es sei denn, man gibt
    eine 50er Jahre Party.\r\n\r\n**Schlempe**\r\nDie Rückstände nach einer Destillation;
    der Abfall.\r\n\r\n**Schmand/Schmant**\r\nBezeichnet die Rückstände nach einer
    langen Lagerung bei Flaschen zwischen der Kapsel und dem Korken. Ratsam deswegen,
    vor Entfernung des Korken, diesen und den Flaschenrand gut mittels Tuch reinigen.\r\n\r\n**Schnaps**\r\nUmgangssprachliche
    Bezeichnung für Spirituose, deren Alkoholkonzentration einen Mindestwert von 15%
    Vol. nach EU-Recht aufweisen muss (Ausnahme Eierlikör 14%).\r\n\r\n*\"Wird ein
    Gauner vom Schnapstod mal getroffen, so sagt man, er hat sich tot gesoffen. Jedoch
    bei den guten Alten sagt man, der Schnaps hat sie erhalten.\" Unbekannt*\r\n\r\n**Schneidbrett**\r\nStabile
    Unterlage zum Früchte schneiden. Kleiner Tipp, damit das Brett nicht rutscht,
    ein angefeuchtetes Küchentuch unterlegen.\r\n\r\n**Schorle**\r\nGetränk aus Wein
    mit Mineral-, oder Sodawasser.\r\n\r\n**Scotch (engl.)**\r\nWhisky aus Schottland.
    Siehe auch [[post:LSbjcA1e|<u>Whisky/Whiskey</u>]].\r\n\r\n**Screw (engl.)**\r\nAlte
    Getränkekategorie bestehend aus einer klaren Spirituose und Orangensaft. Im Gästeglas
    gerührt und auf Eiswürfeln im Collinsglas serviert.\r\n\r\n**Screw cap (engl.)**\r\nDrehverschluss
    an Flaschen\r\n\r\n**Sec (franz.), secco (ital.), seco (span., port.)**\r\nSteht
    für trocken. Bedeutet in der Schaumweinherstellung ein Restzucker von 17 - 35
    g/l.\r\n\r\n**Sektflaschenverschluss**\r\nZum Verschließen angefangener Sekt-
    und Champagnerflaschen. \r\n![Sektflaschenverschluß](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:192}}/aSektflaschenverschlu%C3%9F.jpg
    \"small\")\r\n\r\n**Shaker (engl.)**\r\nBecher zum Schütteln und Vermengen der
    Zutaten, siehe [[post:Td3hzyZf|<u>Tipps für den Barneuling</u>]] auch unter [[post:zfI9J50o|<u>Boston-Shaker</u>]]
    und Speed-Shaker.\r\n\r\n**Sherbet (engl.)**\r\nBedeutet in der Cocktailwelt durch
    Fruchtanteile aromatisierter Sirup, bestehend aus der Grundzutat [[post:FaSGbacs|Oleo
    Saccharum]], siehe dort. \r\n\r\n**Sherry (maur. Ursprung)**\r\nAperitif-Wein
    dessen Alkoholgehalt angehoben wurde. Siehe hierzu unter [[post:LCsqyzy7|<u>Weinaperitife
    / Sherry</u>]].\r\n\r\n**Shōchū (japan.)**\r\nBranntwein wird aus verschiedenen
    Grundprodukten hergestellt, z. B. Reis, Süßkartoffel, Zuckerrohr, Sesam u. a..
    Vielfach mit einem alkoholischen Anteil von 25%, doch ebenfalls über 40% möglich.\r\n\r\n**Shooter
    (engl.)**\r\nSiehe unter [[post:94rZApCd|<u>Bezeichnung der Getränke</u>]] in
    den Tipps für den Barneuling.\r\n\r\n**Shortdrink (engl.)**\r\nKleines Getränk
    mit üblichen ca. 7 cl Volumen , Gegensatz zum Longdrink.\r\n\r\n**Shot (engl.)**\r\nAmerikanisches
    Barmaß, entspricht einem Jigger. Siehe unter [[post:JGU7ljnS|<u>\"Barmaße\"</u>]]
    in den Tipps für den Barneuling.\r\n\r\n**Shrub (arab. Ursprung)**\r\nAlte Getränkekategorie
    üblicherweise bestehend aus Früchten, Spirituose, Zucker, evtl. Essig. Die Mischung
    wird einige Wochen maszeriert, anschließend oft heiß, aber auch auf Eis serviert.
    \r\n\r\n**Sidra (span.)**\r\nSiehe unter [[post:TizOWyNh|<u>Apfelwein</u>]].\r\n\r\n**Sifone
    (ital.)**\r\nVerfahren bei Herstellung des Marsala siehe unter [[post:EVAyIWVC|<u>Mistela
    / Mistel / Mistelle</u>]]\r\n\r\n**Simple syrup (engl.)**\r\nLäuterzucker im Verhältnis
    1 Teil Zucker auf 1 Teil Wasser.\r\n\r\n**Singani (boliv.)**\r\nBolivianischer
    Weinbrand der Rebe  Muscat d’Alexandrie mit kontrollierter Herkunftsbezeichnung,
    einem Pisco ähnlich. Drei zugelassene Qualitätsstufen, Singani de Altura / Gran
    Singani, Singani 1. Wahl, Singani 2. Wahl erhältlich. [[post:JGU7ljnS|<u>Weitere
    Info über Weinbrände</u>]] unter Weinbeerendestillate in den Tipps für den Barneuling.\r\n\r\n**Single
    Malt (engl.)**\r\nSiehe [[post:EVAyIWVC|<u>Malt</u>]]\r\n\r\n**Siphon**\r\nZapfflasche
    um aus Wasser, unter Zugabe von NaHCO³ und CO², Soda herzustellen und dosiert
    ins Glas abzugeben.\r\n\r\n**Sirop de Canne (franz.), cane syrup (engl.)**\r\nRohrzuckersirup,
    im Gegensatz zum Läuterzucker leicht bräunliche Farbe.\r\n\r\n**Sirop de Gomme
    (franz.)**\r\nSiehe [[post:RBQLgPHt|<u>Gomme Syrup</u>]]\r\n\r\n**Sling (engl.)**\r\nSiehe
    unter [[post:94rZApCd|<u>Bezeichnung der Getränke</u>]] in den Tipps für den Barneuling.\r\n\r\n**Slivovic
    (serb.), Slibowitz (böhm.), Sliwowitz (slaw. Ursprung)**\r\nPflaumen-Obstbrand\r\n\r\n**Sloe
    (engl.)**\r\nSchlehe (prunus spinosa), Beeren des Schlehenbaumes werden gern zur
    Mazeration in Gin eingelegt. Anschließend mit Zucker zu einem Likör verarbeitet,
    oft fälschlicher Weise als Sloe-Gin bezeichnet.\r\n\r\n**Smash (engl.)**\r\nSiehe
    unter [[post:94rZApCd|<u>Bezeichnung der Getränke</u>]] in den Tipps für den Barneuling.\r\n\r\n**Smoked
    Cocktail (engl.)**\r\nCocktail versehen mit Raucharomen. Wird erreicht durch Abbrennen
    von Gewürzen, Tee, Holzchips usw. mit Auffangen des Rauches, welchen man bestenfalls
    durch die Flüssigkeit des Cocktails leitet.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:162}}/Smoked%20Cocktail.jpg
    \"small\")\r\n\r\n**Snack (engl.)**\r\nKleiner Happen zwischen den Cocktails,
    einfach ein Muss. \r\n\r\n**Snifter (engl.)**\r\nElegantes Nosingglas mit Stiel
    für Whisky-, Rumtastings und andere. Weitere Glastypen siehe unter [[post:Td3hzyZf|<u>Gläser</u>]]
    unserer Tipps für den Barneuling.\r\n\r\n**Sodasiphon**\r\nSiehe Siphon, erhältlich
    auch als Espumasiphon.\r\n\r\n**[[wiki:sodawasser|Sodawasser]]**\r\nMit Kohlenstoffdioxid
    und Natriumhydrogencarbonat angereichertes Wasser, auch kurz Soda genannt. Die
    Regelungen unterscheiden sich in den Ländern. In Deutschland muss das Wasser mindestens
    570 mg pro Liter Natriumhydrogencarbonat plus Kohlensäure enthalten. Ein Tafelwasser
    nur mit CO² reicht nicht für diese Bezeichnung.\r\n\r\n**Solera (span.)**\r\nTraditionell,
    Begriff bei der Herstellung von Rum, Wein, Cognac, Sherry u. a., bezeichnet das
    kontinuierliche Nachfüllen der Fässer aus der nächst jüngeren Generation. Siehe
    hierzu [[post:6B70hcZ6|<u>Rum/Ron/Rhum dunkel</u>]] unserer Tipps.\r\n\r\n**Sotol
    (mex.)**\r\nMexikanischer Brand der nicht aus Agaven sondern aus Dasylirien hergestellt
    wird. diese Pflanzen ähneln der Agave im Aussehen und die Brenntechnik ist dem
    Mezcal gleich. Der Sotol kommt aus den mexikanischen Gebieten Chihuahua, Coahulia
    und Durango und geniesst regionalen Schutz. \r\n\r\n**Sour**\r\nSiehe unter [[post:94rZApCd|<u>Bezeichnung
    der Getränke</u>]] in den Tipps für den Barneuling.\r\n\r\n**Sparkling Wine (engl.)**\r\nSteht
    im englischsprachigen Raum für Sekt. Weitere Bezeichnungen und Erläuterungen siehe
    unter [[post:LCsqyzy7|<u>Leichte Alkohole / Schaumwein</u>]].\r\n\r\n**Sparschäler**\r\nFrüchte
    auf schonender Art von der Schale befreien, um größere Zesten zu schneiden.\r\n\r\n**Speedrack
    (engl.)**\r\nFlaschenhalter für den Bereich unterhalb des Tresens.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:160}}/Speedrack.jpg
    \"small\")\r\n\r\n**Speedshaker (engl.)**\r\nEinfacher, aus einem Teil bestehender,
    Metallbecher, bei dem die zweite Hälfte das Gästeglas bildet.\r\n\r\n**Sphärisierung**\r\nIn
    der Molekular-Technik die Bildung einer Hülle (Verfestigung von Flüssigkeit durch
    Algin und Calciumlactat), die Perlen entstehen lässt, so genannter „Fake-Kaviar“.\r\n\r\n**Spherical
    ice (engl.)**\r\nGroße Eiskugeln mit kugelförmigen Eisformen produziert. Aufgrund
    geringer Oberfläche ist die Schmelzeigenschaft reduziert.\r\n\r\n**Spiced (engl.)**\r\nGewürzt,
    die Spirituose wird mittels Gewürzen abgerundet.\r\n\r\n**Spirituose (lat. Ursprung)**\r\nOft
    als Schnaps in der Umgangsprache bezeichnet ist eine Flüssigkeit für den Genuss.
    Nach aktuellem EU-Recht Alkoholgehalt von mindestens 15 Vol.-%, bei Eierlikör
    reichen 14 Vol.-%. Früher war die Bezeichnung Branntwein üblich, die noch heute
    in einigen Gesetzen verwendet wird. Die Gewinnung des Alkohols erfolgt durch Brennen
    [[post:Hza7iHRz|(Destillation)]] pflanzlicher Erzeugnisse.\r\n\r\n**Splash (engl.)**\r\nKleine
    Menge, siehe Spritzer\r\n\r\n**Split (engl.)**\r\nAmerikanisches Maß entspricht
    6 pony. Siehe auch unter [[post:JGU7ljnS|<u>\"Barmaße\"</u>]] in den Tipps für
    den Barneuling.\r\n\r\n**Spontangärung**\r\nAlkoholische Gärung verursacht durch
    natürlich in der Luft vorkommende Hefepilze, also ohne Zusatz von gezüchteten
    Hefekulturen.\r\n\r\n**Spritzer**\r\nUngefähre Menge, entspricht einem kurzen
    Ausgiessen aus der Flasche, ca. 1–2 cl.\r\n\r\n**Spumante (ital.)**\r\nItalienischer
    Schaumwein mit früher üblichen Flaschengärung. Weiteres unter Leichte Alkohole,
    Stichwort [[post:LCsqyzy7|<u>Schaumwein</u>]].\r\n\r\n**Squeeze (engl.)**\r\nAusgedrücktes
    Zitrusachtel, welches hiernach dem Drink zugefügt wird.\r\n\r\n**Squeezer (engl.)**\r\nSiehe
    [[post:KfWCTgw9|<u>Fruchtpresse</u>]]\r\n\r\n**Stick (engl.)**\r\nSiehe [[post:Zr3AN86u|<u>Cocktailstäbchen</u>]]\r\n\r\n**Stir
    (engl.)**\r\nUmrühren \r\n\r\n**Stirrer (engl.)**\r\nStab zum Getränke verrühren
    aus Kunststoff, Glas, Holz, Metall.\r\n\r\n**Stößel**\r\nZum Pressen von Früchten
    wie Limetten im Caipirinha, oder Minze im Mojito.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:163}}/muddler.jpeg
    \"small\")\r\n\r\n**Stoppel**\r\nÖsterreichisch für [[post:HG4n9d6i|<u>Korken</u>]]\r\n\r\n**Straight
    (engl.)**\r\nBezeichnet vor allem Bourbon-Whiskeys, die eine Lagerung in neuen,
    geflämmten Eichenfässern von mindestens zwei Jahren erdulden mussten.\r\n\r\n**Straight
    up (engl.)**\r\nOhne Eis servieren; unmissverständlicher nur „up“. Weiterführendes
    hierzu siehe [[post:jFpQMycp|<u>„neat“.</u>]]\r\n\r\n**Strain (engl.)**\r\nAbsieben,
    abseihen\r\n\r\n**Strainer (engl.)**\r\nSiehe [[post:zfI9J50o|<u>Barsieb</u>]]\r\n\r\n**Stravecchio
    (ital.)**\r\nItalienische Bezeichnung für lange Lagerung, sehr alt.\r\n\r\n**Straw
    (engl.)**\r\nTrinkhalm aus Kunststoff, Stroh, auch Edelstahl, in verschiedenen
    Längen, Farben und Durchmessern. \r\n\r\n**Sugar edge (engl.)** \r\nSiehe [[post:Zr3AN86u|<u>Crusta</u>]]\r\n\r\n**Swedish
    Punch (engl.)**\r\nZusammensetzung aus Batavia Arrack, Tee, Zitrus, Gewürze, Zucker,
    Wasser.\r\n\r\n**Swizzle (engl.)**\r\nAlte Getränkekategorie ursprünglich aus
    Rum mit Honig oder Melassesirup bestehend. Zusammengestellt aus einer starken
    Spirituose, Zitrusfrüchten, Zucker oder Likör und Bitters. Möglichst im Collinsglas,
    gefüllt mit crushed ice und einem Swizzlestick gerührt, serviert.\r\n\r\n**Swizzle
    stick (engl.)**\r\nKleiner Quirl / Stab, ursprünglich aus dem Holz des Swizzlestick-Tree
    um Getränke mit crushed ice zu mischen, oder Kohlensäure entfernen.\r\n![Swizzle
    Stick](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:207}}/Swizzlestick.jpg
    \"small\")\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]\r\n"
  :body_bbcode: "[IMG]https://image.jimcdn.com/app/cms/image/transf/none/path/s34ef2c3ad959eb14/image/i7ed8585912bf5891/version/1554118384/s.jpg[/IMG][color=#fefefe]S[/color]\r\n\r\n[b]SA
    (franz.)[/b]\r\nAbkürzung für sans année; ohne Jahr, bezeichnet in der Champagnerherstellung
    einen Verschnitt verschiedener Jahrgänge. \r\n\r\n[b]Sabrieren[/b]\r\nUrsprung
    Sabrage; das Öffnen der Champagnerflasche mittels eines Säbels, indem die Verdickung
    des Halses abgeschlagen wird.\r\n\r\n[b]Sack[/b]\r\nSeit dem 16. Jahrhundert benutzte
    Bezeichnung mit unklarer Herkunft. Wird für einen gespriteten Wein von den Kanaren,
    oder aus Spanien verwandt. Gilt als Synonym für Sherry, doch ebenfalls Weine anderer
    Herkunft tragen diesen Zusatz.\r\n\r\n[b]Sake (jap.)[/b]\r\nReiswein, siehe auch
    unter [post=RUIy8WjI][u]Leichte Alkohole II[/u][/post] in unseren Tipps für den
    Barneuling.\r\n\r\n[b]Salmanazar (Ursprung sumer.?)[/b]\r\nFlaschengröße für Champagner
    mit einem Fassungsvermögen von 9 Litern.\r\n\r\n[b]Salt edge / salt rim (engl.)[/b]\r\nSalz
    am Glasrand, im Gegensatz zum Crusta-Rand.\r\n\r\n[b]Sambuca (ital.)[/b]\r\nAlkoholreicher
    italienischer Digestif-Likör mit Anis aromatisiert.\r\n\r\n[b]Sangaree (Ursprung
    span.)[/b]\r\nAlte Getränkekategorie, die nach dem spanischen Wort für Blut (Sangre)
    aufgrund der Farbe benannt wurde. Bestehend aus Rot-, oder Portwein, einer weiteren
    hochprozentigen Spirituose, Lkör, oder Zucker, ungekühlt, oder auf Eis im Collinsglas
    serviert, mit Muskat abgerundet. \r\n\r\n[b]Sankt Bernhard[/b]\r\nSiehe unter
    [post=zfI9J50o]Bernhard von Clairvaux[/post].\r\n\r\n[b]Sauser[/b]\r\nTeilvergorener
    Traubenmost. Siehe auch [post=KfWCTgw9][u]Federweißer[/u][/post].\r\n\r\n[b]Scaffa
    (engl.)[/b]\r\nAlte Getränkekategorie bestehend aus hochprozentiger Spirituose,
    Likör und Bitters, in einer Schale bei Zimmertemperatur serviert. \r\n\r\n[b]Schirmchen,
    Wedel[/b]\r\nMöglichst nur auf einem Eisbecher verwenden. Es sei denn, man gibt
    eine 50er Jahre Party.\r\n\r\n[b]Schlempe[/b]\r\nDie Rückstände nach einer Destillation;
    der Abfall.\r\n\r\n[b]Schmand/Schmant[/b]\r\nBezeichnet die Rückstände nach einer
    langen Lagerung bei Flaschen zwischen der Kapsel und dem Korken. Ratsam deswegen,
    vor Entfernung des Korken, diesen und den Flaschenrand gut mittels Tuch reinigen.\r\n\r\n[b]Schnaps[/b]\r\nUmgangssprachliche
    Bezeichnung für Spirituose, deren Alkoholkonzentration einen Mindestwert von 15%
    Vol. nach EU-Recht aufweisen muss (Ausnahme Eierlikör 14%).\r\n\r\n[i]\"Wird ein
    Gauner vom Schnapstod mal getroffen, so sagt man, er hat sich tot gesoffen. Jedoch
    bei den guten Alten sagt man, der Schnaps hat sie erhalten.\" Unbekannt[/i]\r\n\r\n[b]Schneidbrett[/b]\r\nStabile
    Unterlage zum Früchte schneiden. Kleiner Tipp, damit das Brett nicht rutscht,
    ein angefeuchtetes Küchentuch unterlegen.\r\n\r\n[b]Schorle[/b]\r\nGetränk aus
    Wein mit Mineral-, oder Sodawasser.\r\n\r\n[b]Scotch[/b]\r\nWhisky aus Schottland.
    Siehe auch [post=LSbjcA1e][u]Whisky/Whiskey[/u][/post].\r\n\r\n[b]Screw (engl.)[/b]\r\nAlte
    Getränkekategorie bestehend aus einer klaren Spirituose und Orangensaft. Im Gästeglas
    gerührt und auf Eiswürfeln im Collinsglas serviert.\r\n\r\n[b]Screw cap (engl.)[/b]\r\nDrehverschluss
    an Flaschen\r\n\r\n[b]Sec (franz.), secco (ital.), seco (span., port.)[/b]\r\nSteht
    für trocken. Bedeutet in der Schaumweinherstellung ein Restzucker von 17 - 35
    g/l.\r\n\r\n[b]Sektflaschenverschluss[/b]\r\nZum Verschließen angefangener Sekt-
    und Champagnerflaschen. \r\n\r\n[b]Shaker (engl.)[/b]\r\nBecher zum Schütteln
    und Vermengen der Zutaten, siehe [post=Td3hzyZf][u]Tipps für den Barneuling[/u][/post]
    auch unter [post=zfI9J50o][u]Boston-Shaker[/u][/post] und Speed-Shaker.\r\n\r\n[b]Sherry
    (maur. Ursprung)[/b]\r\nAperitif-Wein dessen Alkoholgehalt angehoben wurde. Siehe
    hierzu unter [post=LCsqyzy7][u]Weinaperitife / Sherry[/u][/post].\r\n\r\n[b]Shōchū
    (japan.)[/b]\r\nBranntwein wird aus verschiedenen Grundprodukten hergestellt,
    z. B. Reis, Süßkartoffel, Zuckerrohr, Sesam u. a.. Vielfach mit einem alkoholischen
    Anteil von 25%, doch ebenfalls über 40% möglich.\r\n\r\n[b]Shooter (engl.)[/b]\r\nSiehe
    unter [post=94rZApCd][u]Bezeichnung der Getränke[/u][/post] in den Tipps für den
    Barneuling.\r\n\r\n[b]Shortdrink (engl.)[/b]\r\nKleines Getränk mit üblichen ca.
    7 cl Volumen , Gegensatz zum Longdrink.\r\n\r\n[b]Shot (engl.)[/b]\r\nAmerikanisches
    Barmaß, entspricht einem Jigger. Siehe unter [post=JGU7ljnS][u]\"Barmaße\"[/u][/post]
    in den Tipps für den Barneuling.\r\n\r\n[b]Shrub (arab. Ursprung)[/b]\r\nAlte
    Getränkekategorie üblicherweise bestehend aus Früchten, Spirituose, Zucker, evtl.
    Essig. Die Mischung wird einige Wochen maszeriert, anschließend oft heiß, aber
    auch auf Eis serviert. \r\n\r\n[b]Sidra (span.)[/b]\r\nSiehe unter [post=TizOWyNh][u]Apfelwein[/u][/post].\r\n\r\n[b]Sifone
    (ital.)[/b]\r\nVerfahren bei Herstellung des Marsala siehe unter [post=EVAyIWVC][u]Mistela
    / Mistel / Mistelle[/u][/post]\r\n\r\n[b]Simple syrup (engl.)[/b]\r\nLäuterzucker
    im Verhältnis 1 Teil Zucker auf 1 Teil Wasser.\r\n\r\n[b]Singani (boliv.)[/b]\r\nBolivianischer
    Weinbrand der Rebe  Muscat d’Alexandrie mit kontrollierter Herkunftsbezeichnung,
    einem Pisco ähnlich. Drei zugelassene Qualitätsstufen, Singani de Altura / Gran
    Singani, Singani 1. Wahl, Singani 2. Wahl erhältlich. [post=JGU7ljnS][u]Weitere
    Info über Weinbrände[/u][/post] unter Weinbeerendestillate in den Tipps für den
    Barneuling.\r\n\r\n[b]Single Malt (engl.)[/b]\r\nSiehe [post=EVAyIWVC][u]Malt[/u][/post]\r\n\r\n[b]Siphon[/b]\r\nZapfflasche
    um aus Wasser, unter Zugabe von NaHCO³ und CO², Soda herzustellen und dosiert
    ins Glas abzugeben.\r\n\r\n[b]Sirop de Canne (franz.), cane syrup (engl.)[/b]\r\nRohrzuckersirup,
    im Gegensatz zum Läuterzucker leicht bräunliche Farbe.\r\n\r\n[b]Sirop de Gomme
    (franz.)[/b]\r\nSiehe [post=RBQLgPHt][u]Gomme Syrup[/u][/post]\r\n\r\n[b]Sling
    (engl.)[/b]\r\nSiehe unter [post=94rZApCd][u]Bezeichnung der Getränke[/u][/post]
    in den Tipps für den Barneuling.\r\n\r\n[b]Slivovic (serb.), Slibowitz (böhm.),
    Sliwowitz (slaw. Ursprung)[/b]\r\nPflaumen-Obstbrand\r\n\r\n[b]Sloe (engl.)[/b]\r\nSchlehe
    (prunus spinosa), Beeren des Schlehenbaumes werden gern zur Mazeration in Gin
    eingelegt. Anschließend mit Zucker zu einem Likör verarbeitet, oft fälschlicher
    Weise als Sloe-Gin bezeichnet.\r\n\r\n[b]Smash (engl.)[/b]\r\nSiehe unter [post=94rZApCd][u]Bezeichnung
    der Getränke[/u][/post] in den Tipps für den Barneuling.\r\n\r\n[b]Smoked Cocktail
    (engl.)[/b]\r\nCocktail versehen mit Raucharomen. Wird erreicht durch Abbrennen
    von Gewürzen, Tee, Holzchips usw. mit Auffangen des Rauches, welchen man bestenfalls
    durch die Flüssigkeit des Cocktails leitet.\r\n\r\n[b]Snack (engl.)[/b]\r\nKleiner
    Happen zwischen den Cocktails, einfach ein Muss. \r\n\r\n[b]Snifter (engl.)[/b]\r\nElegantes
    Nosingglas mit Stiel für Whisky-, Rumtastings und andere. Weitere Glastypen siehe
    unter [post=Td3hzyZf][u]Gläser[/u][/post] unserer Tipps für den Barneuling.\r\n\r\n[b]Sodasiphon[/b]\r\nSiehe
    Siphon, erhältlich auch als Espumasiphon.\r\n\r\n[b]Sodawasser[/b]\r\nMit Kohlenstoffdioxid
    und Natriumhydrogencarbonat angereichertes Wasser, auch kurz Soda genannt. Die
    Regelungen unterscheiden sich in den Ländern. In Deutschland muss das Wasser mindestens
    570 mg pro Liter Natriumhydrogencarbonat plus Kohlensäure enthalten. Ein Tafelwasser
    nur mit CO² reicht nicht für diese Bezeichnung.\r\n\r\n[b]Solera (span.)[/b]\r\nTraditionell,
    Begriff bei der Herstellung von Rum, Wein, Cognac, Sherry u. a., bezeichnet das
    kontinuierliche Nachfüllen der Fässer aus der nächst jüngeren Generation. Siehe
    hierzu [post=6B70hcZ6][u]Rum/Ron/Rhum dunkel[/u][/post] unserer Tipps.\r\n\r\n[b]Sotol
    (mex.)[/b]\r\nMexikanischer Brand der nicht aus Agaven sondern aus Dasylirien
    hergestellt wird. diese Pflanzen ähneln der Agave im Aussehen und die Brenntechnik
    ist dem Mezcal gleich. Der Sotol kommt aus den mexikanischen Gebieten Chihuahua,
    Coahulia und Durango und geniesst regionalen Schutz. \r\n\r\n[b]Sour[/b]\r\nSiehe
    unter [post=94rZApCd][u]Bezeichnung der Getränke[/u][/post] in den Tipps für den
    Barneuling.\r\n\r\n[b]Sparkling Wine (engl.)[/b]\r\nSteht im englischsprachigen
    Raum für Sekt. Weitere Bezeichnungen und Erläuterungen siehe unter [post=LCsqyzy7][u]Leichte
    Alkohole / Schaumwein[/u][/post].\r\n\r\n[b]Sparschäler[/b]\r\nFrüchte auf schonender
    Art von der Schale befreien, um größere Zesten zu schneiden.\r\n\r\n[b]Speedrack
    (engl.)[/b]\r\nFlaschenhalter für den Bereich unterhalb des Tresens.\r\n\r\n[b]Speedshaker
    (engl.)[/b]\r\nEinfacher, aus einem Teil bestehender, Metallbecher, bei dem die
    zweite Hälfte das Gästeglas bildet.\r\n\r\n[b]Sphärisierung[/b]\r\nIn der Molekular-Technik
    die Bildung einer Hülle (Verfestigung von Flüssigkeit durch Algin und Calciumlactat),
    die Perlen entstehen lässt, so genannter „Fake-Kaviar“.\r\n\r\n[b]Spherical ice
    (engl.)[/b]\r\nGroße Eiskugeln mit kugelförmigen Eisformen produziert. Aufgrund
    geringer Oberfläche ist die Schmelzeigenschaft reduziert.\r\n\r\n[b]Spiced (engl.)[/b]\r\nGewürzt,
    die Spirituose wird mittels Gewürzen abgerundet.\r\n\r\n[b]Split (engl.)[/b]\r\nAmerikanisches
    Maß entspricht 6 pony. Siehe auch unter [post=JGU7ljnS][u]\"Barmaße\"[/u][/post]
    in den Tipps für den Barneuling.\r\n\r\n[b]Spontangärung[/b]\r\nAlkoholische Gärung
    verursacht durch natürlich in der Luft vorkommende Hefepilze, also ohne Zusatz
    von gezüchteten Hefekulturen.\r\n\r\n[b]Spumante (ital.)[/b]\r\nItalienischer
    Schaumwein mit früher üblichen Flaschengärung. Weiteres unter Leichte Alkohole,
    Stichwort [post=LCsqyzy7][u]Schaumwein[/u][/post].\r\n\r\n[b]Squeeze (engl.)[/b]\r\nAusgedrücktes
    Zitrusachtel, welches hiernach dem Drink zugefügt wird.\r\n\r\n[b]Squeezer (engl.)[/b]\r\nSiehe
    [post=KfWCTgw9][u]Fruchtpresse[/u][/post]\r\n\r\n[b]Stick (engl.)[/b]\r\nSiehe
    [post=Zr3AN86u][u]Cocktailstäbchen[/u][/post]\r\n\r\n[b]Stir (engl.)[/b]\r\nUmrühren
    \r\n\r\n[b]Stirrer (engl.)[/b]\r\nStab zum Getränke verrühren aus Kunststoff,
    Glas, Holz, Metall.\r\n\r\n[b]Stößel[/b]\r\nZum Pressen von Früchten wie Limetten
    im Caipirinha, oder Minze im Mojito.\r\n\r\n[b]Stoppel[/b]\r\nÖsterreichisch für
    [post=HG4n9d6i][u]Korken[/u][/post]\r\n\r\n[b]Straight (engl.)[/b]\r\nBezeichnet
    vor allem Bourbon-Whiskeys, die eine Lagerung in neuen, geflämmten Eichenfässern
    von mindestens zwei Jahren erdulden mussten.\r\n\r\n[b]Straight up (engl.)[/b]\r\nOhne
    Eis servieren; unmissverständlicher nur „up“. Weiterführendes hierzu siehe [post=jFpQMycp][u]„neat“.[/u][/post]\r\n\r\n[b]Strain
    (engl.)[/b]\r\nAbsieben, abseihen\r\n\r\n[b]Strainer (engl.)[/b]\r\nSiehe [post=zfI9J50o][u]Barsieb[/u][/post]\r\n\r\n[b]Stravecchio
    (ital.)[/b]\r\nItalienische Bezeichnung für lange Lagerung, sehr alt.\r\n\r\n[b]Straw
    (engl.)[/b]\r\nTrinkhalm aus Kunststoff, Stroh, auch Edelstahl, in verschiedenen
    Längen, Farben und Durchmessern. \r\n\r\n[b]Sugar edge (engl.)[/b] \r\nSiehe [post=Zr3AN86u][u]Crusta[/u][/post]\r\n\r\n[b]Swedish
    Punch (engl.)[/b]\r\nZusammensetzung aus Batavia Arrack, Tee, Zitrus, Gewürze,
    Zucker, Wasser.\r\n\r\n[b]Swizzle (engl.)[/b]\r\nAlte Getränkekategorie ursprünglich
    aus Rum mit Honig oder Melassesirup bestehend. Zusammengestellt aus einer starken
    Spirituose, Zitrusfrüchten, Zucker oder Likör und Bitters. Möglichst im Collinsglas,
    gefüllt mit crushed ice und einem Swizzlestick gerührt, serviert.\r\n\r\n[b]Swizzle
    stick (engl.)[/b]\r\nKleiner Quirl / Stab, ursprünglich aus dem Holz des Swizzlestick-Tree
    um Getränke mit crushed ice zu mischen, oder Kohlensäure entfernen.\r\n\r\n\r\n[post=AujmVOOB][u]oben[/u][/post]\r\n"
