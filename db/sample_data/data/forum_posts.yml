  :body: "**Cachaça**\r\n\r\nCachaça ist ein in Brasilien hergestelltes Destillat
    aus frischem kalt gepresstem Zuckerrohrsaft mit einem Alkoholgehalt zwischen 38%
    und 48%. Somit könnte man in Cachaça auch den kleinen brasilianischen Bruder des
    Rhum Agricole sehen oder besser die kleine Schwester, denn im portugiesischen
    ist Cachaça weiblich.\r\n\r\n![Zuckerrohr gebündelt](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:104}}/grafik.png
    \"small\") Gebündeltes Zuckerrohr vor der Weiterverarbeitung\r\n\r\nEs gibt ihn
    sowohl als Prata, also ungelagerten, als auch in einer gelagerten Version. Wie
    bei allen Spirituosen wird er durch die Fasslagerung weicher und nimmt Holzaromen
    auf. Er sollte aber nicht zu lange im Fass ruhen, damit nicht zu viele Aromen
    des frischen Zuckerrohrs verloren gehen, bzw. vom Holz übrertönt werden.\r\n\r\nTraditionell
    hergestellter Cachaça wird mit dem Zusatz Artesanal versehen.\r\nIn Cocktailrezepten
    wird nicht zwischen den Lagervarianten unterschieden, weswegen wir beide hier
    auch nur in der Zusammenfassung behandeln.\r\n\r\nGute Einstiegscachaças sind
    im Verhältnis zu anderen Spirituosen relativ günstig zu bekommen:\r\n-*Velho Barreiro
    Silver / Gold\r\n-Delicana Silver / Gold / Premium\r\n-Birds\r\n-Nega Fulo\r\n-CanaRio\r\n-Magnifica
    Tradicional*\r\n\r\nauch hier wieder etwas für den dickeren Geldbeutel:\r\n-*Ypioca
    Special Reserve 150\r\n-Refazenda Alambique Gold\r\n-Leblon\r\n-Armazem Vieira
    Safira*\r\n\r\nBekannte Cocktails mit Cachaça:\r\n[[recipe:batida-de-ananas]]\r\n[[recipe:caipirinha]]\r\n[[recipe:from-rio-to-padua]]\r\n[[recipe:tradicional-caipirinha]]\r\n\r\n*SchSt*\r\n\r\n\r\n[[post:JGU7ljnS|oben]]"
