  :body: "**[[wiki:absinth|Absinth]]**\r\n\r\nWie auch Bitters wird Absinth in der
    Regel tröpfchenweise zum Verfeinern in Cocktails eingesetzt. Er basiert vor allem
    auf Anis, Fenchel und Wermutkraut, erhält aber darüber hinaus noch eine Menge
    anderer Kräuter. In Cocktails sollte Absinth sehr vorsichtig eingesetzt werden,
    da er im Gegensatz zu Bitters eine noch intensivere Wirkung entfalten kann. In
    nicht wenigen Rezepten ist die genaue Anzahl der zu verwendenden Tropfen angegeben.
    Der Alkoholgehalt des Absinth liegt zwischen 45-80%.\r\n\r\nAbsinth hatte über
    eine lange Zeit einen berüchtigten Ruf. Nachdem es im 19. und zu Beginn des 20.
    Jahrhundert immer populärer wurde, verbreitete sich die (falsche) Einschätzung
    einer grundsätzlich gesundheitsgefährdeten Wirkung des Wirkstoffes Thujon, der
    im Wermutkraut enthalten ist. Die verheerende Wirkung muss jedoch – wie man heute
    weiß – eher auf übermäßigen Konsum und minderwertige Qualität, als auf das Thujon
    zurückgeführt werden. Thujon entfaltet erst ab einer bestimmten Menge eine gesundheitsschädliche
    Wirkung. Aus diesem Grund ist der im Absinth enthaltene Thujongehalt in der EU
    reglementiert und darf nicht mehr als 35mg/kg betragen. Dieser Wert liegt jedoch
    noch deutlich unter einem gesundheitsschädigenden Wert. Die negativen Wirkungen
    des Absinths sind somit eher auf seinen hohen Alkoholgehalt, als auf seine Inhaltsstoffe
    zurückzuführen. Bis sich diese Erkenntnis durchsetzte verstrich jedoch eine Menge
    Zeit und so wurde Absinth in Deutschland erst im Jahre 1991 wieder legalisiert,
    in den USA gar erst im Jahre 2007. \r\n\r\nBeim Absinth lassen sich je nach Verwendung
    der Kräuter grob zwei geschmackliche Richtungen unterscheiden. Die erste Richtung
    zeichnet sich durch eine kräftige Anisnote aus und ist mit Pernod und Pastis verwandt.
    In Frankreich wird anisbetonter Absinth mit einem Stück Würfelzucker und kaltem
    Wasser besonders gerne getrunken. Bei der zweiten Richtung ist das Wermutkraut
    vorherrschend. Wer dem Anisgeschmack abgeneigt ist, aber dennoch mit Absinth mixen
    möchte, sollte diese Richtung ausprobieren.\r\n\r\nWie auch Bitters harmoniert
    Absinth in Cocktails hervorragend mit Gin, Whiskey, Cognac und Wermut. Darüber
    hinaus gibt es auch Rezepte, in denen das Gästeglas mit Absinth lediglich benetzt
    wird. Hierzu zählt etwa der [[recipe:sazerac]], oder auch [[recipe:corpse-reviver-2]].\r\n\r\nGute
    Absinthe sind leider eine teure Sache. Im Gegensatz zu Bitters werden sie meist
    in größeren Flaschen angeboten, welche 30€ selten unterschreiten. Einsteiger können
    sich jedoch auch erst einmal mit Pernod behelfen, einem wesentlich günstigeren
    Anislikör, der in einigen Rezepten statt Absinth eingesetzt werden kann.\r\n\r\nEmpfehlenswerter
    Absinth für den Einsteigerbarstock bis 20€/0,7l: \r\n- *Abysse Premium Absinthe
    60%*\r\n\r\n*F.B.*\r\n\r\n\r\n[[post:JGU7ljnS|oben]]"
