  :body: "###Agavendestillate\r\n\r\n**[[wiki:tequila|Tequila]]**\r\n\r\nTequila ist
    wohl die am häufigsten falsch eingestufte Spirituose, die es gibt. Auch finden
    sich immer wieder Vorurteile, die dieser tollen Spirituose einfach nicht gerecht
    werden.\r\n\r\nNein, Tequila ist kein Kaktusschnaps und nein, er wird auch nicht
    mit einem Wurm in der Flasche verkauft. Letzteres kommt bei seinen Mezcalgeschwistern
    zwar durchaus vor (allerdings auch nur bei den nicht so hochwertigen), dient aber
    entgegen anderslautender Aussagen nicht der Würze, sondern ist dort nur ein reiner
    Marketinggag. Außerdem ist es auch kein Wurm, sondern die Larve eines Falters,
    die in den Agaven lebt. In einem Tequila werdet Ihr jedoch nie eine solche Larve
    vorfinden. Auch ist er alkoholisch nicht stärker, als jede andere Spirituosenart
    auch und ebenso hat er auch keine anderen alkoholischen Wirkungen, als die anderen.
    Die Trinkstärke liegt in der Regel bei 40%.\r\n\r\nTequila ist technisch gesehen
    ein Mezcal, allerdings mit einigen Besonderheiten. Mezcal ist ein Destillat, welches
    aus Agaven ausschließlich in Mexiko hergestellt wird. Agaven gehören nicht zu
    den Kakteen, wie immer noch viele glauben, sondern zu den Sukkulenten. Wir wollen
    jetzt jedoch nicht zu weit ins Reich der Botanik abschweifen. Was unterscheidet
    nun Tequila von den anderen Mezcals?\r\n\r\nNun, in allererster Linie sind es
    erst mal die Agaven selbst. Tequila darf nur aus einer bestimmten Agavensorte
    hergestellt werden und zwar aus der \"Agave Tequilana Weber, var. blau\", oder
    kurz \"agave azul\". Soviel erst mal zur Kaktussaftlegende. Im Weiteren hebt sich
    auch der Verarbeitungsprozess maßgeblich von dem der Mezcals ab. So wird die Tequilaagave
    unter Dampfdruck gegart, während die Mezcalagave geröstet wird. Auch hier verzichten
    wir mal auf weitere Details.\r\n\r\n![Blaue Agaven-Plantage](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:103}}/grafik.png
    \"small\") Feld mit blauer Agave\r\n\r\nAußerdem entscheidet der Herkunftsort
    der Agaven darüber, ob aus ihnen Tequila hergestellt werden kann. Ähnlich wie
    beim Cognac sind der Tequilaagavenanbau und die Tequilaherstellung regional eng
    abgegrenzt. Ganze 5 Provinzen, alle in der südlichen Mitte Mexikos liegend, dürfen
    Tequila herstellen. Das Zentrum sind die Städte Tequila und Guadelajara in der
    Provinz Jalisco. Tequila darf nur maximal 49% Fremdzucker enthalten und muss somit
    zu mindestens 51% aus Agave Azul hergestellt sein.\r\n\r\n\r\n\r\nTequilas dieser
    Zusammensetzung bezeichnet man als Mixtos. Diese wurden erfunden um den Massenmarkt
    mit möglichst kostengünstiger Ware zu bedienen. Den Tequila mit dem roten Sombrero
    kennen sicher einige von Euch. Auch er gehört zu dieser Tequilakategorie. Diese
    Tequilas dürfen auch außerhalb Mexicos abgefüllt werden. Die Qualität der meisten
    Mixtos läßt oft zu wünschen übrig. Wirklich gute Tequilas erhält man nur mit Destillaten,
    die zu 100% aus Agavezuckern hergestellt wurden.\r\n\r\nDiese Qualität wird auf
    der Flasche in Formulierungen wie 100% de Agave, 100% Puro de Agave, 100% Agave
    Azul oder auch einfach nur 100% Agave angegeben. Fehlt dieser Hinweis, handelt
    es sich um einen Mixto. 100% Agave Tequila darf ausschließlich nur in Mexico abgefüllt
    werden. Außerdem findet Ihr weitere Kontrollsymbole in Form eines NOM-Etiketts
    (kennzeichnet die Destillerie in welcher der Tequila hergestellt wurde) und eine
    CRT-Etikett (garantiert, dass der Tequila während der gesamten Produktion behördlich
    kontrolliert wurde).\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:116}}/casamigos_2.jpg
    \"small\")\r\n\r\nFehlt eine dieser Markierungen oder wird Euch gar angeblicher
    100% Agave Tequila in einer abgefüllten Apothekerflasche angeboten, dann Hände
    weg davon. Im günstigsten Fall ist es ein Mixto, im schlechtesten Fall irgendwas
    Gepanschtes. In keinem Fall jedoch ein 100% Agave Tequila.\r\n\r\nTequilas werden
    jedoch nicht nur über ihren Agavengehalt klassifiziert, sondern auch über ihr
    Alter, was direkten Einfluß auf ihren Charakter hat. Die reinste Form des Agavengeschmacks
    findet sich bei Blanco-, Plata- oder Silvertequila. Wobei im Prinzip alle 3 Bezeichnungen
    das gleiche bedeuten. Diese Tequilas sind entweder direkt nach der Destillation
    abgefüllt oder nur sehr kurz gelagert (maximal 60 Tage). Dadurch sind es die authentischsten,
    für manchen Gaumen aber eben auch die schärfsten Tequilas. \r\n\r\nTequilas, welche
    länger als 60 Tage, jedoch weniger als 1 Jahr gelagert werden, bezeichnet man
    als Reposado. Sie sind durch die Lagerung in ihrem Auftritt deutlich weicher als
    ihre weißen Geschwister, bieten aber immer noch einen guten Agavegeschmack. Auch
    agavefremde Aromen aus den Fasshölzern finden sich im Geschmacksbild dieser Tequilas.\r\n\r\nDie
    dritte Form sind die gealterten Tequilas, genannt Anejo. Diese Tequilas werden
    bis zu 3 Jahren in Eichenfässern gelagert. Dabei nehmen die Destillate natürlich
    wesentlich mehr Holzaromen auf als bei der relativ kurzen Lagerzeit der Reposados.
    Bei einigen Anejo Tequilas ist die Balance leider aus dem Ruder gelaufen. Die
    Holznoten überwiegen und drängen den Agavegeschmack in den Hintergrund. Nur sehr
    gute Anejos meistern die Gratwanderung und bieten eine gute Balance zwischen Weichheit,
    Holz- und Agavearomen. Wer Tequila wirklich kennenlernen will, sollte nicht mit
    einem Anejo einsteigen.\r\n\r\nFür gewöhnlich dienen Anejos eher dem Purgenuss.
    Es ist allerdings durchaus möglich, eine ansprechende Margarita auch mit einem
    Anejo Tequila zuzubereiten. Einige Hersteller versuchten und versuchen sich an
    zusätzlichen Reifezyklen oder anderen Fasssorten und bedenken ihre so gealterten
    Destillate mit Bezeichnungen wie \"Muy Anejo\", \"Extra Anejo\", \"Barrique\",
    \"Selection Suprema\" und so weiter, um sie von den Anejos sprachlich abzuheben.
    Diese Bezeichnungen sind jedoch nicht durch die CRT standardisiert und werden
    praktisch wahlfrei eingesetzt. Es handelt sich bei diesen Destillaten also weiterhin
    um Tequila Anejo.\r\n\r\nMan sollte dabei auch folgendes bedenken. Tequilas profitieren
    im Gegensatz zu anderen gelagerten Destillaten, wie Cognac, Whisky und Rum, nicht
    von immer längeren Lagerzeiten. Insofern sollte man gut prüfen, ob man bereit
    ist die teils exorbitanten Preise dieser Super-Premium-Tequilas zu bezahlen.\r\n\r\nEine
    Kategorie fand bisher jedoch noch gar keine Erwähnung, die der sogenannten Joven
    oder Gold Tequilas. Das hat auch einen guten Grund. Mit dieser Bezeichnung werden
    nur Mixtos versehen, die keiner Lagerung, aber dafür einer Manipulation mit Zuckercouleur
    und/oder Holzspänen unterzogen wurden. Damit will man künstlich eine Weichheit
    generieren, ohne den Aufwand der Lagerung betrieben zu haben und somit dem Kunden
    quasi Reposadoqualität suggerieren. Für den wahren Tequilafreund stellen diese
    Tequilas jedoch keine wirkliche Option dar.\r\n\r\nZum Schluss noch eine Anmerkung.
    Es hat sich in der Vergangenheit immer wieder gezeigt, dass Tester Tequilarezepte
    als schlecht eingestuft haben, weil sie einfach zum falschen Tequila gegriffen
    haben. Wenn man erst mal den falschen hatte, fällt es schwer, noch einmal Geld
    für eine Spirituosengattung auszugeben, die scheinbar nicht lecker ist. Bitte
    tut Euch selbst einen Gefallen und versucht möglichst mit dem Herradura Plata
    die Welt der Tequilas zu betreten. Ich weiß, er kommt nicht mit dem Preis daher,
    den sich ein Einsteiger für eine Mixspirituose vorstellt oder erhofft. Aber erst
    wenn Ihr diesen Tequila probiert habt und Euch der Geschmack nicht überzeugt,
    bin ich bereit anzunehmen, daß Tequila nicht \"Eure\" Spirituose ist. Wenn Ihr
    aber Gefallen an ihm findet, dann werdet auch Ihr bald mit dem Tequilavirus infiziert
    sein und von da an werden sicher noch viele andere Tequilas den Weg in Euer Glas
    finden. Sicher auch noch preisintensivere als der Herradura. Empfehlungen dazu
    könnt Ihr jederzeit im Forum erhalten.\r\n\r\nEinsteigertequilas bis 20€ / 0,7Liter:\r\n-*Sauza
    Hornitos Blanco / Reposado\r\n-el Jimador Blanco / Reposado*\r\n\r\nbis 30€ /
    0,7Liter:\r\n-*Herradura Plata / Reposado\r\n-Milagro Silver / Reposado*\r\n\r\nMit
    den Sauza Hornitos Tequilas lassen sich sehr gut Cocktails mit starker Fruchtausprägung
    (besonders Zitrusfrüchte), aber trotzdem noch hohem Tequilagehalt zubereiten.
    Als Beispiel sei hier der [[recipe:tequila-sunrise]] genannt, in dem der Sauza
    Hornitos Reposado einen sehr guten Job macht, oder auch der [[recipe:guavia-civil]].\r\n\r\nDie
    el Jimador Tequilas eignen sich sehr gut für Rezepte mit etwas weniger starker
    Fruchtausprägung, aber sattem Agaveauftrag wie zum Beispiel die [[recipe:margarita]],
    auch deren zahllose Frucht- und Frozenversionen wie [[recipe:apfel-ingwer-margarita]].
    Aber auch Drinks, in denen Tequila nur eine Gastrolle zu spielen scheint, gelingen
    damit recht gut und der Tequila geht nicht unter. So zum Beispiel der [[recipe:el-manito]]
    oder auch der [[recipe:prince]].\r\n\r\nIn der etwas gehobeneren Preisklasse,
    sind die Herradura- und Milagro-Tequila echte Allrounder. Besonders universell
    jeweils der Herradura Plata und der Milagro Reposado. Mit ihnen gelingen die meisten
    Tequilarezepte.\r\n\r\n*SchSt*\r\n\r\n\r\n[[post:JGU7ljnS|oben]]"
