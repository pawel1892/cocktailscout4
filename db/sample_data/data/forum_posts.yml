  :body: "![Lexikon A](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:9}}/grafik.png)\r\n**Abseihen**\r\nVorsichtiges
    Abgießen eines Drinks durch ein Barsieb.\r\n\r\n**[[wiki:absinth|Absinth, Absinthe
    (franz.), Absynth, Absenta (span.)]]**\r\nHochprozentige Spirituose aus Wermut,
    Anis und Fenchel als Hauptbestandteile, auch „grüne Fee“ genannt. Wurde aufgrund
    des Thujongehaltes als abhängig machende Droge lange Zeit verboten. Weiterführendes
    siehe unter [[post:JGU7ljnS|<u>sonstige Destillate</u>]]. \r\n\r\n**Absinthe-Fontaine
    (franz.)**\r\nDekorativer Wasserspender in der Gastronomie, der gekühltes Wasser
    über mehrere kleine, fein einstellbare Hähne in das Getränk abgibt.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:122}}/Absinthefontaine.jpg
    \"small\")\r\n\r\n**Absinthlöffel**\r\nFür das Absinth-Zeremoniell hergestellter
    Löffel, der auf das Glas gelegt wird, um einen Zuckerwürfel aufzunehmen. Durch
    tröpfchenweiser Zugabe von gekühltem Wasser löst man den Würfel auf.  Klassisch
    wird Absinth zwar lediglich mit kaltem Wasser ergänzt, doch die Methode  den Zucker
    mit Absinth tränken und anzünden hatte ebenso viele Anhänger.\r\n\r\n**[[wiki:mocktail-1|AF-Cocktail]]**
    \r\nZusammenstellung an Zutaten die keinen Alkohol enthalten. Oft alkoholhaltige
    Cocktails nachahmend, namensgleich mit dem Zusatz virgin (jungfräulich). \r\n\r\n**After-Dinner-Cocktail
    (engl.)**\r\nDrink für die Zeit nach dem Essen, auch Digestif.\r\n\r\n**Agraffe
    (franz.)**\r\nDer Drahtkorb, der den Korken einer Schaumweinflasche festhält.
    Auch als Muselet (franz.) bezeichnet.\r\n\r\n**Agrest**\r\nAlte Bezeichnung des
    [[post:JxuXJV3j|<u>Verjus</u>]].\r\n\r\n**[[wiki:rum|Agricole (lat. Ursprung)]]**\r\nLandwirtschaftlich,
    bäuerlich, siehe unter [[post:AEiAj1OF|<u>Rum/Ron/Rhum weiß</u>]].\r\n\r\n**Aguardientes
    de Orujo (span.)**\r\nGekürzt nur Orujo genannt, ein spanischer, in Galizien beheimateter
    [[post:B1ePZzoq|Tresterbrand]], findet seinen Ursprung in Klöstern seit dem 17.
    Jahrhundert. Nach zweijähriger Reifung im Eicheholzfass darf er sich Orujo envejecido
    nennen. Jeden Ostersonntag wird die Fiesta de Aguardiente in Portomarín, mit einer
    Brennveranstaltung und Wahl des besten Destillateurs, gefeiert.\r\n\r\n**Alambic
    (arab., griech. Ursprung)**\r\nAuch Alembic, Alambique, diverse Schreibweisen
    für den Destillierhelm der Destillierapparatur. Das ursprüngliche Instrument zur
    Herstellung von Destillaten. Die flüchtigen Stoffe werden während der Destillation
    aus der Brennblase in diesem Brennhut gefangen und durch den Schwanenhals  in
    ein separates, tiefer liegendes Gefäß gekühlt abgeleitet. \r\n\r\n**Alkohol (aram.,
    arab. Ursprung)**\r\nC2H50H, ein von Paracelsus geprägter Begriff, der etwas Besonderes,
    Feines bedeuten sollte. Entstehung durch Fermentation von Zucker. Umgangssprachlich
    für Ethanol, auch Äthylalkohol, kann bis zu einer Konzentration von 97,2 % vol
    gebracht werden.\r\n\r\n*\"Der Alkohol ist ein Gift. Das haben die Physiologen
    bewiesen. Aber gegen den Alkohol ist damit gar nichts bewiesen, denn ein Gift
    kann immer noch eine Medizin sein.\" (Egon Friedell, 1878 - 1938)*\r\n\r\n**Allasch
    (livl. Ursprung)**\r\nDeutscher, hochprozentiger Likör aus Kümmelbrand, besitzt
    ein ausgeprägtes Kümmelaroma.\r\n\r\n**Almond milk (engl.)**\r\nMandelmilch wird
    u. a. zur Herstellung von Orgeat benötigt.\r\n\r\n**Almond syrup (engl.)**\r\nMandelsirup,
    siehe [[post:FaSGbacs|<u>Orgeat</u>]]\r\n\r\n**Amaretto (ital. Ursprung)**\r\nLikör
    aus Mazeration teilweise von Mandelschalen, Aprikosenkernöl und einigen anderen
    Rohprodukten und Herstellungsmethoden. An Marzipan erinnernder Geschmack diesen
    Likören gleich.\r\n\r\n**Amari (ital.)**\r\nOberbegriff für italienische Bitterspirituosen,
    plural von Amaro.\r\n\r\n**Amaro (ital.)**\r\nBedeutung bitter; Italienisches
    Bitterspirituose mit Kräutercharakter. Traditionell als Digestif getrunken. Amari
    Pluralform.\r\n\r\n**Añejo (span.)**\r\nEine von fünf Alterungskategorien beim
    Mezcal. Entspricht einer Lagerung im Eichenholzfass von einem bis drei Jahre.
    Weiterführendes siehe unter [[post:1X6UGsPe|<u>Tequila</u>]].\r\n\r\n**Angles
    share (engl.)**\r\nEin Schluck für die Engel, bezeichnet bei der [[post:LSbjcA1e|Whisky-Herstellung]]
    den Verlust durch Verdunstung aus einem Fass während der Lagerung. Teilweise ebenso
    im Weinbau verwendet. Typischerweise 2–3 % pro Jahr. Auch als Part des Anges (franz.)
    bezeichnet.\r\n\r\n**[[wiki:bitters|Angostura (venez.-span.)]]**\r\n[[post:zfI9J50o|Cocktailbitter]]
    benannt nach der früher gleichnamigen Stadt in Venezuela. Das Rezept des Bitters
    aus dem Jahre 1824 stammt von dem deutschen Arzt Siegert.\r\n\r\n**Anisados (span.)**\r\nSpanische
    Spirituose mit Anis aromatisiert.\r\n\r\n**Anisée (franz.)**\r\nEine Gruppe an
    Spirituosen, die mit Anis aromatisiert wurden (Pastis, Ouzo u. a.).\r\n\r\n**Anisette
    (franz.)**\r\nAnislikör\r\n\r\n**Anker**\r\nAltes europäisches Hohlmaß, zuweilen
    auch Fassgröße mit unterschiedlicher Volumina, von ca. 35 bis ca. 43 Liter, aber
    auch bis ca. 68 Liter.\r\n\r\n**[[wiki:kraeuter-und-botanicals|Anklatschen]]**\r\nEine
    vielfach geübte Praxis in Bars, Kräuter mit den Handflächen anklatschen. Soll
    durch brechen der Pflanzenstrukturen die Aromen des jeweiligen Krautes freisetzen,
    was auch gelingt. Die ätherischen Öle verteilen sich in den Handflächen und verflüchtigen
    im Raum, sind allerdings verloren für den jeweiligen Cocktail. Bessere Lösung,
    die Kräuter mit Barlöffel, oder Stößel im Gästeglas sanft andrücken. Es sei denn,
    man möchte diese Duftwolke in der Umgebung.\r\n\r\n**Aperitif (franz.)**\r\nDrink
    für die Zeit vor dem Essen als Appetitanreger, auch Before-Dinner-Cocktail. Typische
    Aperitifs: [[wiki:vermouth|Vermouth]], Campari, Sherry, Champagner oder Aperitif-Cocktails.\r\n\r\n**Apfelwein**\r\nAuch
    Cider (engl.), Cidre (franz.) genannt. Sehr altes, schon biblisch erwähntes, aus
    Äpfeln gepresstes, säuerliches Getränk mit einem alkoholischen Anteil von 5,5
    - 6,5 %.\r\n\r\n**Apple Cider (engl.)**\r\nSiehe oben, auch unter [[post:Zr3AN86u|<u>Cider,
    Cidre</u>]]\r\n\r\n**Applejack (engl.)**\r\nSpirituose zumeist aus Cider, deren
    Alkoholkonzentration früher durch frosten und abschöpfen der Wasserbestandteile
    erfolgte.\r\n\r\n**Aquavit (lat.), Akvavit**\r\nSpirituose unter Verwendung von
    Kümmel, Dillsaat. Aqua vitae, Wasser des Lebens seit dem Mittelalter bekannter,
    ursprünglich aus Skandinavien stammender Brand.\r\n\r\n**Arak (arab.)**\r\nArabische
    Spirituose mit Anis aromatisiert. Nicht zu verwechseln mit Arrak, Arrack; siehe
    dort.\r\n\r\n**Aräometer**\r\nAlkoholmeter, Alkoholbestimmungsinstrument. Mit
    dieser Alkoholspindel ermittelt man, vorzugsweise bei 20° Grad Raumtemperatur,
    den alkoholischen Anteil in Volumenprozent. Zuckerreiche Flüssigkeiten, wie Likör,
    Wein u. a., können hiermit allerdings nicht bestimmt werden. \r\n\r\n**[[wiki:brandy-cognac-und-armagnac|Armagnac
    (franz.)]]**\r\nSiehe unter [[post:JGU7ljnS|<u>\"Weinbeerendestillate\"</u>]]
    in den Tipps für den Barneuling.\r\n\r\n**Arrack, Arrak (franz. Ursprung)**\r\nSpirituose
    aus Palmsaft, oder Reis und Zuckerrohr. Produktion findet weitestgehend im südostasiatischen
    Raum statt. Geschmacklich zwischen Rum und Whiskey einzuordnen.\r\n\r\n**Artisanal
    (franz. Ursprung)**\r\nHand gefertigt, der Ausdruck wird besonders bei der [[post:WhgoLNNc|Rum-Herstellung]]
    angewandt.\r\n\r\n**Assemblage (franz.)**\r\nEin Verschnitt von Weinen verschiedener
    Jahrgänge. Besonders in der Schaumweinherstellung beliebt.\r\n\r\n**Aufgesetzter**\r\nRheinländisch-westfälische,
    hausgemachte Spirituose aus Korn mit schwarzen Johannisbeeren. Entweder werden
    die ganzen Früchte, oder lediglich der Saft der Beeren verwandt. \r\n\r\n**Ausgießer**\r\nFlaschen-Stopfen
    mit tüllenförmiger Öffnung zur besseren Dosierung der Flüssigkeiten, auch Pourer
    (engl.) genannt.\r\n![Ausgießer](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:182}}/Ausgie%C3%9Fer.jpg
    \"small\")\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]"
  :body_bbcode: "[img]https://image.jimcdn.com/app/cms/image/transf/none/path/s34ef2c3ad959eb14/image/ia6862209651fe783/version/1554043863/a.jpg[/img][color=#fefefe]A[/color]\r\n\r\n[b]Abseihen[/b]\r\nVorsichtiges
    Abgießen eines Drinks durch ein Barsieb.\r\n\r\n[b]Absinth, Absinthe (franz.),
    Absynth, Absenta (span.)[/b]\r\nHochprozentige Spirituose aus Wermut, Anis und
    Fenchel als Hauptbestandteile, auch „grüne Fee“ genannt. Wurde aufgrund des Thujongehaltes
    als abhängig machende Droge lange Zeit verboten. Weiterführendes siehe unter [post=JGU7ljnS][u]sonstige
    Destillate[/u][/post]. \r\n\r\n[b]Absinthe-Fontaine (franz.)[/b]\r\nDekorativer
    Wasserspender in der Gastronomie, der gekühltes Wasser über mehrere kleine, fein
    einstellbare Hähne in das Getränk abgibt.\r\n\r\n[b]Absinthlöffel[/b]\r\nFür das
    Absinth-Zeremoniell hergestellter Löffel, der auf das Glas gelegt wird, um einen
    Zuckerwürfel aufzunehmen. Durch tröpfchenweiser Zugabe von gekühltem Wasser löst
    man den Würfel auf.  Klassisch wird Absinth zwar lediglich mit kaltem Wasser ergänzt,
    doch die Methode  den Zucker mit Absinth tränken und anzünden hatte ebenso viele
    Anhänger.\r\n\r\n[b]AF-Cocktail[/b] \r\nZusammenstellung an Zutaten die keinen
    Alkohol enthalten. Oft alkoholhaltige Cocktails nachahmend, namensgleich mit dem
    Zusatz virgin (jungfräulich). \r\n\r\n[b]After-Dinner-Cocktail (engl.)[/b]\r\nDrink
    für die Zeit nach dem Essen, auch Digestif.\r\n\r\n[b]Agraffe (franz.)[/b]\r\nDer
    Drahtkorb, der den Korken einer Schaumweinflasche festhält.\r\n\r\n[b]Agrest[/b]\r\nAlte
    Bezeichnung des [post=JxuXJV3j][u]Verjus[/u][/post].\r\n\r\n[b]Agricole (lat.
    Ursprung)[/b]\r\nLandwirtschaftlich, bäuerlich, siehe unter [post=AEiAj1OF][u]Rum/Ron/Rhum
    weiß[/u][/post].\r\n\r\n[b]Aguardientes de Orujo (span.)[/b]\r\nGekürzt nur Orujo
    genannt, ein spanischer, in Galizien beheimateter Tresterbrand, findet seinen
    Ursprung in Klöstern seit dem 17. Jahrhundert. Nach zweijähriger Reifung im Eicheholzfass
    darf er sich Orujo envejecido nennen. Jeden Ostersonntag wird die Fiesta de Aguardiente
    in Portomarín, mit einer Brennveranstaltung und Wahl des besten Destillateurs,
    gefeiert.\r\n\r\n[b]Alambic (arab., griech. Ursprung)[/b]\r\nAuch Alembic, Alambique,
    diverse Schreibweisen für den Destillierhelm der Destillierapparatur. Das ursprüngliche
    Instrument zur Herstellung von Destillaten. Die flüchtigen Stoffe werden während
    der Destillation aus der Brennblase in diesem Brennhut gefangen und durch den
    Schwanenhals  in ein separates, tiefer liegendes Gefäß gekühlt abgeleitet. \r\n\r\n[b]Alkohol
    (aram., arab. Ursprung)[/b]\r\nC2H50H, ein von Paracelsus geprägter Begriff, der
    etwas Besonderes, Feines bedeuten sollte. Umgangssprachlich für Ethanol, auch
    Äthylalkohol, kann bis zu einer Konzentration von 97,2 % vol gebracht werden.\r\n\r\n[i]\"Der
    Alkohol ist ein Gift. Das haben die Physiologen bewiesen. Aber gegen den Alkohol
    ist damit gar nichts bewiesen, denn ein Gift kann immer noch eine Medizin sein.\"
    (Egon Friedell, 1878 - 1938)[/i]\r\n\r\n[b]Allasch (livl. Ursprung)[/b]\r\nDeutscher,
    hochprozentiger Likör aus Kümmelbrand, besitzt ein ausgeprägtes Kümmelaroma.\r\n\r\n[b]Almond
    milk (engl.)[/b]\r\nMandelmilch wird u. a. zur Herstellung von Orgeat benötigt.\r\n\r\n[b]Almond
    syrup (engl.)[/b]\r\nMandelsirup, siehe [post=FaSGbacs][u]Orgeat[/u][/post]\r\n\r\n[b]Amaretto
    (ital. Ursprung)[/b]\r\nLikör aus Mazeration teilweise von Mandelschalen, Aprikosenkernöl
    und einigen anderen Rohprodukten und Herstellungsmethoden. An Marzipan erinnernder
    Geschmack diesen Likören gleich.\r\n\r\n[b]Amari (ital.)[/b]\r\nGruppe von Bitterspirituosen\r\n\r\n[b]Amaro
    (ital.)[/b]\r\nBedeutet bitter\r\n\r\n[b]Añejo (span.)[/b]\r\nEine von fünf Alterungskategorien
    beim Mezcal. Entspricht einer Lagerung im Eichenholzfass von einem bis drei Jahre.
    Weiterführendes siehe unter [post=1X6UGsPe][u]Tequila[/u][/post].\r\n\r\n[b]Angles
    share (engl.)[/b]\r\nEin Schluck für die Engel, bezeichnet bei der Whisky-Herstellung
    den Verlust durch Verdunstung aus einem Fass während der Lagerung. Teilweise ebenso
    im Weinbau verwendet.\r\n\r\n[b]Angostura (venez.-span.)[/b]\r\nCocktailbitter
    benannt nach der früher gleichnamigen Stadt in Venezuela. Das Rezept des Bitters
    aus dem Jahre 1824 stammt von dem deutschen Arzt Siegert.\r\n\r\n[b]Anisados (span.)[/b]\r\nSpanische
    Spirituose mit Anis aromatisiert.\r\n\r\n[b]Anisée (franz.)[/b]\r\nEine Gruppe
    an Spirituosen, die mit Anis aromatisiert wurden (Pastis, Ouzo u. a.).\r\n\r\n[b]Anisette
    (franz.)[/b]\r\nAnislikör\r\n\r\n[b]Anker[/b]\r\nAltes europäisches Hohlmaß, zuweilen
    auch Fassgröße mit unterschiedlicher Volumina, von ca. 35 bis ca. 43 Liter, aber
    auch bis ca. 68 Liter.\r\n\r\n[b]Anklatschen[/b]\r\nEine vielfach geübte Praxis
    in Bars, Kräuter mit den Handflächen anklatschen. Soll durch brechen der Pflanzenstrukturen
    die Aromen des jeweiligen Krautes freisetzen, was auch gelingt. Die ätherischen
    Öle verteilen sich in den Handflächen und verflüchtigen im Raum, sind allerdings
    verloren für den jeweiligen Cocktail. Bessere Lösung, die Kräuter mit Barlöffel,
    oder Stößel im Gästeglas sanft andrücken. Es sei denn, man möchte diese Duftwolke
    in der Umgebung.\r\n\r\n[b]Aperitif (franz.)[/b]\r\nDrink für die Zeit vor dem
    Essen als Appetitanreger, auch Before-Dinner-Cocktail.\r\n\r\n[b]Apfelwein[/b]\r\nAuch
    Cider (engl.), Cidre (franz.) genannt. Sehr altes, schon biblisch erwähntes, aus
    Äpfeln gepresstes, säuerliches Getränk mit einem alkoholischen Anteil von 5,5
    - 6,5 %.\r\n\r\n[b]Apple Cider (engl.)[/b]\r\nSiehe oben, auch unter [post=Zr3AN86u][u]Cider,
    Cidre[/u][/post]\r\n\r\n[b]Applejack (engl.)[/b]\r\nSpirituose zumeist aus Cider,
    deren Alkoholkonzentration früher durch frosten und abschöpfen der Wasserbestandteile
    erfolgte.\r\n\r\n[b]Aquavit (lat.), Akvavit[/b]\r\nSpirituose unter Verwendung
    von Kümmel, Dillsaat. Aqua vitae, Wasser des Lebens seit dem Mittelalter bekannter,
    ursprünglich aus Skandinavien stammender Brand.\r\n\r\n[b]Arak (arab.)[/b]\r\nArabische
    Spirituose mit Anis aromatisiert. Nicht zu verwechseln mit Arrak, Arrack; siehe
    dort.\r\n\r\n[b]Aräometer[/b]\r\nAlkoholmeter, Alkoholbestimmungsinstrument. Mit
    dieser Alkoholspindel ermittelt man, vorzugsweise bei 20° Grad Raumtemperatur,
    den alkoholischen Anteil in Volumenprozent. Zuckerreiche Flüssigkeiten, wie Likör,
    Wein u. a., können hiermit allerdings nicht bestimmt werden. \r\n\r\n[b]Armagnac
    (franz.)[/b]\r\nSiehe unter [post=JGU7ljnS][u]\"Weinbeerendestillate\"[/u][/post]
    in den Tipps für den Barneuling.\r\n\r\n[b]Arrack, Arrak (franz. Ursprung)[/b]\r\nSpirituose
    aus Palmsaft, oder Reis und Zuckerrohr. Produktion findet weitestgehend im südostasiatischen
    Raum statt. Geschmacklich zwischen Rum und Whiskey einzuordnen.\r\n\r\n[b]Artisanal
    (franz. Ursprung)[/b]\r\nHand gefertigt, der Ausdruck wird besonders bei der Rum-Herstellung
    angewandt.\r\n\r\n[b]Assemblage (franz.)[/b]\r\nEin Verschnitt von Weinen verschiedener
    Jahrgänge. Besonders in der Schaumweinherstellung beliebt.\r\n\r\n[b]Aufgesetzter[/b]\r\nRheinländisch-westfälische,
    hausgemachte Spirituose aus Korn mit schwarzen Johannisbeeren. Entweder werden
    die ganzen Früchte, oder lediglich der Saft der Beeren verwandt. \r\n\r\n[b]Ausgießer[/b]\r\nFlaschen-Stopfen
    mit tüllenförmiger Öffnung zur besseren Dosierung der Flüssigkeiten.\r\n\r\n\r\n[post=AujmVOOB][u]oben[/u][/post]"
