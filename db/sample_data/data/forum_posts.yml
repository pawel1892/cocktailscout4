    Ausführungen erhältlich, die sonst aber keinen Unterschied aufweisen. Besitzt
    einen leichten Melassegeschmack. Mit einem Melasseanteil von 2% bis 3% wird dieser
    Zucker Demerarazucker genannt.\r\n\r\n[b]Rohrzucker[/b]\r\nZuckerart aus Zuckerrohr
