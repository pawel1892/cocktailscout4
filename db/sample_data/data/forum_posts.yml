  :body: "###Alkoholfreie Zutaten\r\n\r\n***Säfte und Nektare***\r\n\r\nGrundsätzlich
    gilt folgende Faustregel:\r\n\r\n*Selbst gepresst, bzw. entsaftet* entspricht
    der höchstmöglichen Qualitätsstufe. Nahezu ohne Alternative gilt das für Zitronen
    und Limetten. Aber auch andere Zitrusfrüchte profitieren davon. So kommen Orangen,
    Grapefruits und Mandarinen in selbstgepresster Form meist besser als industriell
    hergestellte Säfte. Das funktioniert natürlich nur, wenn man qualitativ hochwertige
    und reife Früchte verwendet.\r\n\r\nIst die Selbstherstellung nicht möglich oder
    gewollt, so sind *100%-Direktsäfte* die nächst bessere Wahl. Direktsäften wird
    nicht erst der Flüssiganteil entzogen und später wieder zugefügt, wie das bei
    den Konzentraten der Fall ist. Im Prinzip sind sie die industrielle Form der selbst
    gepressten, durchlaufen aber oft noch haltbar machende Produktionsprozesse und
    sind somit qualitativ und manchmal auch geschmacklich ein klein wenig minderwertiger
    als frisch gepresste. So findet Ihr in der Regel alle Zitrusfrüchte als Direktsäfte,
    viele Beeren und auch Äpfel und Birnen werden direkt versaftet.\r\n\r\nDie nächst
    niedrigere Stufe sind die *100%-Konzentratsäfte*. Sie enthalten zwar den vollen
    Fruchtanteil, sind jedoch durch Komprimierung, Dekomprimierung und Haltbarmachung
    qualitativ noch ein Stück weniger wert als Direktsäfte und das merkt man in der
    Regel auch sehr deutlich im Geschmack. Konzentratsäfte machen also nur dann Sinn,
    wenn man weder selbstpressen, noch einen entsprechenden Direktsaft erwerben kann.\r\n\r\nZum
    guten Schluss kommen wir zu den *Nektaren*. Als Nektare bezeichnet man Fruchtgetränke
    mit einem Fruchtgehalt weniger als 100%. Das macht Sinn bei Früchten, die selbst
    nicht genug Flüssigkeit enthalten, als dass man sie vernünftig versaften könnte.
    Oft wird den Nektaren auch noch Zucker zugesetzt. Nektare also bitte nur dann
    kaufen, wenn kein Saft von dieser Frucht erhältlich ist und auch nur dann, wenn
    der Fruchtgehalt mindestens bei 25% liegt. Beispiele dafür sind Maracuja, Mango,
    Pfirsich, Aprikose, Kirsche, Erdbeere usw.\r\n\r\nFruchtsaftgetränke mit einem
    Fruchtgehalt von weniger als 25% kauft bitte nicht. Sowas ist qualitativ und geschmacklich
    sehr minderwertig und hat in Cocktails nix verloren. Hier Marken anzugeben hat
    wenig Sinn. Kauft die Marken, die Euch auch pur sehr gut schmecken und für Euch
    gut erreichbar sind. In speziellen Fällen könnt Ihr ja noch mal im Forum nachfragen.\r\n\r\n***Limonaden
    und Wasser***\r\n\r\nAuch hier gilt: Kauft, was Euch schmeckt und einfach zu bekommen
    ist.\r\n\r\n*SchSt*\r\n\r\n\r\n[[post:JGU7ljnS|oben]]"
  :body_bbcode: "[b]Alkoholfreie Zutaten[/b]\r\n\r\n\r\n[b][i]Säfte und Nektare[/i][/b]\r\n\r\nGrundsätzlich
    gilt folgende Faustregel:\r\n\r\n[i]Selbst gepresst, bzw. entsaftet[/i] entspricht
    der höchstmöglichen Qualitätsstufe. Nahezu ohne Alternative gilt das für Zitronen
    und Limetten. Aber auch andere Zitrusfrüchte profitieren davon. So kommen Orangen,
    Grapefruits und Mandarinen in selbstgepresster Form meist besser als industriell
    hergestellte Säfte. Das funktioniert natürlich nur, wenn man qualitativ hochwertige
    und reife Früchte verwendet.\r\n\r\nIst die Selbstherstellung nicht möglich oder
    gewollt, so sind [i]100%-Direktsäfte[/i] die nächst bessere Wahl. Direktsäften
    wird nicht erst der Flüssiganteil entzogen und später wieder zugefügt, wie das
    bei den Konzentraten der Fall ist. Im Prinzip sind sie die industrielle Form der
    selbst gepressten, durchlaufen aber oft noch haltbar machende Produktionsprozesse
    und sind somit qualitativ und manchmal auch geschmacklich ein klein wenig minderwertiger
    als frisch gepresste. So findet Ihr in der Regel alle Zitrusfrüchte als Direktsäfte,
    viele Beeren und auch Äpfel und Birnen werden direkt versaftet.\r\n\r\nDie nächst
    niedrigere Stufe sind die [i]100%-Konzentratsäfte[/i]. Sie enthalten zwar den
    vollen Fruchtanteil, sind jedoch durch Komprimierung, Dekomprimierung und Haltbarmachung
    qualitativ noch ein Stück weniger wert als Direktsäfte und das merkt man in der
    Regel auch sehr deutlich im Geschmack. Konzentratsäfte machen also nur dann Sinn,
    wenn man weder selbstpressen, noch einen entsprechenden Direktsaft erwerben kann.\r\n\r\nZum
    guten Schluss kommen wir zu den [i]Nektaren[/i]. Als Nektare bezeichnet man Fruchtgetränke
    mit einem Fruchtgehalt weniger als 100%. Das macht Sinn bei Früchten, die selbst
    nicht genug Flüssigkeit enthalten, als dass man sie vernünftig versaften könnte.
    Oft wird den Nektaren auch noch Zucker zugesetzt. Nektare also bitte nur dann
    kaufen, wenn kein Saft von dieser Frucht erhältlich ist und auch nur dann, wenn
    der Fruchtgehalt mindestens bei 25% liegt. Beispiele dafür sind Maracuja, Mango,
    Pfirsich, Aprikose, Kirsche, Erdbeere usw.\r\n\r\nFruchtsaftgetränke mit einem
    Fruchtgehalt von weniger als 25% kauft bitte nicht. Sowas ist qualitativ und geschmacklich
    sehr minderwertig und hat in Cocktails nix verloren. Hier Marken anzugeben hat
    wenig Sinn. Kauft die Marken, die Euch auch pur sehr gut schmecken und für Euch
    gut erreichbar sind. In speziellen Fällen könnt Ihr ja noch mal im Forum nachfragen.\r\n\r\n[b][i]Limonaden
    und Wasser[/i][/b]\r\n\r\nAuch hier gilt: Kauft, was Euch schmeckt und einfach
    zu bekommen ist.\r\n\r\n[i]SchSt[/i]\r\n\r\n\r\n[post=JGU7ljnS]oben[/post]"
