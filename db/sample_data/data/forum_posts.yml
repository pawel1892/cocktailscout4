  :body: "![Lexikon V](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:31}}/grafik.png)\r\n**Vecchio
    (ital.)**\r\nItalienische Bezeichnung für gelagert, gealtert.\r\n\r\n**Veladora
    (span./mex.)**\r\nKerze; das Glas für die Gebet-Kerze aus den mexikanischen, katholischen
    Kirchen wurde vor langer Zeit als Trinkglas, mit einem Volumen von 8 cl, kurzerhand
    für den Mezcal zweckendfremdet. Am Glasboden befindet sich typischer Weise ein
    Kreuz. Weitere Glasformen für die Cocktailbereitung zu finden in unseren Tipps
    für den Barneuling unter [[post:Td3hzyZf|<u>Gläser</u>]].\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:168}}/glas-veladora-mezcal-glas-6cl.jpg
    \"small\")\r\n\r\n**Velho (port.)**\r\nPortugiesische Bezeichnung für gealtert.\r\n\r\n**Vergine
    (ital.)**\r\nItalienische Bezeichnung der besten Qualitätsstufe des sizilianischen
    Likörweins Marsala.\r\n\r\n**Verjus (Ursprung franz.)**\r\nSaft unreifer Trauben,
    auch als Agrest bekannt.\r\n\r\n**Vermiglio (ital.)**\r\nItalienische Bezeichnung
    für leuchtendes Rot.\r\n\r\n**Vermouth, Wermut**\r\nAufgespriteter Wein wird mit
    Kräutern, unter anderen Wermutkraut und weiteren Gewürzen aromatisiert. Bestandteil
    vieler klassischer Cocktails. Kann als Aperitif genossen werden. Weiterführendes
    siehe unter [[post:JGU7ljnS|<u>\"Leichte Alkohole\" in den Tipps für den Barneuling.</u>]]\r\n\r\n**Vermouth
    di Torino (ital.)**\r\nUrsprungsgeschützte Bezeichnung für Vermouth in Italien\r\n\r\n**Vert
    (franz.)**\r\nSteht für grün.\r\n\r\n**Vieux (franz.)**\r\nBezeichnung für betagt,
    oder alt bei Armagnac, Calvados, Wein udgl.\r\n\r\n**Vin Mousseux (franz.)**\r\n[[post:LCsqyzy7|<u>Schaumwein</u>]]
    mit Herstellungsverfahren wie Champagner, doch ohne regionalem Schutz.\r\n\r\n**Vinho
    Espumante (port.)**\r\nSekt wird in Portugal so genannt.\r\n\r\n**Vintage (engl.)**\r\nSpirituose
    eines besonderen Jahrgangs (gealtert).\r\n\r\n**Virgin**\r\nNamenszusatz eines
    populären Cocktails, der ohne alkoholische Zutat nachempfunden wird.\r\n\r\n**VO,
    V.O. (engl.)**\r\nVery old, Prädikatsbezeichnung zur Lagerung von Armagnac, Cognac,
    Weinbrand über zwei Jahre. Ebenfalls werden  Calvados und Rum aus Martinique mit
    diesem Prädikat klassifiziert. Siehe auch V.S.O.P., V.V.S.O.P..\r\n\r\n**Vodka**\r\nSiehe
    unter [[post:2r4dOHmA|<u>Wodka</u>]]\r\n\r\n**Vollrohrzucker**\r\nUnraffinierte
    Zuckerart aus Zuckerrohr hergestellt, dadurch voller Vitamin- und Mineraliengehalt.
    Besitzt einen intensiven Melassegeschmack.\r\n\r\n**V-Shape (engl.)**\r\nCocktailspitz-Glas,
    siehe unter [[post:Td3hzyZf|Martiniglas]] in den Tipps für den Barneuling \r\n\r\n**VS,
    V.S. (engl.)**\r\nVery special, nicht amtliche Bezeichnung für Calvados, Cognac
    deren jüngstes Destillat ein Mindestalter von zwei Jahren aufweist.\r\n\r\n**VSOP,
    V.S.O.P. (engl.)**\r\nVery superior old pale, Prädikatsbezeichnung zur Lagerung
    von Armagnac, Cognac, Weinbrand über vier Jahre. Ebenfalls werden  Calvados und
    Rum aus Martinique mit diesem Prädikat klassifiziert. Siehe auch V.O., V.V.S.O.P..\r\n\r\n**VSQ
    (ital.)**\r\nQualitätsbezeichnung für Spumante: \"Vino Spumante di Qualità\".\r\n\r\n**VVSOP,
    V.V.S.O.P. (engl.)**\r\nVery very superior old pale, Prädikatsbezeichnung zur
    Lagerung von Armagnac, Cognac, Weinbrand über fünf Jahre. Ebenfalls werden  Calvados
    und Rum aus Martinique mit diesem Prädikat klassifiziert. Siehe auch V.S.O.P.,
    V.O..\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]\r\n"
