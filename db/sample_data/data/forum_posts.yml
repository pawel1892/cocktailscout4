  :body: "![Lexikon D](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:12}}/grafik.png)\r\n**[[wiki:classic-daiquiri|Daiquiri]]**\r\nSiehe
    unter [[post:94rZApCd|<u>Bezeichnung der Getränke</u>]] in den Tipps für den Barneuling.\r\n\r\n**Daisy
    (engl.)**\r\nSiehe unter [[post:94rZApCd|<u>Bezeichnung der Getränke</u>]] in
    den Tipps für den Barneuling.\r\n\r\n**[[wiki:barmasse|Dash (engl.)]]**\r\nSpritzer,
    Maß für Cocktail-Bitters oder andere Aromatika. Je nach Viskosität (0,5 - 1 ml)
    unterschiedliche Menge. Wird aus einer Dashflasche oder einem Schüttelröhrchen
    dosiert.\r\n\r\n**Dash-Bottle (engl.)**\r\nFläschchen um Cocktail-Bitters aufzunehmen.\r\n\r\n**Defrutum
    (lat.)**\r\nUnvergorener Traubenmost, der als Sirup bis zur Hälfte, oder sogar
    auf ein Drittel eingekocht wird.\r\n\r\n**Degorgieren (franz. Ursprung)**\r\nDas
    Abschlämmen der Hefe aus der Schaumweinflasche. Heute vereinfacht durch Vereisung
    des Flaschenhalses.\r\n\r\n**Degustation**\r\nDie möglichst objektiv, sensorische
    Prüfung und qualitative Bewertung von Lebensmitteln (Essen, oder Getränke).\r\n\r\n**Dekanter**\r\nBauchige
    Glaskaraffe zum Umfüllen des Weines, damit er mit Luftaustausch ein größeres Bouquet
    erhält, dient gleichzeitig zur Trennung des Weines vom Depot.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:118}}/dekanter.jpg
    \"small\")\r\n\r\n**Dekantieren (franz. Ursprung)**\r\nDie Tätigkeit des Wein-Umfüllens
    in den Dekanter.\r\n\r\n**Dekoration**\r\nAusarbeitung des Cocktails mit Fruchtstücken,
    Zitrus-Zesten, Zuckerrand und dergleichen. Das Gestalten mit Schirmchen, Figuren
    u. a. entspricht  in der Regel nicht dem Zeitgeschmack, wird aus nostalgischen
    Gründen doch hin und wieder akzeptiert. \r\n\r\n**Demerara**\r\nNiederländische
    Kolonie von 1752 bis 1814 an der Nordküste Südamerikas. Auch Niederländisch-Guyana
    genannt.\r\n\r\n**Demerara-Zucker**\r\nGroßkristalliner, brauner Zucker einer
    bestimmten Zuckerrohrart, mit einem 2% - 3%igen Melasseanteil. Siehe ebenfalls
    unter [[post:WhgoLNNc|<u>Roh-Rohrzucker</u>]]\r\n\r\n**Demi**\r\nFlaschengröße
    für Schaumwein mit einem Fassungsvermögen von 0,375 Liter. Auch Filette genannt.\r\n\r\n**Demi-sec
    (franz.)**\r\nHalbtrockener (lieblicher) Schaumwein mit einem Restzuckergehalt
    von 35 - 50 g/l.\r\n\r\n**Depot (franz.)**\r\nAblagerungen des Weines in den Flaschen.
    Besteht überwiegend aus Gerbstoffen bei gerbstoffreichen Weinen.\r\n\r\n**Destillation**\r\nDient
    zur Alkoholherstellung, bei der das zu destillierende Gut erhitzt wird. Durch
    den Verdampfungsprozess lösen sich die flüchtigen Bestandteile, welche separiert
    durch Kondensation wieder aufgefangen werden.\r\n\r\n**Destille**\r\nGaststätte
    mit überwiegendem Branntweinausschank.\r\n\r\n*\"Frohe Arbeit – ernster Wille!
    Mal en Schluck in de Destille! Und een bisken Kille Kille – Det hält munter! Heinrich
    Zille.\" Heinrich Zille (1858 - 1929)*\r\n\r\n**Destillerie**\r\nBranntwein-Brennerei\r\n\r\n**Digestif
    (franz.)**\r\nDrink für die Zeit nach dem Essen, auch After-Dinner-Cocktail.\r\n\r\n**Dipperl,
    Dippl, Düpferl (öster.)**\r\nÖsterreichisch für Fruchtsaft, oder Limonade mit
    Wein vermengt.\r\n\r\n**Dolce (ital.)**\r\nBezeichnung in Italien für süß.\r\n\r\n**Doppelmagnum**\r\nFlaschengröße
    in der Schaumweinherstellung, siehe unter [[post:texpP6wv|<u>Jeroboam</u>]].\r\n\r\n**Dosage
    (franz.)**\r\nZugabe einer, in der Regel, geheimen Zutat zur Abrundung des Schaumweines.
    Je nach Geschmackrichtung werden Süßweine, oder andere Ingredienzien abgefüllt.
    Der letzte Arbeitsschritt bei der Schaumweinherstellung vor der Verkorkung.\r\n\r\n**Dosenöffner**\r\nHaushaltsgegenstand
    in vielen Versionen hergestellt, für Kokosnuss-Creme, evtl. auch Früchte aus Dosen.\r\n\r\n**Dosierer**\r\nAufsatz
    für Flaschen, der eine gleichbleibende Flüssigkeitsmenge bei Betätigung abgibt,
    einem Standard-Ausgießer ähnlich.\r\n\r\n**[[wiki:double-strain|Double strain
    (engl.)]]**\r\nVorsichtiges Abgießen durch ein zweites, feineres Sieb (Teesieb)
    zum Zurückhalten von Frucht-, Pflanzenstücken und -Fasern, während das Sieb am
    Shaker / Glas die groben Bestandteile und das Eis zurückhält. Auch fine strain
    genannt. \r\n![Double strain in ein Cocktailglas](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:35}}/grafik.png
    \"medium\")\r\n\r\n**Douro (port.)**\r\nNeunhundert Kilometer langer Fluss, der
    durch eine Region Portugals mit sehr steilen, Weinreben bewachsenen Berghängen
    fließt und so dieser Region den Namen gibt. Das älteste herkunftgeschützte Weinanbaugebiet
    deren Produkte sich Porto, auch Douro Port, nach der gleichnamigen Hafenstadt
    nennen dürfen.   \r\n\r\n**Doux (franz.)**\r\nSüßer (Schaum)-wein mit einem Restzuckeranteil
    von 50 g/l.\r\n\r\n**Dry (engl.)**\r\nSteht bei Spirituosen und Schaumweinen für
    trocken. Bezeichnung für geringen Restzuckergehalt. Bei Gin oder Vermouth auch
    Produktionskennzeichnung.\r\n\r\n**[[wiki:shaken-vs-ruehren|Dry shake (engl.)]]**\r\nMethode
    des Shakens, geeignet um Cocktails mit Sahne, oder Eiweiß schaumiger herstellen
    zu können. Dabei wird der erste Schüttelvorgang ohne Eis durchgeführt. Nach ausreichendem
    Mixen fügt man im zweiten Gang Eis zur Kühlung hinzu.\r\n\r\n**Dunder (evtl. Ursprung
    niederl.)**\r\nDie Flüssigkeit, welche nach dem Destillieren einer Rumcharge im
    Kessel verbleibt. Verwenden einige Hersteller als traditionelles Verfahren, bei
    erneuter Destillation von Rum zur Förderung der Fermentation. Wird als geschmacksteigernde
    Quelle in erwünschter Richtung eingesetzt.\r\n\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]"
  :body_bbcode: "[IMG]https://image.jimcdn.com/app/cms/image/transf/none/path/s34ef2c3ad959eb14/image/i67241bf4b6074613/version/1554062783/d.jpg[/IMG][color=#fefefe]D[/color]\r\n\r\n[b]Daiquiri[/b]\r\nSiehe
    unter [post=94rZApCd][u]Bezeichnung der Getränke[/u][/post] in den Tipps für den
    Barneuling.\r\n\r\n[b]Daisy (engl.)[/b]\r\nSiehe unter [post=94rZApCd][u]Bezeichnung
    der Getränke[/u][/post] in den Tipps für den Barneuling.\r\n\r\n[b]Dash (engl.)[/b]\r\nSpritzer,
    Maß für Cocktail-Bitters  und anderes. Je nach Viskosität der Flüssigkeit unterschiedliche
    Menge.\r\n\r\n[b]Dash-Bottle (engl.)[/b]\r\nFläschchen um Cocktail-Bitters aufzunehmen.\r\n\r\n[b]Defrutum
    (lat.)[/b]\r\nUnvergorener Traubenmost, der als Sirup bis zur Hälfte, oder sogar
    auf ein Drittel eingekocht wird.\r\n\r\n[b]Degorgieren (franz. Ursprung)[/b]\r\nDas
    Abschlämmen der Hefe aus der Schaumweinflasche. Heute vereinfacht durch Vereisung
    des Flaschenhalses.\r\n\r\n[b]Degustation[/b]\r\nDie möglichst objektiv, sensorische
    Prüfung und qualitative Bewertung von Lebensmitteln (Essen, oder Getränke).\r\n\r\n[b]Dekanter[/b]\r\nBauchige
    Glaskaraffe zum Umfüllen des Weines, damit er mit Luftaustausch ein größeres Bouquet
    erhält, dient gleichzeitig zur Trennung des Weines vom Depot.\r\n\r\n[b]Dekantieren
    (franz. Ursprung)[/b]\r\nDie Tätigkeit des Wein-Umfüllens in den Dekanter.\r\n\r\n[b]Dekoration[/b]\r\nAusarbeitung
    des Cocktails mit Fruchtstücken, Zitrus-Zesten, Zuckerrand und dergleichen. Das
    Gestalten mit Schirmchen, Figuren u. a. entspricht  in der Regel nicht dem Zeitgeschmack,
    wird aus nostalgischen Gründen doch hin und wieder akzeptiert. \r\n\r\n[b]Demerara[/b]\r\nNiederländische
    Kolonie von 1752 bis 1814 an der Nordküste Südamerikas. Auch Niederländisch-Guyana
    genannt.\r\n\r\n[b]Demerara-Zucker[/b]\r\nGroßkristalliner, brauner Zucker einer
    bestimmten Zuckerrohrart, mit einem 2% - 3%igen Melasseanteil. Siehe ebenfalls
    unter [post=WhgoLNNc][u]Roh-Rohrzucker[/u][/post]\r\n\r\n[b]Demi[/b]\r\nFlaschengröße
    für Schaumwein mit einem Fassungsvermögen von 0,375 Liter. Auch Filette genannt.\r\n\r\n[b]Demi-sec
    (franz.)[/b]\r\nHalbtrockener (lieblicher) Schaumwein mit einem Restzuckergehalt
    von 35 - 50 g/l.\r\n\r\n[b]Depot (franz.)[/b]\r\nAblagerungen des Weines in den
    Flaschen. Besteht überwiegend aus Gerbstoffen bei gerbstoffreichen Weinen.\r\n\r\n[b]Destillation[/b]\r\nDient
    zur Alkoholherstellung, bei der das zu destillierende Gut erhitzt wird. Durch
    den Verdampfungsprozess lösen sich die flüchtigen Bestandteile, welche separiert
    durch Kondensation wieder aufgefangen werden.\r\n\r\n[b]Destille[/b]\r\nGaststätte
    mit überwiegendem Branntweinausschank.\r\n\r\n[i]\"Frohe Arbeit – ernster Wille!
    Mal en Schluck in de Destille! Und een bisken Kille Kille – Det hält munter! Heinrich
    Zille.\" Heinrich Zille (1858 - 1929)[/i]\r\n\r\n[b]Destillerie[/b]\r\nBranntwein-Brennerei\r\n\r\n[b]Digestif
    (franz.)[/b]\r\nDrink für die Zeit nach dem Essen, auch After-Dinner-Cocktail.\r\n\r\n[b]Dipperl,
    Dippl, Düpferl (öster.)[/b]\r\nÖsterreichisch für Fruchtsaft, oder Limonade mit
    Wein vermengt.\r\n\r\n[b]Dolce (ital.)[/b]\r\nBezeichnung in Italien für süß.\r\n\r\n[b]Doppelmagnum[/b]\r\nFlaschengröße
    in der Schaumweinherstellung, siehe unter [post=texpP6wv][u]Jeroboam[/u][/post].\r\n\r\n[b]Dosage
    (franz.)[/b]\r\nZugabe einer, in der Regel, geheimen Zutat zur Abrundung des Schaumweines.
    Je nach Geschmackrichtung werden Süßweine, oder andere Ingredienzien abgefüllt.
    Der letzte Arbeitsschritt bei der Schaumweinherstellung vor der Verkorkung.\r\n\r\n[b]Dosenöffner[/b]\r\nHaushaltsgegenstand
    in vielen Versionen hergestellt, für Kokosnuss-Creme, evtl. auch Früchte aus Dosen.\r\n\r\n[b]Dosierer[/b]\r\nAufsatz
    für Flaschen, der eine gleichbleibende Flüssigkeitsmenge bei Betätigung abgibt,
    einem Standard-Ausgießer ähnlich.\r\n\r\n[b]Double strain (engl.)[/b]\r\nVorsichtiges
    Abgießen durch ein zweites, feineres Sieb (Teesieb) zum Zurückhalten von Frucht-,
    Pflanzenstücken und -Fasern, während das Sieb am Shaker / Glas die groben Bestandteile
    und das Eis zurückhält. Auch fine strain genannt. \r\n\r\n[IMG]https://image.jimcdn.com/app/cms/image/transf/dimension=950x10000:format=jpg/path/s34ef2c3ad959eb14/image/i70345733d85ecc26/version/1554130732/doublestrain.jpg[/IMG]\r\n\r\n[b]Douro
    (port.)[/b]\r\nNeunhundert Kilometer langer Fluss, der durch eine Region Portugals
    mit sehr steilen, Weinreben bewachsenen Berghängen fließt und so dieser Region
    den Namen gibt. Das älteste herkunftgeschützte Weinanbaugebiet deren Produkte
    sich Porto, auch Douro Port, nach der gleichnamigen Hafenstadt nennen dürfen.
    \  \r\n\r\n[b]Doux (franz.)[/b]\r\nSüßer (Schaum)-wein mit einem Restzuckeranteil
    von 50 g/l.\r\n\r\n[b]Dry (engl.)[/b]\r\nSteht bei Spirituosen für trocken.\r\n\r\n[b]Dry
    shake (engl.)[/b]\r\nMethode des Shakens, geeignet um Cocktails mit Sahne, oder
    Eiweiß schaumiger herstellen zu können. Dabei wird der erste Schüttelvorgang ohne
    Eis durchgeführt. Nach ausreichendem Mixen fügt man im zweiten Gang Eis zur Kühlung
    hinzu.\r\n\r\n[b]Dunder (evtl. Ursprung niederl.)[/b]\r\nDie Flüssigkeit, welche
    nach dem Destillieren einer Rumcharge im Kessel verbleibt. Verwenden einige Hersteller
    als traditionelles Verfahren, bei erneuter Destillation von Rum zur Förderung
    der Fermentation. Wird als geschmacksteigernde Quelle in erwünschter Richtung
    eingesetzt.\r\n\r\n\r\n[post=AujmVOOB][u]oben[/u][/post]"
