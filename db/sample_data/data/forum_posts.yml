    immer und ewig der Kork.\" Friedrich von Schiller (1759 - 1805)[/i]\r\n\r\n[b]Korkenzieher[/b]\r\nWerkzeug,
    das Weinflaschen u. ä. entkorkt. Von simpel bis zur Gastroausführung sind viele
    Varianten erhältlich.\r\n\r\n[b]Kronkorken[/b]\r\nMetallverschluß für Flaschen,
    deren Inhalt vorzugsweise mit Kohlensäure angereichert ist. Das Metall wird am
    Hals der Flasche nach unten gebogen, faltet sich zu einer Art Krone. Zur Abdichtung
    befand sich früher im Inneren der Kapsel Korkmaterial, dass heute vorwiegend durch
    Kunststoff ersetzt wird.\r\n\r\n[b]Kugelausstecher[/b]\r\nLöffelartiges, halbkugelförmiges
    Messer um Kugeln aus Früchten zu schneiden. Unterschiedliche Größen im Handel.
    Auch Pariser Messer genannt.\r\n\r\n\r\n[post=AujmVOOB][u]oben[/u][/post]"
