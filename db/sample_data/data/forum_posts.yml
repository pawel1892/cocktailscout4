    für Champagner mit einem Fassungsvermögen von 18 Litern. Auch Goliath genannt.\r\n\r\n[b]Menage
    (franz.)[/b]\r\nSteht traditionell für Salz und Pfefferstreuer in einem Halter,
    doch ebenfalls  in einer Anordnung Bitters-Flaschen. \r\n\r\n[b]Messbecher[/b]\r\nOft
    zweiseitig verwendbares Becherchen aus Metall - der größere Teil fasst zumeist
    4 cl, der kleine 2 cl, siehe [post=texpP6wv][u]Jigger.[/u][/post] Doch auch andere
    Größen erhältlich.\r\n\r\n[IMG]https://image.jimcdn.com/app/cms/image/transf/dimension=950x10000:format=jpg/path/s34ef2c3ad959eb14/image/i11a4cbedf962f6ce/version/1554130821/messbecher.jpg[/IMG]\r\n\r\n[b]Met
    (germ. Ursprung)[/b]\r\nAlkoholisches Getränk aus Honig und Wasser, mit einem
    üblichen alkoholischen Anteil von 11%-16%, auch 20% möglich. Hin und wieder mit
    Gewürzen und/oder Säften versetzt.\r\n\r\n[b]Methusalem (sumer.?)[/b]\r\nFlaschengröße
    für Schaumwein mit einem Fassungsvermögen von 6 Litern. \r\n\r\n[b]Mezcal / Mescal
    / Meskal (mex.)[/b]\r\nMexikanischer Agavenbrand zu denen auch der Tequila zählt.
    Siehe unter [post=JGU7ljnS][u]Agavendestillate[/u][/post].\r\n\r\n[b]Mimosa[/b]\r\nGetränkebezeichnung
    für Champagner mit frisch gepresstem Orangensaft zu gleichen Teilen auf etwas
    Eis im Sektglas. Hierzu ist es wichtig nicht nur den Champagner, sondern auch
    die Orangen vorher zu kühlen. Mit einem Schuß Orangenlikör wird es ein Grand Mimosa
    und einige weitere Varianten entstanden.\r\n\r\n[b]Mistela  / Mistel / Mistelle
    (span. / franz.)[/b]\r\nTraubenmost der in der frühen Gärphase mit Weingeist gespritet
    wird. Der Most erhält hierdurch einen Alkoholanteil von mindestens 20% Vol. und
    eine sehr hohe Restsüße.  Dient als Gärungsunterbrecher und zur Süßung bei Malaga,
    Sherry u. a., aber auch als Getränk.\r\n\r\n[b]Mocktail[/b]\r\nWortschöpfung die
    ein alkoholfreies Getränk bezeichnet, welches einen alkoholhaltigen Cocktail nachempfindet,
    den man allgemein auch virgin (jungfräulich) nennt.\r\n\r\n[b]Modifier (engl.)[/b]\r\nZweitwichtigste
    Zutat, die die Basis unterstreichen soll, oft aus Likören, Säften oder Soda bestehend,
    gefolgt von dem  „Flavouring Part“.\r\n\r\n[b]Molekular-Cocktail[/b]\r\nCocktailbereitung
    mit, bis dahin, ungewohnten Mitteln. Zielsetzung der Molekulartechnik gewohnte
    Aromen in anderen Texturen zu offerieren, oder neue Geschmackserlebnisse durch
    veränderter Haptik hervorrufen.\r\n\r\n[b]Monolith-Eis[/b]\r\nGroße Eisblöcke
    mit einem Eispickel gefertigt, jeweils passend für ein Glas.\r\n\r\n[b]Mops[/b]\r\nTrester,
    der mit Wasser aufgefüllt, Zucker angereichert und nochmal vergoren wird. In der
    Pfalz so bezeichneter Tresterwein.\r\n\r\n[b]Muddler (engl.)[/b]\r\nSiehe [post=55QJgTHQ][u]Stößel[/u][/post]\r\n\r\n[b]Mug
    (engl.)[/b]\r\nTrinkbehältnis, -becher mit Henkel, Haferl\r\n\r\n[b]Mule (engl.)[/b]\r\nSiehe
    unter [post=94rZApCd][u]Bezeichnung der Getränke[/u][/post] in den Tipps für den
    Barneuling.\r\n\r\n[b]Mull (engl.)[/b]\r\nAlte Getränkekategorie bestehend aus
    Wein, Gewürzen, Kräutern, welche erwärmt serviert werden.\r\n\r\n[b]Muselet (franz.)[/b]\r\nFranzösisch
    für [post=TizOWyNh][u]Agraffe[/u][/post] siehe dort.\r\n\r\n[b]Muskatnussreibe[/b]\r\nFür
    die Vollendung mancher Cocktails mit frischem Muskat.\r\n\r\n\r\n[post=AujmVOOB][u]oben[/u][/post]"
