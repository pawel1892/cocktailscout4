  :body: "**Rum/Ron/Rhum dunkel**\r\n\r\nUnter dieser Bezeichnung fassen wir mal alles
    zusammen, was, wie unter \"Rum weiß\" beschrieben, hergestellt, jedoch länger
    als 3 Jahre in Fässern gelagert wurde und einen dunklen Farbton hat. Dabei sind
    dann auch solche Rums, die man eigentlich als gold bezeichnen würde, was gelegentlich
    in einigen Rezepten auch geschieht. Normalerweise müßte man auch noch nach den
    Herstellungsländern/-regionen unterscheiden, da diese jeweils doch ein recht spezifisches
    Aroma vertreten. So sind z. B. die schweren dunklen Potstill-Rums der Jamaicaner
    geschmacklich genauso einprägsam, wie es kubanische oder auch Demerararums sind.
    Aber das wäre für den Einstieg wohl der völlige Overkill und deshalb lassen wir
    das an dieser Stelle erst mal beiseite. Wie bereits bei den anderen Spirituosen
    versuchen wir hier den Spagat zwischen möglichst hoher Universalität, vertretbarer
    Qualität und Preis hinzubekommen. Das ist gerade bei gelagerten Spirituosen äußerst
    schwierig, da die Geschmacksnuancen sehr vielfältig sind und eigentlich keine
    direkten Vergleiche zulassen. Letztendlich sind es Fallentscheidungen, aber das
    werdet Ihr später selbst noch oft genug feststellen.\r\n\r\nNun ist es ja so,
    dass bei der Herstellung ein frisches Destillat, in unserem Fall der Rohrum, ja
    immer klar wie Wasser aussieht. Woher kommt also die dunkle Färbung der goldenen
    und braunen Rums? Die entstand mehr oder weniger durch die starke Überproduktion
    des Rums und dem Wissen um die Lagerverfahren anderer Spirituosen. Man füllte
    das Rumdestillat also in Holzfässer ab. Da Schiffe damals recht lange unterwegs
    waren bis sie Europa erreichten und sich die Nachfrage nach Rum durchaus in Grenzen
    hielt, hatte der Rum also reichlich Gelegenheit in den Holzfässern zu reifen.
    Das Endprodukt ist stark von der Wechselwirkung zwischen Holz und Destillat beeinflusst.
    \r\n\r\nDas Holz der [[wiki:faesser|Fässer]] nimmt Öle und Alkohol aus dem Rum
    auf und macht ihn somit weicher. Teile des Alkohols verdunsten auch. Andererseits
    gibt das Holz aber auch Gerb- und Geschmacksstoffe in den Rum ab, die ihm dann
    eine dunklere Farbe verleihen und ihn geschmacklich beeinflussen. Der Geschmack
    ändert sich auch in Abhängigkeit der Stärke, in der der Rum in die Fässer gefüllt
    wird. Hochprozentiges Destillat wird vom Holz schneller absorbiert, beziehungsweise
    verdunstet es auch schneller, als eines, das vor der Fasseinlagerung bereits verdünnt
    wurde. Jede Destillerie hat da ihre eigene Vorgehensweise.\r\n\r\n![Fässer](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:101}}/grafik.png
    \"small\") Fässer in Soleraanordnung\r\n\r\nFrüher war es nicht einfach, große
    Fässer zu bauen, in denen der Rum dicht abgeschlossen ruhen konnte. Deshalb wurden
    die meisten Rums auch nur wenige Jahre gelagert. Heutzutage werden zur Lagerung
    gebrauchte Fässer aus der Whisky-, Cognac-, Sherry-, Port- und Weinherstellung
    verwendet. Zum Teil werden diese Fässer auch ausgebrannt, womit die eichenholzeigenen
    Geschmacksstoffe besser an den Rum abgegeben werden können und er eine besonders
    dunkle Färbung erhält. Auch die klimatischen Bedingungen haben Einfluss auf den
    Geschmack, da sie Art und Grad der Verdunstung beeinflussen. So altert ein in
    der Karibik gelagerter Rum deutlich schneller als die gleiche Abfüllung in Europa.
    \r\nDie Lagerverfahren unterscheiden sich zum Teil unter den Brennereien, manchmal
    aber auch innerhalb einer Brennerei bei verschiedenen Produkten.\r\n\r\nDa gibt
    es zum Beispiel die **Single Cask Lagerung**, bei der nur der in dem einem Fass
    gelagerte Rum abgefüllt wird. Mancher Hersteller arbeitet auch mit dem **First-Second-Third-Fill
    Verfahren**, bei dem das Destillat immer wieder das Fass wechseln muß. Auch immer
    wieder gern verwendet wird das **Solera-Verfahren**, bei dem mehrere Fassreihen
    übereinander gestapelt werden. Die oberen Fässer werden mit dem jüngsten Destillat
    befüllt, während die unteren, am Boden liegenden (spanisch Solera) das Älteste
    enthalten, von dem dann aber immer nur ein Teil entnommen wird und aus der jeweils
    darüber liegenden Fassreihe nachgefüllt wird. Mancher Hersteller lässt den [[wiki:dunkler-rum|**Angelshare**]],
    so nennt man den Teil des verdunsteten Alkohols, offen, während er bei anderen
    aus jüngeren oder auch gleichaltrigen Chargen wieder aufgefüllt wird.\r\n\r\nDie
    Lagerung ist jedoch nicht die einzige Möglichkeit der Geschmacksbeeinflussung
    eines gelagerten Rums. Auf vielen englischsprachigen Karibikinseln werden die
    Rums aus verschiedenen Brennanlagen oder verschiedenen Alters miteinander geblendet,
    also vermischt. Erfahrene Blendmeister generieren da oft erstaunliche Geschmackskompositionen.
    Sie sind letztendlich auch für das Herabsetzen auf Trinkstärke zuständig. \r\n\r\nAuch
    bei Rum-Destillaten gibt es, ähnlich wie bei Wodka, einige aromatisierte Rums,
    hier häufig als Spiced bezeichnet. Dazu finden sowohl Gewürze als auch andere
    Geschmacksstoffe Verwendung. Zu guter Letzt versuchen einige Hersteller, durch
    Zufügen von Zuckercouleur, ihrem Produkt mehr Farbe zu verleihen, was eine längere
    Lagerzeit verdeutlichen und somit wohl einen höheren Preis rechtfertigen soll.
    Das ist eigentlich überflüssig, findet aber trotzdem recht häufig Anwendung.\r\n\r\nNebenbei
    bemerkt gibt es im Bereich der weißen Rums auch die Umkehrung dieses Prozesses,
    also die Lagerung des Destillates mit anschließender Farbfiltrierung, so dass
    scheinbar wieder ein rein weißer Rum, nur eben deutlich weicher und geschmackvoller,
    entsteht.\r\n\r\n\r\n|**Rum/Ron-Destillate Einsteigerbarstock um 20 €**|**Rhum-Destillate
    Einsteigerbarstock um 20 €**|\r\n|---|---|\r\n|-Arehucas Carta Oro 37.5%|-Rhum
    paille oder ambre|\r\n|-Plantation Original Dark Trinidad & Tobago - 40%|-Saint
    James Rhum Agricole Royal Ambre – 45%|\r\n|-Appleton Estate V/X 40%|-Barbancourt
    Rhum Three Stars – 40%|\r\n|-Flor de Cana Black Label 5Anos 40%||\r\n|-Malecon
    Gran Reserva 8Anos 40%||\r\n|-Siboney Reserva Especial 38%||\r\n|-Cartavio Gran
    Anejo Black 3Anos 40%||\r\n|-Old Pascas Jamaica 40%||\r\n|-Robinson Cask Velvety
    41%||\r\n|-Hampden Estate Jamaica Gold 40%||\r\n|**Etwas höherpreisige Sorten:**||\r\n|-Malteco
    Anjeo Suave 10Anos 40.5%|-Clement Rhum Vieux VSOP – 40%|\r\n|-Doorly's Fine Old
    5Anos 40%|-J.Bally Rhum Ambre – 45%|\r\n|-Hampden Estate Jamaica 40%||\r\n|-Angostura
    Butterfly Dark 7Anos 40%||\r\n|-Plantation Barbados Grande Reserve 40%||\r\n|-Pusser's
    British Navy 42%||\r\n|-Appleton Estate Extra 12Anos 43%||\r\n|-Lemon Hart 151
    Overproof Demerara 75.5%||\r\n|-Pampero Aniversario 40%||\r\n|-Bristol Classic
    Caribbean Collection 40%||\r\n|**Cocktails mit dunklem Rum/Ron:**|**Cocktails
    mit dunklem Rhum:**|\r\n|[[recipe:mai-tai]]|[[recipe:last-rites]]|\r\n|[[recipe:rum-sour]]||\r\n|[[recipe:pusser-s-painkiller|Painkiller]]||\r\n|[[recipe:dark-and-stormy|Dark'n'Stormy]]||\r\n|[[recipe:anejo-highball]]||\r\n|[[recipe:zombie]]||\r\n|zahllose
    Grog's und Punches||\r\n\r\n\r\n\r\n*SchSt/rrr*\r\n\r\n\r\n[[post:JGU7ljnS|oben]]"
