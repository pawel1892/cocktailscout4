  :body: "![Lexikon Q](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:26}}/grafik.png)\r\n**QR-CODE**\r\n![QR-Code
    CocktailScout](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:39}}/grafik.png)\r\n**Quart**\r\nAltes
    Maß unterschiedlicher Volumina für Flüssigkeiten, das einem Viertel eines größeren
    entsprach.\r\n\r\n**Quarter cask (engl.)**\r\nFass mit einem Volumen von 45 -
    80 Liter, etwa einem Viertel-Barrel entsprechend, aber abhängig von der Ausgangsgröße
    der Gesamteinheit (Fass-Typ). Wenn ein Butt (Volumen ca. 500 Liter) zugrunde gelegt
    wird, können es ebenfalls ca. 125 Liter sein.\r\n\r\n**Queimada (span.)**\r\nSpanische
    Bezeichnung für ein erhitztes Getränk aus Tresterbrand und Zucker.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:156}}/queimada.jpg
    \"small\")\r\n\r\n**Quentão (port.)**\r\nSo nennt man in Portugal den Glühwein.\r\n\r\n**Queue
    (franz.)**\r\nAltes Maß für Flüssigkeiten wie Weinbrand und Wein, mit sehr großen
    Unterschieden der Volumina.\r\n\r\n**Quinado (span./port.)**\r\nMit Chinarinde
    aromatisierter Dessertwein, wird wie Port, oder Sherry produziert.\r\n\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]\r\n"
