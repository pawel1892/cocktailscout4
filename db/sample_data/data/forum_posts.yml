  :body: "![Lexikon J](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:18}}/grafik.png)\r\n**Jaune
    (franz.)**\r\nSteht für gelb\r\n\r\n**Jenever (niederl., belg.)**\r\nSiehe [[post:RBQLgPHt|<u>Genever</u>]]\r\n\r\n**Jerez
    (span.)**\r\nWeinbauregion in Andalusien, Heimat des Sherry.\r\n\r\n**Jeroboam
    (Ursprung sumer.?)**\r\nFlaschengröße für Schaumwein mit einem Fassungsvermögen
    von 3 Litern. Auch Doppelmagnum genannt.\r\n\r\n**Jigger (engl.)**\r\nAmerikanischer
    slang für 1,5 oz, entspricht 4,4 cl. Siehe unter [[post:6gwRnHPv|<u>\"Barmaße\"</u>]]
    in den Tipps für den Barneuling.\r\n\r\n**[[wiki:barwerkzeuge|Jigger (engl.)]]**\r\nMessbecher,
    in dem das Maß eines Jiggers hineinpasst. \r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:140}}/a6.jpg
    \"medium\")\r\n\r\n**[[wiki:tequila|Joven (mex.-span.)]]**\r\nEine von fünf Alterungsbezeichnungen
    beim Mezcal. Ungelagerter Brand, der mit Etwas versetzt wurde. Bestenfalls mit
    einer gelagerten Spirituose. Weiterführendes siehe unter [[post:1X6UGsPe|<u>Tequila</u>]].\r\n\r\n**Jug
    (engl.)**\r\nKrug, Kanne\r\n\r\n**Juice (engl.)**\r\nFruchtsaft, vorwiegend frisch
    gepresst. \r\n\r\n**Julep (engl.)**\r\nSiehe unter [[post:94rZApCd|<u>Bezeichnung
    der Getränke</u>]] in den Tipps für den Barneuling.\r\n\r\n**Julep Mug (engl.)**\r\nJulep
    Becher aus Silber oder Zinn z. B. für Mint Julep.\r\n\r\n**Julep Strainer (engl.)**\r\nSiehe
    [[post:zfI9J50o|<u>Barsieb</u>]]\r\n![Julep Strainer](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:188}}/Ajulep.jpg
    \"medium\")\r\n\r\n**Julienne (franz.)**\r\nSchmal geschnittene Streifen aus Früchten
    und Dergleichen. \r\n\r\n**Julienneschneider**\r\nWerkzeug um zarte Fäden von
    Früchten zu trennen.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:121}}/julienne.jpeg
    \"small\")\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]"
