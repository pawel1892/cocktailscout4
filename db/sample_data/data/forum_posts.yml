  :body: "###[[wiki:brandy-cognac-und-armagnac|Weinbeerendestillate]]\r\n\r\nUnter
    diese Kategorie lassen sich all diejenigen Destillate einordnen, die aus Weinbeeren
    gewonnen werden. Hier muss zunächst angemerkt werden, dass mit Weinbeeren die
    Früchte des jeweiligen Fruchtstandes, der Weintraube, bezeichnet werden. Die Weintraube
    wiederum ist der Fruchtstand der Weinrebe. Die englische Sammelbezeichnung für
    diese Destillate lautet Brandy und je nach Region gibt es hierfür auch wieder
    unterschiedliche Namen. Für deutsche Erzeugnisse ist beispielsweise der Name Weinbrand
    gebräuchlich. \r\n\r\n**Brandy**\r\nWird in einem Rezept nach Brandy verlangt,
    so bezieht sich dieses zumeist jedoch auf einen Brandy de Jerez. Diese Bezeichnung
    darf ein Produkt nur dann tragen, wenn es im sogenannten „Sherry Dreieck“ von
    Andalusien zwischen Jerez de la Frontera, El Puerto de Santa María und Sanlúcar
    de Barrameda destilliert und abgefüllt wurde. Ein Brandy de Jerez zeichnet sich
    im Gegensatz zu den Brandys aus anderen Ländern nicht nur durch seine schöne Schokoladennote,
    sondern auch ein besonderes Reifeverfahren aus. Nach der Destillation reifen die
    Brände nämlich in übereinander liegenden alten  Sherryfässern, dem sogenannten
    „Solera-Verfahren“. Wird aus einem unteren Fass eine bestimmte Menge Flüssigkeit
    übernommen, so läuft der Brandy aus den oben liegenden Fässern nach. \r\n\r\nDa
    durch dieses Verfahren Destillate aus unterschiedlichen Jahrgängen vermischt werden,
    erhält ein Brandy de Jerez keine Altersangabe. Er wird jedoch üblicherweise in
    drei Kategorien unterteilt: Ein „Solera“ reift mindestens sechs Monate, ein Solera
    Reserva mindestens ein Jahr und ein Solera Gran Reserva mindestens drei Jahre.
    Diese Mindestzeiten werden jedoch in der Regel deutlich überschritten.\r\n\r\n**Cognac**\r\nDie
    hochwertigste und wohl bekannteste Sorte eines Weinbeerenbrandes ist der aus Frankreich
    stammende Cognac. Diesen Namen dürfen nur diejenigen Traubenbrände tragen, welche
    in den Gebieten rund um die französische Stadt Cognac destilliert und abgefüllt
    werden. Die sechs hierfür zulässigen Gebiete, in denen die für die Destillation
    verwendeten Reben angebaut werden, lauten Grande Champagne, Petite Champagne,
    Borderies, Fins Bois, Bons Bois und Bois Ordinaires. Ein Brand, dessen Trauben
    zu mindestens 50% aus der Grande Champagne und zum restlichen Teil aus der Petite
    Champagne stammt, darf sich „Fine Champagne“ nennen. \r\n\r\nIn der Regel setzt
    sich ein Cognac aus den Destillaten von verschiedenen Anbaugebieten und Jahrgängen
    zusammen. Die Klassifizierung erfolgt nach folgenden Kriterien: Ein Cognac, dessen
    jüngstes Destillat mindestens drei Jahre lang gereift ist, wird mit V.S. (Very
    Special), einer mit Mindestreife von vier Jahren als V.S.O.P. (Very Superior Old
    Pale) und einer mit mindestens sechs Jahren Reife als X.O. (Extra Old) deklariert.
    Wie auch beim Brandy de Jerez werden beim Cognac Destillate verwendet, deren tatsächliches
    Alter weit über dem Mindestalter liegt. \r\n\r\nEinige der großen Cognachäuser
    besitzen ein sogenanntes „Paradies“, in welchem Brände ruhen, die bis in das 18.
    Jahrhundert zurückreichen. Diese Brände sind in Abfüllungen enthalten, welche
    durchaus 3.000 Euro oder auch mehr kosten können. Für Cocktails reicht allerdings
    in der Regel die Verwendung eines V.S.O.P. aus.\r\n\r\n**Armagnac**\r\nEin weiterer
    französischer Weinbeerenbrand, der eine geschützte Herkunftsbezeichnung trägt,
    ist der Armagnac. Er darf ausschließlich in den Departments Gers, Landes und Lot-et-Garonne
    der südwestlich gelegenen Region Gascogne produziert werden und gilt als die älteste
    Spirituose Frankreichs. Die Tatsache, dass Armagnac heute deutlich weniger populär
    ist als Cognac, hat ihre Ursache in der Nachkriegszeit. Durch die damalige hohe
    Nachfrage an Armagnac verbreitete sich die (falsche) Vorstellung, bei diesem handele
    es sich um ein qualitativ minderwertiges Massenprodukt des Cognac. Diesen Ruf
    konnte der Armagnac bis heute nicht ganz abschütteln. \r\n\r\nWie auch beim Cognac
    hat sich die Kategorisierung in V.S., V.S.O.P. und X.O. durchgesetzt. Hinzu kommt
    die vom Calvados bekannte Etikettierung als Hors d’Age, womit Brände bezeichnet
    werden, deren jüngstes Destillat mindestens zehn Jahre gereift ist. Auch hier
    reicht die Verwendung eines V.S.O.P. bei Cocktails völlig aus, es ist jedoch nichts
    dagegen einzuwenden, für den A&B (Armagnac & Bénédictine) ein höherklassiges Produkt
    zu verwenden.\r\n\r\n**Pisco**\r\nMacht man einen Sprung über den großen Teich,
    so findet man in Lateinamerika mit dem Pisco eine weitere Sorte des Weinbeerenbrandes.
    Der Pisco ist die Nationalspirituose von Chile und Peru und beide Länder streiten
    seit Jahrhunderten um das exklusive Recht auf seinen Namen. Wie auch beim Brandy
    de Jerez, Cognac und Armagnac und im Gegensatz zu Tresterbränden, wie dem Grappa,
    wird das Destillat aus dem Saft frischer Trauben gewonnen. Beim peruanischen Pisco
    wird der Alkoholgehalt von 40% dabei bereits im ersten Destillationsvorgang erreicht.
    \r\n\r\nMan unterscheidet den Pisco Puro, der aus einer einzigen Traubensorte
    gewonnen wird, vom aus zwei oder mehr Traubensorten hergestellten Pisco Acholado.
    Eine dritte Kategorie ist der durch seinen speziellen Herstellungsprozess charakterisierte
    Pisco Mosto Verde, bei welchem der Transformationsprozess von Zucker in Alkohol
    unterbrochen wird und so ein süßerer und weicherer Pisco entsteht.\r\n\r\nEmpfehlenswerte
    Brandys für den Einsteigerbarstock bis 20€ / 0,7L: \r\n- *Carlos III*\r\n- *Osborne
    Veterano*\r\n- *Osborne 103*\r\n- *Torres 10*\r\n\r\nIm Preisbereich um 25€/0,7L
    kämen dann folgende Produkte in Frage: \r\n- *Cardenal Mendoza*\r\n- *Carlos I*\r\n-
    *Lustau Solera Reserva*\r\n\r\nEmpfehlenswerte Cognacs im preislichen Bereich
    um 30€/0,7L wären:\r\n- *Courvoisier V.S.O.P.*\r\n- *Otard V.S.O.P.*\r\n- *Remy
    Martin V.S.O.P.*\r\n\r\nBekannte Cocktails mit Brandy und Cognac:\r\n[[recipe:a-amp-b|B&B]]
    wie A&B\r\n[[recipe:between-the-sheets]]\r\n[[recipe:brandy-alexander]]\r\n[[recipe:brandy-crusta]]\r\n[[recipe:sidecar]]\r\n[[recipe:stinger]]\r\n\r\nBekannte
    Cocktails mit Armagnac:\r\n[[recipe:a-amp-b]]\r\n\r\n\r\nBekannte Cocktails mit
    Pisco:\r\n[[recipe:judgment-day]]\r\n[[recipe:pisco-sour]]\r\n[[recipe:pisco-punch]]\r\n
    \                                                     \r\n*F.B.*\r\n\r\n[[post:JGU7ljnS|oben]]"
  :body_bbcode: "[b]Weinbeerendestillate[/b]\r\n\r\nUnter diese Kategorie lassen sich
    all diejenigen Destillate einordnen, die aus Weinbeeren gewonnen werden. Hier
    muss zunächst angemerkt werden, dass mit Weinbeeren die Früchte des jeweiligen
    Fruchtstandes, der Weintraube, bezeichnet werden. Die Weintraube wiederum ist
    der Fruchtstand der Weinrebe. Die englische Sammelbezeichnung für diese Destillate
    lautet Brandy und je nach Region gibt es hierfür auch wieder unterschiedliche
    Namen. Für deutsche Erzeugnisse ist beispielsweise der Name Weinbrand gebräuchlich.
    \r\n\r\nWird in einem Rezept nach Brandy verlangt, so bezieht sich dieses zumeist
    jedoch auf einen Brandy de Jerez. Diese Bezeichnung darf ein Produkt nur dann
    tragen, wenn es im sogenannten „Sherry Dreieck“ von Andalusien zwischen Jerez
    de la Frontera, El Puerto de Santa María und Sanlúcar de Barrameda destilliert
    und abgefüllt wurde. Ein Brandy de Jerez zeichnet sich im Gegensatz zu den Brandys
    aus anderen Ländern nicht nur durch seine schöne Schokoladennote, sondern auch
    ein besonderes Reifeverfahren aus. Nach der Destillation reifen die Brände nämlich
    in übereinander liegenden alten  Sherryfässern, dem sogenannten „Solera-Verfahren“.
    Wird aus einem unteren Fass eine bestimmte Menge Flüssigkeit übernommen, so läuft
    der Brandy aus den oben liegenden Fässern nach. \r\n\r\nDa durch dieses Verfahren
    Destillate aus unterschiedlichen Jahrgängen vermischt werden, erhält ein Brandy
    de Jerez keine Altersangabe. Er wird jedoch üblicherweise in drei Kategorien unterteilt:
    Ein „Solera“ reift mindestens sechs Monate, ein Solera Reserva mindestens ein
    Jahr und ein Solera Gran Reserva mindestens drei Jahre. Diese Mindestzeiten werden
    jedoch in der Regel deutlich überschritten.\r\n-\r\nDie hochwertigste und wohl
    bekannteste Sorte eines Weinbeerenbrandes ist der aus Frankreich stammende Cognac.
    Diesen Namen dürfen nur diejenigen Traubenbrände tragen, welche in den Gebieten
    rund um die französische Stadt Cognac destilliert und abgefüllt werden. Die sechs
    hierfür zulässigen Gebiete, in denen die für die Destillation verwendeten Reben
    angebaut werden, lauten Grande Champagne, Petite Champagne, Borderies, Fins Bois,
    Bons Bois und Bois Ordinaires. Ein Brand, dessen Trauben zu mindestens 50% aus
    der Grande Champagne und zum restlichen Teil aus der Petite Champagne stammt,
    darf sich „Fine Champagne“ nennen. \r\n\r\nIn der Regel setzt sich ein Cognac
    aus den Destillaten von verschiedenen Anbaugebieten und Jahrgängen zusammen. Die
    Klassifizierung erfolgt nach folgenden Kriterien: Ein Cognac, dessen jüngstes
    Destillat mindestens drei Jahre lang gereift ist, wird mit V.S. (Very Special),
    einer mit Mindestreife von vier Jahren als V.S.O.P. (Very Superior Old Pale) und
    einer mit mindestens sechs Jahren Reife als X.O. (Extra Old) deklariert. Wie auch
    beim Brandy de Jerez werden beim Cognac Destillate verwendet, deren tatsächliches
    Alter weit über dem Mindestalter liegt. \r\n\r\nEinige der großen Cognachäuser
    besitzen ein sogenanntes „Paradies“, in welchem Brände ruhen, die bis in das 18.
    Jahrhundert zurückreichen. Diese Brände sind in Abfüllungen enthalten, welche
    durchaus 3.000 Euro oder auch mehr kosten können. Für Cocktails reicht allerdings
    in der Regel die Verwendung eines V.S.O.P. aus.\r\n-\r\nEin weiterer französischer
    Weinbeerenbrand, der eine geschützte Herkunftsbezeichnung trägt, ist der Armagnac.
    Er darf ausschließlich in den Departments Gers, Landes und Lot-et-Garonne der
    südwestlich gelegenen Region Gascogne produziert werden und gilt als die älteste
    Spirituose Frankreichs. Die Tatsache, dass Armagnac heute deutlich weniger populär
    ist als Cognac, hat ihre Ursache in der Nachkriegszeit. Durch die damalige hohe
    Nachfrage an Armagnac verbreitete sich die (falsche) Vorstellung, bei diesem handele
    es sich um ein qualitativ minderwertiges Massenprodukt des Cognac. Diesen Ruf
    konnte der Armagnac bis heute nicht ganz abschütteln. \r\n\r\nWie auch beim Cognac
    hat sich die Kategorisierung in V.S., V.S.O.P. und X.O. durchgesetzt. Hinzu kommt
    die vom Calvados bekannte Etikettierung als Hors d’Age, womit Brände bezeichnet
    werden, deren jüngstes Destillat mindestens zehn Jahre gereift ist. Auch hier
    reicht die Verwendung eines V.S.O.P. bei Cocktails völlig aus, es ist jedoch nichts
    dagegen einzuwenden, für den A&B (Armagnac & Bénédictine) ein höherklassiges Produkt
    zu verwenden.\r\n-\r\nMacht man einen Sprung über den großen Teich, so findet
    man in Lateinamerika mit dem Pisco eine weitere Sorte des Weinbeerenbrandes. Der
    Pisco ist die Nationalspirituose von Chile und Peru und beide Länder streiten
