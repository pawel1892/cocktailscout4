  :body: "![Lexikon I](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:17}}/grafik.png)\r\n**IBA**\r\nAbkürzung
    für International Bartenders Association, weltweit wichtigste Bartender-Organisation.
    Definiert offizielle Cocktailrezepturen und veranstaltet internationale Wettbewerbe.
    Zielsetzung ist die Standardisierung von Cocktails in den Ländern ist.\r\n\r\n\r\n**[[wiki:eis|Ice-Crusher
    (engl.)]]**\r\nGerät um größere Eisstücke in crushed ice zu zermahlen. Erhältlich
    als elektrische Version, oder per Kurbel bedienbare.\r\n\r\n**[[wiki:eis|Ice-Cube
    (engl.)]]**\r\nEiswürfel, größere Eisstücke. Siehe auch [[post:JGU7ljnS|<u>\"Benötigte
    Barutensilien\"</u>]] in den Tipps für den Barneuling.\r\n\r\n**Igristoje (russ.)**\r\n[[post:LCsqyzy7|<u>Schaumwein</u>]]
    mit Herstellungsverfahren wie Champagner, doch ohne regionalem Schutz. Fälschlicher
    Weise wird Igristoje oft mit der althergebrachten Bezeichnung Schampanskoje tituliert.
    \r\n\r\n**Imperial**\r\nNormal-Flaschengröße für Schaumwein mit einem Fassungsvermögen
    von 0,75 Liter. \r\n\r\n**Infusion**\r\nAromatisieren einer Flüssigkeit durch
    Früchte, Gewürze, Tee und Dergleichen. Die Aroma  abgebenden Teile werden eine
    gewisse Zeit in Flüssigkeit eingelegt (Mazeration).\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:36}}/grafik.png
    \"medium\")\r\n\r\n**Invecchiamento (ital.)**\r\nItalienisch für Alterung, der
    Zusatz \"minimo\" bezeichnet eine Mindestlagerzeit. Invecchiato:  im Fass, oder
    Flasche gelagert. \r\n\r\n**Invertzucker**\r\nGemenge aus Glucose (Traubenzucker)
    und Fructose (Fruchtzucker).\r\n\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]"
