  :body: "also dann fang ich doch mal an....\n\r\nich wohne in Neuss am Rhein (kennen
    vielleicht einige) und mein Favorite ist die Cocktailbar Bahia,eine von außen
    relativ kleine Cocktailbar aber drinnen ist es dagegen überraschend geräumig.Fröhliche
    orangefarbene Wände, grüne Pflanzen und Urlaubsmusik sorgen für die richtige Atmosphäre.\n\r\nBesonderheiten:\n\r\n1)
    Zwei riesige Sofas, die man auch mieten kann\n\r\n2) Alle paar Wochenenden Bahiah-Party
    im dortigen Partykeller\n\r\n3) Happy Hour von 20-21 Uhr (Longdrinks 3¤, Cocktails
    4¤)\n\r\nNegative Aspekte:\n\r\nDie Bedienungen wechseln häufig und sind daher
    meistens nicht eingearbeitet und je nach Geschmack geht einem die Musik nach einiger
    Zeit auf die Nerven.\n\r\n\n\r\nEbenfalls zu empfehlen ist das Athisha, eine Shisha-Bar
    mit einem guten Cocktailangebot am Marktplatz gelegen.\n\r\nMan sitzt auf bequemen
    Sofas, die kleinen Tische sind aus dunklem Holz und es gibt viele Kerzen, allesin
    allem orientalisches Flair.\n\r\nBesonderheiten:\n\r\n1)Wasserpfeife mit Tabak
    nach Wahl für 5¤\n\r\n2)ebenfalls Happy Hour und auch sonst rehct billig (Long
    Island Icetea in einem Wizenglas :-s für 6,50¤)\n\r\n\n\r\nDie Musik ist größtenteils
    House und R´n´B (also Geschmackssache)\n\r\nNegatives:\n\r\n1) Oft sehr voll,dann
    müssen manche auf unbequemen Hockern sitzen oder es wird sehr sehr eng, das stört
    vor allem wenn man mit mehr als 4-6 Leuten unterwegs ist.\n\r\n\n\r\nso viel zu
    den Cocktaillocations in Neuss.\n\r\nViel Spaß beim ausprobieren!!!"
