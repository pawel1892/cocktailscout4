  :body: "Moin zusammen,\n\r\n\n\r\nhab von ´nem Kollegen zwei Flaschen noch originalverschlossene
    Whiskyflaschen zugesteckt bekommen die Opa noch im Keller stehen hatte:\n\r\n\n\r\nVielleicht
    könnt Ihr mir helfen und was zu diesen Flaschen sagen, bevor ich sie öffne.\n\r\nSo
    ob sie etwas besser sind als für Whisky-Cola oder Abfluß... :-)\n\r\n\n\r\nFlasche
    1:\n\r\nHAIG - Blended Scotch Whisky\n\r\nGold Label\n\r\nJohn HAIG und Co. Ltd.\n\r\nDistillers
    Markinch Scotland\n\r\n\n\r\nAusländisches Erzeugnis\n\r\n43Vol.%\n\r\nSchneider
