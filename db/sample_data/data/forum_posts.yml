  :body: "![Lexikon E](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:13}}/grafik.png)\r\n**Eau
    de vie (franz.)**\r\n\"Lebenswasser\", Aus Weintrester, oder Obst destillierter
    Schnaps. Oberbegriff für alle klaren Obstbrände wie Grappa, Calvados (in der Reifung)
    oder Kirsch.\r\n\r\n**Ebbelwoi (hess.)**\r\nSüdhessischer Ausdruck für [[post:TizOWyNh|<u>Apfelwein</u>]].\r\n\r\n**Eggnog
    (engl.)**\r\nSiehe unter [[post:94rZApCd|<u>Bezeichnung der Getränke</u>]] in
    den Tipps für den Barneuling.\r\n\r\n**Eierwein**\r\nEin in Weinregionen beliebtes
    Mischgetränk aus Muskat, Nelke, Zimt, Zucker, welche in Weinbrand ziehen. Anschließend
    Wein und Zitronensaft hiermit erwärmen und unter stetigem Rühren Eier hinzugefügen.
    Seit alters her als Stärkungswein besonders zum neuen Jahr, oder Ostern gereicht.
    \r\n\r\n**Eiskübel**\r\nDient zur Kühlung von Champagner-, Weinflaschen u. ä.,
    außerdem zur Zwischenlagerung von Eiswürfeln als Eisbehälter für die Bararbeit.
    \r\n\r\n**Eispickel**\r\nWerkzeug, mit dem Eis in passende Stücke zerstoßen wird.
    Erhältlich mit einem Dorn und mehrfach bis zu sechs Dornen. \r\n\r\n**Eisschaufel**\r\nErlaubt
    hygienisches Befüllen des Glases / Shakers mit Eis.\r\n\r\n**Eiszange**\r\nHygienisches
    Befüllen des Glases / Shakers mit Eis, ist dosiert hiermit möglich.\r\n\r\n**Elbow-Press
    (engl.)**\r\nZitruspresse, deren Hebelarme mit einem Kniehebelmechanismus verbunden
    sind. Die Saftgewinnung ist zwar weniger effizient als bei einer Haushaltspresse.
    Doch der Ertrag ist klarer, Bitterstoffe werden zurück gehalten, weil keine Fruchthäute
    zerrieben werden.  \r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:117}}/Elbow-Press.jpg
    \"small\")\r\n\r\n**Elderflower (engl.)**\r\nHolunderblüten des Holunderbusches,
    die ihr Aroma dem -Likör (z. B. St-Germain), oder -Sirup abgeben. Verleiht Cocktails
    ein feines florales Aroma.\r\n\r\n**Enzian**\r\nBitterer Brand aus der Wurzel
    des im Alpenraum wachsenden, gelbblühenden Enzians (Gentiana lutea). Das regionale
    Wissen, die Ernte und Herstellung des Enzian sind von der UNESCO als immaterielles
    Kulturerbe anerkannt. Verschiedene Heilwirkungen werden ihm zugeschrieben. Charakteristisch
    bitterer, erdiger Geschmack.\r\n\r\n**Espuma (span.)**\r\nSchaum, bedeutet in
    der Cocktailwelt, mit Aromen angereichert. Schnelle Herstellung mit einem Sahne-,
    Espuma-Siphon. Seit Entwicklung der Molekularküche ein probates Mittel, mit aromatisiertem
    Schaum auf Cocktails Aufmerksamkeit zu erregen. \r\n\r\n**Essenz**\r\nExtrakt,
    einem Bitters im Aussehen und Verwendung ähnlich. Im Gegensatz dazu bestehen Essenzen
    lediglich aus einer Grundzutat, Alkohol und Wasser.\r\n\r\n**Extra Añejo (span.)**\r\nEine
    von fünf Alterungskategorien beim Mezcal. Entspricht einer Lagerung im Eichenholzfass
    über drei Jahre. Weiterführendes siehe unter [[post:1X6UGsPe|<u>Tequila</u>]].\r\n\r\n**Extra-sec**\r\nExtra
    trockene Schaumweine deren Restzucker 12 - 20 g/l beträgt. \r\n\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]"
  :body_bbcode: "[IMG]https://image.jimcdn.com/app/cms/image/transf/none/path/s34ef2c3ad959eb14/image/i52ac4228b382c5f5/version/1554062834/e.jpg[/IMG][color=#fefefe]E[/color]\r\n\r\n[b]Eau
