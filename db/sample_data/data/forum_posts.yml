    mit Herstellungsverfahren wie Champagner, doch ohne regionalem Schutz.\r\n\r\n[b]Crème
    de Cerises (franz.)[/b]\r\nKirschlikör\r\n\r\n[b]Crème de Ciel (franz.)[/b]\r\nCreme
    des Himmels, andere Bezeichnung für Blue Curaçao\r\n\r\n[b]Crème de Fraise /-
