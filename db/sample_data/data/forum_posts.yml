  :body: "Hallo zusammen,\r\n\r\nfrohe Ostern! Es ist endlich so weit: Wie versprochen,
    habe ich die alte BBCode-Syntax durch Markdown ersetzt. Außerdem habe ich den
    Editor überarbeitet, sodass ihr Bilder nun direkt hier hochladen könnt.\r\n\r\nKeine
    Sorge, ihr müsst Markdown nicht extra lernen – fast alles lässt sich über die
    Buttons im Editor erledigen. Wer jedoch lieber nur mit der Tastatur arbeitet,
    wird Markdown sehr praktisch finden. Im folgenden Post zeige ich euch daher die
    gesamte Markdown-Syntax.\r\n\r\nDiese werden wir künftig auch im Wiki und im Blog
    benutzen. Hier könnt ihr also schon einmal üben!\r\n"
