  :body: "###Gläser\r\n\r\nDie richtige Wahl des Glases trägt viel dazu bei, dass
    einem der Drink gefällt und schmeckt. Deswegen zeigen wir hier eine Auswahl gebräuchlicher
    Formen für euer neues Hobby. Mit den Gläsern ist es wie mit anderen Dingen ebenfalls,
    es gibt nicht nur das ultimative Glas. Hier die unterschiedlichen Varianten und
    Größen als Anregung und Hilfe, nicht als Muss.\r\n\r\n[***Longdrinkglas***](https://www.barstuff.de/longdrinkglaeser/)
    Größe: ca. 200 ml bis 450 ml, für Drinks mit viel Eis, Säften oder Tonic und dergleichen.,
    zur Kategorie Longdrinkglas zählt auch das [***Collins-Glas***](https://en.wikipedia.org/wiki/Collins_glass)
    Größe 200 ml bis 350 ml, schmales hohes Glas für Collinses, bekanntester Vertreter
    ist der Tom Collins. Weiter das [***Highballglas***](https://www.barstuff.de/highballglas-manhattan-onis-225ml-12-stk-9651?gad_source=1&gad_campaignid=21516075273&gclid=EAIaIQobChMIgKqz6ZTckgMVx4CDBx0zwjPYEAQYASABEgKlzvD_BwE)
    auch [***DOF (Double-old-fashioned-Glas)***](https://www.barstuff.de/duble-old-fashioned-glaeser/)
    s. u., ein stabiles Glas für einfach aufgebaute Drinks wie z. B. Gin Tonic, aber
    auch zum Muddlen (Zerquetschen) von Früchten wie  beim Mojito. Für den Anfang
    reicht ein Glastyp. In den meisten Fällen wird ein stabiles Glas zum Muddlen bevorzugt.\r\n\r\n[***Fancy-***](https://www.barstuff.de/fancy-glaeser/)
    und [***Hurricane-Glas***](https://www.barstuff.de/hurricane-cocktailglas-25cl-oder-44cl-1vpe.html?gad_source=1&gad_campaignid=20638648238&gclid=EAIaIQobChMIytO-spXckgMVx5aDBx23nBDkEAQYAiABEgJv_fD_BwE)
    Größe ca. 200 ml bis 450 ml, zeichnet sich durch eine geschwungene Form  mit kurzem
    Stiel aus. Zum Beispiel für Drinks mit exotischen Fruchtsäften, Sahne, Coconut-Cream,
    typisches Beispiel die Piña Colada. Die Alternative zu diesem Typ ist ein Bierglas
    mit Stiel, möglichst ohne Werbeaufdruck.\r\n\r\n[***Tumbler***](https://www.barstuff.de/tumbler/)
    auch [***Old-fashioned-Glas***](https://www.barstuff.de/old-fashioned-glaeser/)
    oder [***Whiskyglas***](https://www.barstuff.de/whiskyglaeser/) Größe ca. 140
    ml – 300 ml, ist ein kurzes, breites Glas mit einem dicken Boden. Wird u. a. bevorzugt
    für Drinks mit Whisk(e)y. Die Variante [***Double-old-fashioned-Glas, kurz DOF***](https://www.barstuff.de/duble-old-fashioned-glaeser/)
    Größe max. 480 ml wird auch Highballglas oder Longdrinkglas genannt s. o..\r\n\r\n[***Martiniglas***](https://www.barstuff.de/martiniglaeser/)
    Größe ca. 150 ml bis 220 ml normal groß, gibt es auch doppelt so groß, ist das
    Cocktailglas schlechthin und wird auch ***Martinispitz***, ***Martinikelch***,
    ***Martinischale***, ***Cocktailglas*** genannt. Der Klassiker hier, der Martini,
    ein Shortdrink mit Gin als Hauptbestandteil. Das Martiniglas gehört zu den [***Cocktailschalen***](https://www.barstuff.de/barlexikon-cocktailschale/),
    wie auch die [***Champagner-, Sektschale***](https://www.barstuff.de/search?search=champagnerschale)
    mit einem zumeist geringerem Fassungsvermögen ca. 160 ml bis 200 ml.\r\n\r\n [***Margaritaglas***](https://www.barstuff.de/margaritaglaeser/)
    Größe ca. 200 ml bis 350 ml in der normalen Ausführung, auch ***Margaritaschale***,
    gehört ebenfalls zu den [***Cocktailschalen***](https://www.barstuff.de/barlexikon-cocktailschale/)
    und wird, wie der Name verrät, für Margaritas verwendet. Ist das am wenigsten
    gebräuchliche Glas und leicht durch eine Champagnerschale oder Martiniglas zu
    ersetzen.\r\n\r\n[***Nosingglas***](https://www.barstuff.de/barlexikon-nosing-glas/)
    Größe ab ca. 170 ml, ein  sich zum Rand verjüngendes Glas um die verschiedensten
    Aromen des Getränkes zu sammeln, dem Genießenden zur Nase zu führen. Darunter
    fallen auch Cognacschwenker oder Weingläser. Hauptsächlich benutzt bei einer Purverkostung
    hochwertiger Getränke bzw. Cocktails.\r\n\r\n[***Tiki-Mug***](https://www.barstuff.de/tiki-glaeser/)
    oder ***Tiki-Becher***, Größe ca. 300 ml bis 600 ml in der normalen Form, ein
    spezielles Gefäß für Rum-, Tikiliebhaber. In unseren Regionen wohl eher die ungewöhnlichste
    Form ein Getränk zu servieren.\r\n\r\n[***Shooterglas, Shotglas***](https://www.barstuff.de/schnapsglaeser/)
    Größe ca. 40 ml bis 60 ml ist vereinfacht ein hohes Schnapsglas für alle kurzen
    Drinks, wie zum Beispiel B 52.\r\n\r\nEs gibt weitere Spezialformen an Gläsern,
    wie den noch nicht erwähnten Sektkelch oder die Likörschale. Manche davon können
    für das ein oder andere Mixgetränk benutzt werden, nötig sind sie keinesfalls.
    Halten wir fest, die gebräuchlichen Formen sind Longdrinkgläser, Martinigläser,
    Tumbler, Nosinggläser.\r\n\r\n|Longdrink|Fancy|Hurricane|Tumbler|Old Fashioned|\r\n|:---:|:---:|:---:|:---:|:---:|:---:|\r\n|[![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:85}}/a11.jpg
    \"small\")](https://www.barstuff.de/longdrinkglaeser/)|[![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:86}}/a12.jpg
    \"small\")](https://www.barstuff.de/fancy-glaeser/)|[![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:87}}/a13.jpg
    \"small\")](https://www.barstuff.de/squall-american-barglass-429ml.html)|[![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:88}}/a14.jpg
    \"small\")](https://www.barstuff.de/tumbler/)|[![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:89}}/a15.jpg
    \"small\")](https://www.barstuff.de/spiegelau-psc-old-fashioned-270ml.html)|\r\n\r\n|Shooter|Martini|Margarita|Nosing|Tiki|\r\n|:---:|:---:|:---:|:---:|:---:|\r\n|[![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:90}}/a16.jpg
    \"small\")](https://www.barstuff.de/fluted-whiskey-glas-shooters-shots-libbey-44ml-1368G)|[![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:91}}/a17.jpg
    \"small\")](https://www.barstuff.de/martiniglaeser/)|[![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:92}}/a18.jpg
    \"small\")](https://www.barstuff.de/margaritaglaeser/)|[![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:93}}/a19.jpg
    \"small\")](https://www.barstuff.de/barlexikon-nosing-glas/)|[![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:94}}/a20.jpg
    \"small\")](https://www.barstuff.de/tiki-glaeser/)|\r\n\r\n\r\n*rrr/jean.11*\r\n\r\n\r\n[[post:JGU7ljnS|oben]]"
