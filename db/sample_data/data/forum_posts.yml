    hier bieten sich noch mehr Möglichkeiten im nächst höheren preislichen Segment
    bis 25 Euro:\r\n- [i]Papidoux X.O.[/i]\r\n- [i]Pere Magloire V.S.O.P.[/i] \r\n\r\nCocktails
