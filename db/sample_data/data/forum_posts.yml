  :body: "![Lexikon K](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:19}}/grafik.png)\r\n**Kapselheber**\r\nÖffner
    für Flaschen mit einem Kronkorken-Verschluß.\r\n\r\n**Kaoliang (chin.)**\r\nHirsewein,
    hat mit Wein wenig gemein, sondern ist ein hochprozentiger (über 60%) aus fermentierter
    Hirse gebrauter Likör. Allgemein auch als chinesischer Vodka bezeichnet.\r\n\r\n**Karaffe**\r\nWohlgeformter
    Glasbehälter für Flüssigkeiten, oft mit eingeschliffenem Glasstopfen.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:150}}/karaffe.jpg
    \"small\")\r\n\r\n**Kellnerbesteck**\r\nPraktisches Werkzeug mit Korkenzieher,
    Kapselheber, Kapselschneider. Korken lassen sich hiermit fast mühelos durch Hebelwirkung
    aus der Flasche entfernen.\r\n\r\n**[[wiki:brandy-cognac-und-armagnac|Kognak]]**\r\nDeutsche,
    weniger gebräuchliche Schreibweise für [[post:Zr3AN86u|<u>Cognac.</u>]]\r\n\r\n**Korinthenbrand**\r\nBrand
    ausschließlich von Korinthen der Beeren Muscat of Alexandria und Schwarze Korinth.
    Darf keine weiteren Zusätze erhalten, lediglich Zuckercouleur zur Farbanpassung.
    Auch Raisin Brandy genannt.\r\n\r\n**Korken**\r\nFlaschenverschluß für Wein, Schaumwein,
    Brände u. ä. aus der Rinde von Korkeichen im mediterranen Raum. Die erste Gewinnung
    von Kork erfolgt nach einem Alter des Baumes von ca. 40 Jahren.\r\n\r\n*\"Schüttle
    den Staat, wie du willst. Nie wirst du etwas bedeuten. Leicht auf der Fläche schwimmt
    immer und ewig der Kork.\" Friedrich von Schiller (1759 - 1805)*\r\n\r\n**[[wiki:barwerkzeuge|Korkenzieher]]**\r\nWerkzeug,
    das Weinflaschen u. ä. entkorkt. Von simpel bis zur Gastroausführung sind viele
    Varianten erhältlich.\r\n\r\n**Kracherl (bayr./öster.)**\r\nDie Bezeichnung in
    Oberbayern und Teilen Österreichs für Limonade, siehe dort.\r\n\r\n**Kronkorken**\r\nMetallverschluß
    für Flaschen, deren Inhalt vorzugsweise mit Kohlensäure angereichert ist. Das
    Metall wird am Hals der Flasche nach unten gebogen, faltet sich zu einer Art Krone.
    Zur Abdichtung befand sich früher im Inneren der Kapsel Korkmaterial, dass heute
    vorwiegend durch Kunststoff ersetzt wird.\r\n\r\n**Kugelausstecher**\r\nLöffelartiges,
    halbkugelförmiges Messer um Kugeln aus Früchten zu schneiden. Unterschiedliche
    Größen im Handel. Auch Pariser Messer genannt.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:143}}/kugelausstecher.jpg
    \"small\")\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]"
  :body_bbcode: "[IMG]https://image.jimcdn.com/app/cms/image/transf/none/path/s34ef2c3ad959eb14/image/ifbc28d7d030ca15e/version/1554118132/k.jpg[/IMG][color=#fefefe]K[/color]\r\n\r\n[b]Kapselheber[/b]\r\nÖffner
    für Flaschen mit einem Kronkorken-Verschluß.\r\n\r\n[b]Kaoliang (chin.)[/b]\r\nHirsewein,
