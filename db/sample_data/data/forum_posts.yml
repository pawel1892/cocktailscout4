  :body: "![Lexion U](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:30}}/grafik.png)\r\n**Umeshu
    (jap.)**\r\nLikör aus der asiatischen Umefrucht, eine Aprikosenart. Landläufige
    Bezeichnung in unseren Regionen  \"Pflaumenwein\", doch obwohl der alkoholische
    Anteil eher dem eines Weines entspricht, handelt es sich um Likör.\r\n\r\n**Unabhängig**\r\nGemacht
    von Genießern für Genießer ist Cocktailscout. Diese Seite unterliegt keinem Sponsoring,
    auch nicht, wie so viele, die Cocktailseite eines Herstellers. Wir unterliegen
    keinem Diktat, allein der Geschmack zählt.\r\n\r\n**Untersetzer**\r\nHerstellung
    aus verschiedenen Materialien, wie Glas, Metall, Stoff, Holz usw., schont den
    Tisch / Tresen vor Kratzern und schwitzenden Gläsern. Englische Bezeichnung Coaster.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:167}}/untersetzer.jpg
    \"small\")\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]\r\n"
