  :body: "Aus Belgien kommt ein Klosterbier, welches immer noch ausschließlich von
    Mönchen gebraut wird und einen sehr guten Geschmack haben soll. Es ist das Trappistenbier.
    Sehr hoch im Alkoholgehalt, so 6% - 8%.\n\r\n\n\r\nDa wir belgische Freunde haben,
    versuchte ich hierüber mal das Bier zu beziehen. Aber selbst die haben keine Bezugsquelle.
    Es soll schon über Monate ausverkauft sein. Der Erlös dieses Bieres wird komplett
    sozialen Zwecken zugeführt."
