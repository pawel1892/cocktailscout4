  :body: "![Lexikon R](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:27}}/grafik.png)\r\n**Raicilla
    (mex.)**\r\nAgavenbrand, im Vergleich zum Tequilla, der nur aus der blauen Agave
    gebrannt werden sollte, kommen beim Raicilla verschiedene Agavensorten zum Einsatz
    und erhält hierdurch ein anderes Aromenprofil.\r\n\r\n**Raisin Brandy**\r\nSiehe
    [[post:HG4n9d6i|<u>Korinthenbrand</u>]]\r\n\r\n**Raki (türk.)**\r\nTürkische Spirituose
    mit Anis aromatisiert.\r\n\r\n**Ratafia**\r\nAperitif aus Weinbrand und Traubenmost.\r\n\r\n**Ratafia
    catalana**\r\nKatalanischer Likör aus grünen Walnüssen und Kräutern. Wird u. a.
    in vielen Haushalten selbst hergestellt und auf eigens für diesen Likör veranstalteten
    Messen im Spätherbst präsentiert.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:157}}/Ratafia%20catalana.jpg
    \"small\")\r\n\r\n**Rehoboam (Ursprung sumer.?)**\r\nFlaschengröße für Schaumwein
    mit einem Fassungsvermögen von 4,5 Litern.\r\n\r\n**Reposado (mex./span.)**\r\nEine
    von fünf Alterungskategorien beim Mezcal. Umfasst eine Lagerung von 2 Monaten
    bis zu einem Jahr im Eichenholzfass. Weiterführendes siehe unter [[post:1X6UGsPe|<u>Tequila</u>]].\r\n\r\n**Reserva
    (span./port.)**\r\nSpanisch, portugiesische Bezeichnung mit ähnlichen Anforderungen
    wie im italienischen Riserva, siehe dort.\r\n\r\n**Rich syrup (engl.)**\r\nLäuterzucker
    im Verhältnis 2 Teile Zucker auf 1 Teil Wasser.\r\n\r\n**Rickey (engl.)**\r\nAlte
    Getränkekategorie aus einer Spirituose wie z. B. Gin, Limettenhälfte, Zucker/Sirup/Likör,
    aufgefüllt mit Soda in einem Highball, auch Old-fashioned-Glas auf Eiswürfeln
    serviert.\r\n\r\n**Rinse (engl.)**\r\nAusspülen, bezeichnet ein Glas aromatisieren
    mit wenigen Tropfen eines Destillates und anschließendem ausschütten.\r\n\r\n**Riserva,
    Riserva Speciale (ital.)**\r\nItalienische Bezeichnung für erhöhte Qualitätsanforderung
    mit längerer Lagerung. Bei Speciale erhöhen sich diese Anforderungen.\r\n\r\n**Roh-Rohrzucker**\r\nTeilraffinierte
    Zuckerart aus Zuckerrohr hergestellt, mit einem Melasseanteil bis zu 1%. In weißen
    und braunen Ausführungen erhältlich, die sonst aber keinen Unterschied aufweisen.
    Besitzt einen leichten Melassegeschmack. Mit einem Melasseanteil von 2% bis 3%
    wird dieser Zucker Demerarazucker genannt.\r\n\r\n**Rohrzucker**\r\nZuckerart
    aus Zuckerrohr hergestellt, chemisch identisch mit Rübenzucker. In weißen und
    braunen Ausführungen erhältlich, nicht zu verwechseln mit Roh-Rohrzucker, oder
    gar [[post:JxuXJV3j|<u>Vollrohrzucker</u>]], siehe dort.\r\n\r\n**Rojo (span.)**\r\nSteht
    im spanischen für rot bei Vermouth, Weinen etc..\r\n\r\n**Ron / Rhum / Rum**\r\nSiehe
    unter [[post:JGU7ljnS|<u>Zuckerrohrdestillate</u>]] in den Tipps für den Barneuling.\r\n\r\n*\"So
    geht es mit Rum: Erst bist du froh, dann fällst du um.\" frei nach Wilhelm Busch
    (1832 - 1908)*\r\n\r\n**Rosolio (ital.)**\r\nLikör-Kategorie bestehend zu gleichen
    Teilen aus Alkohol, Wasser, Zucker, die am Schluss mit Rosenwasser aromatisiert
    wird. \r\n\r\n**Rosso (ital.)**\r\nSteht in Italien für rot als Farbbezeichnung
    bei Wein, Vermouth u. a..\r\n\r\n**Rühr-Becher / Rühr-Glas**\r\nBecher / Glas
    zum Rühren von Zutaten die klar bleiben sollen.  Meist mit einer Ausgusslippe
    versehen.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:155}}/ruehrglas.jpg
    \"small\")\r\n\r\n**Runny honey (engl.)**\r\nHonig, der aufgrund seiner zähflüssigen
    Viskosität mit heißem Wasser vermengt wird.  Auf 2 Teile Honig, 1 Teil heißes
    Wasser.\r\n\r\n**Rye-Whiskey (engl.)**\r\nAmerikanischer Whiskey dessen Maische
    mit überwiegendem Roggen-Anteil versetzt ist.\r\n\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]\r\n"
