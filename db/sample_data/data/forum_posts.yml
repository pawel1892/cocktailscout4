    Whisky\n\r\nSpecial Quality - fully matured\n\r\nOver 5 Years old\n\r\nA rare
    selection of choiced Scotch Whiskies - perfectly blended\n\r\n\n\r\n43Vol.%\n\r\nImport
    und Flaschenfüllung für:\n\r\nKASTELL\n\r\nMarken Spirituosen GmbH - Niederhatzkofen\n\r\n\n\r\n\n\r\nSind
    das irgendwelche alten Aldibilligflaschen oder kann man damit noch was anfangen?\n\r\nAuch
