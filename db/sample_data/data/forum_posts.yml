    siehe dort.\r\n\r\n[b]Rojo (span.)[/b]\r\nSteht im spanischen für rot bei Vermouth,
    Weinen etc..\r\n\r\n[b]Ron / Rhum / Rum[/b]\r\nSiehe unter [post=JGU7ljnS][u]Zuckerrohrdestillate[/u][/post]
    in den Tipps für den Barneuling.\r\n\r\n[i]\"So geht es mit Rum: Erst bist du
    froh, dann fällst du um.\" frei nach Wilhelm Busch (1832 - 1908)[/i]\r\n\r\n[b]Rosolio
    (ital.)[/b]\r\nLikör-Kategorie bestehend zu gleichen Teilen aus Alkohol, Wasser,
    Zucker, die am Schluss mit Rosenwasser aromatisiert wird. \r\n\r\n[b]Rosso (ital.)[/b]\r\nSteht
    in Italien für rot als Farbbezeichnung bei Wein, Vermouth u. a..\r\n\r\n[b]Rühr-Becher
    / Rühr-Glas[/b]\r\nBecher / Glas zum Rühren von Zutaten die klar bleiben sollen.
    \ Meist mit einer Ausgusslippe versehen.\r\n\r\n[b]Runny honey (engl.)[/b]\r\nHonig,
