  :body: "![Lexikon M](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:22}}/grafik.png)\r\n**Magnum**\r\nFlaschengröße
    für Schaumwein mit einem Fassungsvermögen von 1,5 Liter. \r\n\r\n**Maische**\r\nDas
    Produkt eines Arbeitsverfahrens (Maischen) der Whisky-, Wein-, Bier-, Obstbrandherstellung.
    Hierbei wird das Getreide, der Obstbrei mit Hefepilzen versetzt.\r\n\r\n**[[wiki:whisky|Malt
    (engl.)]]**\r\nKurzwort für Single Malt Whisky, erfüllt zwei Bedingungen: 1. Der
    Whisky stammt aus einer Brennerei, deshalb kein Verschnitt. 2. Der Whisky wird
    ausschließlich aus gemälzter Gerste gewonnen.\r\n\r\n**Mälzen**\r\nHerstellungsprozess
    aus Getreide Malz, z. B. für die Whisky-, oder Bierproduktion, zu gewinnen. Dabei
    wird durch Darren (Trocknen) und erneutes Befeuchten des Getreides, auf definierte
    Feuchtigkeitsanteile, das Korn angeregt zu Keimen. Hierdurch wandelt sich Stärke
    des Kornes in Zucker. Im letzten Schritt erfolgt das Abschleifen der Keimlinge
    mit Trocknung des Malzes, wodurch es das typische Aroma erhält. \r\n\r\n**Malzwein**\r\nDurch
    dreimaliges Destillieren von Getreidemaische entstandener Kornbrand, der einen
    intensiven Malzgeschmack besitzt. Zum Wein im eigentlichen Sinn besteht kein Zusammenhang.
    \r\n\r\n**[[wiki:sirupe-hausgemacht|Mandelsirup]]**\r\nSiehe unter [[post:FaSGbacs|<u>Orgeat</u>]].\r\n\r\n**[[wiki:likoere|Maraschino
    (kroa./ital.)]]**\r\nEin Kirschlikör aus der Maraska-Kirsche. Diese ursprünglich
    in Dalmatien beheimatete Sauerkirsche besitzt ein sehr intensives Aroma. Der Likör
    ist klar, mit einem Alkoholgehalt über 24%. Wichtige Zutat in Klassikern wie [[wiki:classic-daiquiri|Hemingway
    Daiquiri]], [[recipe:last-word]] und [[recipe:aviation]].\r\n\r\n\r\n**Marc (franz.)**\r\nSteht
    für Tresterbrand\r\n\r\n**Marc de Champagne (franz.)**\r\nSiehe unter [[post:B1ePZzoq|<u>Trester
    / Tresterbrand</u>]]. Lediglich regionale Produkte, die auch bei der Champagner-Herstellung
    verwandt werden, kommen zum Einsatz.\r\n\r\n**[[wiki:margarita-2|Margarita (span.)]]**\r\nTequilacocktail,
    siehe unter [[post:94rZApCd|<u>Bezeichnung der Getränke</u>]] in den Tipps für
    den Barneuling.\r\n\r\n**[[wiki:martini-1|Martini]]**\r\nAlte Getränkebezeichnung
    bestehend aus Gin und, oder Wodka mit Vermouth und optional Bitters in einem Cocktailspitz
    serviert.\r\n\r\n**Matcha (jap.)**\r\nGrüner Pulver-Tee, Zutat mancher Cocktails
    um neue geschmackliche Noten der Cocktailwelt zu bescheren.  Verleiht Cocktails
    ein erdiges, herbes Aroma mit leuchtend grüner Farbe.\r\n\r\n**Mazerat**\r\nDas
    Produkt einer Infusion. Siehe [[post:oD2oYkoc|<u>Infusion</u>]].\r\n\r\n**Medowucha
    (russ.)**\r\nAlkoholisches Getränk aus vergorenen Beeren-, Fruchtsäften, dass
    anschließend mit Honig versetzt wird. Der alkoholische Anteil beträgt 10%-16%
    und besitzt einen deutlichen Honiggeschmack. \r\n\r\n**Medronho (port.)**\r\nGenauer
    Aguardente de Medronho ist ein traditioneller, allerdings seltener Brand aus den
    Früchten des Erdbeerbaumes, ein Heidekrautgewächs.\r\n\r\n**Mei Kuei Lu Chiew
    (chin.)**\r\nChinesischer, hochprozentiger (über 50%) Rosenessenz-Likör, destilliert
    aus Hirseschnaps, Rosenblätter, Zucker.\r\n\r\n**[[wiki:rum|Melasse (franz, span.
    Ursprung)]]**\r\nDunkelbrauner, zähflüssiger Zuckersirup aus Zuckerrohr, auch
    Zuckerrüben, welcher u. a. bei der Rumherstellung zum Einsatz kommt.\r\n\r\n**Melchisedek
    (hebrä.)**\r\nDie größte Champagnerflasche der Welt: 30 Liter\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:146}}/Groesste-Champagnerflasche.jpg
    \"small\")\r\n\r\n**Melchior (Ursprung sumer.?)**\r\nFlaschengröße für Champagner
    mit einem Fassungsvermögen von 18 Litern. Auch Goliath genannt.\r\n\r\n**Menage
    (franz.)**\r\nSteht traditionell für Salz und Pfefferstreuer in einem Halter,
    doch ebenfalls  in einer Anordnung Bitters-Flaschen. \r\n\r\n**[[wiki:barwerkzeuge|Messbecher]]**\r\nOft
    zweiseitig verwendbares Becherchen aus Metall - der größere Teil fasst zumeist
    4 cl, der kleine 2 cl, siehe [[post:texpP6wv|<u>Jigger.</u>]] Doch auch andere
    Größen erhältlich.\r\n![Messbecher mit cl-Einteilung](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:37}}/grafik.png
    \"medium\")\r\n\r\n**Met (germ. Ursprung)**\r\nAlkoholisches Getränk aus Honig
    und Wasser, mit einem üblichen alkoholischen Anteil von 11%-16%, auch 20% möglich.
    Hin und wieder mit Gewürzen und/oder Säften versetzt.\r\n\r\n**Methusalem (sumer.?)**\r\nFlaschengröße
    für Schaumwein mit einem Fassungsvermögen von 6 Litern. \r\n\r\n**[[wiki:tequila|Mezcal
    / Mescal / Meskal (mex.)]]**\r\nMexikanischer Agavenbrand zu denen auch der Tequila
    zählt. Siehe unter [[post:JGU7ljnS|<u>Agavendestillate</u>]].\r\n\r\n**[[wiki:bezeichnung-der-getraenke|Mimosa]]**\r\nGetränkebezeichnung
    für Champagner mit frisch gepresstem Orangensaft zu gleichen Teilen auf etwas
    Eis im Sektglas. Hierzu ist es wichtig nicht nur den Champagner, sondern auch
    die Orangen vorher zu kühlen. Mit einem Schuß Orangenlikör wird es ein Grand Mimosa
    und einige weitere Varianten entstanden.\r\n\r\n**Mistela  / Mistel / Mistelle
    (span. / franz.)**\r\nTraubenmost der in der frühen Gärphase mit Weingeist gespritet
    wird. Der Most erhält hierdurch einen Alkoholanteil von mindestens 20% Vol. und
    eine sehr hohe Restsüße.  Dient als Gärungsunterbrecher und zur Süßung bei Malaga,
    Sherry u. a., aber auch als Getränk.\r\n\r\n**[[wiki:barwerkzeuge|Mixing-Glass
    (engl.)]]**\r\nSiehe unter [[post:WhgoLNNc|Rührbecher / Rührglass]]\r\n\r\n**Mocochinchi
    (span./boliv.)**\r\nNationalgetränk in Bolivien deren Bestandteile des in Chile
    getrunkenen Mote con huesillos (siehe dort) ähnlich sind.\r\n\r\n**[[wiki:mocktail-1|Mocktail]]**\r\nWortschöpfung
    die ein alkoholfreies Getränk bezeichnet. Einen alkoholhaltigen Cocktail nachempfunden,
    nennt man allgemein virgin (jungfräulich).\r\n\r\n**Modifier (engl.)**\r\nZweitwichtigste
    Zutat, die die Basis unterstreichen soll, oft aus Likören, Säften oder Soda bestehend,
    gefolgt von dem  „Flavouring Part“.\r\n\r\n**Molekular-Cocktail**\r\nCocktailbereitung
    mit, bis dahin, ungewohnten Mitteln. Zielsetzung der Molekulartechnik gewohnte
    Aromen in anderen Texturen zu offerieren, oder neue Geschmackserlebnisse durch
    veränderter Haptik hervorrufen.\r\n\r\n**[[wiki:eis|Monolith-Eis]]**\r\nGroße
    Eisblöcke mit einem Eispickel gefertigt, jeweils passend für ein Glas.\r\n\r\n**Mops**\r\nTrester,
    der mit Wasser aufgefüllt, Zucker angereichert und nochmal vergoren wird. In der
    Pfalz so bezeichneter Tresterwein.\r\n\r\n**Mote con huesillos (span./chil.)**\r\nChilenisches
    Erfrischungsgetränk aus getrockneten Pfirsichen, gekochten Weizengraupen und Panela
    (stark eingekochter Zuckerrohrsaft) evtl. Orangenschalen und Nelken. Gereicht
    in einem hohen Glas mit Löffel, im Sommer, vor allem zum Nationalfeiertag.\r\n\r\n**[[wiki:barwerkzeuge|Muddler
    (engl.)]]**\r\nSiehe [[post:55QJgTHQ|<u>Stößel</u>]]\r\n\r\n**Mug (engl.)**\r\nTrinkbehältnis,
    -becher mit Henkel, Haferl\r\n\r\n**Mule (engl.)**\r\nSiehe unter [[post:94rZApCd|<u>Bezeichnung
    der Getränke</u>]] in den Tipps für den Barneuling.\r\n\r\n**Mull (engl.)**\r\nAlte
    Getränkekategorie bestehend aus Wein, Gewürzen, Kräutern, welche erwärmt serviert
    werden.\r\n\r\n**Muselet (franz.)**\r\nFranzösisch für [[post:TizOWyNh|<u>Agraffe</u>]]
    siehe dort.\r\n\r\n**[[wiki:kraeuter-und-botanicals|Muskatnussreibe]]**\r\nFür
    die Vollendung mancher Cocktails mit frischem Muskat.\r\n\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]"
  :body_bbcode: "[IMG]https://image.jimcdn.com/app/cms/image/transf/none/path/s34ef2c3ad959eb14/image/i8459e7cb5f94df28/version/1554118211/m.jpg[/IMG][color=#fefefe]M[/color]\r\n\r\n[b]Magnum[/b]\r\nFlaschengröße
