  :body: "###Getreidedestillate\r\n\r\n**[[wiki:wodka|Wodka/Vodka]]**\r\n\r\nkann
    eigentlich nahezu aus jeder kohlenhydrathaltigen Basis destilliert werden und
    ist ab 37,5%Alc aufwärts zu bekommen. Je höher der Alkoholgehalt, um so höherwertiger
    in der Regel die Spirituose. Die mancherorts vorherrschende Meinung, es handle
    sich dabei um billigen und minderwertigen Kartoffelschnaps, rührt einfach aus
    seiner Geschichte, als armen Leuten in der Tat nur die Destillation aus Kartoffeln
    blieb. Das Ergebnis ließ oft sehr zu wünschen übrig. Heutige hochwertige Wodkas
    werden jedoch meist aus Roggen (häufig in Russland und Polen) und Weizen (viele
    westliche), manchmal auch Gerste hergestellt. Es gibt auch nach wie vor Wodka
    auf Kartoffelbasis, diese sind aber Gott sei Dank nicht mehr mit dem Fusel aus
    vergangener Zeit gleichzusetzen.\r\n\r\nWodka sollte, so die Theorie, möglichst
    geschmacksneutral sein, was durch Mehrfachdestillation und -filtration zu erreichen
    versucht wird. Gott sei Dank geht aber doch nicht der komplette Geschmack verloren,
    so dass noch kleine, aber feine Unterschiede übrigbleiben.\r\n\r\nJe nachdem,
    ob Ihr auf die etwas mild/süßlichen östlichen oder die westlichen Wodkas steht,
    eignen sich folgende Marken recht gut zum Mixen.\r\n\r\nFür den Einsteigerbarstock
    empfehlenswerte östliche Wodka/Vodka bis 15€ / 0,7L:\r\n- Russian Standard\r\n-
    Parliament\r\n- Wyborowa\r\n\r\noder wahlweise westliche Wodka/Vodka bis 15€ /
    0,7L:\r\n- Absolut\r\n- Smirnoff\r\n- Danzka\r\n- Finlandia\r\n\r\nDes Weiteren
    finden sich im Handel auch verschiedene aromatisierte (flavoured) Wodkas verschiedenster
    Couleur, die wir aber im Umfang des Einsteigerbarstocks erst mal außen vor lassen
    wollen.\r\n\r\nWodka glänzt eher mit der Abwesenheit von Aromen und ist per Definition
    am Besten ohne jeden Eigengeschmack. Die einzelnen Wodkas unterscheiden sich nur
    in Nuancen. Eine wirklich  allgemeingültige Empfehlung, welcher Wodka sich für
    einen Cocktail besser eignet, als ein anderer, ist daher nahezu unmöglich. \r\n\r\nBekannte
    Cocktails mit Wodka:\r\n- [[recipe:bloody-mary]]\r\n- [[recipe:caipirovka]]\r\n-
    [[recipe:cosmopolitan]]\r\n- [[recipe:moscow-mule-home-made|Moscow Mule]]\r\n-
    [[recipe:sex-on-the-beach]]\r\n- [[recipe:wodka-martini]]\r\n\r\n*SchSt*\r\n\r\n\r\n[[post:JGU7ljnS|oben]]"
