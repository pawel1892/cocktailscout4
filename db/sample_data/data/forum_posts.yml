  :body: "###Leichte Alkohole\r\n\r\nUnter dieser Kategorie werden von uns all diejenigen
    Getränke behandelt, welche einen Alkoholgehalt von weniger als 20% besitzen und
    in denen Wein eine grundlegende Rolle spielt. Nach einer allgemeinen Einführung
    zu Wein und seinen unterschiedlichen Rebsorten wenden wir uns den Charakteristika
    von Weinaperitifen und Schaumweinen sowie deren Verwendungsmöglichkeiten in Cocktails
    zu.\r\n\r\n***Wein***\r\nWohl eines der ältesten alkoholischen Getränke und seit
    mindestens dem 6. Jahrtausend v. Chr. als Anbau bekannt. Auch wenn in Mixgetränken
    Wein eine eher untergeordnete Rolle spielt, möchten wir eine kleine Erläuterung
    zum Wein mitgeben. Wein kann ganz grob in Weiß-, Rot- und Roséwein unterteilt
    werden. Darüber hinaus bestehen Weine aus unterschiedlichen Rebsorten, die geschmacksbildend
    sind. Wein muß ein Mindestalkoholgehalt von 7,5% enthalten, kann sich aber bei
    speziellen Sorten wie Madeira, Marsala u. a. bis zu 17,5% durch die Hefe steigern.\r\n\r\nZur
    Herstellung des  Weines werden nach der Lese zunächst die Beeren gepresst, das
    sogenannte Keltern. Man erhält Most, welcher dann vergoren wird. Dieser Gärprozess
    wird beim Rotwein mit den ganzen roten Beeren vollzogen. Im Unterschied zum Rosé,
    bei dem entweder nur ein Teil der Beeren mit den Schalen vergoren, oder die Gärung
    zum Anfang mit den Beerenschalen erfolgt und später ohne sie weiter vergoren wird.
    Wein sollte aus Most, ohne Zutaten, mit Hilfe der Hefebakterien hergestellt werden.
    Dass nicht jeder Produzent (Winzer möchte ich an dieser Stelle nicht sagen) sich
    daran hält, zeigen leider immer wieder auftauchende Skandale der vergangenen Jahrzehnte.\r\n\r\nDurch
    Gärung roter Beeren ohne Schalen entsteht auch Weißwein, denn die Farbstoffe befinden
    sich lediglich in der Beerenschale. Diese Methode ist in Frankreich zur Produktion
    günstigen Weines nicht unüblich. Der Wein aus weißen Beeren wird dort blanc de
    blanc genannt.  Die deutsche Weißwein-Produktion besteht überwiegend aus sortenreinen
    weißen Beeren. Aber das Verschneiden, sprich Vermengen von Wein verschiedener
    Reben, um einen bestimmten Geschmack zu erzielen, ist üblich. Der turbulente Gärprozess,
    durch Hefebakterien in Gang gesetzt,  verwandelt den Zucker der Beeren in Alkohol
    und endet entweder bis der Zucker aufgebraucht ist, oder die Bakterien durch die
    Alkoholkonzentration „schläfrig“ werden, keinen Alkohol mehr produzieren. Das
    ist der Regelfall, dadurch behält der Wein noch seine Restsüße und wird vollmundig.
    \r\n\r\nWelche Beerensorten wo angebaut werden, ist stark klimaabhängig. Nicht
    jede Sorte wächst überall gleich gut. Grob gesagt, in wärmeren Regionen werden
    vermehrt rote Beeren angebaut, in den kühleren demzufolge eher die weißen Sorten.
    Alle ca. 10000 Rebsorten und überdies noch die ländertypischen Anbaugebiete, Klassifizierungen
    bzw. Qualitätsstufen zu erläutern,  aufzulisten,  würde den Rahmen einer Cocktailseite
    sprengen. Einige typische sollen hier aber kurz Erwähnung finden, ohne Anspruch
    auf Vollständigkeit:\r\n\r\n![Trauben weiß](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:110}}/grafik.png
    \"small\") Weiße Trauben\r\n\r\n<u>Als weiße Beeren sind zu nennen</u>\r\n-*Chardonnay*
    Eine der wenigen Weißweinsorten, die vom Fassausbau profitieren. Mit höherem Alkoholgehalt
    können hieraus Spitzenqualitäten erzeugt werden. Walnussaroma, ab und an rauchig
    ist hier zu nennen.\r\n-*Gewürztraminer oder Klevner* Obwohl rötliche Beeren,
    gilt er als weiße Rebe. Die Weine sind sehr aromatisch, an Rosenblüten erinnernd.\r\n-*Grüner
    Veltliner oder Weißgipfler* Frisches Bouquet, geschmacklich Pfirsich- und Zitrusnoten.\r\n-*Kerner*
    Rassige, mit gutem Süß-Säure-Verhältnis ausgestattete Weine, teilweise Muskattöne.
    \r\n-*Müller-Thurgau oder Rivaner* Eher milde, mit geringer Säure behaftete Weine.\r\n-*Muskateller*
    Feinfruchtige Säure und vor allem Muskatnoten sind bezeichnend. Wird u. a. zur
    Piscoherstellung verwandt.\r\n-*Riesling* Spitzenweine  in jungen Jahren mit frischen
    fruchtigen Tönen, im Alter eher mineralische Anklänge. \r\n-*Ruländer, grauer
    Burgunder oder Pinot Gris (Grigio)* Ebenfalls rötliche Beeren, zählt zu den weißen
    Reben. Säurearme an Äpfel erinnernde Töne, mit hohem Alkoholgehalt.\r\n-*Sauvignon
    Blanc* Stachelbeerig,  typische grüne Aromen, wie frisch gemähtes Gras, grüner
    Spargel, grüne Paprika. Bringt Spitzenqualitäten hervor.\r\n-*Silvaner* Zählt
    zu den ältesten Rebsorten. Säurebetonter Wein mit wenigen Fruchtnoten.\r\n-*Weißburgunder,
    Pinot Blanc* Auch eine alte Rebsorte mit wenig Säure.\r\n\r\n![Rote Weinbeeren](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:111}}/grafik.png
    \"small\") Rote Weinbeeren\r\n\r\n<u>Die roten Reben</u>\r\n-*Abrusco* Kräftig
    dunkelroter, tanninreicher Wein, der gern zum Verschneiden im toskanischen Raum
    angebaut wird.\r\n-*Barbera* Kraftvolle, tanninarme, hochwertige Weine mit  vollem
    Körper und Pflaumenaroma.\r\n-*Blauer Portugieser* Frischer, rubinroter Wein mit
    leichtem Körper, im Barrique auch große Weine. Viele Roséweine (Weißherbst ) werden
    aus dieser Rebe hergestellt.\r\n-*Blaufränkisch oder Lemberger* Bringen leichte
    fruchtige, ebenso charaktervoll fruchtige, dunkelrote Weine  mit Anklängen an
    Beeren und Kirschen hervor.\r\n-*Cabernet Sauvignon* Tannin- und säurehaltiger
    Wein von dunkelroter Farbe, mit intensivem Fruchtgeschmack.  \r\n-*Merlot* Ein
    weicher, etwas pflaumig schmeckender Wein, von dunkelroter Farbe.\r\n-*Nebbiolo*
    Alte piemontesische Rebe, die Spitzenweine hervorbringen kann.\r\n-*Sangiovese*
    Alte Rebe, die kräftige, säure- und tanninbetonte, große Weine entstehen läßt.\r\n-*Schwarzriesling*
    Fruchtige Aromen, ziegelrote Farbe sind Merkmale dieser Rebe. U. a. zur Champagnerherstellung
    benutzt.\r\n-*Spätburgunder oder Pinot noir* Sehr alte Rebe mit feinen Düften.
    Der Wein sollte vorwiegend in jungen Jahren getrunken werden. Aber auch eine Rebe
    der Champagnerfertigung. \r\n-*Syrah oder Shiraz* Eine Rebe mit hohem Tanningehalt,
    setzt eine lange Lagerzeit voraus. Unvergleichlicher Johannisbeerduft ist prägend
    für diese Sorte.\r\n\r\nWein in der Welt der Cocktails bedeutet u. a. Aperitif,
    Bowle, oder warm als hausgemachter Glühwein ohne Kopfschmerz am nächsten Tag.
    So vielfältig wie die Reben, so vielfältig sind die Weine, die teilweise durch
    Verschnitt und Lagerung in großen Holz- oder kleinen Barriquefässern zur Höchstform
    gebracht werden. Den Aromenreichtum guter Weine, können Flüssigkeiten in Dosen,
    Kanistern, Tüten und dgl. nie erreichen. Deswegen lasst die Finger von solchen
    Produkten. Ein guter Wein muss nicht unbedingt hochpreisig sein.\r\n\r\n*rrr*\r\n\r\n\r\n***Weinaperitife***\r\nUnter
    der Kategorie der Weinaperitife sollen nun all diejenigen Getränke erläutert werden,
    welche Wein als ihre Basis haben, und wunderbar als Aperitif gereicht werden können.
    Ihre Verbreitung haben sie vor allem in Frankreich, Italien und Spanien, also
    in denjenigen Ländern, welche auch über eine große Weinproduktion verfügen. Im
    Einzelnen sollen nun Quinquina, Wermut und Sherry vorgestellt werden. Dabei muss
    jedoch angemerkt werden, dass diese Aufzählung keinen Anspruch auf Vollständigkeit
    erheben möchte. Es gibt über die hier besprochenen Gattungen noch weitere Weinaperitife,
    die jedoch den Rahmen dieser Einführung sprengen würden.\r\n\r\n<u>Quinquina</u>\r\nDie
    Bezeichnung „Quinquina“ werden wohl viele noch nicht gehört haben. Ihren Namen
    erhält diese Getränkegattung von der Chinin-Rinde, welche durch ihre feinen Bitteraromen
    den eher süßen Quinquinas den besonderen Schliff erteilt. Im Gegensatz zu Wermut
    können bei der Herstellung nicht nur Weißweine, sondern auch Rosé- und Rotweine
    zur Anwendung kommen. Der jeweilige Wein wird mit Fruchtlikören, Kräutern und
    Gewürzen vermählt und besitzt in der Regel 15-18%. Quinquinas lassen sich gut
    vor dem Essen trinken, um den Magen zu öffnen, sind aber auch wichtiger Bestandteil
    berühmter Cocktails. Ihren Ursprung haben die Quinquinas zu Zeiten des Kolonialismus,
    als an Malaria erkrankten Soldaten das Verabreichen des Chinins erleichtert werden
    sollte.\r\n\r\nManch einer wird wohl durch die James Bond-Filme schon einmal mit
    dieser Getränkegattung in Berührung gekommen sein. In „Casino Royal“ bestellt
    Bond einen Martini mit einem besonderen Mischungsverhältnis und nennt ihn später
    „Vesper“. Seine besondere Note macht dabei der heute leider nicht mehr verfügbare
    Kina Lillet aus, welcher in diesem Drink den sonst im Martini verwendeten trockenen
    Wermut ersetzt. Sein Nachfolger Cap Corse Grande Reserve Quinquina blanc von Mattei,
    mit fruchtig leichter Süße und unterstützender Bitterkeit der Chinarinde.\r\n\r\nCocktails
    mit Quinquina:\r\n[[recipe:corpse-reviver-2]]\r\n[[recipe:twentieth-century]]\r\n[[recipe:martini-james-bond|Vesper]]\r\n\r\n<u>[[wiki:vermouth|Wermut/Vermouth]]</u>\r\nDer
    Wermut ist die für Cocktailliebhaber wichtigste Gruppe der Weinaperitife. Seinen
    Charakter erhält er neben Weißwein und Fruchtlikören durch das  charakteristische
    Wermutkraut (Artemisia absinthium). Sein Name ist aus dem Altdeutschen \"Vermuota\"
    bzw. \"Weramote\" abgeleitet und er besitzt - wie auch der Quinquina - zwischen
    15-18%vol. Die beiden Länder, in denen Wermut vorwiegend produziert und konsumiert
    wird, sind Frankreich und Italien. Im Jahre 1786 wurde der erste Wermut von Antonio
    Benedetto Carpano in Turin hergestellt.\r\n\r\nMan unterscheidet in der Regel
    zwischen trockenen und süßen Wermuts. Erstere finden vor allem in Frankreich Verbreitung
    und der berühmte Noilly Prat ist hier dasjenige Produkt, welches sich großer Beliebtheit
    erfreut. Beim vor allem in Italien verbreiteten süßen Wermut lassen sich noch
    einmal zwei Kategorien unterscheiden: Weiß/Bianco und Rot/Rouge/Rosso. Während
    der weiße Wermut in Cocktails eher selten verlangt wird, ist der rote bitter-süße
    Wermut unverzichtbarer Bestandteil so berühmter Drinks wie Manhattan und Negroni.
    Süße Wermuts lassen sich aufgrund ihres hohen Zuckergehalts aber auch sehr gut
    als Digestif trinken.\r\n\r\nIm Preisbereich bis 15 Euro sind folgende Wermuts
    zu empfehlen:\r\n- *Dolin Blanc*\r\n- *Dolin Rouge*\r\n- *Carpano Bianco*\r\n-
    *Carpano Classico Rosso*\r\n- *Noilly Prat Extra Dry*\r\n\r\nWer beim süßen Wermut
    noch etwas mehr ausgeben möchte, hätte dann noch die folgende Auswahl:\r\n- *Carpano
    Antica Formula*\r\n- *Noilly Prat Ambre*\r\n- *Noilly Prat Rouge*\r\n\r\nCocktails
    mit Wermut:\r\n[[recipe:manhattan]]\r\n[[recipe:martinez-cocktail]]\r\n[[recipe:dry-martini]]\r\n[[recipe:negroni]]\r\n\r\n<u>Sherry</u>\r\nDie
    dritte Gruppe der weinhaltigen Produkte, die hier besprochen werden soll, ist
    der Sherry. Er zählt zu den Likörweinen, denen auch der portugiesische Portwein
    angehört und hat seine Heimat in Spanien. Seine Bezeichnung hat er vom arabischen
    Ortsnamen „Sherish“ für das heutige Jerez de la Frontera. Jeder Sherry, egal über
    welchen Zuckergehalt er letztlich verfügt, wird aus trockenem Weißwein gewonnen
    und anschließend mit Brandwein verschnitten. Erst danach erhalten die süßeren
    Varianten durch die süßeren Trauben Moscatel oder Pedro Ximénez ihren Zuckergehalt.
    Es lassen sich fünf verschiedene Gruppen aufführen, die sich ja nach Zuckergehalt
    voneinander unterscheiden:\r\n-*Fino* Sehr hell, trocken und mit feiner Mandelnote
    ist er der Aperitif schlechthin, sollte gekühlt wie ein Weißwein serviert werden
    und eignet sich auch sehr gut für Cocktails.\r\n-*Amontillado* Mit einer Farbe
    wie Bernstein, halbtrocken und einem größeren Körper als der Fino kann er zu jeder
    Tageszeit getrunken werden.\r\n-*Oloroso* Dunkelgoldene Farbe, leicht trocken
    bis süß, verfügt über ein angenehmes Nussaroma und einen kräftigen Charakter.\r\n-*Cream*
    Dunkelrubinrot, mild und süß und daher hervorragend als Digestif geeignet.\r\n-*Pedro
    Ximénez* Braun-schwarz, noch süßer und intensiver als der Cream  und aus der gleichnamigen
    Traube gewonnen.\r\n\r\nBeim Sherry bieten folgende Marken im preislichen Bereich
    bis 15 Euro durchweg gute Qualität:\r\n- *Dry Sack*\r\n- *Lustau*\r\n- *Tio Pepe*\r\n\r\nCocktails
    mit Sherry:\r\n[[recipe:adonis]]\r\n[[recipe:sherry-mistmas]]\r\n\r\n*F.B.*\r\n\r\n\r\n***Schaumwein***\r\nWeinhaltige
    Getränke mit Kohlenstoffdioxid, die einen Druck in der Flasche von drei oder mehr
    bar beinhalten. Perlwein dagegen hat lediglich einen Kohlensäuredruck von 1-2,5
    bar. \r\n\r\n<u>Drei verschiedene Herstellungsmethoden gibt es:</u>\r\nDas Kohlenstoffdioxid
    resultiert aus erster Gärung, die Asti-Methode. Der Wein wird vor Ende des Gärprozesses
    durch Entfernung der Hefe süß gehalten,  darauf in Tanks oder Flaschen zum höchstmöglichen
    Druck weiter vergoren und einer erneuten Entfernung der entstandenen Hefe unterzogen.\r\n\r\nZweitens,
    der junge Wein wird mit Hefe und Zucker versetzt und abgefüllt in Flaschen oder
    druckfeste Tanks, sodass bei der zweiten Gärung die Kohlensäure in den Wein übergeht.
    Das nennt man Tankgärverfahren für den einfachen Sekt, oder in Flaschen abgefüllt,
    ist es eben die Méthode champenoise für Winzer-Sekt oder Krimsekt, Crémant, Cava
    und Champagner. Die letzten zwei sind regionaltypische Bezeichnungen und dürfen
    nur hier verwandt werden. \r\n\r\nBei der dritten Methode wird die Kohlensäure
    mit Druck und Kälte aus dem jungen Wein gelöst. Anschließend die Flaschen  durch
    Zugabe dieser Kohlensäure unter Druck gesetzt. Nennt sich auch so, Schaumwein
    mit zugesetzter Kohlensäure. Der Mindestalkoholgehalt beträgt für alle Schaumweine
    10%.\r\n\r\nFür Schaumweine bietet sich in der Welt des Mixens ein großer Raum.
    Cocktails wie der French 68 oder andere geben einen würdevollen Rahmen für ein
    gelungenes Fest. Es muss nicht immer der Champagner mit großem Namen sein, Winzersekt
    z. B. bekommt man für viel weniger Geld, schmeckt deswegen nicht schlechter.\r\n\r\nCocktails
    mit Schaumwein:\r\n[[recipe:bellini]]\r\n[[recipe:french-68]]\r\n[[recipe:french-75]]\r\n[[recipe:kir-royal]]\r\n[[recipe:st-germain-sektcocktail]]\r\n\r\n*rrr*\r\n\r\n\r\n[[post:JGU7ljnS|oben]]"
