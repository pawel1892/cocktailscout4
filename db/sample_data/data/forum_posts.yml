  :body: "Hilfreich für einige der hier aufgeführten Arten ist ein sonniges Fensterbrett,
    ein Garten oder Balkon, aber keinesfalls notwendig. Vieles Genannte erhält man
    frisch in Obst- und Gemüseabteilungen der Märkte, verpackt in kleinen Mengen,
    in gekühlter Umgebung. Die Rede ist von...\r\n\r\n###Kräutern, Blüten, Stängeln
    und Wurzeln\r\n\r\nAußergewöhnliche Cocktails bestechen hin und wieder durch Verwendung
    frischer Kräuter. Oft nur als Dekoration, doch häufig als geschmackgebender Bestandteil
    eines Drinks. Die Anhängerschaft dieser Kompositionen wird stetig größer. Was
    in der Küche seit Jahrhunderten beliebt, findet vermehrt Anwendung in Mixgetränken.
    Doch welche Kräuter oder andere Pflanzenteile, außer Früchte, sind geeignet? Das
    will dieser kleine Beitrag für euch herausfinden.\r\n\r\n\r\n***Basilikum***\r\n<u>*Genoveser
    Basilikum*</u>, in jedem Lebensmittelmarkt  in Töpfen erhältlich, ist der bekannteste
    von allen Arten und wenn die Rede von Basilikum im Zusammenhang mit Cocktails
    ist, auch der einzig zu verwendende, es sei denn, etwas anderes wird explizit
    genannt. Lässt sich auf der Fensterbank, oder bei warmem Wetter, in der Sonne
    im Garten weiter ziehen. Gegossen werden soll nur von unten in einer Schale weil
    die obere Erde sonst schimmelt. Geschmack pfeffrig, leicht süßlich, würzig.  Neben
    roten gibt es noch den Zitronenbasilikum und andere Varietäten.\r\n\r\nDer <u>*Thai-Basilikum*</u>
    unterteilt sich nochmal in 2 Arten, Bai Horapa und Bai Krapow, beide schmecken
    leicht nach Minze und Anis, der Krapow ist etwas strenger. Im Fachhandel als Pflanze
    oder Samen erhältlich.\r\n![Basilikum](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:49}}/grafik.png)\r\n\r\nCocktails
    mit Basilikum:\r\n[[recipe:basilikum-daiquiri]]\r\n[[recipe:duke-basil]]\r\n\r\n***Hibiskus-
    und andere Blüten***\r\nOft nur Zierde eines Getränkes, doch ebenfalls zur geschmacklichen
    Steigerung geeignet. Vielfach  in Sektcocktails, teilweise als ganze Blüte, oder
    nur Blütenblättchen, werten sie, ebenso wie frische Beeren, jeden Eiswürfel auf
    und sind zudem gesund. Darauf geachtet werden sollte unbedingt auf Essbarkeit,
    nicht jede Blüte kann verzehrt werden. Sonst ist erlaubt, was gefällt, nur zu
    verspielt muß es nicht sein. Essbare Blüten gibt es im Fachhandel, oder wenn sie
    sauber und ungespritzt sind im eigenen Garten, wie Chrysanthemen, Gänseblümchen
    mit ihrem nussigen Geschmack, die süßlichen Veilchen, Borretschblüten, Rosenblätter,
    Stiefmütterchen, die pfeffrige Kapuzinerkresse, auch Dahlien, Herbstastern, Holunderblüten,
    Kornblumen, Lindenblüten, sogar Löwenzahn, Mohn, Ringelblume, Schafgarbe und Schlüsselblumen
    um einige aufzuführen. Samenmischungen mit essbaren Blüten sind ebenfalls erhältlich.
    Nochmal der Hinweis, man sollte schon wissen, welche Blüten zum Verzehr genommen
    werden, nicht alles was blüht, kann gegessen werden. Giftig sind u. a. der Fingerhut,
    das Maiglöckchen und auch der Goldregen, oder Oleander, der in vielen Gärten steht.
    Nur am Rande, zu den Blüten zählen auch Gewürznelken, welche als getrocknete Knospen
    in der Feuerzangenbowle oder im Glühwein ihr würzig scharfes Aroma entfalten.\r\n![Gänseblümchen](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:50}}/grafik.png)\r\n\r\nCocktail
    mit Blüten:\r\n[[recipe:hibiskus-sektcocktail]]\r\n\r\n***Borretsch***\r\nWegen
    seines zweiten Namens Gurkenkraut, Kukumerkraut kann man es sich leicht vorstellen
    ihn in Getränken mit Gurke zu integrieren. Borretsch ist ein Bestandteil der sieben
    Kräuter für die grüne Sauce. Allerdings wird nach neuesten Erkenntnissen aufgrund
    des Pyrrolizidingehaltes vom Verzehr abgeraten, oder doch zumindest zu einer eingeschränkten
    Verwendung der harten, borstigen Blätter. Dagegen können die schönen blauen Blüten
    ohne Bedenken verzehrt werden. Borretsch ist erhältlich auf Wochenmärkten oder
    im Fachhandel.\r\n![Borretsch](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:51}}/grafik.png)\r\n\r\nGetränke
    mit einem frischen Gurkengeschmack:\r\n[[recipe:rosemarys-gt]]\r\n[[recipe:moscow-mule-home-made]]\r\n[[recipe:pipeline]]\r\n\r\n***Estragon***\r\nAuch
    Schlangenkraut, Drachenkraut, wegen des schlängelnden Wuchses so genannt, verwandt
    mit dem Beifuß und Wermut. Das Kraut mit seinen lanzettförmigen Blättchen besitzt
    einen leichten Anisduft, im Geschmack frische herbe Noten. Zu verwenden ist der
    französische (deutsche) Estragon wegen seines höheren Anteils an ätherischen Ölen
    im Vergleich zum russischen. Dafür ist er leider nicht Winterfest. Mittlerweile
    überall als vorgezogene Pflanze erhältlich, zu raten ist, ihn im Fachhandel zu
    kaufen, weil es hier doch robustere Pflanzen gibt. Estragon kann man sich in Getränken
    mit Aquavit, Chartreuse oder ähnlichem vorstellen, ebenso aber in anderen Drinks,
    welche eine leicht frischwürzige Note erhalten sollen.\r\n![Estragon](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:52}}/grafik.png)\r\n\r\n***Ingwer
    und andere Wurzeln***\r\n<u>*Ingwer*</u>, die Wurzelknolle einer Gewürzlilie,
    benutzt zum Würzen mit zitronigem, scharfem Geschmack. Sehr gesund und lecker,
    wird in Cocktails hauptsächlich gerieben verwandt. Die Schnittflächen erinnern
    im Aussehen einer Kartoffel, fest, saftig, gelb. Bitte ausschließlich frische
    Wurzelknollen verwenden. Inzwischen in fast jedem Lebensmittelgeschäft und natürlich
    Asia-Shops erhältlich. Weniger häufig anzutreffen, aber gleiche Gattung der\r\n\r\n<u>*Galgant*</u>,
    ähnelt im Aussehen und Geschmack dem Ingwer, ist aber säuerlicher und milder.
    Die Finger sind etwas dünner und heller.\r\n\r\n<u>*Kurkuma*</u> oder Gelbwurz,
    vom Aussehen den beiden Vorangestellten sehr ähnlich, ist aber nicht zitronig
    scharf, eher  warm, dumpf-süßlich. Dafür färbt er in einem sehr kräftigen Gelborange.
    Manche Asiashops haben frische Wurzeln. Für alle Arten gilt, die Schale sollte
    glatt und glänzend sein, dieses  zeugt von Frische. Halten sich längere Zeit im
    Gemüsefach des Kühlschrankes, oder einem kühlen, trockenen und dunklen Ort im
    Keller. Kleiner Tipp, wenn lediglich Ginger Ale statt Ginger Beer zur Hand, kann
    man dieses mit frischem Ingwer aufpeppen.\r\n![Ingwer](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:53}}/grafik.png)\r\n\r\nDrink
    mit Ingwer:\r\n[[recipe:spanishuptown]]\r\n\r\n***Lavendel***\r\nKraut, in Stauden
    wachsend, mit blauen Blüten. Vorwiegend in Gartenabteilungen und Gärtnereien erhältlich.
    Benötigt sonnige Standorte. Intensiver Duft und Geschmack, deswegen sehr sparsam,
    hauptsächlich die Blüten verwenden. So nebenbei, Lavendel vertreibt Mücken.\r\n\r\n![Lavendel](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:54}}/grafik.png)\r\n\r\nDrink
    mit Lavendel:\r\n[[recipe:frozen-lemon-lavender]] \r\n\r\n***Limettenblätter***\r\nDie
    Blätter der Kaffir-Limette entfalten nur im zerkleinerten und erwärmten Zustand
    ihr volles, citrusartiges Aroma. Teilweise frisch, sonst eingefroren in Asia-Shops
    erhältlich. Ähneln vom Aussehen einem frischen Lorbeerblatt, mit einer ledrigen
    Festigkeit. Getränke mit Limettenblättern könnten sein Glühwein, Feuerzangenbowle,
    Punches und ähnliches.\r\n\r\n![Limettenblätter](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:55}}/grafik.png)\r\n\r\nDrink
    mit Limettenblätter:\r\n[[recipe:gf-honey]]\r\n\r\n***Minze***\r\nEs gibt unzählige
    Arten Minze. Zu nennen sind hier die\r\n<u>*Hain-Minze*</u> Mentha x spicata var.
    nemorosa, die ideale Minze für Mojito schlechthin.\r\n<u>*Krause Minze*</u> Mentha
    spicata var. crispate\r\n<u>*Marrokanische Minze*</u> Mentha spicata \r\n<u>*Pfefferminze*</u>
    Mentha x piperita var. piperita, besitzt im Vergleich zu den oberen drei Minzen
    einen höheren Mentholgehalt, der in Cocktails weniger geschätzt wird. \r\n<u>*Schokoladenminze*</u>
    Mentha x piperita var. chocolate\r\n\r\nDiese und andere Arten sind im gut sortierten
    Fachhandel oder teilweise auf dem Wochenmarkt erhältlich. Minze nicht ohne Gefäß
    in den Garten auspflanzen. Sie bildet sonst überall neue Triebe.\r\n![Minze](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:56}}/grafik.png)\r\n\r\nDrinks
    mit Minze:\r\n[[recipe:mojito]]\r\n[[recipe:brokkr]]\r\n\r\n***Oregano***\r\nDost
    oder Wilder Majoran sind weitere Bezeichnungen dieses würzigen, antibakteriell
    wirkenden Krautes mit kleinen Blättchen. Bevorzugt einen warmen trockenen Standort.
    Geeignet ist, wegen der hohen Würzkraft der griechische Oregano. Auf und in Märkten
    wie auch im Fachhandel erhältlich. Sein spezielles Aroma lässt experimentelle
    Drinks entstehen.\r\n![Oregano](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:57}}/grafik.png)\r\n\r\n***Petersilie***\r\nPeterle,
    auch Silk und viele weitere regionaltypische Namen trägt dieses Gewächs. Wer kennt
    es nicht, dieses Kraut? Zwei Arten zur groben Blattunterscheidung, krausblättrige
    und glatte Petersilie. Die Glattblättrige ist für unsere Zwecke die passendere,
    da mehr Würzkraft in ihr steckt. Sie ist überall erhältlich. Verwendung könnte
    sie im Aperitif oder ähnlichem zur Geschmackssteigerung finden.\r\n![Petersilie](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:58}}/grafik.png)\r\n\r\n***Rosmarin***\r\nImmergrüner
    buschiger Strauch, mit sehr aromatischem, ausgeprägtem Duft. Leicht bitterer Geschmack,
    an Eukalyptus erinnernd. Die frischen, nicht verholzten Triebspitzen sind für
    Cocktails ideal. In Gartenabteilungen der Märkte und auf dem Wochenmarkt erhältlich.
    Mag sonnige Standorte wenig Wasser, da aus dem Mittelmeerraum kommend.\r\n![Rosmarin](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:59}}/grafik.png)\r\n\r\nDrinks
    mit Rosmarin:\r\n[[recipe:rosemarys-daiquiri]]\r\n[[recipe:rosemarys-gt]]\r\n\r\n***Salbei***\r\nSehr
    viele Arten haben sich über fast alle Regionen verteilt. Vom <u>*Echten Salbei*</u>
    Salvia officinalis die Blätter mit unvergleichlichem Aroma zum Würzen, ebenfalls
    Verwendung finden die blauen Blüten als Deko. Ähnlich im Geschmack und Aussehen
    der <u>*Muskatellersalbei*</u> Salvia sclarea. Warmer Duft mit Schärfe, schmeckt
    in größerer Menge bitter. Im Fachhandel so auch in den Gartenmärkten und Wochenmärkten
    zu kaufen. Sonniger Standort und wenig Wasser bevorzugt.  \r\n![Salbei](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:60}}/grafik.png)\r\n\r\nDrink
    mit Salbei:\r\n[[recipe:salvia-laimun]]\r\n\r\n***Thymian***\r\nViele Arten auch
    beim Thymian mit seinem hocharomatischen Duft und würzigen Geschmack der kleinen
    Blättchen. Bekannteste\r\n<u>*Echter Thymian*</u> Thymus vulgaris aber auch \r\n<u>*Zitronenthymian*</u>
    Thymus x citriodorus mit seinen hell geränderten Blättchen ist zu nennen. Hat
    einen intensiven zitronigen Duft und Geschmack. Kurzer bis bodendeckender Strauch,
    mag ebenfalls viel Sonne und wenig Wasser. Geeignet die jungen, nicht verholzten
    Triebspitzen. In und auf Märkten und im Fachhandel zu bekommen.\r\n\r\n![Thymian](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:61}}/grafik.png)\r\n\r\nDrinks
    mit Thymian:\r\n[[recipe:ottone]]\r\n[[recipe:raspberry-thyme-smash]]\r\n\r\n***Waldmeister***\r\nHäufig
    in Rotbuchenwäldern anzutreffen, auch in Hain- und Eichenwäldern. Gutes Erkennungsmerkmal,
    die Blätter wachsen am Stängel in Quirlen und Etagen. Liebt Schatten bis halbschattige
    Standorte. Hat einen eigenartigen, angenehm würzigen Geruch. Im Frühjahr wird
    der Waldmeister auch auf Wochenmärkten verkauft. Man sollte ihn nicht im Garten
    aussetzen, sonst verteilt er sich überall. Gesundheitsschädlich durch seinen Cumarininhalt
    wird der Verzehr in sehr großen Mengen.\r\n![Waldmeister](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:63}}/grafik.png)\r\n\r\nDrink
    mit Waldmeister:\r\n[[recipe:mai-bowle]]\r\n\r\n***Wermut***\r\nBitterer Beifuß,
    lat. Artemisia absinthium, etwas ungewöhnlich für einen Cocktail zu verwenden
    aber nicht abwegig, da es die Spirituose gleichen Namens gibt, die Extrakte dieser
    Pflanze enthält. Ebenfalls Bestandteil des Absinth. Verwenden möglichst die zarten
    Blättchen an den Neuaustrieben und die Blüten. Wird seit Urzeiten als Heilkraut
    angesehen. Wächst als Wildkraut selbst an Straßenrändern. Hin und wieder werden
    Jungpflanzen auch auf dem Wochenmarkt verkauft. Sehr bitter im Geschmack, appetitanregend.
    Wermut enthält Thujon, deswegen bitte nicht übermäßg verwenden. \r\n![Wermut](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:62}}/grafik.png)\r\n\r\nDrink
    mit Wermutkraut:\r\n[[recipe:americano-af]]\r\n\r\n***Ysop***\r\nEisenkraut und
    weitere Namen, ein Bestandteil des Chartreuse, benötigt sonnige, kalkhaltige Standorte.
    Die kleinen schmalen Blättchen mit ihrer starken Würzkraft, sollten sparsam verwendet
    werden. Im gut sortierten Fachhandel erhältlich. Ein Versuch, Ysop im entsprechenden
    Aperitif zu verwenden, ist es jedenfalls wert. \r\n![Ysop](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:64}}/grafik.png)\r\n\r\n***Zimt***\r\nDie
    getrocknete Rinde des Zimtbaumes wird als Stangenzimt oder Kaneel, ebenso gemahlen
    in Pulverform in Gewürzabteilungen des Handels verkauft. Die Rinden, bei der Ernte
    in mehreren Lagen geschichtet, rollen sich in der Trocknungsphase zusammen. Zu
    unterscheiden ist, der feine Ceylonzimt, zeigt an den Enden ein geschlossenes
    Bild, im Gegensatz zum indonesischen oder chinesischen Zimt. Ebenfalls findet
    sich im Zimt Cumarin, weswegen die gleichen Vorsichtsmaßnahmen gelten, wie beim
    Waldmeister. Der Anteil im Ceylonzimt ist allerdings deutlich geringer, als im
    indonesischen oder Chinazimt. Im Getränk finden Verwendung sowohl Kaneel, alsauch
    der gemahlene Zimt.\r\n![Zimt/Caneel](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:65}}/grafik.png)\r\n\r\nDrinks
    mit Zimt:\r\n[[recipe:hot-buttered-rum-triobar]]\r\n[[recipe:weihnachts-caipi]]\r\n\r\n***Zitronengras***\r\nFrüher
    den Asiamärkten vorbehalten, mittlerweile findet man es genauso im Supermarkt
    in der Obst- und Gemüseabteilung. Verwenden sollte man allerdings nur Frisches.
    Die Aromaten citrusartig, allerdings ohne Säure. Sie werden nur freigesetzt, indem
    man die Stängel anquetscht.\r\n![Zitronengras](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:66}}/grafik.png)\r\n\r\nDrink
    mit Zitronengras:\r\n[[recipe:lemongrasmojito]]\r\n\r\n***Zitronenmelisse***\r\nAuch
    einfach Melisse genannt, ist mittlerweile überall im Handel erhältlich Die gezackten,
    Blätter besitzen ein schönes, zitroniges Aroma. \r\n![Zitronenmelisse](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:67}}/grafik.png)\r\n\r\nDrinks
    mit Zitronenmelisse:\r\n[[recipe:citrus-kumquat-43]]\r\n\r\n***Zitronenverbene***\r\nOder
    Zitronenstrauch, ein leider etwas in Vergessenheit geratenes Kraut. Verwendung
    finden die frischen Triebspitzen. Beim Reiben der Blätter entfaltet sich ein herrliches
    Citrusaroma mit leicht süßlichem Hauch. Zu beziehen im gut sortierten Fachhandel.\r\n![Zitronenverbene](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:68}}/grafik.png)\r\n\r\nDie
    Palette der Kräuter ist damit nicht beendet. Doch die Auswahl geschah unter dem
    Gesichtspunkt der möglichen Verwendung in einem Getränk.\r\n\r\n*rrr*\r\n\r\n\r\n[[post:JGU7ljnS|oben]]"
