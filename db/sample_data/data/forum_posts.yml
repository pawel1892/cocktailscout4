  :body: "**[[wiki:bitters|Bitters]]**\r\n\r\nWas Gewürze beim Kochen sind, stellen
    die Bitters beim Cocktailmixen dar. Sie sollen einen Drink verfeinern und ihm
    den letzten Schliff geben. Aus diesem Grund werden sie nur – bis auf wenige Ausnahmen
    – tröpfchenweise eingesetzt. In Rezepten ist üblicherweise von „Dashes“ die Rede,
    womit eine Flüssigkeitsmenge gemeint ist, die etwas weniger als einen Spritzer
    beträgt. \r\n\r\n![Cocktailbitters](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:112}}/grafik.png
    \"small\")Diverse Cocktail-Bitters\r\n\r\nDas bekannteste, älteste und auch heute
    noch am häufigsten verwendete Bitter ist das Angostura aus Südamerika. Es wurde
    vom deutschen Arzt Johann Gottlieb Benjamin Siegert im Jahre 1824 in Venezuela
    erfunden und ursprünglich gegen Tropenkrankheiten verabreicht. Wie viele andere
    alkoholhaltige Heilmittel fand auch das Angostura recht schnell seinen Weg in
    die Bar.\r\n\r\nEntgegen ihres Namens schmecken nicht alle Bitters ausschließlich
    und zwingend bitter. Sie bestehen vielmehr aus einer sehr intensiven Komposition
    verschiedener Gewürze, worunter Bitteraromen vorherrschend sein können, jedoch
    nicht müssen. Die sogenannten „Aromatic Bitters“ zeichnen sich zwar durch eine
    intensive Bitternote, aber auch durch Gewürze wie Piment oder Nelken aus. Bei
    anderen Bitters liegt der Schwerpunkt auf einer einzigen Geschmacksrichtung, wie
    beispielsweise den Orange Bitters oder den Chocolate Bitters. So gibt es auch
    Bitters, die gar nicht wirklich bitter, sondern eher fruchtig sind. Das für den
    Ramos Gin Fizz unabdingbare Orangenblütenwasser fällt beispielsweise in diese
    Kategorie.\r\n\r\nGenerell lässt sich sagen, dass Bitters sehr gut mit Whiskey,
    Gin, Cognac und Wermut harmonieren. Bei den meisten sogenannten „Wermut-Cocktails“,
    wie beispielsweise Manhattan oder Martini, sind sie integraler Bestandteil und
    verleihen dem Drink erst ihr besonderes Aroma. Aber auch einige Cocktails der
    Tiki-Ära greifen auf Bitters zurück. Don the Beachcomber war es, der seinen Mai
    Tai und Zombie durch die Verwendung von Angostura verfeinerte und ihnen somit
    einen ungewohnt trockenen Charakter verlieh.\r\n\r\nDer Einsteiger ist zunächst
    bestens mit einem Aromatic und einem Orange Bitter versorgt. Der Literpreis bei
    Bitters ist zwar recht hoch, aufgrund ihres Einsatzes in Tropfen halten die in
    der Regel 0,2l umfassenden Flaschen jedoch sehr lange.\r\n\r\nEmpfehlenswerte
    Bitters bis 15 Euro/0,2l:\r\n- *Angostura Aromatic Bitters*\r\n- *Angostura Orange
    Bitters*\r\n- *The Bitter Truth Aromatic Bitters*\r\n- *The Bitter Truth Orange
    Bitters*\r\n- *The Bitter Truth Lemon Bitters*\r\n- *Peychaud's*\r\n\r\n*F.B.*\r\n\r\n\r\n[[post:JGU7ljnS|oben]]"
