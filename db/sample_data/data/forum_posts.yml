    Viskosität beigemengt wurde. Der Drink erhält hierdurch eine andere Haptik im
    Mund.\r\n\r\n[b]Grain (engl.)[/b]\r\nKurzwort für Grainwhisky, bestehend u. a.
    aus Weizen, gemälzter Gerste, Mais. Vorzugsweise zur Blend-Whisky-Herstellung
    verarbeitet. \r\n\r\n[b]Grappa (ital.)[/b]\r\nItalienischer Tresterbrand.\r\n\r\n[b]Grater
    (engl.)[/b]\r\nReibe z. B. für Zesten, Schokolade, Muskat. Siehe auch [post=EVAyIWVC][u]Muskatnussreibe[/u][/post].\r\n\r\n[b]Grenadine[/b]\r\nRoter
    Fruchtsirup ursprünglich aus Granatapfelsaft gefertigt. Siehe ebenfalls unter
    [post=JGU7ljnS][u]alkoholfreie Zutaten[/u][/post].\r\n\r\n[b]Grog[/b]\r\nAlte
    Getränkekategorie, die Rum mit Wasser vermengt, enthält. Üblich sind ebenso Zitronensaft,
    Zucker, Gewürze, aber auch aromatische Früchte hierzu. Wird kalt und heiß genossen.
    Stammt aus der Zeit als englische Seeleute eine tägliche Ration Rum zur \"Stärkung\"
    erhielten. Siehe auch unter [post=B1ePZzoq][u]Toddy[/u][/post].\r\n\r\n[b]Grüne
    Fee[/b]\r\nSiehe [post=TizOWyNh][u]Absinth[/u][/post]\r\n\r\n[b]Gunpowder proof
    (engl.)[/b]\r\nAlkoholstärke-Angabe welche einem Volumen von 57,15% entspricht.
    Zur Überprüfung wurde von englischen Seeleuten Schießpulver mit Gin oder Rum getränkt,
    brannte es, ist der Alkoholgehalt gleich oder größer 57,15%. \r\n\r\n\r\n[post=AujmVOOB][u]oben[/u][/post]"
