  :body: "![Lexikon XYZ](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:33}}/grafik.png)\r\n**Xanthan**\r\nein
    natürlich vorkommendes Polysaccharid, welches als Verdickungsmittel in der Lebensmittelindustrie
    und der Molekular-Technik Anwendung findet.\r\n\r\n**Xérès (span.)**\r\nSiehe
    unter [[post:texpP6wv|<u>Jerez</u>]].\r\n\r\n**XO, X.O. (engl.)**\r\nExtra old,
    nicht amtliche Bezeichnung für Calvados, Cognac und dergleichen, deren jüngstes
    Destillat ein Mindestalter von sechs Jahren aufweist. Weitere Bezeichnungen für
    diese Abfüllungen Hors d'âge, oder Napoléon.\r\n\r\n**Y-Peeler (engl.)**\r\nSiehe
    unter Ziseliermesser hier unten.\r\n\r\n**Yuzu (chin.)**\r\nChinesische Zitrusfrucht,
    in Japan kultiviert, einer Mandarine im Aussehen und Geschmack ähnlich, doch mit
    einer intensiven säuerlichen, bitteren Note. Verleiht Cocktails exotische Zitrusnoten.\r\n\r\n\r\n**Zapfen**\r\nSchweizerisch
    für [[post:HG4n9d6i|<u>Korken</u>]]\r\n\r\n**Zeste**\r\nAbgeschältes Stück Schale
    einer Zitrusfrucht. Verwendung findet lediglich die äußere, Aroma gebende Schicht
    der Schale.\r\n![Zeste](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:218}}/grafik.png
    \"small\")\r\n\r\n**Zestenreißer**\r\nSiehe [[post:KfWCTgw9|Fadenschneider]].\r\n\r\n**Zibarte,
    Ziparte, Zippate**\r\nAlte Unterart der Pflaume, aufgrund des geringen Ertrages
    wenig angebaut, welche vorwiegend im Schwarzwald für die Herstellung eines wohlschmeckenden
    (fruchtig, mandelig) Brandes Verwendung findet. Hier auch Zibärtle, Ziberl genannt.\r\n\r\n**Zibäteli,
    Zibelle  Ziberli, Zyberli (schweiz.)**\r\nSchweizerisch für Zibarte, Ziparte siehe
    dort.\r\n\r\n**Zigarrenbrand**\r\nFassgelagerte Spirituose, die aufgrund des Verlustes
    ihrer alk. Schärfe bei Rauchern, nicht nur Zigarrenrauchern, sehr beliebt ist.
    Es sind neben den klassischen Bränden, wie Rum, Whisky, Cognac, auch gelagerte
    Steinobstbrände begehrt.\r\n\r\n**Ziseliermesser**\r\nSpezialmesser für kunstvolles
    Kerben schnitzen in Früchte.\r\n![](/rails/active_storage/blobs/redirect/{{FORUM_IMAGE:173}}/Ziseliermesser.jpg
    \"small\")\r\n\r\n**Zoom (engl.)**\r\nIn Europa kaum bekannte Getränkegattung
    aus Spirituose, Sahne, Honig. Siehe weiterführende Getränkegruppen unter [[post:RUIy8WjI|<u>\"Bezeichnung
    der Getränke\"</u>]] in den Tipps für den Barneuling.\r\n\r\n\r\n[[post:AujmVOOB|<u>oben</u>]]"
  :body_bbcode: "[IMG]https://image.jimcdn.com/app/cms/image/transf/none/path/s34ef2c3ad959eb14/image/i49de9450860b2038/version/1554118559/xyz.jpg[/IMG][color=#fefefe]XYZ[/color]\r\n\r\n[b]Xanthan[/b]\r\nein
    natürlich vorkommendes Polysaccharid, welches als Verdickungsmittel in der Lebensmittelindustrie
    und der Molekular-Technik Anwendung findet.\r\n\r\n[b]Xérès (span.)[/b]\r\nSiehe
