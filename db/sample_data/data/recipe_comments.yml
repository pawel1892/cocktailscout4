  :body: "Orginal IBA Rezept:\n\r\n\n\r\nMARTINI ( DRY ) Pre dinner ( martini glass
    )\n\r\n5.5 cl Gin\n\r\n1.5 cl Dry Vermouth\n\r\nPour all ingredients into mixing
    glass with ice cubes. Stir well Strain in chilled martini cocktail glass. Squeeze
    oil from lemon peel onto the drink, or garnish with olive. \n\r\n\n\r\n"
