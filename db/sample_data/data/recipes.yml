- :id: 406
  :title: Mint Julep
  :slug: mint-julep
  :description: "Minze zwischen den Handflächen anklatschen und mit Whiskey in das
    vorgekühlte Gästeglas geben. Fünf Minuten ziehen lassen und immer wieder umrühren,
    bzw. die Minze vorsichtig andrücken. Minze herausnehmen, Glas mit gestoßenem Eis
    füllen und so lange umrühren, bis das Glas von außen beschlägt. Mit gestoßenem
    Eis auffüllen, mit übriger Minze dekorieren.\r\n\r\nAdaptiert nach einer Rezeptur
    aus ›Bartenders Guide or How to Mix Drinks‹, Jerry Thomas, 1862.\r\nTraditionell
    wird der Mint Julep in einem Silber- oder Zinnbecher serviert, mit einem Minzestängel
    garniert und durch einen kurzen Strohhalm getrunken.\r\n\r\nVariante von Yannic\r\n(bis
    20.05.2013 Hauptrezept in der Datenbank)\r\nPfefferminzblätter\r\n1 BL Zucker\r\n4cl
    Bourbon Whiskey\r\n10cl Soda "
