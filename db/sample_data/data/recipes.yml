- :id: 41
  :title: Mai Tai
  :slug: mai-tai
  :description: "Alle Zutaten gut shaken und in ein Cocktailglas auf frischem Eis
    abseihen. Kann noch etwas mit Crushed Ice aufgefüllt werden. Optional nach Vic's
    Rezept den Glasrand mit Minzezweig aromatisieren. Der Mai Tai gehört zu den bekanntesten
    Cocktails.<br />\r\n\r\nTrader Vic`s <b>ORIGINAL FORMULA</b>:<br />\r\n2 ounces
    17-year-old J. Wray Nephew Jamaican Rum<br />\r\n1/2 ounce French Garnier Orgeat<br
    />\r\n1/2 ounce Holland DeKuyper Orange Curacao<br />\r\n1/4 ounce Rock Candy
    Syrup<br />\r\nJuice from 1 fresh Lime<br />\r\nShake and garnish with half of
    the lime shell inside the drink and float a sprig of fresh mint at the edge of
    the glass.\r\n<br /><br />\r\nRezeptvorschlag hier bis 02.03.2026, wobei Vic's
    Original oben steht:<br />\r\n6 cl brauner Rum<br />\r\n2 cl Triple Sec<br />\r\n1
    cl Zuckersirup<br />\r\n2 cl Mandelsirup<br />\r\n2 cl Limettensaft"
