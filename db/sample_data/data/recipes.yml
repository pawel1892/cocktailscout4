- :id: 10
  :title: Tequila Sunrise
  :slug: tequila-sunrise
  :description: "Alle Zutaten ausser der Grenadine zusammen mit ein paar Eiswürfeln
    kräftig im Shaker schütteln. Das ganze in ein Longdrinkglas auf frischem Eis abseihen.
    Grenadine vorsichtig in das Glas geben, so dass diese zu Boden geht. Eine Orangenscheibe
    als Dekoration.\r\n\r\nEs empfiehlt sich wirklich sehr, für diesen Cocktail einen
    100%Agave-Tequila zu verwenden. Am besten eignet sich dafür der **Sauza Hornitos**.
    Bei Verwendung dieses Tequilas sollte auch auf die Zugabe von Zitronensaft verzichtet
    werden.\r\n"
