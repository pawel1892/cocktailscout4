- :id: 1
  :title: Piña Colada
  :slug: pina-colada
  :description: "Die Zutaten mit Crushed Ice im Blender gründlich mixen und anschließend
    in ein Cocktailglas geben. \r\n\r\nDeutlich besser schmeckt die Piña Colada allerdings,
    wenn man 1-2 cl Sahne hinzugibt. Man kann auch einige frische Ananasstücke mit
    in den Blender hineingeben.\r\n\r\nAlternativ kann man die Piña Colada auch im
    Shaker zubereiten. Einfach alle Zutaten mit einigen Eiswürfeln shaken und dann
    in ein Cocktailglas geben.\r\n\r\n**Probiert doch auch mal schoeun's Version:**\r\n6cl
    Weisser Rum / 4cl Cream of Coconut / 10cl Ananassaft / 2cl Sahne<br /\r\n\r\nVariante
    hier bis zum 03.03.2026:\r\n3 cl Rum weiß\r\n3 cl Cream of Coconut\r\n9 cl Ananassaft"
