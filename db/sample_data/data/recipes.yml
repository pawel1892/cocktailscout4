- :id: 17
  :title: Swimming Pool
  :slug: swimming-pool
  :description: "Alle Zutaten in einem Shaker gut schütteln und anschließend mit Crushed
    Ice in ein Cocktailglas geben. Als Dekoration eignen sich tropische Früchte wie
    Ananas oder Kiwi sehr gut.<br />\r\nWohl einer der bekanntesten Cocktails. Der
    Geschmack ist tropisch-süß, keine Spur vom herben Alkohol. Und die Herkunft des
    Namens lässt sich beim Betrachten der Farbe des Cocktails auch leicht erahnen.
    \ <br />\r\nHier Schumanns Originalrezept:\r\n4cl weißer Rum\r\n2cl Wodka\r\n1cl
    Curacao Blue\r\n2cl Coconut Cream\r\n1cl süße Sahne\r\n4cl Pineapple Juice\r\n\r\nRum,
    Wodka, Coconut Cream, Sahne und Pineapple Juice auf Eis im Shaker schütteln.<br
    />\r\nIn ein randvoll mit gestoßenem Eis gefülltem Glas abfüllen. Curacao Blue
    darüberfließen lassen. Mit Ananasscheibe und Cocktailkirsche garnieren."
