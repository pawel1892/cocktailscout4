    eingießen.\r\n5. Mit Sprühsahne das Glas füllen und glattstreichen.\r\n6. Einen
    Kreis mit einem Strohhalm (dünn) formen und mit Erdbeerlikör auffüllen.\r\n7.
    Kopf und Hände des Geistes über den roten Rand streichen (wie beim Originallogo)\r\n8.
