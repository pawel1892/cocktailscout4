- :id: 9
  :title: Whiskey Sour
  :slug: whiskey-sour
  :description: "Zutaten im Shaker auf Eis (mit Eiklar erst ohne Eis) kräftig schütteln,
    anschließend in einen Tumbler geben. Das Ganze kann mit einem Zuckerrand und einer
    Zitronenscheibe verziert werden.\r\n<br />\r\nVariante von Gertchen:\r\n4 cl Bourbon
    Whiskey\r\n2 cl Limettensaft\r\n1 cl Zuckersirup\r\n1 Cocktailkirsche\r\n1 Teelöffel
    Cocktailkirschensaft\r\nDie Zutaten im Shaker mit Eis schütteln und in den Tumbler
    seihen.\r\nDie Coctailkirsche und den Saft derselben dazugeben.\r\nEtwas crushed
    ice dazugeben und mit einem Schuß Mineralwasser auffüllen.\r\nResultat: Immer
    noch ein Sour, aber nicht ganz so sauer!\r\n"
