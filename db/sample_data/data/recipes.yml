  :title: B 52
  :slug: b-52
  :description: "Kaffeelikör, Irish Cream (bevorzugt Baileys) und 73%Rum, in dieser
    Reihenfolge vorsichtig in ein Shooterglas geben, so dass sich die Zutaten schichten.
    Das Ganze dann anzünden. Den Trinkhalm natürlich beilegen und nicht in das brennende
    Glas tun. Den Shooter, während er brennt, schnellstmöglich durch den Strohhalm
    trinken.<br />\r\nIn der Ur-Version brannte der B52 übrigens nicht. Da wurde als
